---
# ============================================================================
# Role Defaults: login
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Default configuration parameters for the login role, which executes
#          cluster authentication (oc login), sets up an ephemeral kubeconfig,
#          validates server identity, and establishes the authenticated session.
# Role / Playbook Dependencies: vars/api_regex.yml, vars/secrets.yml, vars/paths.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by login tasks
# ============================================================================

# Target ARO cluster name (string, mandatory)
# Sourced from vars/upgrade.yml or overridden via CLI --cluster
cluster_name: ""

# Scoped temporary kubeconfig path for isolated multi-cluster session state (string, default: path)
# Sourced from vars/paths.yml or dynamically derived from cluster_name
kubeconfig_path: "{{ playbook_dir }}/.kubeconfig-{{ cluster_name | default('default') }}"
cluster_kubeconfig: "{{ playbook_dir }}/.kubeconfig-{{ cluster_name | default('default') }}"

# Regular expression pattern for validating active cluster API endpoint URL (string, default: regex)
# Sourced from vars/api_regex.yml or role defaults
desired_cluster_api_regex: '^https://api\.[a-zA-Z0-9.-]+:6443/?$'

# Bypass TLS certificate verification when connecting to cluster API endpoint (boolean, default: true)
# Sourced from vars/upgrade.yml or role defaults (essential for private/internal CA clusters)
insecure_skip_tls_verify: true

# OpenShift CLI binary executable command or path (string, default: "oc")
# Sourced from vars/paths.yml or discovered dynamically on system PATH
oc_binary: "oc"

# Maximum command retry attempts for transient API communication blips (integer, default: 3)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retries: 3

# Delay in seconds between oc CLI command retry attempts (integer, default: 10)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retry_delay: 10
