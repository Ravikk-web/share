---
# ============================================================================
# Tasks: login
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses command, shell, assert, set_fact, and fail modules;
#                 compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Authenticates against the target OpenShift cluster using credentials
#          referenced from vars/secrets.yml or cluster facts, creates a
#          dedicated session kubeconfig file under playbook_dir, verifies
#          server identity, and exports the KUBECONFIG fact for all downstream roles.
# Dependencies: vars/secrets.yml, vars/upgrade.yml, vars/paths.yml, vars/api_regex.yml
# Gate type: HARD (fails immediately and triggers rescue if login or identity fails)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Discover OpenShift CLI Binary
# ----------------------------------------------------------------------------
# Why: Accommodates jump hosts where oc is installed under /usr/local/bin/oc
#      or available via system PATH.
- name: "Discover oc binary path"
  shell: "command -v /usr/local/bin/oc || command -v oc || echo 'oc'"
  args:
    executable: /bin/bash
  register: oc_binary_discovery
  changed_when: false
  failed_when: false

- name: "Set oc binary fact"
  set_fact:
    oc_binary: "{{ oc_binary if (oc_binary is defined and oc_binary | length > 0) else (oc_binary_discovery.stdout | trim if (oc_binary_discovery.stdout | default('') | trim | length > 0) else 'oc') }}"

# ----------------------------------------------------------------------------
# 2. Resolve Credentials and Endpoint Facts
# ----------------------------------------------------------------------------
# Why: Allows execution whether cluster parameters were supplied as individual
#      variables, a 'cluster' map (cluster.name, cluster.api_url, cluster.username,
#      cluster.password), or as part of the structured 'clusters' map in vars/secrets.yml.
- name: "Resolve cluster endpoint and credentials if not explicitly set"
  set_fact:
    cluster_name: >-
      {{ cluster_name
         if (cluster_name is defined and cluster_name | length > 0)
         else (cluster.name | default(''))
         if (cluster is defined and cluster.name is defined)
         else '' }}
    cluster_api_url: >-
      {{ cluster_api_url
         if (cluster_api_url is defined and cluster_api_url | length > 0)
         else (cluster.api_url | default(''))
         if (cluster is defined and cluster.api_url is defined)
         else (clusters[cluster_name].api_url | default(''))
         if (clusters is defined and cluster_name is defined and cluster_name in clusters)
         else '' }}
    cluster_username: >-
      {{ cluster_username
         if (cluster_username is defined and cluster_username | length > 0)
         else (cluster.username | default(''))
         if (cluster is defined and cluster.username is defined)
         else (clusters[cluster_name].username | default(''))
         if (clusters is defined and cluster_name is defined and cluster_name in clusters)
         else '' }}
    cluster_password: >-
      {{ cluster_password
         if (cluster_password is defined and cluster_password | length > 0)
         else (cluster.password | default(''))
         if (cluster is defined and cluster.password is defined)
         else (clusters[cluster_name].password | default(''))
         if (clusters is defined and cluster_name is defined and cluster_name in clusters)
         else '' }}
    insecure_skip_tls_verify: >-
      {{ insecure_skip_tls_verify
         if (insecure_skip_tls_verify is defined)
         else (cluster.insecure_skip_tls_verify | default(true))
         if (cluster is defined and cluster.insecure_skip_tls_verify is defined)
         else (clusters[cluster_name].insecure_skip_tls_verify | default(true))
         if (clusters is defined and cluster_name is defined and cluster_name in clusters and clusters[cluster_name].insecure_skip_tls_verify is defined)
         else true }}
  no_log: true

# ----------------------------------------------------------------------------
# 3. Validate Prerequisites
# ----------------------------------------------------------------------------
# Why: Explicitly verifies all necessary facts are present before attempting
#      CLI execution to avoid cryptic errors.
- name: "Validate cluster name and credentials exist"
  assert:
    that:
      - cluster_name is defined
      - cluster_name | length > 0
      - cluster_api_url is defined
      - cluster_api_url | length > 0
      - cluster_username is defined
      - cluster_username | length > 0
      - cluster_password is defined
      - cluster_password | length > 0
    fail_msg: >-
      Authentication prerequisites failed. Ensure 'cluster_name', 'cluster_api_url',
      'cluster_username', and 'cluster_password' are defined and non-empty.
    success_msg: "Cluster credentials validated for: {{ cluster_name }}"
  no_log: true

# ----------------------------------------------------------------------------
# 4. Execute OpenShift CLI Login
# ----------------------------------------------------------------------------
# Why: Dedicated kubeconfig prevents clobbering ~/.kube/config.
# Why: shell with /bin/bash ensures precise flag quoting for credentials and URLs.
# Why: --insecure-skip-tls-verify avoids rejection of internal/cluster CA certificates.
# Why: no_log: true guarantees zero password leaks in logs or console.
# Why: retries/delay absorbs transient network blips and API server restarts.
- name: "{{ cluster_name }} | Execute OpenShift CLI login"
  shell: |
    {{ oc_binary }} login \
      --username="{{ cluster_username }}" \
      --password="{{ cluster_password }}" \
      "{{ cluster_api_url }}" \
      --kubeconfig="{{ kubeconfig_path }}" \
      --insecure-skip-tls-verify={{ insecure_skip_tls_verify | bool | lower }} 2>&1
  args:
    executable: /bin/bash
  register: oc_login_result
  failed_when: false
  no_log: true
  changed_when: "'Login successful' in oc_login_result.stdout"
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: oc_login_result.rc == 0

# ----------------------------------------------------------------------------
# 5. Record Failure in Tracking Structure (if defined)
# ----------------------------------------------------------------------------
# Why: Maintains compatibility with environments using master_results fact lists.
- name: "{{ cluster_name }} | Record login failure in master_results"
  set_fact:
    master_results: >-
      {{ (master_results | default([])) + [{
        'cluster_name': cluster_name,
        'api_url': cluster_api_url,
        'ocp_version': 'N/A',
        'overall_status': 'FAIL',
        'alerts': [],
        'checks': [{
          'check_name': 'Cluster Login',
          'status': 'FAIL',
          'details': 'Unable to login. Verify credentials and API URL.'
        }]
      }] }}
  when:
    - master_results is defined
    - oc_login_result.rc is defined
    - oc_login_result.rc != 0

# ----------------------------------------------------------------------------
# 6. Check Login Outcome
# ----------------------------------------------------------------------------
# Why: Fail explicitly if authentication was unsuccessful, naming the cluster
#      endpoint while ensuring passwords remain unexposed.
- name: "Validate login success"
  fail:
    msg: >-
      Authentication failed for cluster '{{ cluster_name }}' at endpoint {{ cluster_api_url }}
      (exit code {{ oc_login_result.rc }}). Verify cluster reachability, network routing,
      TLS certificate bypass (--insecure-skip-tls-verify=true), and service account credentials.
  when: oc_login_result.rc != 0

# ----------------------------------------------------------------------------
# 7. Verify Server Identity
# ----------------------------------------------------------------------------
# Why: Guarantees that the session established actually connects to the expected
#      cluster API URL, preventing DNS spoofing or session hijack.
- name: "Verify active cluster server identity"
  command: "{{ oc_binary }} whoami --show-server --kubeconfig={{ kubeconfig_path }}"
  register: whoami_server_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: whoami_server_raw.rc == 0

- name: "Assert active cluster server matches expected API endpoint pattern"
  assert:
    that:
      - (whoami_server_raw.stdout | trim) is match(desired_cluster_api_regex)
    fail_msg: >-
      Connected server '{{ whoami_server_raw.stdout | trim }}' does not match the
      required cluster API URL pattern '{{ desired_cluster_api_regex }}'. Possible DNS
      spoofing or misdirected session.
    success_msg: "Cluster server identity verified: {{ whoami_server_raw.stdout | trim }}"

# ----------------------------------------------------------------------------
# 8. Export KUBECONFIG Facts
# ----------------------------------------------------------------------------
# Why: Sets environment facts consumed by all subsequent phase playbooks and roles.
- name: "Export KUBECONFIG facts for subsequent tasks and roles"
  set_fact:
    cluster_kubeconfig: "{{ kubeconfig_path }}"
    ansible_env_kubeconfig: "{{ kubeconfig_path }}"
    kubeconfig: "{{ kubeconfig_path }}"
    active_cluster_server: "{{ whoami_server_raw.stdout | trim }}"
    login_result: "{{ oc_login_result }}"
