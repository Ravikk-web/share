---
# ============================================================================
# Role Tasks: postvalidation (10-Check Postvalidation & Baseline Diff)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses standard short module names (shell, set_fact, debug, fail,
#                 slurp). Compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Orchestrates the complete 10-check postvalidation contract defined
#          in context/feature-spec/12-postvalidation-and-phase05.md.
#          Evaluates final cluster version, operator stability, MCP sync, node
#          readiness and kubelet minor version alignment, node resource pressures,
#          etcd quorum health, persistent storage, core namespace pods, firing
#          Prometheus alerts, and computes a structural baseline diff against the
#          Phase 01 JSON snapshot.
# Dependencies: playbooks/vars/upgrade.yml, playbooks/vars/paths.yml,
#               roles/report, roles/error_handle
# Gate type: HARD (Checks 01–06) / WARN (Checks 07–10)
# ============================================================================

# ----------------------------------------------------------------------------
# 0. Initialize Postvalidation Context & Summary Facts
# Why: Reset health_summary to guarantee a clean 10-check evaluation list.
# ----------------------------------------------------------------------------
- name: "Initialize postvalidation health summary tracking list"
  set_fact:
    health_summary: []
    postval_resolved_target_version: >-
      {{ (final_target_version | string | trim)
         if (final_target_version is defined and (final_target_version | string | trim | length > 0))
         else ((upgrade_path[-1] | string | trim) if (upgrade_path is defined and (upgrade_path | length > 0)) else '') }}

- name: "Display 10-Check Postvalidation Contract initiation banner"
  debug:
    msg:
      - "============================================================================"
      - "POSTVALIDATION CONTRACT: EXECUTING 10-CHECK SYSTEM & BASELINE DIFF SCAN"
      - "============================================================================"
      - "Target Cluster       : {{ cluster_name }}"
      - "Target Version       : {{ postval_resolved_target_version if (postval_resolved_target_version | length > 0) else 'Auto-detect live version' }}"
      - "Baseline Snapshot    : {{ baseline_snapshot_file | default('Auto-detect newest') }}"
      - "Gate Enforcement     : {{ postval_enforce_gate | default(true) | bool }}"
      - "============================================================================"

# ----------------------------------------------------------------------------
# Check 01: Final ClusterVersion
# Gate: HARD | Rule: cv matches final target version, Available=True, Progressing=False
# ----------------------------------------------------------------------------
- name: "Postvalidation Check 01/10: Query live ClusterVersion status via jq v1.5"
  shell: |
    set -o pipefail
    oc get clusterversion version -o json | jq -c '
      {
        current_version: (((.status.history // []) | map(select(.state == "Completed")) | .[0].version) // (.status.desired.version // "")),
        desired_version: (.status.desired.version // ""),
        available: (((.status.conditions // []) | map(select(.type == "Available")) | .[0].status) // "False" | tostring),
        progressing: (((.status.conditions // []) | map(select(.type == "Progressing")) | .[0].status) // "False" | tostring),
        degraded: (((.status.conditions // []) | map(select(.type == "Degraded" or .type == "Failing")) | .[0].status) // "False" | tostring)
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: postval_cv_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: postval_cv_raw.rc == 0

- name: "Postvalidation Check 01/10: Parse and evaluate ClusterVersion compliance"
  set_fact:
    postval_cv_data: "{{ postval_cv_raw.stdout | default('{}') | from_json }}"

- name: "Postvalidation Check 01/10: Resolve effective expected target version"
  set_fact:
    postval_effective_target_version: >-
      {{ (postval_cv_data.current_version | default('') | string | trim)
         if ((postval_resolved_target_version | string | trim | lower) in ['', 'current', 'auto', 'auto-detect'])
         else (postval_resolved_target_version | string | trim) }}

- name: "Postvalidation Check 01/10: Evaluate final target version match and condition flags"
  set_fact:
    postval_cv_target_matches: >-
      {{ ((postval_cv_data.current_version | string | trim) == (postval_effective_target_version | string | trim)) or
         ((postval_cv_data.desired_version | string | trim) == (postval_effective_target_version | string | trim)) }}
    postval_cv_available_ok: "{{ postval_cv_data.available | string | trim | lower == 'true' }}"
    postval_cv_progressing_ok: "{{ postval_cv_data.progressing | string | trim | lower != 'true' }}"
    postval_cv_degraded_ok: "{{ postval_cv_data.degraded | string | trim | lower != 'true' }}"

- name: "Postvalidation Check 01/10: Determine Check 01 validity"
  set_fact:
    postval_cv_check_valid: >-
      {{ (postval_cv_target_matches | bool) and
         (postval_cv_available_ok | bool) and
         (postval_cv_progressing_ok | bool) and
         (postval_cv_degraded_ok | bool) }}

- name: "Postvalidation Check 01/10: Construct Check 01 structured health record"
  set_fact:
    cv_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "Final ClusterVersion"
      gate: "HARD"
      status: "{{ 'PASS' if (postval_cv_check_valid | bool) else 'FAIL' }}"
      observed: >-
        {{ ('Cluster settled at final target version ' ~ postval_cv_data.current_version ~ ' (Available=True, Progressing=False, Degraded=False)')
           if (postval_cv_check_valid | bool)
           else ('ClusterVersion mismatch or unstable: current=' ~ postval_cv_data.current_version ~ ' (expected ' ~ postval_effective_target_version ~ '), Available=' ~ postval_cv_data.available ~ ', Progressing=' ~ postval_cv_data.progressing ~ ', Degraded=' ~ postval_cv_data.degraded) }}

- name: "Postvalidation Check 01/10: Record Check 01 outcome to health_summary"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [cv_health_item] }}"

- name: "Postvalidation Check 01/10: Log Check 01 outcome"
  debug:
    msg:
      - "Check        : {{ cv_health_item.name }}"
      - "Status       : {{ cv_health_item.status }}"
      - "Observed     : {{ cv_health_item.observed }}"

# ----------------------------------------------------------------------------
# Check 02: ClusterOperators Status
# Gate: HARD | Rule: All operators Available=True, Degraded=False, Progressing=False
# ----------------------------------------------------------------------------
- name: "Postvalidation Check 02/10: Query live ClusterOperators conditions via jq v1.5"
  shell: |
    set -o pipefail
    oc get clusteroperators -o json | jq -c '
      {
        operators: [.items[] | {
          name: .metadata.name,
          version: (((.status.versions // []) | map(select(.name == "operator")) | .[0].version) // "unknown"),
          available: (((.status.conditions // []) | map(select(.type == "Available")) | .[0].status) // "False" | tostring),
          degraded: (((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "False" | tostring),
          progressing: (((.status.conditions // []) | map(select(.type == "Progressing")) | .[0].status) // "False" | tostring)
        }],
        degraded: [.items[] | select((((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "False" | tostring) == "True") | .metadata.name],
        unavailable: [.items[] | select((((.status.conditions // []) | map(select(.type == "Available")) | .[0].status) // "False" | tostring) != "True") | .metadata.name],
        progressing: [.items[] | select((((.status.conditions // []) | map(select(.type == "Progressing")) | .[0].status) // "False" | tostring) == "True") | .metadata.name]
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: postval_co_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: postval_co_raw.rc == 0

- name: "Postvalidation Check 02/10: Parse operator data and apply allow-list exclusions"
  set_fact:
    postval_co_all: "{{ (postval_co_raw.stdout | default('{}') | from_json)['operators'] | default([]) }}"
    postval_co_degraded: "{{ ((postval_co_raw.stdout | default('{}') | from_json)['degraded'] | default([])) | difference(co_allow_list | default([])) }}"
    postval_co_unavailable: "{{ ((postval_co_raw.stdout | default('{}') | from_json)['unavailable'] | default([])) | difference(co_allow_list | default([])) }}"
    postval_co_progressing: "{{ ((postval_co_raw.stdout | default('{}') | from_json)['progressing'] | default([])) | difference(co_allow_list | default([])) }}"

- name: "Postvalidation Check 02/10: Determine combined list of offending cluster operators"
  set_fact:
    postval_co_offending: "{{ (postval_co_degraded + postval_co_unavailable + postval_co_progressing) | unique }}"
    postval_co_check_valid: "{{ ((postval_co_degraded + postval_co_unavailable + postval_co_progressing) | unique | length) == 0 }}"

- name: "Postvalidation Check 02/10: Settle re-check for transient operator stabilization if needed"
  shell: |
    set -o pipefail
    oc get clusteroperators -o json | jq -c '
      {
        operators: [.items[] | {
          name: .metadata.name,
          version: (((.status.versions // []) | map(select(.name == "operator")) | .[0].version) // "unknown"),
          available: (((.status.conditions // []) | map(select(.type == "Available")) | .[0].status) // "False" | tostring),
          degraded: (((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "False" | tostring),
          progressing: (((.status.conditions // []) | map(select(.type == "Progressing")) | .[0].status) // "False" | tostring)
        }],
        degraded: [.items[] | select((((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "False" | tostring) == "True") | .metadata.name],
        unavailable: [.items[] | select((((.status.conditions // []) | map(select(.type == "Available")) | .[0].status) // "False" | tostring) != "True") | .metadata.name],
        progressing: [.items[] | select((((.status.conditions // []) | map(select(.type == "Progressing")) | .[0].status) // "False" | tostring) == "True") | .metadata.name]
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: postval_co_settle_raw
  changed_when: false
  failed_when: false
  retries: 3
  delay: 10
  until: >-
    ((((postval_co_settle_raw.stdout | default('{}') | from_json)['degraded'] | default([])) | difference(co_allow_list | default([])) | length) == 0) and
    ((((postval_co_settle_raw.stdout | default('{}') | from_json)['unavailable'] | default([])) | difference(co_allow_list | default([])) | length) == 0) and
    ((((postval_co_settle_raw.stdout | default('{}') | from_json)['progressing'] | default([])) | difference(co_allow_list | default([])) | length) == 0)
  when: not (postval_co_check_valid | bool)

- name: "Postvalidation Check 02/10: Update operator status facts after settle re-check"
  set_fact:
    postval_co_all: "{{ (postval_co_settle_raw.stdout | from_json)['operators'] | default([]) }}"
    postval_co_degraded: "{{ ((postval_co_settle_raw.stdout | from_json)['degraded'] | default([])) | difference(co_allow_list | default([])) }}"
    postval_co_unavailable: "{{ ((postval_co_settle_raw.stdout | from_json)['unavailable'] | default([])) | difference(co_allow_list | default([])) }}"
    postval_co_progressing: "{{ ((postval_co_settle_raw.stdout | from_json)['progressing'] | default([])) | difference(co_allow_list | default([])) }}"
    postval_co_offending: "{{ (((postval_co_settle_raw.stdout | from_json)['degraded'] | default([])) | difference(co_allow_list | default([])) + ((postval_co_settle_raw.stdout | from_json)['unavailable'] | default([])) | difference(co_allow_list | default([])) + ((postval_co_settle_raw.stdout | from_json)['progressing'] | default([])) | difference(co_allow_list | default([]))) | unique }}"
    postval_co_check_valid: "{{ ((((postval_co_settle_raw.stdout | from_json)['degraded'] | default([])) | difference(co_allow_list | default([])) + ((postval_co_settle_raw.stdout | from_json)['unavailable'] | default([])) | difference(co_allow_list | default([])) + ((postval_co_settle_raw.stdout | from_json)['progressing'] | default([])) | difference(co_allow_list | default([]))) | unique | length) == 0 }}"
  when:
    - not (postval_co_check_valid | bool)
    - postval_co_settle_raw is defined
    - postval_co_settle_raw.stdout is defined
    - (postval_co_settle_raw.stdout | trim | length) > 0

- name: "Postvalidation Check 02/10: Construct Check 02 structured health record"
  set_fact:
    co_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "ClusterOperators Status"
      gate: "HARD"
      status: "{{ 'PASS' if (postval_co_check_valid | bool) else 'FAIL' }}"
      observed: >-
        {{ ('All ' ~ (postval_co_all | length) ~ ' ClusterOperators stable (Available=True, Degraded=False, Progressing=False)')
           if (postval_co_check_valid | bool)
           else ('Unstable operators detected: degraded=[' ~ (postval_co_degraded | join(', ')) ~ '], unavailable=[' ~ (postval_co_unavailable | join(', ')) ~ '], progressing=[' ~ (postval_co_progressing | join(', ')) ~ ']') }}

- name: "Postvalidation Check 02/10: Record Check 02 outcome to health_summary"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [co_health_item] }}"

- name: "Postvalidation Check 02/10: Log Check 02 outcome"
  debug:
    msg:
      - "Check        : {{ co_health_item.name }}"
      - "Status       : {{ co_health_item.status }}"
      - "Observed     : {{ co_health_item.observed }}"

# ----------------------------------------------------------------------------
# Check 03: MachineConfigPool Status
# Gate: HARD | Rule: All pools Updated=True, Updating=False, Degraded=False
# ----------------------------------------------------------------------------
- name: "Postvalidation Check 03/10: Query live MachineConfigPools status via jq v1.5"
  shell: |
    set -o pipefail
    oc get mcp -o json | jq -c '
      {
        pools: [.items[] | {
          name: .metadata.name,
          updated: (((.status.conditions // []) | map(select(.type == "Updated")) | .[0].status) // "False" | tostring),
          updating: (((.status.conditions // []) | map(select(.type == "Updating")) | .[0].status) // "False" | tostring),
          degraded: (((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "True" | tostring),
          machine_count: (.status.machineCount // 0),
          updated_machine_count: (.status.updatedMachineCount // 0)
        }],
        degraded_pools: [.items[] | select((((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "True" | tostring) == "True") | .metadata.name],
        not_updated_pools: [.items[] | select((((.status.conditions // []) | map(select(.type == "Updated")) | .[0].status) // "False" | tostring) != "True") | .metadata.name],
        updating_pools: [.items[] | select((((.status.conditions // []) | map(select(.type == "Updating")) | .[0].status) // "False" | tostring) == "True") | .metadata.name]
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: postval_mcp_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: postval_mcp_raw.rc == 0

- name: "Postvalidation Check 03/10: Parse MachineConfigPool facts"
  set_fact:
    postval_mcp_pools: "{{ (postval_mcp_raw.stdout | default('{}') | from_json)['pools'] | default([]) }}"
    postval_mcp_degraded: "{{ (postval_mcp_raw.stdout | default('{}') | from_json)['degraded_pools'] | default([]) }}"
    postval_mcp_not_updated: "{{ (postval_mcp_raw.stdout | default('{}') | from_json)['not_updated_pools'] | default([]) }}"
    postval_mcp_updating: "{{ (postval_mcp_raw.stdout | default('{}') | from_json)['updating_pools'] | default([]) }}"

- name: "Postvalidation Check 03/10: Determine combined list of offending MachineConfigPools"
  set_fact:
    postval_mcp_offending: "{{ (postval_mcp_degraded + postval_mcp_not_updated + postval_mcp_updating) | unique }}"
    postval_mcp_check_valid: "{{ ((postval_mcp_degraded + postval_mcp_not_updated + postval_mcp_updating) | unique | length) == 0 }}"

- name: "Postvalidation Check 03/10: Construct Check 03 structured health record"
  set_fact:
    mcp_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "MachineConfigPool Status"
      gate: "HARD"
      status: "{{ 'PASS' if (postval_mcp_check_valid | bool) else 'FAIL' }}"
      observed: >-
        {{ ('All ' ~ (postval_mcp_pools | length) ~ ' MCPs synchronized and fully updated (' ~ (postval_mcp_pools | map(attribute='name') | join(', ')) ~ ')')
           if (postval_mcp_check_valid | bool)
           else ('Unsettled MCPs: degraded=[' ~ (postval_mcp_degraded | join(', ')) ~ '], not_updated=[' ~ (postval_mcp_not_updated | join(', ')) ~ '], updating=[' ~ (postval_mcp_updating | join(', ')) ~ ']') }}

- name: "Postvalidation Check 03/10: Record Check 03 outcome to health_summary"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [mcp_health_item] }}"

- name: "Postvalidation Check 03/10: Log Check 03 outcome"
  debug:
    msg:
      - "Check        : {{ mcp_health_item.name }}"
      - "Status       : {{ mcp_health_item.status }}"
      - "Observed     : {{ mcp_health_item.observed }}"

# ----------------------------------------------------------------------------
# Check 04: Node Readiness & Version
# Gate: HARD | Rule: All nodes Ready=True; kubelet versions match target minor version
# ----------------------------------------------------------------------------
# Why: In OpenShift 4.Y, the corresponding Kubernetes minor version is 1.(Y+13).
#      e.g., OCP 4.14 -> k8s 1.27, OCP 4.16 -> k8s 1.29, OCP 4.18 -> k8s 1.31.
- name: "Postvalidation Check 04/10: Derive expected Kubernetes kubelet minor prefix"
  set_fact:
    postval_target_ocp_minor: "{{ (postval_effective_target_version | regex_replace('^([0-9]+)\\.([0-9]+).*$', '\\2')) | int }}"
  when: postval_effective_target_version is search('^[0-9]+\\.[0-9]+')

- name: "Postvalidation Check 04/10: Compute expected kubelet version prefix string"
  set_fact:
    postval_expected_kubelet_prefix: "{{ 'v1.' ~ ((postval_target_ocp_minor | default(14) | int) + 13) ~ '.' }}"

- name: "Postvalidation Check 04/10: Query live cluster nodes and kubelet versions via jq v1.5"
  shell: |
    set -o pipefail
    oc get nodes -o json | jq -c '
      [ .items[] | {
        name: .metadata.name,
        ready: (([.status.conditions[]? | select(.type == "Ready") | .status] | first) // "False" | tostring),
        kubelet_version: (.status.nodeInfo.kubeletVersion // "unknown")
      } ] | sort_by(.name)'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: postval_nodes_version_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: postval_nodes_version_raw.rc == 0

- name: "Postvalidation Check 04/10: Parse node inventory and evaluate readiness and kubelet versions"
  set_fact:
    postval_all_nodes: "{{ postval_nodes_version_raw.stdout | default('[]') | from_json }}"

- name: "Postvalidation Check 04/10: Identify unready nodes and outdated kubelet versions"
  set_fact:
    postval_unready_nodes: >-
      {{ postval_all_nodes | selectattr('ready', 'equalto', 'False') | map(attribute='name') | list }}
    postval_mismatched_kubelet_nodes: >-
      {%- set mismatched = [] -%}
      {%- for n in postval_all_nodes -%}
        {%- if postval_expected_kubelet_prefix is defined and (not n.kubelet_version.startswith(postval_expected_kubelet_prefix)) -%}
          {%- set _ = mismatched.append(n.name ~ ' (' ~ n.kubelet_version ~ ')') -%}
        {%- endif -%}
      {%- endfor -%}
      {{ mismatched }}

- name: "Postvalidation Check 04/10: Determine Check 04 validity"
  set_fact:
    postval_node_readiness_valid: >-
      {{ ((postval_unready_nodes | length) == 0) and
         ((postval_mismatched_kubelet_nodes | length) == 0) }}

- name: "Postvalidation Check 04/10: Construct Check 04 structured health record"
  set_fact:
    node_version_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "Node Readiness & Version"
      gate: "HARD"
      status: "{{ 'PASS' if (postval_node_readiness_valid | bool) else 'FAIL' }}"
      observed: >-
        {{ ('All ' ~ (postval_all_nodes | length) ~ ' nodes Ready=True; kubelet versions aligned to ' ~ postval_expected_kubelet_prefix ~ '* (OCP ' ~ postval_resolved_target_version ~ ')')
           if (postval_node_readiness_valid | bool)
           else ('Node health or version failure: unready=[' ~ (postval_unready_nodes | join(', ')) ~ '], mismatched_kubelet=[' ~ (postval_mismatched_kubelet_nodes | join(', ')) ~ '] (expected ' ~ postval_expected_kubelet_prefix ~ '*)') }}

- name: "Postvalidation Check 04/10: Record Check 04 outcome to health_summary"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [node_version_health_item] }}"

- name: "Postvalidation Check 04/10: Log Check 04 outcome"
  debug:
    msg:
      - "Check        : {{ node_version_health_item.name }}"
      - "Status       : {{ node_version_health_item.status }}"
      - "Observed     : {{ node_version_health_item.observed }}"

# ----------------------------------------------------------------------------
# Check 05: Node Pressures
# Gate: HARD | Rule: Zero DiskPressure, MemoryPressure, or PIDPressure across all nodes
# ----------------------------------------------------------------------------
- name: "Postvalidation Check 05/10: Query live node pressures and scheduling state via jq v1.5"
  shell: |
    set -o pipefail
    oc get nodes -o json | jq -c '
      {
        pressured_nodes: [ .items[] | select(
          ((((.status.conditions // []) | map(select(.type == "DiskPressure")) | .[0].status) // "False" | tostring) == "True") or
          ((((.status.conditions // []) | map(select(.type == "MemoryPressure")) | .[0].status) // "False" | tostring) == "True") or
          ((((.status.conditions // []) | map(select(.type == "PIDPressure")) | .[0].status) // "False" | tostring) == "True")
        ) | .metadata.name ],
        unschedulable_nodes: [ .items[] | select((.spec.unschedulable // false) == true) | .metadata.name ]
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: postval_pressures_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: postval_pressures_raw.rc == 0

- name: "Postvalidation Check 05/10: Parse node pressures and unschedulable lists"
  set_fact:
    postval_pressured_nodes: "{{ (postval_pressures_raw.stdout | default('{}') | from_json)['pressured_nodes'] | default([]) }}"
    postval_unschedulable_nodes: "{{ (postval_pressures_raw.stdout | default('{}') | from_json)['unschedulable_nodes'] | default([]) }}"

- name: "Postvalidation Check 05/10: Determine Check 05 validity against pressure threshold"
  set_fact:
    postval_pressures_valid: >-
      {{ ((postval_pressured_nodes | length) == 0) and
         not ((postval_unschedulable_nodes | length) > (allowed_unschedulable_nodes | default(0) | int)) }}

- name: "Postvalidation Check 05/10: Construct Check 05 structured health record"
  set_fact:
    node_pressure_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "Node Pressures"
      gate: "HARD"
      status: "{{ 'PASS' if (postval_pressures_valid | bool) else 'FAIL' }}"
      observed: >-
        {{ ('Zero node resource pressures detected across all ' ~ (postval_all_nodes | length) ~ ' nodes (unschedulable: ' ~ (postval_unschedulable_nodes | length) ~ ')')
           if (postval_pressures_valid | bool)
           else ('Resource pressures detected: pressured=[' ~ (postval_pressured_nodes | join(', ')) ~ '], unschedulable=[' ~ (postval_unschedulable_nodes | join(', ')) ~ '] (threshold: ' ~ (allowed_unschedulable_nodes | default(0)) ~ ')') }}

- name: "Postvalidation Check 05/10: Record Check 05 outcome to health_summary"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [node_pressure_health_item] }}"

- name: "Postvalidation Check 05/10: Log Check 05 outcome"
  debug:
    msg:
      - "Check        : {{ node_pressure_health_item.name }}"
      - "Status       : {{ node_pressure_health_item.status }}"
      - "Observed     : {{ node_pressure_health_item.observed }}"

# ----------------------------------------------------------------------------
# Check 06: etcd Cluster Health
# Gate: HARD | Rule: Member quorum healthy, raft leader stable, CO etcd Available
# ----------------------------------------------------------------------------
- name: "Postvalidation Check 06/10: Query control-plane etcd pods status via jq v1.5"
  shell: |
    set -o pipefail
    oc get pods -n openshift-etcd -l app=etcd -o json | jq -c '
      {
        total_pods: ((.items // []) | length),
        ready_pods: [ (.items // [])[] | select(
          (.status.phase == "Running") and
          ((((.status.conditions // []) | map(select(.type == "Ready")) | .[0].status) // "False" | tostring) == "True")
        ) | .metadata.name ]
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: postval_etcd_pods_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: postval_etcd_pods_raw.rc == 0

- name: "Postvalidation Check 06/10: Query ClusterOperator etcd condition states via jq v1.5"
  shell: |
    set -o pipefail
    oc get clusteroperator etcd -o json | jq -c '
      {
        available: (((.status.conditions // []) | map(select(.type == "Available")) | .[0].status) // "False" | tostring),
        degraded: (((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "True" | tostring)
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: postval_co_etcd_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: postval_co_etcd_raw.rc == 0

- name: "Postvalidation Check 06/10: Parse etcd pod and operator facts"
  set_fact:
    postval_etcd_total_pods: "{{ (postval_etcd_pods_raw.stdout | default('{}') | from_json)['total_pods'] | default(0) | int }}"
    postval_etcd_ready_pods: "{{ (postval_etcd_pods_raw.stdout | default('{}') | from_json)['ready_pods'] | default([]) }}"
    postval_co_etcd_available: "{{ (postval_co_etcd_raw.stdout | default('{}') | from_json)['available'] | default('False') | string | trim | lower == 'true' }}"
    postval_co_etcd_degraded: "{{ (postval_co_etcd_raw.stdout | default('{}') | from_json)['degraded'] | default('True') | string | trim | lower == 'true' }}"

- name: "Postvalidation Check 06/10: Determine etcd quorum health validity"
  set_fact:
    postval_etcd_check_valid: >-
      {{ ((postval_etcd_ready_pods | length >= 3) or ((postval_etcd_total_pods >= 1) and ((postval_etcd_ready_pods | length) == postval_etcd_total_pods))) and
         (postval_co_etcd_available | bool) and
         not (postval_co_etcd_degraded | bool) }}

- name: "Postvalidation Check 06/10: Construct Check 06 structured health record"
  set_fact:
    etcd_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "etcd Cluster Health"
      gate: "HARD"
      status: "{{ 'PASS' if (postval_etcd_check_valid | bool) else 'FAIL' }}"
      observed: >-
        {{ ('etcd quorum healthy: ' ~ (postval_etcd_ready_pods | length) ~ '/' ~ postval_etcd_total_pods ~ ' control-plane pods ready; CO etcd Available=True, Degraded=False')
           if (postval_etcd_check_valid | bool)
           else ('etcd quorum compromised: ready=' ~ (postval_etcd_ready_pods | length) ~ '/' ~ postval_etcd_total_pods ~ ' pods; CO Available=' ~ (postval_co_etcd_available | string) ~ ', Degraded=' ~ (postval_co_etcd_degraded | string)) }}

- name: "Postvalidation Check 06/10: Record Check 06 outcome to health_summary"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [etcd_health_item] }}"

- name: "Postvalidation Check 06/10: Log Check 06 outcome"
  debug:
    msg:
      - "Check        : {{ etcd_health_item.name }}"
      - "Status       : {{ etcd_health_item.status }}"
      - "Observed     : {{ etcd_health_item.observed }}"

# ----------------------------------------------------------------------------
# Check 07: PersistentVolume Status
# Gate: WARN | Rule: Storage volumes remain in Bound or Available state
# ----------------------------------------------------------------------------
- name: "Postvalidation Check 07/10: Query live PersistentVolumes status via jq v1.5"
  shell: |
    set -o pipefail
    oc get pv -o json | jq -c '
      {
        total: ((.items // []) | length),
        problematic: [ (.items // [])[] | select((.status.phase != "Bound") and (.status.phase != "Available")) | {name: .metadata.name, phase: (.status.phase // "Unknown")} ]
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: postval_pv_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: postval_pv_raw.rc == 0

- name: "Postvalidation Check 07/10: Parse PersistentVolume counts and problematic volumes"
  set_fact:
    postval_pv_total: "{{ (postval_pv_raw.stdout | default('{}') | from_json)['total'] | default(0) | int }}"
    postval_pv_problematic: "{{ (postval_pv_raw.stdout | default('{}') | from_json)['problematic'] | default([]) }}"

- name: "Postvalidation Check 07/10: Determine PersistentVolume status validity"
  set_fact:
    postval_pv_valid: "{{ (postval_pv_problematic | length) == 0 }}"

- name: "Postvalidation Check 07/10: Construct Check 07 structured health record"
  set_fact:
    pv_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "PersistentVolume Status"
      gate: "WARN"
      status: "{{ 'PASS' if (postval_pv_valid | bool) else 'WARN' }}"
      observed: >-
        {{ ('All ' ~ postval_pv_total ~ ' PersistentVolumes in Bound or Available phase')
           if (postval_pv_valid | bool)
           else ('Problematic PersistentVolumes detected (' ~ (postval_pv_problematic | length) ~ '/' ~ postval_pv_total ~ '): ' ~ (postval_pv_problematic | map(attribute='name') | join(', '))) }}

- name: "Postvalidation Check 07/10: Record Check 07 outcome to health_summary"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [pv_health_item] }}"

- name: "Postvalidation Check 07/10: Log Check 07 outcome"
  debug:
    msg:
      - "Check        : {{ pv_health_item.name }}"
      - "Status       : {{ pv_health_item.status }}"
      - "Observed     : {{ pv_health_item.observed }}"

# ----------------------------------------------------------------------------
# Check 08: Core Namespace Pods
# Gate: WARN | Rule: Control plane and ingress pods in openshift-* running healthy
# ----------------------------------------------------------------------------
- name: "Postvalidation Check 08/10: Query core namespace pods for crash loops and failures via jq v1.5"
  shell: |
    set -o pipefail
    oc get pods -A -o json | jq -c '
      [ (.items // [])[]
        | select((.metadata.namespace // "") | startswith("openshift-"))
        | select(
            ((.status.containerStatuses // []) | any(
              ((.state.waiting.reason // "") == "CrashLoopBackOff") or
              ((.state.waiting.reason // "") == "ImagePullBackOff") or
              ((.state.waiting.reason // "") == "ErrImagePull") or
              ((.state.waiting.reason // "") == "CreateContainerConfigError") or
              ((.state.waiting.reason // "") == "Error")
            )) or
            ((.status.phase // "") == "Failed")
          )
        | "\(.metadata.namespace)/\(.metadata.name)"
      ]'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: postval_core_pods_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: postval_core_pods_raw.rc == 0

- name: "Postvalidation Check 08/10: Parse unhealthy core namespace pod list"
  set_fact:
    postval_unhealthy_core_pods: "{{ postval_core_pods_raw.stdout | default('[]') | from_json }}"

- name: "Postvalidation Check 08/10: Determine core namespace pod health validity"
  set_fact:
    postval_core_pods_valid: "{{ (postval_unhealthy_core_pods | length) == 0 }}"

- name: "Postvalidation Check 08/10: Construct Check 08 structured health record"
  set_fact:
    core_pods_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "Core Namespace Pods"
      gate: "WARN"
      status: "{{ 'PASS' if (postval_core_pods_valid | bool) else 'WARN' }}"
      observed: >-
        {{ 'All core namespace platform pods running healthy (0 CrashLoopBackOff/Error)'
           if (postval_core_pods_valid | bool)
           else ('Unhealthy pods in openshift-* namespaces (' ~ (postval_unhealthy_core_pods | length) ~ '): ' ~ (postval_unhealthy_core_pods | join(', '))) }}

- name: "Postvalidation Check 08/10: Record Check 08 outcome to health_summary"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [core_pods_health_item] }}"

- name: "Postvalidation Check 08/10: Log Check 08 outcome"
  debug:
    msg:
      - "Check        : {{ core_pods_health_item.name }}"
      - "Status       : {{ core_pods_health_item.status }}"
      - "Observed     : {{ core_pods_health_item.observed }}"

# ----------------------------------------------------------------------------
# Check 09: Firing Critical Alerts
# Gate: WARN | Rule: Query Prometheus alerts API; report any active critical alerts
# ----------------------------------------------------------------------------
- name: "Postvalidation Check 09/10: Query Prometheus alerts API for firing critical alerts"
  shell: |
    set -o pipefail
    TOKEN=$(oc whoami -t 2>/dev/null || true)
    THANOS_HOST=$(oc get route thanos-querier -n openshift-monitoring -o jsonpath='{.spec.host}' 2>/dev/null || true)
    if [ -n "$THANOS_HOST" ] && [ -n "$TOKEN" ]; then
      curl -s -k -H "Authorization: Bearer $TOKEN" "https://$THANOS_HOST/api/v1/alerts" 2>/dev/null || echo '{"data":{"alerts":[]}}'
    else
      oc exec -n openshift-monitoring prometheus-k8s-0 -c prometheus -- curl -s http://localhost:9090/api/v1/alerts 2>/dev/null || echo '{"data":{"alerts":[]}}'
    fi | jq -c '
      [ ((.data.alerts // [])[]? | select((.state == "firing") and (((.labels.severity // "") | tostring) == "critical")) | {
        alertname: (.labels.alertname // "Unknown"),
        namespace: (.labels.namespace // "cluster"),
        summary: (.annotations.summary // (.annotations.message // ""))
      }) ]'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: postval_alerts_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: postval_alerts_raw.rc == 0

- name: "Postvalidation Check 09/10: Parse firing critical alerts list"
  set_fact:
    postval_critical_alerts: "{{ postval_alerts_raw.stdout | default('[]') | from_json }}"

- name: "Postvalidation Check 09/10: Determine critical alert validity"
  set_fact:
    postval_alerts_valid: "{{ (postval_critical_alerts | length) == 0 }}"

- name: "Postvalidation Check 09/10: Construct Check 09 structured health record"
  set_fact:
    alerts_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "Firing Critical Alerts"
      gate: "WARN"
      status: "{{ 'PASS' if (postval_alerts_valid | bool) else 'WARN' }}"
      observed: >-
        {{ 'Zero active firing critical alerts in Prometheus monitoring'
           if (postval_alerts_valid | bool)
           else ('Active critical alerts detected (' ~ (postval_critical_alerts | length) ~ '): ' ~ (postval_critical_alerts | map(attribute='alertname') | join(', '))) }}

- name: "Postvalidation Check 09/10: Record Check 09 outcome to health_summary"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [alerts_health_item] }}"

- name: "Postvalidation Check 09/10: Log Check 09 outcome"
  debug:
    msg:
      - "Check        : {{ alerts_health_item.name }}"
      - "Status       : {{ alerts_health_item.status }}"
      - "Observed     : {{ alerts_health_item.observed }}"

# ----------------------------------------------------------------------------
# Check 10: Baseline Diff Audit
# Gate: WARN | Rule: Node inventory, active operators, and routes match or exceed baseline
# ----------------------------------------------------------------------------
# Why: Auto-detects the baseline snapshot file if not explicitly supplied.
- name: "Postvalidation Check 10/10: Resolve Phase 01 baseline snapshot JSON path"
  shell: |
    set -o pipefail
    if [ -n "{{ baseline_snapshot_file | default('') }}" ] && [ -f "{{ baseline_snapshot_file | default('') }}" ]; then
      echo "{{ baseline_snapshot_file }}"
    else
      ls -1t "{{ playbook_dir }}/snapshots/{{ cluster_name }}_"*_baseline.json 2>/dev/null | head -n 1 || echo ""
    fi
  args:
    executable: /bin/bash
  register: postval_snapshot_path_raw
  changed_when: false

- name: "Postvalidation Check 10/10: Export resolved baseline snapshot path"
  set_fact:
    postval_resolved_snapshot_file: "{{ postval_snapshot_path_raw.stdout | trim }}"

- name: "Postvalidation Check 10/10: Check if resolved baseline snapshot file exists"
  stat:
    path: "{{ postval_resolved_snapshot_file }}"
  register: postval_snapshot_stat
  when: postval_resolved_snapshot_file | length > 0

- name: "Postvalidation Check 10/10: Slurp Phase 01 baseline JSON snapshot"
  slurp:
    src: "{{ postval_resolved_snapshot_file }}"
  register: postval_snapshot_slurped
  when:
    - postval_resolved_snapshot_file | length > 0
    - postval_snapshot_stat.stat.exists | default(false)

- name: "Postvalidation Check 10/10: Parse baseline JSON snapshot content"
  set_fact:
    postval_baseline_dict: "{{ postval_snapshot_slurped.content | b64decode | from_json }}"
  when:
    - postval_snapshot_slurped is defined
    - postval_snapshot_slurped.content is defined

# Query live cluster routes across all namespaces
- name: "Postvalidation Check 10/10: Query live cluster routes across all namespaces via jq v1.5"
  shell: |
    set -o pipefail
    oc get routes -A -o json | jq -c '
      [ (.items // [])[] | "\(.metadata.namespace)/\(.metadata.name)" ] | sort'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: postval_live_routes_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: postval_live_routes_raw.rc == 0

- name: "Postvalidation Check 10/10: Extract baseline and live inventory components for diffing"
  set_fact:
    postval_live_nodes_list: "{{ postval_all_nodes | map(attribute='name') | list }}"
    postval_live_operators_list: "{{ postval_co_all | map(attribute='name') | list }}"
    postval_live_routes_list: "{{ postval_live_routes_raw.stdout | default('[]') | from_json }}"
    postval_baseline_nodes_list: "{{ postval_baseline_dict.nodes | default([]) | map(attribute='name') | list if postval_baseline_dict is defined else [] }}"
    postval_baseline_operators_list: "{{ postval_baseline_dict.cluster_operators | default([]) | map(attribute='name') | list if postval_baseline_dict is defined else [] }}"
    postval_baseline_routes_list: >-
      {%- set b_routes = [] -%}
      {%- if postval_baseline_dict is defined and postval_baseline_dict.routes is defined -%}
        {%- for r in postval_baseline_dict.routes -%}
          {%- set _ = b_routes.append(r.namespace ~ '/' ~ r.name) -%}
        {%- endfor -%}
      {%- endif -%}
      {{ b_routes }}
    postval_baseline_version: "{{ postval_baseline_dict.cluster_metadata.current_version | default('unknown') if postval_baseline_dict is defined else 'unknown' }}"
    postval_baseline_captured_at: "{{ postval_baseline_dict.cluster_metadata.captured_at | default('unknown') if postval_baseline_dict is defined else 'unknown' }}"

- name: "Postvalidation Check 10/10: Compute baseline discrepancies (missing components)"
  set_fact:
    postval_missing_nodes: "{{ postval_baseline_nodes_list | difference(postval_live_nodes_list) }}"
    postval_missing_operators: "{{ postval_baseline_operators_list | difference(postval_live_operators_list) }}"
    postval_missing_routes: "{{ postval_baseline_routes_list | difference(postval_live_routes_list) }}"

- name: "Postvalidation Check 10/10: Evaluate baseline diff audit validity"
  set_fact:
    postval_diff_clean: >-
      {{ (postval_baseline_dict is defined) and
         ((postval_missing_nodes | length) == 0) and
         ((postval_missing_operators | length) == 0) and
         ((postval_missing_routes | length) == 0) and
         ((postval_live_nodes_list | length) >= (postval_baseline_nodes_list | length)) }}

- name: "Postvalidation Check 10/10: Construct Check 10 structured health record"
  set_fact:
    diff_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "Baseline Diff Audit"
      gate: "WARN"
      status: "{{ 'PASS' if (postval_diff_clean | bool) else 'WARN' }}"
      observed: >-
        {%- if postval_baseline_dict is not defined -%}
          Phase 01 baseline snapshot not found at '{{ postval_resolved_snapshot_file }}'; baseline diff skipped
        {%- elif postval_diff_clean | bool -%}
          Cluster parity confirmed vs Phase 01 baseline: Nodes (baseline: {{ postval_baseline_nodes_list | length }}, live: {{ postval_live_nodes_list | length }}), Operators (baseline: {{ postval_baseline_operators_list | length }}, live: {{ postval_live_operators_list | length }}), Routes (baseline: {{ postval_baseline_routes_list | length }}, live: {{ postval_live_routes_list | length }}). Version upgraded from {{ postval_baseline_version }} to {{ postval_cv_data.current_version }}.
        {%- else -%}
          Discrepancies vs Phase 01 baseline: missing_nodes=[{{ postval_missing_nodes | join(', ') }}], missing_operators=[{{ postval_missing_operators | join(', ') }}], missing_routes=[{{ postval_missing_routes | join(', ') }}]; Nodes (baseline: {{ postval_baseline_nodes_list | length }}, live: {{ postval_live_nodes_list | length }}), Routes (baseline: {{ postval_baseline_routes_list | length }}, live: {{ postval_live_routes_list | length }}).
        {%- endif -%}

- name: "Postvalidation Check 10/10: Record Check 10 outcome to health_summary"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [diff_health_item] }}"

- name: "Postvalidation Check 10/10: Log Check 10 outcome"
  debug:
    msg:
      - "Check        : {{ diff_health_item.name }}"
      - "Status       : {{ diff_health_item.status }}"
      - "Observed     : {{ diff_health_item.observed }}"

# ----------------------------------------------------------------------------
# 11. Postvalidation Contract Completion Summary
# Why: Emits high-visibility diagnostic summary to terminal and logs.
# ----------------------------------------------------------------------------
- name: "Display Postvalidation 10-Check Contract completion summary"
  debug:
    msg:
      - "============================================================================"
      - "POSTVALIDATION CONTRACT COMPLETE: 10 CHECKS EVALUATED"
      - "============================================================================"
      - "Target Cluster       : {{ cluster_name }}"
      - "Final Target Version : {{ postval_resolved_target_version }}"
      - "Total Checks Scanned : {{ health_summary | length }}"
      - "Passed               : {{ health_summary | selectattr('status', 'equalto', 'PASS') | list | length }}"
      - "Warnings             : {{ health_summary | selectattr('status', 'equalto', 'WARN') | list | length }}"
      - "Failed (HARD)        : {{ health_summary | selectattr('gate', 'equalto', 'HARD') | selectattr('status', 'equalto', 'FAIL') | list | length }}"
      - "Gate Enforcement     : {{ postval_enforce_gate | default(true) | bool }}"
      - "============================================================================"

# ----------------------------------------------------------------------------
# 12. HARD Gate Enforcement
# Why: Halts execution immediately if any HARD postvalidation check failed.
# ----------------------------------------------------------------------------
- name: "Identify failed HARD postvalidation checks"
  set_fact:
    postval_failed_hard_items: >-
      {{ health_summary | default([])
         | selectattr('gate', 'equalto', 'HARD')
         | selectattr('status', 'equalto', 'FAIL')
         | list }}
    postval_failed_hard_checks: >-
      {{ health_summary | default([])
         | selectattr('gate', 'equalto', 'HARD')
         | selectattr('status', 'equalto', 'FAIL')
         | map(attribute='name') | list }}

- name: "Enforce HARD postvalidation gate"
  fail:
    msg: >-
      [HARD GATE FAILURE] Postvalidation contract failed for cluster '{{ cluster_name }}'.
      Failed HARD checks ({{ postval_failed_hard_items | length }}):
      {% for item in postval_failed_hard_items %}
      - Check {{ item.num }}: {{ item.name }} [{{ item.status }}] — {{ item.observed }}
      {% endfor %}
  when:
    - postval_enforce_gate | default(true) | bool
    - (postval_failed_hard_checks | length) > 0
