---
# ============================================================================
# Phase 02 Playbook: Prevalidation & Auto-Remediation
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses standard play-level vars_files, include_role, and
#                 block/rescue/always; compatible across Ansible 2.7 and 2.14.
#
# Purpose: Orchestrates the complete 15-check prevalidation contract defined
#          in context/feature-spec/09-prevalidation-and-phase02.md.
#          Reuses the authenticated session from Phase 01, executes the
#          15-check scan via roles/prevalidation, invokes roles/remediate if
#          auto-fixable HARD checks fail and toggles are active, re-evaluates
#          residual gates, generates client-facing HTML prevalidation reports
#          via roles/report, and ensures fail-safe session teardown on failure.
# Role / Playbook Dependencies: vars/upgrade.yml, vars/secrets.yml, vars/paths.yml,
#               vars/smtp.yml, vars/report_vars.yml, vars/api_regex.yml,
#               roles/login, roles/logout, roles/prevalidation,
#               roles/remediate, roles/report, roles/error_handle
# Gate Type: HARD (fails immediately if residual HARD checks persist)
# Outputs: output/<cluster>_prevalidation_<ts>.html, health_summary fact, preval_report_file fact, email notification
# ============================================================================

- name: "Phase 02 — Prevalidation & Auto-Remediation"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/upgrade.yml
    - vars/secrets.yml
    - vars/paths.yml
    - vars/smtp.yml
    - vars/report_vars.yml
    - vars/api_regex.yml

  # --------------------------------------------------------------------------
  # Main Tasks: 15-Check Prevalidation, Auto-Remediation Pass & Report Generation
  # --------------------------------------------------------------------------
  tasks:
    - name: "Phase 02: Execute Prevalidation Scan and Blocker Remediation"
      block:
        # 0. Capture start epoch for phase runtime calculation
        - name: "Phase 02: Capture start epoch for phase runtime calculation"
          set_fact:
            phase02_start_epoch: "{{ lookup('pipe', 'date +%s') }}"

        # 1. Establish run timestamp for consistent file naming across phases
        - name: "Ensure run timestamp is established for logs and reports"
          set_fact:
            run_timestamp: "{{ run_timestamp | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"
          when: run_timestamp is not defined or run_timestamp | length == 0

        # 2. Session Verification & Re-use
        # Why: Reuses authenticated session from Phase 01. If invoked standalone,
        #      safely establishes cluster session via login role inside protected block.
        - name: "Phase 02: Check if existing authenticated cluster session is present"
          stat:
            path: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
          register: p02_kubeconfig_stat

        - name: "Phase 02: Establish authenticated cluster session via login role if needed"
          include_role:
            name: login
          when: not (p02_kubeconfig_stat.stat.exists | default(false))

        # 2. Display Phase 02 Initiation Banner
        - name: "Display Phase 02 initiation banner"
          debug:
            msg:
              - "============================================================================"
              - "PHASE 02: PREVALIDATION & AUTO-REMEDIATION INITIATED"
              - "============================================================================"
              - "Target Cluster       : {{ cluster_name }}"
              - "Target Hop           : {{ upgrade_path[0] | default('unknown') }}"
              - "Auto-Remediation     : {{ auto_remediation_enabled | default(true) | bool }}"
              - "Kubeconfig           : {{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
              - "============================================================================"

        # 3. Execute Initial 15-Check Prevalidation Scan via prevalidation role
        - name: "Execute 15-Check Prevalidation Contract scan via prevalidation role"
          include_role:
            name: prevalidation

        # 4. Identify Initial Failed HARD Checks
        - name: "Identify initial failed HARD prevalidation checks"
          set_fact:
            preval_failed_hard_checks: >-
              {{ health_summary | default([])
                 | selectattr('gate', 'equalto', 'HARD')
                 | selectattr('status', 'equalto', 'FAIL')
                 | map(attribute='name') | list }}

        # 5. Evaluate Auto-Remediation Requirements
        - name: "Evaluate whether auto-remediation should be dispatched"
          set_fact:
            preval_remediation_needed: >-
              {{ (auto_remediation_enabled | default(true) | bool) and
                 ((('CGroup Mode Compatibility' in preval_failed_hard_checks) and (auto_fix_cgroup_v2 | default(true) | bool)) or
                  (('Administrator Acknowledgement (Admin-Acks)' in preval_failed_hard_checks) and (auto_apply_admin_acks | default(true) | bool)) or
                  (('MachineConfigPools Synchronization' in preval_failed_hard_checks) and (auto_unpause_mcp | default(true) | bool)) or
                  (('ClusterOperators Health' in preval_failed_hard_checks) and (auto_restart_degraded_operators | default(false) | bool))) }}
            trigger_cgroup_remediation: >-
              {{ ('CGroup Mode Compatibility' in preval_failed_hard_checks) and
                 (auto_fix_cgroup_v2 | default(true) | bool) and
                 (not (skip_cgroup_check | default(false) | bool)) }}
            trigger_admin_ack_remediation: >-
              {{ ('Administrator Acknowledgement (Admin-Acks)' in preval_failed_hard_checks) and (auto_apply_admin_acks | default(true) | bool) }}
            trigger_unpause_mcp_remediation: >-
              {{ ('MachineConfigPools Synchronization' in preval_failed_hard_checks) and (auto_unpause_mcp | default(true) | bool) }}
            trigger_co_restart_remediation: >-
              {{ ('ClusterOperators Health' in preval_failed_hard_checks) and (auto_restart_degraded_operators | default(false) | bool) }}

        # 6. Execute Auto-Remediation Pass via remediate role if needed
        - name: "Display Auto-Remediation pass initiation notice"
          debug:
            msg:
              - "============================================================================"
              - "PHASE 02: AUTO-REMEDIATION PASS DISPATCHED"
              - "============================================================================"
              - "Trigger CGroup v2    : {{ trigger_cgroup_remediation | bool }}"
              - "Trigger Admin-Acks   : {{ trigger_admin_ack_remediation | bool }}"
              - "Trigger Unpause MCP  : {{ trigger_unpause_mcp_remediation | bool }}"
              - "Trigger Restart CO   : {{ trigger_co_restart_remediation | bool }}"
              - "============================================================================"
          when: preval_remediation_needed | bool

        - name: "Phase 02: Execute Auto-Remediation pass for fixable blockers via remediate role"
          include_role:
            name: remediate
          when: preval_remediation_needed | bool

        # 7. Evaluate Residual HARD Gate
        - name: "Identify residual failing HARD checks after remediation pass"
          set_fact:
            preval_residual_hard_failures: >-
              {{ health_summary | default([])
                 | selectattr('gate', 'equalto', 'HARD')
                 | selectattr('status', 'in', ['FAIL', 'FIX-FAILED'])
                 | list }}

        - name: "HARD Gate: Enforce prevalidation health contract"
          fail:
            msg: >-
              [HARD GATE FAILURE] Phase 02 Prevalidation contract failed for cluster '{{ cluster_name }}'.
              Residual failed HARD checks ({{ preval_residual_hard_failures | length }}):
              {% for item in preval_residual_hard_failures %}
              - Check {{ item.num }}: {{ item.name }} [{{ item.status }}] — {{ item.observed }}
              {% endfor %}
              Execution halted before upgrade initiation with zero cluster mutations.
          when: (preval_residual_hard_failures | length) > 0

        # 8. Generate Prevalidation HTML Report via report role
        - name: "Calculate Phase 02 execution duration"
          set_fact:
            phase02_duration_seconds: "{{ (lookup('pipe', 'date +%s') | int) - (phase02_start_epoch | default(0) | int) }}"

        - name: "Configure report parameters for Prevalidation report"
          set_fact:
            report_type: "prevalidation"
            report_title: "Pre-Upgrade Validation Report"
            report_template: "phase02-prevalidation.j2"
            checks: "{{ health_summary }}"

        - name: "Generate client-facing Prevalidation HTML report via report role"
          include_role:
            name: report

        # 9. Log Confirmation to Text Run Log (.txt)
        - name: "Log Phase 02 prevalidation pass to text run log"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
            line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [PASS] [HARD] Phase 02: Prevalidation contract satisfied for cluster '{{ cluster_name }}' (Total checks: {{ health_summary | length }}, Passed: {{ health_summary | selectattr('status', 'equalto', 'PASS') | list | length }}, Warn: {{ health_summary | selectattr('status', 'equalto', 'WARN') | list | length }}, Autofixed: {{ health_summary | selectattr('status', 'equalto', 'AUTO-FIXED') | list | length }}). Report generated: {{ report_file_path }}."
            create: true

        # 10. Log Confirmation to CSV Run Log (.csv)
        - name: "Check if CSV run log exists"
          stat:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
          register: phase02_csv_stat

        - name: "Initialize CSV run log header if new"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
            line: "timestamp,cluster,task_name,gate_type,status,reason,observed"
            create: true
          when: not (phase02_csv_stat.stat.exists | default(false))

        - name: "Log Phase 02 prevalidation pass to CSV run log"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
            line: '"{{ lookup(''pipe'', ''date +%Y-%m-%dT%H:%M:%S'') }}","{{ cluster_name }}","Phase 02 Prevalidation & Auto-Remediation","HARD","PASS","Prevalidation contract satisfied (Autofixed: {{ health_summary | selectattr(''status'', ''equalto'', ''AUTO-FIXED'') | list | length }})","Report: {{ report_file_path }}"'
            create: true

        # 11. Dispatch Prevalidation HTML Report Email via sendmail role
        - name: "Phase 02: Resolve prevalidation email recipients"
          set_fact:
            resolved_preval_recipients: >-
              {{ preval_mail_to
                 if (preval_mail_to is defined and preval_mail_to | length > 0)
                 else (mail_to | default([])) }}
          when:
            - send_prevalidation_email | default(true) | bool
            - not (dry_run | default(false) | bool)

        - name: "Phase 02: Audit available report attachments"
          stat:
            path: "{{ item }}"
          loop:
            - "{{ output_dir | default(playbook_dir ~ '/output') }}/{{ cluster_name }}_phase01_{{ run_timestamp }}.html"
            - "{{ report_file_path }}"
          register: preval_attachment_stats
          when:
            - send_prevalidation_email | default(true) | bool
            - not (dry_run | default(false) | bool)

        - name: "Phase 02: Filter available report attachments"
          set_fact:
            preval_final_attachments: >-
              {{ preval_attachment_stats.results
                 | selectattr('stat.exists', 'defined')
                 | selectattr('stat.exists', 'equalto', true)
                 | map(attribute='item')
                 | list }}
          when:
            - send_prevalidation_email | default(true) | bool
            - not (dry_run | default(false) | bool)

        - name: "Phase 02: Dispatch Prevalidation HTML Report email notification"
          block:
            - name: "Configure Prevalidation Report email parameters"
              set_fact:
                mail_to: "{{ resolved_preval_recipients }}"
                mail_subject: "{{ prevalidation_subject_prefix | default('[ARO Upgrade PREVALIDATION]') }} — {{ overall_verdict | default('PASS') }} — {{ cluster_name }}"
                mail_template: "phase02-prevalidation.j2"
                mail_attachments: "{{ preval_final_attachments | default([report_file_path]) }}"

            - name: "Dispatch Prevalidation HTML report email via sendmail role"
              include_role:
                name: sendmail

            - name: "Log prevalidation email delivery confirmation to text run log"
              lineinfile:
                path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
                line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [INFO] [NOTIFICATION] Prevalidation HTML report emailed to: {{ resolved_preval_recipients | join(', ') }} with attachments {{ preval_final_attachments | join(', ') }}."
                create: true
              failed_when: false
          # ------------------------------------------------------------------
          # Rescue: Non-fatal email notification error handler
          # ------------------------------------------------------------------
          # 1. Error extraction: captures ansible_failed_result.msg from mail failure.
          # 2. Alerts dispatched: logs non-fatal diagnostic warning to console and run log.
          # 3. Teardown guarantee: execution continues cleanly without interrupting prevalidation.
          # ------------------------------------------------------------------
          rescue:
            - name: "Log warning if prevalidation email dispatch encountered SMTP error"
              debug:
                msg: "[WARN] Prevalidation HTML report was successfully generated at '{{ report_file_path }}', but email notification dispatch failed: {{ ansible_failed_result.msg | default('SMTP error') }}"

            - name: "Log email dispatch warning to text run log"
              lineinfile:
                path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
                line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [WARN] [NOTIFICATION] Prevalidation HTML report was generated at {{ report_file_path }}, but email dispatch failed."
                create: true
              failed_when: false
          when:
            - send_prevalidation_email | default(true) | bool
            - not (dry_run | default(false) | bool)
            - (resolved_preval_recipients | default([]) | length) > 0

        # 12. Display Structured Confirmation Banner
        - name: "Display Phase 02 Prevalidation completion banner"
          debug:
            msg:
              - "============================================================================"
              - "PHASE 02 COMPLETE: PREVALIDATION & AUTO-REMEDIATION SUCCESSFUL"
              - "============================================================================"
              - "Cluster Name       : {{ cluster_name }}"
              - "Target First Hop   : {{ preval_resolved_target_version | default(upgrade_path[0] | default('unknown')) }}"
              - "Total Checks       : {{ health_summary | length }}"
              - "Passed Checks      : {{ health_summary | selectattr('status', 'equalto', 'PASS') | list | length }}"
              - "Warnings           : {{ health_summary | selectattr('status', 'equalto', 'WARN') | list | length }}"
              - "Auto-Fixed Checks  : {{ health_summary | selectattr('status', 'equalto', 'AUTO-FIXED') | list | length }}"
              - "Residual Failures  : 0"
              - "Report File        : {{ report_file_path }}"
              - "Email Notification : {{ 'Deferred to Dry-Run Digest' if (dry_run | default(false) | bool) else ('Dispatched to ' ~ (resolved_preval_recipients | join(', ')) if (send_prevalidation_email | default(true) | bool and (resolved_preval_recipients | default([]) | length > 0)) else 'Disabled / No recipients') }}"
              - "Session State      : {{ 'Preserved for Phase 05 Validation' if ((dry_run | default(false) | bool) and (dry_run_include_postval | default(true) | bool)) else ('Preserved for Phase 03 Upgrade Initiation' if not ((dry_run | default(false) | bool) or (stop_after_phase is defined and (stop_after_phase | int) <= 2)) else 'Terminated (Pre-check / Dry-run completed)') }}"
              - "============================================================================"

      # ----------------------------------------------------------------------
      # Rescue: Error Extraction, Alert Dispatch & Clean Session Logout
      # ----------------------------------------------------------------------
      # 1. Error extraction cascade: ansible_failed_result.stderr -> stderr_lines -> msg -> fallback.
      # 2. Alerts dispatched: error_handle triggers failure alert email (error-report.j2) and dual run logs.
      # 3. Teardown guarantee: session logout is guaranteed by caller always: block and rescue handler.
      # ----------------------------------------------------------------------
      rescue:
        - name: "Extract sanitized error message from failure result in Phase 02"
          set_fact:
            resolved_error: >-
              {{ resolved_error
                 if (resolved_error | default('') | length > 0)
                 else (ansible_failed_result.stderr | default('')
                 if (ansible_failed_result.stderr | default('') | length > 0)
                 else (ansible_failed_result.stderr_lines | default([]) | join('\n'))
                 if (ansible_failed_result.stderr_lines | default([]) | length > 0)
                 else ansible_failed_result.msg | default('Unknown error — inspect logs')) }}

        - name: "Evaluate whether failure is an RBAC / authorization error in Phase 02"
          set_fact:
            is_rbac_error: >-
              {{ (resolved_error | lower is search('forbidden'))
                 or (resolved_error | lower is search('cannot patch'))
                 or (resolved_error | lower is search('unauthorized'))
                 or (resolved_error | lower is search('cannot get'))
                 or (resolved_error | lower is search('cannot list'))
                 or (resolved_error | lower is search('cannot create')) }}

        # Calculate Phase 02 failure execution duration
        - name: "Calculate Phase 02 execution duration on failure"
          set_fact:
            phase02_duration_seconds: "{{ (lookup('pipe', 'date +%s') | int) - (phase02_start_epoch | default(lookup('pipe', 'date +%s')) | int) }}"

        # Determine destination prevalidation failure report file path
        - name: "Determine destination prevalidation failure report file path"
          set_fact:
            p02_rescue_report_path: "{{ output_dir | default(playbook_dir ~ '/output') }}/{{ cluster_name }}_prevalidation_{{ run_timestamp }}.html"

        # Assemble complete 15-check prevalidation contract list for failure report
        # Why: Guarantees that even on early failure (e.g. check 04 abort or HARD gate halt),
        #      the client-facing HTML report contains all 15 checks with their status.
        - name: "Assemble complete 15-check prevalidation contract list for failure report"
          set_fact:
            preval_failure_checks: >-
              {%- set canon = [
                {'num': 1, 'name': 'ClusterOperators Health', 'gate': 'HARD'},
                {'num': 2, 'name': 'Node Health and Conditions', 'gate': 'HARD'},
                {'num': 3, 'name': 'MachineConfigPools Synchronization', 'gate': 'HARD'},
                {'num': 4, 'name': 'API Context Verification', 'gate': 'HARD'},
                {'num': 5, 'name': 'API Server Readiness Probe', 'gate': 'HARD'},
                {'num': 6, 'name': 'etcd Quorum and Member Health', 'gate': 'HARD'},
                {'num': 7, 'name': 'Administrator Acknowledgement (Admin-Acks)', 'gate': 'HARD'},
                {'num': 8, 'name': 'Node Request Capacity Headroom', 'gate': 'HARD'},
                {'num': 9, 'name': 'Pending Node Certificate Signing Requests (CSRs)', 'gate': 'WARN'},
                {'num': 10, 'name': 'PersistentVolumes Health', 'gate': 'WARN'},
                {'num': 11, 'name': 'PersistentVolumeClaims Health', 'gate': 'WARN'},
                {'num': 12, 'name': 'PodDisruptionBudgets Headroom', 'gate': 'WARN'},
                {'num': 13, 'name': 'Critical Namespace Pod Health', 'gate': 'WARN'},
                {'num': 14, 'name': 'CGroup Mode Compatibility', 'gate': 'HARD'},
                {'num': 15, 'name': 'OLM Operator Upgrade Compatibility', 'gate': 'HARD'}
              ] -%}
              {%- set res = [] -%}
              {%- for c in canon -%}
                {%- set matched = [] -%}
                {%- for h in health_summary | default([]) -%}
                  {%- if (h.num | default(0) | int == c.num) or (c.name | lower in (h.name | default('') | lower)) or ((h.name | default('') | lower) in c.name | lower) -%}
                    {%- set _ = matched.append(h) -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- if matched | length > 0 -%}
                  {%- set _ = res.append(matched[0]) -%}
                {%- else -%}
                  {%- set is_first_unrun = (res | length == (health_summary | default([]) | length)) -%}
                  {%- set _ = res.append({
                    'num': c.num,
                    'name': c.name,
                    'gate': c.gate,
                    'status': ('FAIL' if is_first_unrun else 'SKIPPED'),
                    'observed': (('Halted with error: ' ~ resolved_error) if is_first_unrun else 'Check was not evaluated due to prior failure in prevalidation sequence')
                  }) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ res }}

        # Configure failure report parameters
        - name: "Configure failure report parameters for Prevalidation report"
          set_fact:
            report_type: "prevalidation"
            report_title: "Pre-Upgrade Validation Report"
            report_template: "phase02-prevalidation.j2"
            overall_status: "FAIL"
            overall_verdict: "FAIL"
            checks: "{{ preval_failure_checks }}"
            output_file: "{{ p02_rescue_report_path }}"

        - name: "Ensure report output directory exists on failure"
          file:
            path: "{{ output_dir | default(playbook_dir ~ '/output') }}"
            state: directory
            mode: '0755'

        # Generate Prevalidation HTML failure report via report role
        - name: "Generate client-facing Prevalidation HTML failure report via report role"
          include_role:
            name: report
          ignore_errors: true

        - name: "Check if Prevalidation failure HTML report was written to disk"
          stat:
            path: "{{ p02_rescue_report_path }}"
          register: p02_rescue_report_stat

        # Fallback: Directly stream template if report role did not generate file
        - name: "Fallback: Directly stream phase02-prevalidation.j2 to output if needed"
          template:
            src: "{{ playbook_dir }}/templates/phase02-prevalidation.j2"
            dest: "{{ p02_rescue_report_path }}"
            mode: '0644'
          when: not (p02_rescue_report_stat.stat.exists | default(false))
          failed_when: false

        - name: "Verify Prevalidation failure report disk presence and export facts"
          stat:
            path: "{{ p02_rescue_report_path }}"
          register: p02_final_rescue_stat

        - name: "Attach Prevalidation HTML report to mail_attachments for alert email"
          set_fact:
            report_file_path: "{{ p02_rescue_report_path }}"
            mail_attachments: "{{ ((mail_attachments | default([])) + [p02_rescue_report_path]) | unique }}"
            attached_reports: "{{ ((attached_reports | default([])) + [p02_rescue_report_path]) | unique }}"
          when: p02_final_rescue_stat.stat.exists | default(false)

        - name: "Log Phase 02 failure and report generation to text run log"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
            line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [FAIL] [HARD] Phase 02 Prevalidation failed: {{ resolved_error | replace('\n', ' ') }}. Failure report: {{ p02_rescue_report_path }}."
            create: true
          failed_when: false

        - name: "Configure Phase 02 error context facts"
          set_fact:
            current_step_no: "Phase 02"
            current_task_name: "Phase 02 Prevalidation & Auto-Remediation"
            current_gate_type: "HARD"
            failure_reason: "Prevalidation HARD gate or auto-remediation failure in Phase 02"
            failure_observed: "{{ resolved_error }}"
            phase_02_failed: true

        - name: "Record Phase 02 failure and dispatch alert via error_handle role"
          include_role:
            name: error_handle

        - name: "Execute session logout on Phase 02 failure"
          include_role:
            name: logout

        - name: "Halt execution on Phase 02 failure"
          fail:
            msg: "Phase 02 Prevalidation & Auto-Remediation failed: {{ resolved_error }}"

      # ----------------------------------------------------------------------
      # Always: Fail-Safe Session Logout Guarantee
      # ----------------------------------------------------------------------
      always:
        - name: "Guarantee session logout if Phase 02 failed"
          include_role:
            name: logout
          when: phase_02_failed | default(false) | bool
