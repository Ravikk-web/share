---
# ============================================================================
# Phase 02 Playbook: Prevalidation & Auto-Remediation
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses standard play-level vars_files, include_role, and
#                 block/rescue/always; compatible across Ansible 2.7 and 2.14.
#
# Purpose: Orchestrates the complete 14-check prevalidation contract defined
#          in context/feature-spec/09-prevalidation-and-phase02.md.
#          Reuses the authenticated session from Phase 01, executes the
#          14-check scan via roles/prevalidation, invokes roles/remediate if
#          auto-fixable HARD checks fail and toggles are active, re-evaluates
#          residual gates, generates client-facing HTML prevalidation reports
#          via roles/report, and ensures fail-safe session teardown on failure.
# Dependencies: vars/upgrade.yml, vars/secrets.yml, vars/paths.yml,
#               vars/smtp.yml, vars/report_vars.yml, vars/api_regex.yml,
#               roles/login, roles/logout, roles/prevalidation,
#               roles/remediate, roles/report, roles/error_handle
# Gate type: HARD (fails immediately if residual HARD checks persist)
# ============================================================================

- name: "Phase 02 — Prevalidation & Auto-Remediation"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/upgrade.yml
    - vars/secrets.yml
    - vars/paths.yml
    - vars/smtp.yml
    - vars/report_vars.yml
    - vars/api_regex.yml

  # --------------------------------------------------------------------------
  # Pre-Tasks: Session Verification & Re-use
  # Why: Reuses authenticated session from Phase 01. If invoked standalone,
  #      safely establishes cluster session via login role.
  # --------------------------------------------------------------------------
  pre_tasks:
    - name: "Phase 02: Check if existing authenticated cluster session is present"
      stat:
        path: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: p02_kubeconfig_stat

    - name: "Phase 02: Establish authenticated cluster session via login role if needed"
      include_role:
        name: login
      when: not (p02_kubeconfig_stat.stat.exists | default(false))

  # --------------------------------------------------------------------------
  # Main Tasks: 14-Check Prevalidation, Auto-Remediation Pass & Report Generation
  # --------------------------------------------------------------------------
  tasks:
    - name: "Phase 02: Execute Prevalidation Scan and Blocker Remediation"
      block:
        # 1. Establish run timestamp for consistent file naming across phases
        - name: "Ensure run timestamp is established for logs and reports"
          set_fact:
            run_timestamp: "{{ run_timestamp | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"
          when: run_timestamp is not defined or run_timestamp | length == 0

        # 2. Display Phase 02 Initiation Banner
        - name: "Display Phase 02 initiation banner"
          debug:
            msg:
              - "============================================================================"
              - "PHASE 02: PREVALIDATION & AUTO-REMEDIATION INITIATED"
              - "============================================================================"
              - "Target Cluster       : {{ cluster_name }}"
              - "Target Hop           : {{ upgrade_path[0] | default('unknown') }}"
              - "Auto-Remediation     : {{ auto_remediation_enabled | default(true) | bool }}"
              - "Kubeconfig           : {{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
              - "============================================================================"

        # 3. Execute Initial 14-Check Prevalidation Scan via prevalidation role
        - name: "Execute 14-Check Prevalidation Contract scan via prevalidation role"
          include_role:
            name: prevalidation

        # 4. Identify Initial Failed HARD Checks
        - name: "Identify initial failed HARD prevalidation checks"
          set_fact:
            preval_failed_hard_checks: >-
              {{ health_summary | default([])
                 | selectattr('gate', 'equalto', 'HARD')
                 | selectattr('status', 'equalto', 'FAIL')
                 | map(attribute='name') | list }}

        # 5. Evaluate Auto-Remediation Requirements
        - name: "Evaluate whether auto-remediation should be dispatched"
          set_fact:
            preval_remediation_needed: >-
              {{ (auto_remediation_enabled | default(true) | bool) and
                 ((('CGroup Mode Compatibility' in preval_failed_hard_checks) and (auto_fix_cgroup_v2 | default(true) | bool)) or
                  (('Administrator Acknowledgement (Admin-Acks)' in preval_failed_hard_checks) and (auto_apply_admin_acks | default(true) | bool)) or
                  (('MachineConfigPools Synchronization' in preval_failed_hard_checks) and (auto_unpause_mcp | default(true) | bool)) or
                  (('ClusterOperators Health' in preval_failed_hard_checks) and (auto_restart_degraded_operators | default(false) | bool))) }}
            trigger_cgroup_remediation: >-
              {{ ('CGroup Mode Compatibility' in preval_failed_hard_checks) and
                 (auto_fix_cgroup_v2 | default(true) | bool) and
                 (not (skip_cgroup_check | default(false) | bool)) }}
            trigger_admin_ack_remediation: >-
              {{ ('Administrator Acknowledgement (Admin-Acks)' in preval_failed_hard_checks) and (auto_apply_admin_acks | default(true) | bool) }}
            trigger_unpause_mcp_remediation: >-
              {{ ('MachineConfigPools Synchronization' in preval_failed_hard_checks) and (auto_unpause_mcp | default(true) | bool) }}
            trigger_co_restart_remediation: >-
              {{ ('ClusterOperators Health' in preval_failed_hard_checks) and (auto_restart_degraded_operators | default(false) | bool) }}

        # 6. Execute Auto-Remediation Pass via remediate role if needed
        - name: "Display Auto-Remediation pass initiation notice"
          debug:
            msg:
              - "============================================================================"
              - "PHASE 02: AUTO-REMEDIATION PASS DISPATCHED"
              - "============================================================================"
              - "Trigger CGroup v2    : {{ trigger_cgroup_remediation | bool }}"
              - "Trigger Admin-Acks   : {{ trigger_admin_ack_remediation | bool }}"
              - "Trigger Unpause MCP  : {{ trigger_unpause_mcp_remediation | bool }}"
              - "Trigger Restart CO   : {{ trigger_co_restart_remediation | bool }}"
              - "============================================================================"
          when: preval_remediation_needed | bool

        - name: "Phase 02: Execute Auto-Remediation pass for fixable blockers via remediate role"
          include_role:
            name: remediate
          when: preval_remediation_needed | bool

        # 7. Evaluate Residual HARD Gate
        - name: "Identify residual failing HARD checks after remediation pass"
          set_fact:
            preval_residual_hard_failures: >-
              {{ health_summary | default([])
                 | selectattr('gate', 'equalto', 'HARD')
                 | selectattr('status', 'in', ['FAIL', 'FIX-FAILED'])
                 | list }}

        - name: "HARD Gate: Enforce prevalidation health contract"
          fail:
            msg: >-
              [HARD GATE FAILURE] Phase 02 Prevalidation contract failed for cluster '{{ cluster_name }}'.
              Residual failed HARD checks ({{ preval_residual_hard_failures | length }}):
              {% for item in preval_residual_hard_failures %}
              - Check {{ item.num }}: {{ item.name }} [{{ item.status }}] — {{ item.observed }}
              {% endfor %}
              Execution halted before upgrade initiation with zero cluster mutations.
          when: (preval_residual_hard_failures | length) > 0

        # 8. Generate Prevalidation HTML Report via report role
        - name: "Configure report parameters for Prevalidation report"
          set_fact:
            report_type: "prevalidation"
            report_title: "Pre-Upgrade Validation Report"
            checks: "{{ health_summary }}"

        - name: "Generate client-facing Prevalidation HTML report via report role"
          include_role:
            name: report

        # 9. Log Confirmation to Text Run Log (.txt)
        - name: "Log Phase 02 prevalidation pass to text run log"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
            line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [PASS] [HARD] Phase 02: Prevalidation contract satisfied for cluster '{{ cluster_name }}' (Total checks: {{ health_summary | length }}, Passed: {{ health_summary | selectattr('status', 'equalto', 'PASS') | list | length }}, Warn: {{ health_summary | selectattr('status', 'equalto', 'WARN') | list | length }}, Autofixed: {{ health_summary | selectattr('status', 'equalto', 'AUTO-FIXED') | list | length }}). Report generated: {{ report_file_path }}."
            create: true

        # 10. Log Confirmation to CSV Run Log (.csv)
        - name: "Check if CSV run log exists"
          stat:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
          register: phase02_csv_stat

        - name: "Initialize CSV run log header if new"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
            line: "timestamp,cluster,task_name,gate_type,status,reason,observed"
            create: true
          when: not (phase02_csv_stat.stat.exists | default(false))

        - name: "Log Phase 02 prevalidation pass to CSV run log"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
            line: '"{{ lookup(''pipe'', ''date +%Y-%m-%dT%H:%M:%S'') }}","{{ cluster_name }}","Phase 02 Prevalidation & Auto-Remediation","HARD","PASS","Prevalidation contract satisfied (Autofixed: {{ health_summary | selectattr(''status'', ''equalto'', ''AUTO-FIXED'') | list | length }})","Report: {{ report_file_path }}"'
            create: true

        # 11. Display Structured Confirmation Banner
        - name: "Display Phase 02 Prevalidation completion banner"
          debug:
            msg:
              - "============================================================================"
              - "PHASE 02 COMPLETE: PREVALIDATION & AUTO-REMEDIATION SUCCESSFUL"
              - "============================================================================"
              - "Cluster Name       : {{ cluster_name }}"
              - "Target First Hop   : {{ preval_resolved_target_version | default(upgrade_path[0] | default('unknown')) }}"
              - "Total Checks       : {{ health_summary | length }}"
              - "Passed Checks      : {{ health_summary | selectattr('status', 'equalto', 'PASS') | list | length }}"
              - "Warnings           : {{ health_summary | selectattr('status', 'equalto', 'WARN') | list | length }}"
              - "Auto-Fixed Checks  : {{ health_summary | selectattr('status', 'equalto', 'AUTO-FIXED') | list | length }}"
              - "Residual Failures  : 0"
              - "Report File        : {{ report_file_path }}"
              - "Session State      : Preserved for Phase 03 Upgrade Initiation"
              - "============================================================================"

      # ----------------------------------------------------------------------
      # Rescue: Error Extraction, Alert Dispatch & Clean Session Logout
      # ----------------------------------------------------------------------
      rescue:
        - name: "Extract sanitized error message from failure result in Phase 02"
          set_fact:
            resolved_error: >-
              {{ ansible_failed_result.stderr | default('')
                 if (ansible_failed_result.stderr | default('') | length > 0)
                 else (ansible_failed_result.stderr_lines | default([]) | join('\n'))
                 if (ansible_failed_result.stderr_lines | default([]) | length > 0)
                 else ansible_failed_result.msg | default('Unknown error — inspect logs') }}

        - name: "Evaluate whether failure is an RBAC / authorization error in Phase 02"
          set_fact:
            is_rbac_error: >-
              {{ (resolved_error | lower is search('forbidden'))
                 or (resolved_error | lower is search('cannot patch'))
                 or (resolved_error | lower is search('unauthorized'))
                 or (resolved_error | lower is search('cannot get'))
                 or (resolved_error | lower is search('cannot list'))
                 or (resolved_error | lower is search('cannot create')) }}

        - name: "Configure Phase 02 error context facts"
          set_fact:
            current_step_no: "Phase 02"
            current_task_name: "Phase 02 Prevalidation & Auto-Remediation"
            current_gate_type: "HARD"
            failure_reason: "Prevalidation HARD gate or auto-remediation failure in Phase 02"
            failure_observed: "{{ resolved_error }}"
            phase_02_failed: true

        - name: "Record Phase 02 failure and dispatch alert via error_handle role"
          include_role:
            name: error_handle

        - name: "Execute session logout on Phase 02 failure"
          include_role:
            name: logout

        - name: "Halt execution on Phase 02 failure"
          fail:
            msg: "Phase 02 Prevalidation & Auto-Remediation failed: {{ resolved_error }}"

      # ----------------------------------------------------------------------
      # Always: Fail-Safe Session Logout Guarantee
      # ----------------------------------------------------------------------
      always:
        - name: "Guarantee session logout if Phase 02 failed"
          include_role:
            name: logout
          when: phase_02_failed | default(false) | bool
