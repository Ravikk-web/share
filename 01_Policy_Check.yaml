---
# ============================================================================
# Phase 01 Playbook: Policy Check & Baseline Snapshot Capture
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses standard play-level vars_files, include_role, and
#                 block/rescue/always; compatible across Ansible 2.7 and 2.14.
#
# Purpose: Authenticates against the target OpenShift cluster, executes the
#          snapshot role to capture the baseline JSON snapshot, validates that
#          the first hop in upgrade_path is a confirmed update edge from the
#          current version, enforces the HARD edge gate, logs confirmation,
#          and ensures fail-safe session teardown on any failure.
# Role / Playbook Dependencies: vars/upgrade.yml, vars/secrets.yml, vars/paths.yml,
#               vars/smtp.yml, vars/report_vars.yml, vars/api_regex.yml,
#               roles/login, roles/logout, roles/snapshot, roles/error_handle
# Gate Type: HARD (fails immediately if edge check fails or cluster unreachable)
# Outputs: snapshots/<cluster>_<ts>_baseline.json, baseline_snapshot_file_path fact, output/<cluster>_phase01_<ts>.html (success and failure), authenticated session
# ============================================================================

- name: "Phase 01 — Policy Check & Baseline Capture"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/upgrade.yml
    - vars/secrets.yml
    - vars/paths.yml
    - vars/smtp.yml
    - vars/report_vars.yml
    - vars/api_regex.yml

  # --------------------------------------------------------------------------
  # Main Tasks: Policy Check, Snapshot Capture & Edge Enforcement
  # --------------------------------------------------------------------------
  tasks:
    - name: "Phase 01: Execute Baseline Capture and Policy Validation"
      block:
        # 1. Establish run timestamp for consistent file naming across phases
        - name: "Ensure run timestamp is established for snapshot, logs and reports"
          set_fact:
            run_timestamp: "{{ run_timestamp | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"
          when: run_timestamp is not defined or run_timestamp | length == 0

        # Why: Captures epoch seconds at phase start for duration calculation in the report.
        - name: "Capture Phase 01 start time for duration tracking"
          set_fact:
            phase01_start_epoch: "{{ lookup('pipe', 'date +%s') }}"

        # 2. Establish authenticated cluster session via login role
        # Why: Authenticates once per workflow run, scoping the kubeconfig file
        #      under playbook_dir. Scoped within the primary tasks block so that
        #      authentication failures jump to rescue, generating a failure HTML
        #      report and sending an error alert email with the report attached.
        - name: "Phase 01: Establish authenticated cluster session via login role"
          include_role:
            name: login

        - name: "Record successful cluster authentication"
          set_fact:
            p01_login_succeeded: true

        # 3. Capture immutable baseline JSON snapshot via snapshot role
        - name: "Capture cluster baseline snapshot"
          include_role:
            name: snapshot

        # 3. Query live available update edges from ClusterVersion
        - name: "Query live cluster available update edges"
          shell: |
            # Why: set -o pipefail requires /bin/bash; Ansible default /bin/sh defaults to dash on Debian
            set -o pipefail
            oc get clusterversion version -o json | jq -r '(.status.availableUpdates // [])[].version'
          args:
            executable: /bin/bash
          environment:
            KUBECONFIG: "{{ cluster_kubeconfig }}"
          register: cv_available_edges_raw
          changed_when: false
          retries: "{{ oc_command_retries | default(3) }}"
          delay: "{{ oc_command_retry_delay | default(10) }}"
          until: cv_available_edges_raw.rc == 0

        # 4. Query live conditional update edges from ClusterVersion
        - name: "Query live cluster conditional update edges"
          shell: |
            # Why: set -o pipefail requires /bin/bash; Ansible default /bin/sh defaults to dash on Debian
            set -o pipefail
            oc get clusterversion version -o json | jq -r '(.status.conditionalUpdates // [])[].version'
          args:
            executable: /bin/bash
          environment:
            KUBECONFIG: "{{ cluster_kubeconfig }}"
          register: cv_conditional_edges_raw
          changed_when: false
          retries: "{{ oc_command_retries | default(3) }}"
          delay: "{{ oc_command_retry_delay | default(10) }}"
          until: cv_conditional_edges_raw.rc == 0

        # 5. Extract and consolidate valid update edges
        - name: "Consolidate verified cluster update edges"
          set_fact:
            available_edges_list: "{{ cv_available_edges_raw.stdout_lines | default([]) }}"
            conditional_edges_list: "{{ cv_conditional_edges_raw.stdout_lines | default([]) }}"
            target_first_hop: "{{ upgrade_path[0] }}"

        - name: "Assemble combined valid update edge set"
          set_fact:
            all_valid_update_edges: "{{ (available_edges_list + conditional_edges_list) | unique }}"

        # 6. Validate target first hop against live edges
        - name: "Verify target first hop exists in cluster update graph"
          set_fact:
            is_valid_target_edge: "{{ target_first_hop in all_valid_update_edges }}"

        # 7. HARD Gate: Halt if target hop is not a valid update edge
        - name: "HARD Gate: Enforce target hop is a verified update edge"
          fail:
            msg: >-
              [HARD GATE FAILURE] Target version '{{ target_first_hop }}' is NOT a verified update edge
              for cluster '{{ cluster_name }}' (current version: '{{ baseline_current_version | default("unknown") }}', channel: '{{ baseline_channel | default("unknown") }}').
              Available edges: {{ available_edges_list | join(', ') if (available_edges_list | length > 0) else 'None' }}.
              Conditional edges: {{ conditional_edges_list | join(', ') if (conditional_edges_list | length > 0) else 'None' }}.
              Execution halted with zero cluster mutations.
          when: not (is_valid_target_edge | bool)

        # 8. Log confirmation to human-readable text run log (.txt)
        - name: "Log Phase 01 baseline capture confirmation to text run log"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
            line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [PASS] [HARD] Phase 01: Baseline snapshot captured to {{ baseline_snapshot_file_path }} (Nodes: {{ baseline_nodes_count }}, Operators: {{ baseline_operators_count }}, Routes: {{ baseline_routes_count }}). Target hop '{{ target_first_hop }}' verified in cluster update graph."
            create: true

        # 9. Log confirmation to machine-parseable CSV run log (.csv)
        - name: "Check if CSV run log exists"
          stat:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
          register: phase01_csv_stat

        - name: "Initialize CSV run log header if new"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
            line: "timestamp,cluster,task_name,gate_type,status,reason,observed"
            create: true
          when: not (phase01_csv_stat.stat.exists | default(false))

        - name: "Log Phase 01 baseline capture confirmation to CSV run log"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
            line: '"{{ lookup(''pipe'', ''date +%Y-%m-%dT%H:%M:%S'') }}","{{ cluster_name }}","Phase 01 Baseline & Edge Check","HARD","PASS","Verified update edge {{ target_first_hop }}","Snapshot: {{ baseline_snapshot_file_path }}"'
            create: true

        # 10. Display structured confirmation banner
        - name: "Display Phase 01 completion banner"
          debug:
            msg:
              - "============================================================================"
              - "PHASE 01 COMPLETE: POLICY CHECK & BASELINE SNAPSHOT CAPTURED"
              - "============================================================================"
              - "Cluster Name     : {{ cluster_name }}"
              - "Current Version  : {{ baseline_current_version }}"
              - "Target First Hop : {{ target_first_hop }}"
              - "Snapshot File    : {{ baseline_snapshot_file_path }}"
              - "Nodes Count      : {{ baseline_nodes_count }}"
              - "Operators Count  : {{ baseline_operators_count }}"
              - "Routes Count     : {{ baseline_routes_count }}"
              - "Session State    : Preserved for Phase 02 Prevalidation"
              - "============================================================================"

        # 11. Calculate Phase 01 runtime duration
        # Why: Captures phase end time and computes delta for report metric tile.
        - name: "Calculate Phase 01 execution duration"
          set_fact:
            phase01_duration_seconds: "{{ (lookup('pipe', 'date +%s') | int) - (phase01_start_epoch | int) }}"

        # 12. Assemble Phase 01 structured check results for report template
        # Why: Constructs a list of dicts (same schema as health_summary) representing
        #      each Phase 01 execution step, for the report role to render.
        - name: "Assemble Phase 01 execution step records for report"
          set_fact:
            phase01_checks:
              - num: 0
                name: "Establish Authenticated Cluster Session"
                gate: "HARD"
                status: "PASS"
                observed: "Login successful via oc login — kubeconfig scoped to playbook_dir (.kubeconfig-{{ cluster_name }})"
              - num: 1
                name: "Establish Run Timestamp"
                gate: "INFO"
                status: "PASS"
                observed: "run_timestamp: {{ run_timestamp }}"
              - num: 2
                name: "Capture Cluster Baseline Snapshot"
                gate: "HARD"
                status: "PASS"
                observed: "{{ baseline_snapshot_file_path }} — Nodes: {{ baseline_nodes_count }}, Operators: {{ baseline_operators_count }}, Routes: {{ baseline_routes_count }}"
              - num: 3
                name: "Query Live Available Update Edges"
                gate: "HARD"
                status: "PASS"
                observed: "{{ available_edges_list | length }} available edges discovered from ClusterVersion status.availableUpdates"
              - num: 4
                name: "Query Live Conditional Update Edges"
                gate: "HARD"
                status: "PASS"
                observed: "{{ conditional_edges_list | length }} conditional edges discovered from ClusterVersion status.conditionalUpdates"
              - num: 5
                name: "Consolidate Verified Update Edge Set"
                gate: "INFO"
                status: "PASS"
                observed: "{{ all_valid_update_edges | length }} unique valid update edges assembled (available + conditional, deduplicated)"
              - num: 6
                name: "Verify Target First Hop in Update Graph"
                gate: "INFO"
                status: "PASS"
                observed: "Target {{ target_first_hop }} confirmed present in combined edge set — is_valid_target_edge: true"
              - num: 7
                name: "HARD Gate: Enforce Verified Update Edge"
                gate: "HARD"
                status: "PASS"
                observed: "Gate passed — target version {{ target_first_hop }} is a verified update edge from {{ baseline_current_version }} on {{ baseline_channel }}"
              - num: 8
                name: "Log Phase 01 Confirmation (.txt)"
                gate: "INFO"
                status: "PASS"
                observed: "logs/{{ cluster_name }}_{{ run_timestamp }}.txt — [PASS] [HARD] Baseline snapshot captured"
              - num: 9
                name: "Log Phase 01 Confirmation (.csv)"
                gate: "INFO"
                status: "PASS"
                observed: "logs/{{ cluster_name }}_{{ run_timestamp }}.csv — Phase 01 Baseline & Edge Check PASS"
              - num: 10
                name: "Display Phase 01 Completion Banner"
                gate: "INFO"
                status: "PASS"
                observed: "PHASE 01 COMPLETE — Session preserved for Phase 02 Prevalidation"

        # 13. Configure deep diagnostic details for Phase 01 report
        - name: "Configure deep diagnostic details for Phase 01 report"
          set_fact:
            diagnostic_details:
              - title: "Live Cluster Version & Channel Configuration"
                content: >-
                  Cluster: {{ cluster_name }}
                  Current Version: {{ baseline_current_version }}
                  Channel: {{ baseline_channel }}
                  Target First Hop: {{ target_first_hop }}
                  Verified Edge: true
              - title: "Available Update Edges (Raw)"
                content: "{{ available_edges_list | default([]) | to_nice_json }}"
              - title: "Conditional Update Edges (Raw)"
                content: "{{ conditional_edges_list | default([]) | to_nice_json }}"

        # 14. Configure report parameters for Phase 01 report generation
        # Why: Pre-computes facts consumed by the report role to prevent Jinja2 lazy recursion.
        #      Uses phase01-policy-check.j2 template instead of health-overview.j2 because
        #      Phase 01 content (edge validation, snapshot grid, session lifecycle) differs
        #      structurally from the health-check table format used by Phases 02/05/06.
        - name: "Configure report parameters for Phase 01 Policy Check report"
          set_fact:
            report_type: "phase01"
            report_title: "Phase 01 — Policy Check & Baseline Capture Report"
            report_template: "phase01-policy-check.j2"
            checks: "{{ phase01_checks }}"

        # 15. Generate client-facing Phase 01 HTML report via report role
        - name: "Generate client-facing Phase 01 Policy Check HTML report via report role"
          include_role:
            name: report

        # 16. Session Teardown on Standalone / Phase 01 Stop
        - name: "Phase 01: Teardown cluster session if stopping after Phase 01 or standalone"
          include_role:
            name: logout
          when: (standalone_phase | default(false) | bool) or (stop_after_phase is defined and (stop_after_phase | int) == 1)
      when:
        - skip_to_phase is not defined or (skip_to_phase | int) <= 1
        - stop_after_phase is not defined or (stop_after_phase | int) >= 1

      # ----------------------------------------------------------------------
      # Rescue: Error Extraction, Report Generation, Alert Dispatch & Session Logout
      # ----------------------------------------------------------------------
      # 1. Error extraction cascade: ansible_failed_result.stderr -> stderr_lines -> msg -> fallback.
      # 2. Fail-safe report: generates phase01-policy-check.j2 HTML report on failure (roles/report + direct fallback).
      # 3. Alerts dispatched: error_handle triggers failure alert email (error-report.j2) with attached report.
      # 4. Teardown guarantee: session logout is guaranteed by caller always: block and rescue handler.
      # ----------------------------------------------------------------------
      rescue:
        - name: "Extract sanitized error message from failure result in Phase 01"
          set_fact:
            resolved_error: >-
              {{ resolved_error
                 if (resolved_error | default('') | length > 0)
                 else (ansible_failed_result.stderr | default('')
                       if (ansible_failed_result is defined and ansible_failed_result.stderr is defined and ansible_failed_result.stderr | length > 0)
                       else (ansible_failed_result.stderr_lines | default([]) | join('\n'))
                       if (ansible_failed_result is defined and ansible_failed_result.stderr_lines is defined and ansible_failed_result.stderr_lines | length > 0)
                       else (ansible_failed_result.msg | default('Unknown error — inspect logs'))
                       if (ansible_failed_result is defined and ansible_failed_result.msg is defined)
                       else (failure_observed
                             if (failure_observed | default('') | length > 0)
                             else 'Unknown error — inspect logs')) }}

        - name: "Evaluate whether failure is an RBAC / authorization error in Phase 01"
          set_fact:
            is_rbac_error: >-
              {{ (resolved_error | lower is search('forbidden'))
                 or (resolved_error | lower is search('cannot patch'))
                 or (resolved_error | lower is search('unauthorized'))
                 or (resolved_error | lower is search('cannot get'))
                 or (resolved_error | lower is search('cannot list'))
                 or (resolved_error | lower is search('cannot create')) }}

        - name: "Configure Phase 01 error context facts"
          set_fact:
            current_step_no: "Phase 01"
            current_task_name: "Phase 01 Policy Check & Baseline Capture"
            current_gate_type: "HARD"
            failure_reason: "Phase 01 Policy Check or Baseline Snapshot failed"
            failure_observed: "{{ resolved_error }}"
            phase_01_failed: true
            run_timestamp: "{{ run_timestamp | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"
            target_first_hop: "{{ target_first_hop | default(upgrade_path[0] if (upgrade_path is defined and upgrade_path | length > 0) else 'unknown') }}"

        - name: "Phase 01 Rescue: Calculate execution duration on failure"
          set_fact:
            phase01_duration_seconds: "{{ (lookup('pipe', 'date +%s') | int) - (phase01_start_epoch | default(lookup('pipe', 'date +%s')) | int) }}"

        - name: "Phase 01 Rescue: Assemble execution step records for failure report"
          set_fact:
            phase01_checks:
              - num: 0
                name: "Establish Authenticated Cluster Session"
                gate: "HARD"
                status: "{{ 'PASS' if (p01_login_succeeded | default(false)) else 'FAIL' }}"
                observed: >-
                  {{ ('Login successful via oc login — kubeconfig scoped to playbook_dir (.kubeconfig-' ~ (cluster_name | default('cluster')) ~ ')')
                     if (p01_login_succeeded | default(false))
                     else ('Cluster authentication failed: ' ~ resolved_error) }}
              - num: 1
                name: "Establish Run Timestamp"
                gate: "INFO"
                status: "PASS"
                observed: "run_timestamp: {{ run_timestamp }}"
              - num: 2
                name: "Capture Cluster Baseline Snapshot"
                gate: "HARD"
                status: >-
                  {{ 'PASS' if (baseline_snapshot_file_path is defined and baseline_snapshot_file_path | length > 0)
                     else ('SKIPPED' if not (p01_login_succeeded | default(false))
                           else 'FAIL') }}
                observed: >-
                  {{ (baseline_snapshot_file_path ~ ' — Nodes: ' ~ (baseline_nodes_count | default(0)) ~ ', Operators: ' ~ (baseline_operators_count | default(0)) ~ ', Routes: ' ~ (baseline_routes_count | default(0)))
                     if (baseline_snapshot_file_path is defined and baseline_snapshot_file_path | length > 0)
                     else ('Skipped due to prior authentication failure'
                           if not (p01_login_succeeded | default(false))
                           else ('Failed to capture baseline snapshot: ' ~ resolved_error)) }}
              - num: 3
                name: "Query Live Available Update Edges"
                gate: "HARD"
                status: >-
                  {{ 'PASS' if (cv_available_edges_raw is defined and cv_available_edges_raw.rc | default(1) == 0)
                     else ('SKIPPED' if (baseline_snapshot_file_path is not defined or baseline_snapshot_file_path | length == 0)
                           else 'FAIL') }}
                observed: >-
                  {{ (((available_edges_list | default([])) | length | string) ~ ' available edges discovered from ClusterVersion status.availableUpdates')
                     if (cv_available_edges_raw is defined and cv_available_edges_raw.rc | default(1) == 0)
                     else ('Skipped due to prior failure'
                           if (baseline_snapshot_file_path is not defined or baseline_snapshot_file_path | length == 0)
                           else ('Failed querying available update edges: ' ~ resolved_error)) }}
              - num: 4
                name: "Query Live Conditional Update Edges"
                gate: "HARD"
                status: >-
                  {{ 'PASS' if (cv_conditional_edges_raw is defined and cv_conditional_edges_raw.rc | default(1) == 0)
                     else ('SKIPPED' if (cv_available_edges_raw is not defined or cv_available_edges_raw.rc | default(1) != 0)
                           else 'FAIL') }}
                observed: >-
                  {{ (((conditional_edges_list | default([])) | length | string) ~ ' conditional edges discovered from ClusterVersion status.conditionalUpdates')
                     if (cv_conditional_edges_raw is defined and cv_conditional_edges_raw.rc | default(1) == 0)
                     else ('Skipped due to prior query failure'
                           if (cv_available_edges_raw is not defined or cv_available_edges_raw.rc | default(1) != 0)
                           else ('Failed querying conditional update edges: ' ~ resolved_error)) }}
              - num: 5
                name: "Consolidate Verified Update Edge Set"
                gate: "INFO"
                status: >-
                  {{ 'PASS' if (all_valid_update_edges is defined and all_valid_update_edges | length > 0)
                     else ('SKIPPED' if (cv_available_edges_raw is not defined)
                           else 'FAIL') }}
                observed: >-
                  {{ ((all_valid_update_edges | length | string) ~ ' unique valid update edges assembled')
                     if (all_valid_update_edges is defined and all_valid_update_edges | length > 0)
                     else ('Skipped due to prior query failure'
                           if (cv_available_edges_raw is not defined)
                           else 'No valid update edges assembled') }}
              - num: 6
                name: "Verify Target First Hop in Update Graph"
                gate: "INFO"
                status: >-
                  {{ 'PASS' if (is_valid_target_edge is defined and (is_valid_target_edge | string | lower in ['true', '1']))
                     else ('FAIL' if (is_valid_target_edge is defined and not (is_valid_target_edge | string | lower in ['true', '1']))
                           else 'SKIPPED') }}
                observed: >-
                  {{ ('Target ' ~ (target_first_hop | default('unknown')) ~ ' confirmed present in combined edge set')
                     if (is_valid_target_edge is defined and (is_valid_target_edge | string | lower in ['true', '1']))
                     else (('Target "' ~ (target_first_hop | default('unknown')) ~ '" is NOT a valid update edge from ' ~ (baseline_current_version | default('cluster')) ~ ' on channel ' ~ (baseline_channel | default('unknown')))
                           if (is_valid_target_edge is defined and not (is_valid_target_edge | string | lower in ['true', '1']))
                           else 'Skipped due to prior edge query failure') }}
              - num: 7
                name: "HARD Gate: Enforce Verified Update Edge"
                gate: "HARD"
                status: >-
                  {{ 'PASS' if (is_valid_target_edge is defined and (is_valid_target_edge | string | lower in ['true', '1']))
                     else 'FAIL' }}
                observed: >-
                  {{ ('Gate passed — target version ' ~ (target_first_hop | default('unknown')) ~ ' is a verified update edge')
                     if (is_valid_target_edge is defined and (is_valid_target_edge | string | lower in ['true', '1']))
                     else ('HARD GATE HALTED: ' ~ resolved_error) }}
              - num: 8
                name: "Phase 01 Overall Execution Status"
                gate: "HARD"
                status: "FAIL"
                observed: "Execution halted in Phase 01: {{ resolved_error }}"

        - name: "Phase 01 Rescue: Configure deep diagnostic details for failure report"
          set_fact:
            diagnostic_details:
              - title: "Phase 01 Failure Context & Root-Cause Error"
                content: >-
                  Cluster: {{ cluster_name | default('cluster') }}
                  Current Version: {{ baseline_current_version | default('unknown') }}
                  Target First Hop: {{ target_first_hop | default('unknown') }}
                  Channel: {{ baseline_channel | default('unknown') }}
                  Failed Task: {{ current_task_name | default('Phase 01 Policy Check') }}
                  Gate Type: {{ current_gate_type | default('HARD') }}
                  Error: {{ resolved_error }}

        - name: "Phase 01 Rescue: Configure report parameters for failure report"
          set_fact:
            report_type: "phase01"
            report_title: "Phase 01 — Policy Check & Baseline Capture Report"
            report_template: "phase01-policy-check.j2"
            overall_status: "FAIL"
            overall_verdict: "FAIL"
            checks: "{{ phase01_checks }}"

        - name: "Phase 01 Rescue: Check if Phase 01 report was already generated on disk"
          stat:
            path: "{{ output_dir | default(playbook_dir ~ '/output') }}/{{ cluster_name | default('cluster') }}_phase01_{{ run_timestamp }}.html"
          register: p01_rescue_report_stat

        # Layer 1: Standard report generation via report role
        - name: "Phase 01 Rescue: Generate client-facing HTML report on failure via report role"
          include_role:
            name: report
          when: not (p01_rescue_report_stat.stat.exists | default(false))
          ignore_errors: true

        # Why: Resolves the Phase 01 HTML report path (freshly created or pre-existing)
        #      and verifies existence on disk before email attachment handling.
        - name: "Phase 01 Rescue: Resolve report artifact path"
          set_fact:
            p01_rescue_report_path: >-
              {{ report_file_path
                 if (report_file_path is defined and report_file_path | length > 0)
                 else ((output_dir | default(playbook_dir ~ '/output')) ~ '/' ~ (cluster_name | default('cluster')) ~ '_phase01_' ~ (run_timestamp | default('current')) ~ '.html') }}

        - name: "Phase 01 Rescue: Check presence of report artifact on disk"
          stat:
            path: "{{ p01_rescue_report_path }}"
          register: p01_rescue_report_file_stat

        # Layer 2: Fail-safe direct template fallback: ensures report exists even if report role was bypassed or failed
        - name: "Phase 01 Rescue: Ensure report output directory exists for fallback generation"
          file:
            path: "{{ output_dir | default(playbook_dir ~ '/output') }}"
            state: directory
            mode: '0755'
          when: not (p01_rescue_report_file_stat.stat.exists | default(false))

        - name: "Phase 01 Rescue: Fallback direct HTML report generation if report role did not write file"
          template:
            src: "{{ playbook_dir }}/templates/phase01-policy-check.j2"
            dest: "{{ p01_rescue_report_path }}"
            mode: '0644'
          when: not (p01_rescue_report_file_stat.stat.exists | default(false))

        - name: "Phase 01 Rescue: Re-verify report presence after fallback generation"
          stat:
            path: "{{ p01_rescue_report_path }}"
          register: p01_rescue_report_final_stat

        - name: "Phase 01 Rescue: Attach Phase 01 HTML report to failure alert email"
          set_fact:
            report_file_path: "{{ p01_rescue_report_path }}"
            mail_attachments: "{{ [p01_rescue_report_path] }}"
            attached_reports: "{{ [p01_rescue_report_path | basename] }}"
          when: p01_rescue_report_final_stat.stat.exists | default(false)

        - name: "Phase 01 Rescue: Ensure attachments are empty if no report on disk"
          set_fact:
            report_file_path: ""
            mail_attachments: []
            attached_reports: []
          when: not (p01_rescue_report_final_stat.stat.exists | default(false))

        - name: "Record Phase 01 failure and alert via error_handle role"
          include_role:
            name: error_handle

        - name: "Execute session logout on Phase 01 failure"
          include_role:
            name: logout

        - name: "Halt execution on Phase 01 failure"
          fail:
            msg: "Phase 01 Policy Check & Baseline Capture failed: {{ resolved_error }}"

      # ----------------------------------------------------------------------
      # Always: Fail-Safe Session Logout Guarantee
      # ----------------------------------------------------------------------
      always:
        - name: "Guarantee session logout if Phase 01 failed"
          include_role:
            name: logout
          when: phase_01_failed | default(false) | bool
