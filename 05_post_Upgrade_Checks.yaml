# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (set_fact, fail, include_role, command, debug, stat)
#                 work on both versions.
#                 | default('') guards are applied on all optional variables.
#
# Phase 05 — Post-Upgrade Verification & 10-Check Hard Gate (05_post_Upgrade_Checks.yaml)
#
# Responsibilities:
#   1. Reuses authenticated session from earlier phases (or logs in if run standalone).
#   2. Executes postvalidation aggregator role running all 10 checks (5 HARD, 5 WARN) + baseline diff.
#   3. Renders client-facing HTML postvalidation report to output/ via report role.
#   4. Enforces HARD gate: any HARD failure aborts execution and tears down session.
#   5. WARN checks surface non-blocking findings in report and logs.
#   6. Wrapped in block/rescue/always: rescue logs errors, dispatches alert email, and logs out.

---
- name: Phase 05 — Post-Upgrade Verification Hard Gate
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - vars/upgrade.yml
    - vars/paths.yml
    - vars/secrets.yml
    - vars/smtp.yml
    - vars/report_vars.yml
    - vars/api_regex.yml

  pre_tasks:
    - name: Check existing kubeconfig session
      stat:
        path: "{{ kubeconfig_path }}"
      register: post_kubeconfig_stat

    - name: Test cluster session reachability
      command: oc whoami --show-server --kubeconfig "{{ kubeconfig_path }}"
      register: post_whoami_test
      changed_when: false
      failed_when: false
      when:
        - not (dry_run | default(false) | bool)
        - post_kubeconfig_stat.stat.exists | default(false)

    - name: Resolve target cluster credentials if re-authentication needed
      set_fact:
        target_cluster_entry: "{{ (clusters | default([]) | selectattr('name', 'equalto', cluster_name) | list | first) | default({}) }}"
      no_log: true
      when:
        - not (dry_run | default(false) | bool)
        - not (post_kubeconfig_stat.stat.exists | default(false)) or (post_whoami_test.rc | default(1) != 0)

    - name: Set login parameters for cluster {{ cluster_name | default('UNKNOWN') }}
      set_fact:
        login_api_url: "{{ target_cluster_entry.api_url | default(login_api_url | default('')) }}"
        login_username: "{{ target_cluster_entry.username | default(login_username | default('')) }}"
        login_password: "{{ target_cluster_entry.password | default(login_password | default('')) }}"
      no_log: true
      when:
        - not (dry_run | default(false) | bool)
        - not (post_kubeconfig_stat.stat.exists | default(false)) or (post_whoami_test.rc | default(1) != 0)

    - name: Authenticate to cluster {{ cluster_name | default('UNKNOWN') }} (if not already logged in)
      include_role:
        name: login
      when:
        - not (dry_run | default(false) | bool)
        - not (post_kubeconfig_stat.stat.exists | default(false)) or (post_whoami_test.rc | default(1) != 0)

  tasks:
    - name: Phase 05 Execution Block
      block:
        - name: Set Phase 05 Step 1 Context — 10-Check Postvalidation
          set_fact:
            failed_phase: "05_post_Upgrade_Checks"
            current_step_no: 1
            current_task_name: "Post-Upgrade 10-Check Verification"
            current_gate_type: "HARD"
            phase05_failed: false

        - name: Run 10-Check Postvalidation Aggregator
          include_role:
            name: postvalidation

        - name: Set Phase 05 Step 2 Context — Render Postvalidation HTML Report
          set_fact:
            current_step_no: 2
            current_task_name: "Render Postvalidation HTML Report"
            current_gate_type: "HARD"

        - name: Render Postvalidation HTML Verification Report
          include_role:
            name: report
          vars:
            report_phase: "postvalidation"
            phase_name: "Post-Upgrade Verification (Phase 05)"

        - name: Export postvalidation report path for downstream phases
          set_fact:
            postvalidation_report_html_path: "{{ report_html_path | default('') }}"

        - name: Detect any HARD gate failures in health_summary
          set_fact:
            postval_hard_failures: "{{ health_summary | default([]) | selectattr('gate', 'equalto', 'HARD') | selectattr('status', 'equalto', 'FAIL') | list }}"

        - name: Enforce HARD gate halt on postvalidation failures
          fail:
            msg: >-
              HARD GATE FAILURE in Phase 05: One or more critical postvalidation checks failed on cluster '{{ cluster_name }}'.
              Found {{ postval_hard_failures | length }} failed HARD check(s).
              Postvalidation report written to: {{ report_html_path | default('output/') }}.
              Upgrade cannot be declared successful until all HARD postvalidation checks pass.
          when: (postval_hard_failures | length > 0) or (failed_validations | default([]) | length > 0)

        - name: Confirm Phase 05 Post-Upgrade Verification Success
          debug:
            msg: >-
              ══════════════════════════════════════════════════════════════════════════
              ✔ Phase 05 Post-Upgrade Verification completed successfully on '{{ cluster_name }}'!
              All 5 HARD checks passed.
              Report generated: {{ report_html_path | default('N/A') }}.
              Overall verdict: {{ report_last_verdict | default('PASS') }}.
              Cluster successfully upgraded to final target version.
              ══════════════════════════════════════════════════════════════════════════

      rescue:
        - name: Record failure details for Phase 05
          set_fact:
            phase05_failed: true
            failed_phase: "05_post_Upgrade_Checks"
            failure_reason: >-
              {{
                (((ansible_failed_result | default({})).stderr | default('')) | trim) if (((ansible_failed_result | default({})).stderr | default('')) | trim != '')
                else (
                  (((ansible_failed_result | default({})).stderr_lines | default([])) | join(' ') | trim) if ((((ansible_failed_result | default({})).stderr_lines | default([])) | length) > 0)
                  else (
                    (((ansible_failed_result | default({})).msg | default('')) | trim) if (((ansible_failed_result | default({})).msg | default('')) | trim != '' and ((ansible_failed_result | default({})).msg | default('')) != 'non-zero return code')
                    else (
                      (((ansible_failed_result | default({})).message | default('')) | trim) if (((ansible_failed_result | default({})).message | default('')) | trim != '')
                      else 'Postvalidation checks failed.'
                    )
                  )
                )
              }}
            failure_observed: "FAILED at Step {{ current_step_no | default(1) }}: {{ current_task_name | default('Post-Upgrade Verification') }}"

        - name: Trigger standardized error handling and alert
          include_role:
            name: error_handle

        - name: Tear down cluster session on failure
          include_role:
            name: logout

        - name: Halt execution due to Phase 05 failure
          fail:
            msg: "Phase 05 (05_post_Upgrade_Checks) failed for cluster '{{ cluster_name }}'. Session torn down."

      always:
        - name: Ensure session logout at end of Phase 05
          include_role:
            name: logout
          when: phase05_failed | default(false)
      when: not (dry_run | default(false) | bool)
