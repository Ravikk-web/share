---
# ============================================================================
# Tasks: logout
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses command, file, set_fact, debug; compatible across 2.7 and 2.14.
#
# Purpose: Revokes active OpenShift session token, removes temporary kubeconfig,
#          clears KUBECONFIG facts, and guarantees fail-safe teardown.
# Role / Playbook Dependencies: None (designed to be safe even if login failed or was skipped)
# Gate Type: N/A (must never fail)
# Outputs: Revoked cluster session token, removed temporary kubeconfig file, cleared session facts
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Resolve Target Kubeconfig File
# ----------------------------------------------------------------------------
# Why: Resolves the exact kubeconfig path to terminate and delete, evaluating
#      kubeconfig_path, cluster_kubeconfig, and cluster_name in order.
- name: "Resolve target kubeconfig path for teardown"
  set_fact:
    logout_kubeconfig: >-
      {{ kubeconfig_path
         if (kubeconfig_path is defined and kubeconfig_path | length > 0)
         else (cluster_kubeconfig
         if (cluster_kubeconfig is defined and cluster_kubeconfig | length > 0)
         else (playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default')))) }}

# ----------------------------------------------------------------------------
# 2. Revoke Active Session Token
# ----------------------------------------------------------------------------
# Why: Revoking the token at the OpenShift API server invalidates the bearer token.
# Why: failed_when: false ensures session cleanup never masks underlying failure
#      even if the session was already closed, the server is unreachable, or
#      the kubeconfig file does not exist.
- name: "Revoke active OpenShift session token"
  command: "{{ oc_binary | default('oc') }} logout --kubeconfig={{ logout_kubeconfig }}"
  register: oc_logout_result
  failed_when: false
  changed_when: false
  no_log: true

# ----------------------------------------------------------------------------
# 3. Remove Temporary Kubeconfig File
# ----------------------------------------------------------------------------
# Why: Eliminates sensitive session tokens and credentials from jump host disk.
# Why: state=absent is idempotent; failed_when: false prevents masking errors.
- name: "Remove temporary kubeconfig file from disk"
  file:
    path: "{{ logout_kubeconfig }}"
    state: absent
  failed_when: false

# ----------------------------------------------------------------------------
# 4. Unset KUBECONFIG Facts
# ----------------------------------------------------------------------------
# Why: Clears in-memory references to prevent accidental token or path reuse
#      in any subsequent tasks or post-run scripts.
- name: "Unset KUBECONFIG facts to prevent token leakage"
  set_fact:
    cluster_kubeconfig: ""
    ansible_env_kubeconfig: ""
    kubeconfig: ""
    kubeconfig_path: ""
    active_cluster_server: ""
    logout_kubeconfig: ""

# ----------------------------------------------------------------------------
# 5. Clean Debug Confirmation
# ----------------------------------------------------------------------------
# Why: Provides clear audit feedback on the console confirming session teardown.
- name: "Confirm session termination"
  debug:
    msg: "Session closed and kubeconfig removed for cluster {{ cluster_name | default('default') }}."
