---
# ============================================================================
# Role Defaults: pdb (PodDisruptionBudgets)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Simple scalar and boolean values.
#
# Purpose: Defines default parameters for the pdb role, which audits
#          PodDisruptionBudgets across all namespaces to detect zero-disruption
#          budgets (disruptionsAllowed == 0 with expectedPods > 0) that would
#          deadlock node draining during MachineConfigPool rollouts.
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: Configurable (WARN by default; HARD if fail_on_zero_disruption_pdb is true)
# ============================================================================

# Target cluster identifier (string, required)
cluster_name: ""

# Enforce strict PodDisruptionBudget check (fail if any PDB allows 0 disruptions with active pods)
# Sourced from vars/upgrade.yml (default: false — non-blocking WARN advisory per 14-check contract)
fail_on_zero_disruption_pdb: false

# Whether to exclude core OpenShift platform namespaces from zero-disruption deadlock audits
# Prevents false positive HARD gate failures on logging/monitoring single-replica components
pdb_ignore_system_namespaces: true
pdb_system_namespaces:
  - "openshift-"
  - "kube-"

# Master toggle for enforcing gate failure on validation error
# Set to false by prevalidation aggregator during diagnostic sweeps before remediation
pdb_enforce_gate: true

# Transient retry parameters for oc CLI execution
oc_command_retries: 3
oc_command_retry_delay: 10
