---
# ============================================================================
# Role Tasks: pdb (PodDisruptionBudgets)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (shell, set_fact, fail, debug).
#                 Compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Detects restrictive PodDisruptionBudgets that prevent node evacuation
#          during MachineConfigPool rollout (disruptionsAllowed == 0 and expectedPods > 0).
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: Configurable (WARN by default; HARD if fail_on_zero_disruption_pdb is true)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Query Live PodDisruptionBudgets via oc CLI & jq v1.5
# Why: oc get pdb -A -o json parsed with jq 1.5 extracts disruption status.
# Why: Shell with set -o pipefail and args: executable: /bin/bash captures errors.
# Why: Parentheses around 'and' operands comply strictly with jq 1.5.
# Why: Filters for disruptionsAllowed == 0 AND expectedPods > 0 to detect true deadlocks.
# ----------------------------------------------------------------------------
- name: "Query live pod disruption budgets across all namespaces via jq"
  shell: |
    set -o pipefail
    oc get pdb -A -o json | jq -c '
      {
        total_count: (.items // [] | length),
        pdbs: [.items[]? | {
          namespace: .metadata.namespace,
          name: .metadata.name,
          disruptions_allowed: (.status.disruptionsAllowed // 0),
          current_healthy: (.status.currentHealthy // 0),
          desired_healthy: (.status.desiredHealthy // 0),
          expected_pods: (.status.expectedPods // 0)
        }],
        zero_disruption_pdbs: [.items[]? | select((((.status.disruptionsAllowed // 0) | tonumber) == 0) and (((.status.expectedPods // 0) | tonumber) > 0)) | {
          namespace: .metadata.namespace,
          name: .metadata.name,
          disruptions_allowed: (.status.disruptionsAllowed // 0),
          expected_pods: (.status.expectedPods // 0),
          desired_healthy: (.status.desiredHealthy // 0),
          current_healthy: (.status.currentHealthy // 0)
        }],
        zero_disruption_names: [.items[]? | select((((.status.disruptionsAllowed // 0) | tonumber) == 0) and (((.status.expectedPods // 0) | tonumber) > 0)) | ((.metadata.namespace // "") + "/" + (.metadata.name // ""))]
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: pdb_query_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: pdb_query_raw.rc == 0

# ----------------------------------------------------------------------------
# 2. Extract Facts & Evaluate PodDisruptionBudget Compliance
# Why: Bracket notation ['pdbs'] avoids collisions with Python dict.items().
# Why: Resolves whether check is HARD or WARN based on fail_on_zero_disruption_pdb.
# ----------------------------------------------------------------------------
- name: "Extract pod disruption budget facts"
  set_fact:
    pdb_total_count: "{{ (pdb_query_raw.stdout | default('{}') | from_json)['total_count'] | default(0) | int }}"
    pdb_all_budgets: "{{ (pdb_query_raw.stdout | default('{}') | from_json)['pdbs'] | default([]) }}"
    pdb_zero_disruption_items: "{{ (pdb_query_raw.stdout | default('{}') | from_json)['zero_disruption_pdbs'] | default([]) }}"
    pdb_zero_disruption_names: "{{ (pdb_query_raw.stdout | default('{}') | from_json)['zero_disruption_names'] | default([]) }}"

- name: "Filter offending pod disruption budgets by namespace policy"
  set_fact:
    pdb_effective_gate: "{{ 'HARD' if (fail_on_zero_disruption_pdb | default(false) | bool) else 'WARN' }}"
    pdb_actionable_zero_disruption_names: >-
      {%- set offending = [] -%}
      {%- for name in pdb_zero_disruption_names -%}
        {%- set ns = name.split('/')[0] | default('') -%}
        {%- set is_sys = false -%}
        {%- if (pdb_ignore_system_namespaces | default(true) | bool) -%}
          {%- for prefix in (pdb_system_namespaces | default(['openshift-', 'kube-'])) -%}
            {%- if ns.startswith(prefix) -%}{%- set is_sys = true -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- if not is_sys -%}{%- set _ = offending.append(name) -%}{%- endif -%}
      {%- endfor -%}
      {{ offending }}

- name: "Evaluate pod disruption budget compliance"
  set_fact:
    pdb_check_valid: >-
      {{ ((pdb_actionable_zero_disruption_names if (pdb_effective_gate == 'HARD') else pdb_zero_disruption_names) | length) == 0 }}

# ----------------------------------------------------------------------------
# 3. Construct Structured Health Record & Append to Summary
# Why: Appends structured dictionary into health_summary for reporting.
# ----------------------------------------------------------------------------
- name: "Construct structured pdb health record"
  set_fact:
    pdb_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "PodDisruptionBudgets Health"
      gate: "{{ pdb_effective_gate }}"
      status: "{{ 'PASS' if (pdb_check_valid | bool) else ('FAIL' if (pdb_effective_gate == 'HARD') else 'WARN') }}"
      observed: >-
        {{ ('All ' ~ pdb_total_count ~ ' PodDisruptionBudgets permit disruptions (no zero-disruption deadlocks)')
           if ((pdb_check_valid | bool) and (pdb_total_count > 0))
           else ('No PodDisruptionBudgets configured in cluster (PASS)')
           if ((pdb_check_valid | bool) and (pdb_total_count == 0))
           else ('Zero-disruption PDBs detected (disruptionsAllowed=0, expectedPods>0): [' ~ (pdb_zero_disruption_names | join(', ')) ~ ']') }}

- name: "Record pdb result to health_summary tracking list"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [pdb_health_item] }}"

- name: "Log pod disruption budget evaluation outcome"
  debug:
    msg:
      - "Check        : {{ pdb_health_item.name }}"
      - "Gate         : {{ pdb_health_item.gate }}"
      - "Status       : {{ pdb_health_item.status }}"
      - "Observed     : {{ pdb_health_item.observed }}"
      - "Gate Enforced: {{ pdb_enforce_gate | default(true) | bool }}"

# ----------------------------------------------------------------------------
# 4. Enforce Gate if Configured as HARD Gate
# Why: If fail_on_zero_disruption_pdb is true, halts upgrade to prevent drain deadlock.
# ----------------------------------------------------------------------------
- name: "Enforce HARD gate for PodDisruptionBudgets check"
  fail:
    msg: "HARD GATE FAILURE [pdb]: One or more PodDisruptionBudgets permit 0 disruptions with active pods on cluster '{{ cluster_name }}': {{ pdb_zero_disruption_names | to_json }}. Node draining during MCP rollout will deadlock until these PDBs are relaxed or workloads are scaled."
  when:
    - not (pdb_check_valid | bool)
    - pdb_effective_gate == 'HARD'
    - pdb_enforce_gate | default(true) | bool
