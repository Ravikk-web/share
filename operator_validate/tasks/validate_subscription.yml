---
# ============================================================================
# Task File: validate_subscription.yml (roles/operator_validate)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names and set_fact; fully compatible.
#
# Purpose: Validates an individual OLM subscription against active CSVs.
#          Confirms installedCSV exists and reports phase Succeeded.
# Dependencies: playbooks/roles/operator_validate/defaults/main.yml
# Gate type: HARD
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Match Subscription with Target CSV
# Why: Looks up matching CSV in same namespace matching sub_item.installed_csv.
# ----------------------------------------------------------------------------
- name: "operator_validate: Find matching CSV for subscription {{ sub_item.name }}"
  set_fact:
    val_matched_csvs: >-
      {{ val_csvs | default([])
         | selectattr('namespace', 'equalto', sub_item.namespace)
         | selectattr('name', 'equalto', sub_item.installed_csv)
         | list }}

- name: "operator_validate: Resolve CSV phase and validity for {{ sub_item.name }}"
  set_fact:
    val_csv_phase: >-
      {{ (val_matched_csvs | first).phase
         if (val_matched_csvs | length > 0)
         else 'Missing' }}
    val_csv_status: >-
      {{ 'PASS'
         if (val_matched_csvs | length > 0 and (val_matched_csvs | first).phase == 'Succeeded')
         else 'FAIL' }}

# ----------------------------------------------------------------------------
# 2. Append to Operator Report List
# ----------------------------------------------------------------------------
- name: "operator_validate: Append validated record for {{ sub_item.name }}"
  set_fact:
    operators: >-
      {{ operators | default([]) + [{
           'subscription': sub_item.name,
           'namespace': sub_item.namespace,
           'installed_csv': sub_item.installed_csv,
           'target_channel': sub_item.channel,
           'installplan_approval': sub_item.approval,
           'csv_phase': val_csv_phase,
           'status': val_csv_status,
           'details': 'Subscription ' ~ sub_item.name ~ ' -> CSV ' ~ sub_item.installed_csv ~ ' (' ~ val_csv_phase ~ ')'
         }] }}

- name: "operator_validate: Display subscription validation verdict"
  debug:
    msg: "Subscription '{{ sub_item.name }}' ({{ sub_item.namespace }}) -> CSV: {{ sub_item.installed_csv }} [Phase: {{ val_csv_phase }}] -> Verdict: {{ val_csv_status }}"
