---
# ============================================================================
# Phase 01 - Policy check, baseline snapshot, upgrade path
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Read-only. Steps:
#   1. Save a baseline snapshot of the cluster (Phase 05 compares against it).
#   2. Validate the whole upgrade path before anything changes:
#      - hops the cluster already reached are skipped (so a re-run resumes),
#      - an update already running to the next hop is watched, not restarted,
#      - every remaining edge is checked against the OpenShift update graph of
#        that hop's channel, and the first edge against the cluster's own offer.
#   3. Stop the run if the path is not valid.
# ============================================================================

- name: "Phase 01: Start"
  set_fact:
    current_phase: "01"

- name: "Phase 01: Save the baseline snapshot"
  include_tasks: "{{ playbook_dir }}/steps/01/snapshot.yml"

- name: "Phase 01: Validate the upgrade path"
  include_tasks: "{{ playbook_dir }}/steps/01/validate_path.yml"

- name: "Phase 01: Record the result"
  set_fact:
    run_start_version: "{{ path_current_version }}"
    run_phase_results: >-
      {{ run_phase_results + [{
           'phase': '01', 'name': phase_names['01'], 'status': path_validation_status,
           'detail': 'Cluster at ' ~ path_current_version ~ '; ' ~ (path_remaining_hops | length) ~ ' hop(s) to run'
                     ~ ((', ' ~ (path_reached_hops | length) ~ ' already reached') if (path_reached_hops | length > 0) else '')
                     ~ ((', resuming ' ~ path_in_progress_hop) if (path_in_progress_hop | length > 0) else '')
                     ~ ('; problems: ' ~ (path_validation_problems | join('; ')) if (path_validation_problems | length > 0) else '')
         }] }}

- name: "Phase 01: Log the result"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "{{ path_validation_status }}"
    event_task: "Upgrade path"
    event_reason: "{{ run_phase_results[-1].detail }}"
    event_observed: "Snapshot {{ baseline_snapshot_file_path | basename }}"

- name: "Phase 01: GATE - the upgrade path must be valid"
  fail:
    msg: >-
      The upgrade path {{ path_current_version }} -> {{ upgrade_path | join(' -> ') }} is not valid:
      {{ (path_validation_problems | join('; ') ~ '; ') if (path_validation_problems | length > 0) else '' }}
      {%- for r in path_validation | selectattr('status', 'equalto', 'FAIL') | list %} {{ r['from'] }} -> {{ r.to }}: {{ r.detail }}{% if not loop.last %};{% endif %}{% endfor %}.
      Nothing on the cluster was changed.
  when: path_validation_status == 'FAIL'
