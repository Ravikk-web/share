---
# ============================================================================
# Phase 01 Playbook: Policy Check & Baseline Snapshot Capture
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses standard play-level vars_files, include_role, and
#                 block/rescue/always; compatible across Ansible 2.7 and 2.14.
#
# Purpose: Authenticates against the target OpenShift cluster, executes the
#          snapshot role to capture the baseline JSON snapshot, validates that
#          the first hop in upgrade_path is a confirmed update edge from the
#          current version, enforces the HARD edge gate, logs confirmation,
#          and ensures fail-safe session teardown on any failure.
# Dependencies: vars/upgrade.yml, vars/secrets.yml, vars/paths.yml,
#               vars/smtp.yml, vars/report_vars.yml, vars/api_regex.yml,
#               roles/login, roles/logout, roles/snapshot, roles/error_handle
# Gate type: HARD (fails immediately if edge check fails or cluster unreachable)
# ============================================================================

- name: "Phase 01 — Policy Check & Baseline Capture"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/upgrade.yml
    - vars/secrets.yml
    - vars/paths.yml
    - vars/smtp.yml
    - vars/report_vars.yml
    - vars/api_regex.yml

  # --------------------------------------------------------------------------
  # Pre-Tasks: Session Establishment
  # Why: Authenticates once per workflow run, scoping the kubeconfig file
  #      under playbook_dir. The session is preserved across subsequent phases.
  # --------------------------------------------------------------------------
  pre_tasks:
    - name: "Phase 01: Establish authenticated cluster session via login role"
      include_role:
        name: login

  # --------------------------------------------------------------------------
  # Main Tasks: Policy Check, Snapshot Capture & Edge Enforcement
  # --------------------------------------------------------------------------
  tasks:
    - name: "Phase 01: Execute Baseline Capture and Policy Validation"
      block:
        # 1. Establish run timestamp for consistent file naming across phases
        - name: "Ensure run timestamp is established for snapshot and logs"
          set_fact:
            run_timestamp: "{{ run_timestamp | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"
          when: run_timestamp is not defined or run_timestamp | length == 0

        # 2. Capture immutable baseline JSON snapshot via snapshot role
        - name: "Capture cluster baseline snapshot"
          include_role:
            name: snapshot

        # 3. Query live available update edges from ClusterVersion
        - name: "Query live cluster available update edges"
          shell: |
            set -o pipefail
            oc get clusterversion version -o json | jq -r '(.status.availableUpdates // [])[].version'
          args:
            executable: /bin/bash
          environment:
            KUBECONFIG: "{{ cluster_kubeconfig }}"
          register: cv_available_edges_raw
          changed_when: false
          retries: "{{ oc_command_retries | default(3) }}"
          delay: "{{ oc_command_retry_delay | default(10) }}"
          until: cv_available_edges_raw.rc == 0

        # 4. Query live conditional update edges from ClusterVersion
        - name: "Query live cluster conditional update edges"
          shell: |
            set -o pipefail
            oc get clusterversion version -o json | jq -r '(.status.conditionalUpdates // [])[].version'
          args:
            executable: /bin/bash
          environment:
            KUBECONFIG: "{{ cluster_kubeconfig }}"
          register: cv_conditional_edges_raw
          changed_when: false
          retries: "{{ oc_command_retries | default(3) }}"
          delay: "{{ oc_command_retry_delay | default(10) }}"
          until: cv_conditional_edges_raw.rc == 0

        # 5. Extract and consolidate valid update edges
        - name: "Consolidate verified cluster update edges"
          set_fact:
            available_edges_list: "{{ cv_available_edges_raw.stdout_lines | default([]) }}"
            conditional_edges_list: "{{ cv_conditional_edges_raw.stdout_lines | default([]) }}"
            target_first_hop: "{{ upgrade_path[0] }}"

        - name: "Assemble combined valid update edge set"
          set_fact:
            all_valid_update_edges: "{{ (available_edges_list + conditional_edges_list) | unique }}"

        # 6. Validate target first hop against live edges
        - name: "Verify target first hop exists in cluster update graph"
          set_fact:
            is_valid_target_edge: "{{ target_first_hop in all_valid_update_edges }}"

        # 7. HARD Gate: Halt if target hop is not a valid update edge
        - name: "HARD Gate: Enforce target hop is a verified update edge"
          fail:
            msg: >-
              [HARD GATE FAILURE] Target version '{{ target_first_hop }}' is NOT a verified update edge
              for cluster '{{ cluster_name }}' (current version: '{{ baseline_current_version | default("unknown") }}', channel: '{{ baseline_channel | default("unknown") }}').
              Available edges: {{ available_edges_list | join(', ') if (available_edges_list | length > 0) else 'None' }}.
              Conditional edges: {{ conditional_edges_list | join(', ') if (conditional_edges_list | length > 0) else 'None' }}.
              Execution halted with zero cluster mutations.
          when: not (is_valid_target_edge | bool)

        # 8. Log confirmation to human-readable text run log (.txt)
        - name: "Log Phase 01 baseline capture confirmation to text run log"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
            line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [PASS] [HARD] Phase 01: Baseline snapshot captured to {{ baseline_snapshot_file_path }} (Nodes: {{ baseline_nodes_count }}, Operators: {{ baseline_operators_count }}, Routes: {{ baseline_routes_count }}). Target hop '{{ target_first_hop }}' verified in cluster update graph."
            create: true

        # 9. Log confirmation to machine-parseable CSV run log (.csv)
        - name: "Check if CSV run log exists"
          stat:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
          register: phase01_csv_stat

        - name: "Initialize CSV run log header if new"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
            line: "timestamp,cluster,task_name,gate_type,status,reason,observed"
            create: true
          when: not (phase01_csv_stat.stat.exists | default(false))

        - name: "Log Phase 01 baseline capture confirmation to CSV run log"
          lineinfile:
            path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
            line: '"{{ lookup(''pipe'', ''date +%Y-%m-%dT%H:%M:%S'') }}","{{ cluster_name }}","Phase 01 Baseline & Edge Check","HARD","PASS","Verified update edge {{ target_first_hop }}","Snapshot: {{ baseline_snapshot_file_path }}"'
            create: true

        # 10. Display structured confirmation banner
        - name: "Display Phase 01 completion banner"
          debug:
            msg:
              - "============================================================================"
              - "PHASE 01 COMPLETE: POLICY CHECK & BASELINE SNAPSHOT CAPTURED"
              - "============================================================================"
              - "Cluster Name     : {{ cluster_name }}"
              - "Current Version  : {{ baseline_current_version }}"
              - "Target First Hop : {{ target_first_hop }}"
              - "Snapshot File    : {{ baseline_snapshot_file_path }}"
              - "Nodes Count      : {{ baseline_nodes_count }}"
              - "Operators Count  : {{ baseline_operators_count }}"
              - "Routes Count     : {{ baseline_routes_count }}"
              - "Session State    : Preserved for Phase 02 Prevalidation"
              - "============================================================================"

      # ----------------------------------------------------------------------
      # Rescue: Error Extraction, Alert Dispatch & Clean Session Logout
      # ----------------------------------------------------------------------
      rescue:
        - name: "Extract sanitized error message from failure result in Phase 01"
          set_fact:
            resolved_error: >-
              {{ ansible_failed_result.stderr | default('')
                 if (ansible_failed_result.stderr | default('') | length > 0)
                 else (ansible_failed_result.stderr_lines | default([]) | join('\n'))
                 if (ansible_failed_result.stderr_lines | default([]) | length > 0)
                 else ansible_failed_result.msg | default('Unknown error — inspect logs') }}

        - name: "Evaluate whether failure is an RBAC / authorization error in Phase 01"
          set_fact:
            is_rbac_error: >-
              {{ (resolved_error | lower is search('forbidden'))
                 or (resolved_error | lower is search('cannot patch'))
                 or (resolved_error | lower is search('unauthorized'))
                 or (resolved_error | lower is search('cannot get'))
                 or (resolved_error | lower is search('cannot list'))
                 or (resolved_error | lower is search('cannot create')) }}

        - name: "Configure Phase 01 error context facts"
          set_fact:
            current_step_no: "Phase 01"
            current_task_name: "Phase 01 Policy Check & Baseline Capture"
            current_gate_type: "HARD"
            failure_reason: "Phase 01 Policy Check or Baseline Snapshot failed"
            failure_observed: "{{ resolved_error }}"
            phase_01_failed: true

        - name: "Record Phase 01 failure and alert via error_handle role"
          include_role:
            name: error_handle

        - name: "Execute session logout on Phase 01 failure"
          include_role:
            name: logout
          failed_when: false

        - name: "Halt execution on Phase 01 failure"
          fail:
            msg: "Phase 01 Policy Check & Baseline Capture failed: {{ resolved_error }}"

      # ----------------------------------------------------------------------
      # Always: Fail-Safe Session Logout Guarantee
      # ----------------------------------------------------------------------
      always:
        - name: "Guarantee session logout if Phase 01 failed"
          include_role:
            name: logout
          when: phase_01_failed | default(false) | bool
          failed_when: false
