# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (set_fact, fail, include_role, command, debug)
#                 work on both versions.
#                 | default('') guards are applied on all optional variables.
#
# Phase 01 — Policy Check & Baseline Snapshot (01_Policy_Check.yaml)
#
# Responsibilities:
#   1. Authenticate once via login role and establish kubeconfig under playbook_dir.
#   2. Capture baseline cluster snapshot via snapshot role (writes to snapshots/<cluster>_<ts>_baseline.json).
#   3. Validate that the target upgrade versions in upgrade_path are real edges in oc adm upgrade.
#   4. Enforce HARD gate: invalid edge or baseline failure aborts before any upgrade.
#   5. Wrap tasks in block/rescue/always: rescue records failure via error_handle and tears down via logout.

---
- name: Phase 01 — Policy Check & Baseline Snapshot
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - vars/upgrade.yml
    - vars/paths.yml
    - vars/secrets.yml
    - vars/smtp.yml
    - vars/report_vars.yml
    - vars/api_regex.yml

  pre_tasks:
    - name: Resolve target cluster credentials from secrets.yml
      set_fact:
        target_cluster_entry: "{{ (clusters | default([]) | selectattr('name', 'equalto', cluster_name) | list | first) | default({}) }}"
      no_log: true

    - name: Set login parameters for cluster {{ cluster_name | default('UNKNOWN') }}
      set_fact:
        login_api_url: "{{ target_cluster_entry.api_url | default(login_api_url | default('')) }}"
        login_username: "{{ target_cluster_entry.username | default(login_username | default('')) }}"
        login_password: "{{ target_cluster_entry.password | default(login_password | default('')) }}"
      no_log: true

    - name: Verify cluster credentials are defined
      fail:
        msg: >-
          Cluster '{{ cluster_name | default('UNKNOWN') }}' was not found in vars/secrets.yml
          and no explicit login_api_url was provided.
      when: login_api_url | default('') == ''

    - name: Authenticate to cluster {{ cluster_name | default('UNKNOWN') }}
      include_role:
        name: login

  tasks:
    - name: Phase 01 Execution Block
      block:
        - name: Set Phase 01 Step 1 Context — Capture Baseline Snapshot
          set_fact:
            failed_phase: "01_Policy_Check"
            current_step_no: 1
            current_task_name: "Capture Baseline Snapshot"
            current_gate_type: "HARD"
            phase01_failed: false

        - name: Capture baseline snapshot
          include_role:
            name: snapshot

        - name: Set Phase 01 Step 2 Context — Validate Upgrade Path Edges
          set_fact:
            current_step_no: 2
            current_task_name: "Validate Upgrade Path Edges"
            current_gate_type: "HARD"

        - name: Query ClusterVersion for available upgrade edges
          command: oc get clusterversion version -o json --kubeconfig {{ kubeconfig_path }}
          register: oc_cv_edge_raw
          changed_when: false
          failed_when: oc_cv_edge_raw.rc != 0

        - name: Parse available upgrade edges from ClusterVersion
          set_fact:
            parsed_cv_edge_data: "{{ oc_cv_edge_raw.stdout | from_json }}"
            current_cv_version: "{{ (oc_cv_edge_raw.stdout | from_json).status.desired.version | default(((oc_cv_edge_raw.stdout | from_json).status.history | default([{}]) | first).version | default('unknown')) }}"
            available_edge_list: >-
              [
                {% for upd in (oc_cv_edge_raw.stdout | from_json).status.availableUpdates | default([]) %}
                  "{{ upd.version | default('') }}"{{ '' if loop.last else ',' }}
                {% endfor %}
              ]
            conditional_edge_list: >-
              [
                {% for cond in (oc_cv_edge_raw.stdout | from_json).status.conditionalUpdates | default([]) %}
                  "{{ cond.release.version | default('') }}"{{ '' if loop.last else ',' }}
                {% endfor %}
              ]

        - name: Combine available and conditional upgrade edges
          set_fact:
            all_valid_immediate_edges: "{{ (available_edge_list | default([])) + (conditional_edge_list | default([])) }}"
            resolved_upgrade_path: "{{ (upgrade_path | from_json) if (upgrade_path is string and upgrade_path.startswith('[')) else (upgrade_path.split(',') if (upgrade_path is string and ',' in upgrade_path) else ([upgrade_path] if upgrade_path is string else (upgrade_path | default([])))) }}"

        - name: Set first hop target version
          set_fact:
            first_hop_target_version: "{{ resolved_upgrade_path | first | default('') }}"

        - name: Display detected upgrade edges and target path
          debug:
            msg:
              - "Cluster:               {{ cluster_name }}"
              - "Current Version:       {{ current_cv_version }}"
              - "Target Upgrade Path:   {{ resolved_upgrade_path | join(' → ') }}"
              - "First Hop Target:      {{ first_hop_target_version }}"
              - "Available Edges:       {{ available_edge_list | default([]) }}"
              - "Conditional Edges:     {{ conditional_edge_list | default([]) }}"

        - name: Validate first hop target is an available edge (or already at target)
          fail:
            msg: >-
              HARD GATE FAILURE in Phase 01: Target version '{{ first_hop_target_version }}'
              is not a valid upgrade edge for cluster '{{ cluster_name }}'
              (current version: {{ current_cv_version }}).
              Available edges from oc get clusterversion:
              {{ all_valid_immediate_edges | join(', ') if all_valid_immediate_edges | length > 0 else 'None found' }}.
              Verify channel configuration or target version before proceeding.
          when:
            - first_hop_target_version != current_cv_version
            - first_hop_target_version not in all_valid_immediate_edges

        - name: Validate upgrade_path is non-empty
          fail:
            msg: >-
              HARD GATE FAILURE in Phase 01: upgrade_path is empty for cluster '{{ cluster_name }}'.
          when: (resolved_upgrade_path | length) == 0

        - name: Confirm Phase 01 Policy Check & Baseline Success
          debug:
            msg: >-
              ✔ Phase 01 Policy Check & Baseline completed successfully.
              Baseline snapshot: {{ baseline_snapshot_file_path | default('recorded') }}.
              Current version '{{ current_cv_version }}' validated against target hop '{{ first_hop_target_version }}'.

      rescue:
        - name: Record failure details for Phase 01
          set_fact:
            phase01_failed: true
            failed_phase: "01_Policy_Check"
            failure_reason: >-
              {{
                (((ansible_failed_result | default({})).stderr | default('')) | trim) if (((ansible_failed_result | default({})).stderr | default('')) | trim != '')
                else (
                  (((ansible_failed_result | default({})).stderr_lines | default([])) | join(' ') | trim) if ((((ansible_failed_result | default({})).stderr_lines | default([])) | length) > 0)
                  else (
                    (((ansible_failed_result | default({})).msg | default('')) | trim) if (((ansible_failed_result | default({})).msg | default('')) | trim != '' and ((ansible_failed_result | default({})).msg | default('')) != 'non-zero return code')
                    else (
                      (((ansible_failed_result | default({})).message | default('')) | trim) if (((ansible_failed_result | default({})).message | default('')) | trim != '')
                      else 'Policy check or baseline capture failed.'
                    )
                  )
                )
              }}
            failure_observed: "FAILED at Step {{ current_step_no | default(1) }}: {{ current_task_name | default('Policy Check & Baseline') }}"

        - name: Trigger standardized error handling and alert
          include_role:
            name: error_handle

        - name: Tear down cluster session on failure
          include_role:
            name: logout

        - name: Halt execution due to Phase 01 failure
          fail:
            msg: "Phase 01 (01_Policy_Check) failed for cluster '{{ cluster_name }}'. Session torn down."

      always:
        - name: Ensure session logout on failure
          include_role:
            name: logout
          when: phase01_failed | default(false)
