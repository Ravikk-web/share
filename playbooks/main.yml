---
# ============================================================================
# main.yml - the whole upgrade flow on one page
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Started by 00_Run.sh, which passes: cluster_name, upgrade_path, run_mode,
# run_timestamp and (optionally) mail_to_cli.
#
# Read it top to bottom:
#   1. Start   - check the inputs and pick the phases for this run mode
#   2. Block   - log in, run the phases in order, write the report, send the summary
#   3. Rescue  - the ONLY failure handler: report, status file, one alert mail
#   4. Always  - log out
#
# Each phase is a plain task file next to this one (01_Policy_Check.yaml ...).
# The steps they use live in steps/<phase>/.
#
#   Phase                                     upgrade   dry-run      pre-check  post-check
#   01 Policy check & baseline                  yes      yes            yes        -
#   02 Prechecks (read-only)                    yes      yes            yes        -
#   03 Pre-upgrade implementation (05 watches)  yes      plan only      yes        -
#   04 Upgrade hops (05 watches each)           yes      plan only      -          -
#   06 Postchecks & baseline diff               yes      audit only     -          yes
#   07 Operators & developer console            yes      plan only      -          -
#   05 Live monitoring never runs on its own: Phases 03 and 04 include it.
#
# A dry run never changes the cluster: every cluster write checks `dry_run`.
# While testing, a phase include below can be commented out: each phase reads
# what it needs from the cluster itself.
# ============================================================================

- name: "ARO cluster upgrade"
  hosts: localhost
  connection: local
  gather_facts: true
  gather_subset: min
  vars_files:
    - vars/upgrade.yml
    - vars/secrets.yml
    - vars/smtp.yml
    - vars/paths.yml
    - vars/report_vars.yml
    - vars/api_regex.yml

  # Why: every oc command in the run uses the run's own kubeconfig, written by
  #      steps/common/login.yml. ~/.kube/config is never read or changed.
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

  vars:
    mode_phases:
      upgrade: [1, 2, 3, 4, 6, 7]
      dry-run: [1, 2, 3, 4, 6, 7]
      pre-check: [1, 2, 3]
      post-check: [6]
    phase_names:
      login: "Login"
      "01": "Policy check & baseline"
      "02": "Prechecks"
      "03": "Pre-upgrade implementation"
      "04": "Upgrade hops"
      "05": "Live monitoring"
      "06": "Postchecks & baseline diff"
      "07": "Operators & developer console"
    # Exit code written to the status file when a phase fails (read by 00_Run.sh).
    # Phase 05 has no code of its own: it runs inside Phase 03 or 04 and keeps their
    # code, except that it uses 30 instead of 20 when a hop stops progressing or times out.
    phase_exit_codes:
      login: 5
      "01": 5
      "02": 10
      "03": 15
      "04": 20
      "06": 25
      "07": 35

  tasks:
    # ------------------------------------------------------------------------
    # 1. Start
    # ------------------------------------------------------------------------
    - name: "Start: Check the inputs from 00_Run.sh"
      assert:
        that:
          - cluster_name | default('') | length > 0
          - cluster_name in clusters
          - run_mode | default('') in mode_phases
          - (run_mode == 'post-check') or (upgrade_path | default([]) | length > 0)
        fail_msg: >-
          Start the run with 00_Run.sh. Needed: cluster_name (one of {{ clusters.keys() | list | join(', ') }}),
          run_mode (upgrade, dry-run, pre-check or post-check) and, except for post-check, upgrade_path.

    - name: "Start: Set up the run"
      set_fact:
        run_timestamp: "{{ run_timestamp | default(lookup('pipe', 'date +%Y%m%d_%H%M%S'), true) }}"
        run_start_epoch: "{{ lookup('pipe', 'date +%s') }}"
        dry_run: "{{ run_mode == 'dry-run' }}"
        run_phases: "{{ mode_phases[run_mode] }}"
        current_phase: "login"
        run_failed: false
        run_phase_results: []
        hop_results: []
        admin_acks_applied: []
        preval_checks: []
        preval_deferred: []
        preval_rechecked: false
        preval_autofix_items: []
        preimpl_tasks: []
        postval_checks: []
        operator_checks: []
        operators: []
        installed_operators: []
        # Why: the highest hop decides what the whole path needs (cgroup v2 for 4.19+,
        #      operator compatibility). Worked out once here so every phase can use it,
        #      even when an earlier phase is commented out for a test.
        target_max_version: >-
          {%- set best = [] -%}
          {%- for v in upgrade_path | default([]) if v is match('^[0-9]+[.][0-9]+[.][0-9]+$') -%}
          {%- if (best | length == 0) or (v is version(best[-1], '>')) -%}{%- set _ = best.append(v) -%}{%- endif -%}
          {%- endfor -%}
          {{ best[-1] if (best | length > 0) else '' }}

    - name: "Start: Name the run's report and log files"
      set_fact:
        report_file: "{{ output_dir }}/{{ cluster_name }}_{{ run_timestamp }}_report.html"
        log_file: "{{ log_dir }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
        csv_file: "{{ log_dir }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
        status_file: "{{ log_dir }}/{{ cluster_name }}_{{ run_timestamp }}.status"

    - name: "Start: Show what this run will do"
      debug:
        msg:
          - "Cluster : {{ cluster_name }} ({{ clusters[cluster_name].tier | default('DEV') }})"
          - "Mode    : {{ run_mode }}{{ ' - no cluster changes' if (dry_run | bool) else '' }}"
          - "Path    : {{ upgrade_path | default([]) | join(' -> ') if (upgrade_path | default([]) | length > 0) else 'current version (post-check)' }}"
          - "Phases  : {{ run_phases | map('string') | map('regex_replace', '^', '0') | join(', ') }}"
          - "Report  : {{ report_file }}"

    # ------------------------------------------------------------------------
    # 2. The phases, in order
    # ------------------------------------------------------------------------
    - name: "Run"
      block:
        - name: "Log in to the cluster"
          include_tasks: "{{ playbook_dir }}/steps/common/login.yml"

        - name: "Phase 01 - Policy check, baseline snapshot, upgrade path"
          include_tasks: "{{ playbook_dir }}/01_Policy_Check.yaml"
          when: 1 in run_phases

        - name: "Phase 02 - Prechecks (read-only)"
          include_tasks: "{{ playbook_dir }}/02_Pre_upgrade_check.yaml"
          when: 2 in run_phases

        - name: "Phase 03 - Pre-upgrade implementation (Phase 05 watches any node rollout)"
          include_tasks: "{{ playbook_dir }}/03_Pre_upgrade_Implementation.yaml"
          when: 3 in run_phases

        - name: "Phase 04 - Upgrade hops (Phase 05 watches each hop)"
          include_tasks: "{{ playbook_dir }}/04_Initiate_upgrade.yaml"
          when: 4 in run_phases

        - name: "Phase 06 - Postchecks and baseline diff"
          include_tasks: "{{ playbook_dir }}/06_post_Upgrade_Checks.yaml"
          when: 6 in run_phases

        - name: "Phase 07 - Operators and developer console"
          include_tasks: "{{ playbook_dir }}/07_Operator_Upgrade.yaml"
          when: 7 in run_phases

        - name: "Finish: Write the run report"
          include_tasks: "{{ playbook_dir }}/steps/common/write_report.yml"

        - name: "Finish: Send the summary mail"
          include_tasks: "{{ playbook_dir }}/steps/common/send_mail.yml"
          vars:
            mail_kind: "summary"
            mail_headline: "{{ summary_title }} - {{ run_verdict }}"
            mail_attachments: ["{{ report_file }}", "{{ log_file }}", "{{ csv_file }}"]
            # Read by templates/email-summary.j2. The check list is the last phase that ran checks.
            summary_title: "{{ {'upgrade': 'Upgrade Complete', 'dry-run': 'Dry Run Summary', 'pre-check': 'Pre-check Summary', 'post-check': 'Post-check Summary'}[run_mode] }}"
            summary_verdict: "{{ run_verdict }}"
            summary_intro: "{{ run_summary_text }}"
            summary_checks: "{{ postval_checks if (postval_checks | length > 0) else preval_checks }}"
          when: send_email | default(true) | bool

        - name: "Finish: Show the result"
          debug:
            msg:
              - "RUN {{ run_verdict }}: {{ run_summary_text }}"
              - "Report: {{ report_file }}"

      # ----------------------------------------------------------------------
      # 3. The only failure handler
      # ----------------------------------------------------------------------
      rescue:
        - name: "Failure: Record it, write the report, send one alert"
          include_tasks: "{{ playbook_dir }}/steps/common/handle_failure.yml"

        - name: "Failure: Stop the run"
          fail:
            msg: "Run stopped in {{ phase_names[current_phase] | default(current_phase) }} (exit code {{ failure_exit_code }}): {{ resolved_error | truncate(1500) }}"

      # ----------------------------------------------------------------------
      # 4. Always log out
      # ----------------------------------------------------------------------
      always:
        - name: "Log out of the cluster"
          include_tasks: "{{ playbook_dir }}/steps/common/logout.yml"
