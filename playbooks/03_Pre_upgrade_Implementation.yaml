---
# ============================================================================
# Phase 03 - Pre-upgrade implementation
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Makes the changes the cluster needs before the first hop, one task at a time.
# Every task (steps/03/task_*.yml) works the same way:
#   check -> change if needed -> watch the node rollout it started (Phase 05 in
#   rollout mode, with heartbeat and degradation mails) -> verify -> record one row
#   -> stop the run if the change did not work (FIX-FAILED / FAIL)
#
#   1. MachineConfigPools  unpause paused pools on mcp_auto_unpause_list
#   2. cgroup v2           set cgroupMode v2 when a hop reaches 4.19+ (all nodes reboot)
#   3. Operator upgrades   approve every pending operator upgrade, wait for Succeeded,
#                          stop if an operator still blocks the target version
#   4. Admin-ack           removed-API check, then the ack the next minor hop needs
#                          (a later minor hop's ack: right before that hop, Phase 04)
# Then, if any task changed the cluster (or watched nodes reboot): run the 17 prechecks
# again -> GATE.
#
# The order matters: a paused pool would not take the cgroup change, and the
# admin-ack step waits for Upgradeable=True, which a blocking operator keeps False.
# Each task reads the cluster itself, so the phase also works when Phase 02 is
# commented out for a test, and one task can be commented out on its own.
# Dry run: every task reports what it would change; nothing is changed.
# While a cluster update is running nothing is changed. A live run normally never gets
# here with an update running: the resume step after Phase 01 watches it to the end
# first. A dry run does (the resume step only reports there).
# ============================================================================

- name: "Phase 03: Start"
  set_fact:
    current_phase: "03"
    preimpl_tasks: []
    preimpl_changed: false
    preimpl_current_task: {}
    remediation_attempted_nums: []

# Why: never change cgroups, pools or operators under a running cluster update.
- name: "Phase 03: Read ClusterVersion"
  shell: |
    set -o pipefail
    oc get clusterversion version -o json | jq -c '{
      completed: ((((.status.history // []) | map(select(.state == "Completed")) | .[0].version) // "")),
      desired: (.status.desired.version // ""),
      progressing: (((((.status.conditions // []) | map(select(.type == "Progressing")) | .[0]) // {}).status // "False") | tostring)}'
  args:
    executable: /bin/bash
  register: p03_cv_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: p03_cv_raw.rc == 0

- name: "Phase 03: Is a cluster update running?"
  set_fact:
    preimpl_update_running: "{{ _cv.progressing == 'True' and _cv.desired != _cv.completed }}"
    preimpl_cv: "{{ _cv }}"
  vars:
    _cv: "{{ p03_cv_raw.stdout | from_json }}"

- name: "Phase 03: Record that the changes are skipped during an update"
  set_fact:
    preimpl_tasks:
      - num: 0
        name: "All tasks"
        status: "SKIPPED"
        observed: >-
          An update to {{ preimpl_cv.desired }} (from {{ preimpl_cv.completed }}) is running, so no pre-upgrade
          change is made. {{ 'A live run watches it to the end before the prechecks, then makes the changes still needed.'
          if (dry_run | bool) else 'Run the same command again: it watches the update to the end first, then makes the changes still needed.' }}
  when: preimpl_update_running | bool

# ----------------------------------------------------------------------------
# The four tasks, in order
# ----------------------------------------------------------------------------
- name: "Phase 03: Task 1 - MachineConfigPools (unpause allow-listed pools)"
  include_tasks: "{{ playbook_dir }}/steps/03/task_1_unpause_pools.yml"
  when: not (preimpl_update_running | bool)

- name: "Phase 03: Task 2 - cgroup v2"
  include_tasks: "{{ playbook_dir }}/steps/03/task_2_cgroup_v2.yml"
  when: not (preimpl_update_running | bool)

- name: "Phase 03: Task 3 - Operator upgrades"
  include_tasks: "{{ playbook_dir }}/steps/03/task_3_operator_upgrades.yml"
  when: not (preimpl_update_running | bool)

- name: "Phase 03: Task 4 - Admin-ack"
  include_tasks: "{{ playbook_dir }}/steps/03/task_4_admin_ack.yml"
  when: not (preimpl_update_running | bool)

# ----------------------------------------------------------------------------
# Re-check after the changes
# ----------------------------------------------------------------------------
# Why: node reboots can disturb something that passed before (an operator, a volume,
#      a PDB). All 17 prechecks run again with nothing left to Phase 03; a check a
#      task worked on is AUTO-FIXED only if it now passes, otherwise FIX-FAILED.
- name: "Phase 03: Nothing is left to Phase 03 any more"
  set_fact:
    preval_defer_fixes: false
    preimpl_current_task: {}
  when: preimpl_changed | bool

- name: "Phase 03: Run all 17 prechecks again after the changes"
  include_tasks: "{{ playbook_dir }}/steps/02/run_all_checks.yml"
  when: preimpl_changed | bool

- name: "Phase 03: Mark the checks the tasks worked on AUTO-FIXED or FIX-FAILED"
  set_fact:
    preval_rechecked: true
    preval_checks: >-
      {%- set out = [] -%}
      {%- for c in preval_checks -%}
      {%- if c.num in remediation_attempted_nums -%}
      {%- set fixed = c.status in ['PASS', 'WARN'] -%}
      {%- set _ = out.append(c | combine({'status': ('AUTO-FIXED' if fixed else 'FIX-FAILED'),
            'observed': ('Fixed in Phase 03, then re-checked: ' if fixed else 'Changed in Phase 03, but the re-check still fails: ') ~ c.observed})) -%}
      {%- else -%}
      {%- set _ = out.append(c) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: preimpl_changed | bool

# ----------------------------------------------------------------------------
# Result and gate
# ----------------------------------------------------------------------------
- name: "Phase 03: Record the result"
  set_fact:
    preimpl_blockers: "{{ _blockers }}"
    run_phase_results: >-
      {{ run_phase_results + [{
           'phase': '03', 'name': phase_names['03'] ~ (' (plan only)' if (dry_run | bool) else ''),
           'status': ('FAIL' if (_blockers | length > 0)
                      else ('WARN' if (preimpl_tasks | selectattr('status', 'match', '^(WARN|SKIPPED)$') | list | length > 0)
                      else ('AUTO-FIXED' if (preimpl_tasks | selectattr('status', 'equalto', 'AUTO-FIXED') | list | length > 0)
                      else 'PASS'))),
           'detail': ((preimpl_tasks | length) ~ ' task(s): '
                      ~ ((preimpl_tasks | selectattr('status', 'equalto', 'AUTO-FIXED') | map(attribute='name') | join(', ')) or 'nothing') ~ ' changed'
                      ~ ((', ' ~ (preimpl_tasks | selectattr('status', 'match', '^(WARN|SKIPPED)$') | map(attribute='name') | join(', ')) ~ ' to review')
                         if (preimpl_tasks | selectattr('status', 'match', '^(WARN|SKIPPED)$') | list | length > 0) else '')
                      ~ ('; prechecks re-run: ' ~ (_blockers | length) ~ ' blocking' if (preval_rechecked | bool) else '')
                      ~ ('; nothing on the cluster was changed (dry run)' if (dry_run | bool) else ''))
         }] }}
  vars:
    _blockers: >-
      {{ (preval_checks | selectattr('gate', 'equalto', 'HARD') | selectattr('status', 'match', '^(FAIL|FIX-FAILED)$') | list)
         if (preimpl_changed | bool) else [] }}

- name: "Phase 03: Log the result"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "{{ run_phase_results[-1].status }}"
    event_task: "Pre-upgrade implementation"
    event_reason: "{{ run_phase_results[-1].detail }}"

- name: "Phase 03: Results"
  debug:
    msg: >-
      {%- set out = [] -%}
      {%- for t in preimpl_tasks -%}
      {%- set _ = out.append('%d %-10s %s - %s' | format(t.num, t.status, t.name, t.observed | truncate(200))) -%}
      {%- endfor -%}
      {{ out }}

- name: "Phase 03: GATE - no HARD precheck may fail after the changes"
  fail:
    msg: >-
      {{ preimpl_blockers | length }} blocking precheck(s) on '{{ cluster_name }}' after the Phase 03 changes:
      {% for c in preimpl_blockers %}Check {{ '%02d' | format(c.num) }} {{ c.name }} [{{ c.status }}]: {{ c.observed | truncate(300) }}{% if not loop.last %} | {% endif %}{% endfor %}.
      No hop was started.
  when: preimpl_blockers | length > 0
