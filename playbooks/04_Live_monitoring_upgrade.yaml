---
# ============================================================================
# Phase 04: Live Monitoring & Settle-Gate
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses standard include_role, set_fact, debug, and lineinfile modules;
#                 compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Live upgrade monitoring task playbook executed per hop from tasks/hop.yml.
#          Coordinates 2-minute polling of ClusterVersion, MCPs, and nodes,
#          dispatches 20-minute heartbeat status notifications via sendmail,
#          enforces hop timeout guard (default 90m), and monitors cluster settle state.
# Dependencies: playbooks/vars/upgrade.yml, playbooks/vars/smtp.yml,
#               roles/sendmail, roles/monitor
# Gate type: HARD (fails if monitoring timeout is exceeded or cluster fails to settle)
# ============================================================================

- name: "Phase 04: Display Live Monitoring & Settle-Gate Hand-off Banner"
  debug:
    msg:
      - "============================================================================"
      - "PHASE 04: LIVE MONITORING & SETTLE-GATE HAND-OFF"
      - "============================================================================"
      - "Target Cluster       : {{ cluster_name }}"
      - "Target Hop Version   : {{ hop_item | default(target_version | default('unknown')) }}"
      - "Hop Identifier       : {{ hop_label | default('1/1') }}"
      - "Polling Interval     : {{ poll_interval_minutes | default(2) }} minutes"
      - "Hop Timeout Guard    : {{ hop_timeout_minutes | default(90) }} minutes"
      - "Heartbeat Cadence    : {{ heartbeat_minutes | default(20) }} minutes"
      - "============================================================================"

# Pre-compute hop context variables for monitor role
- name: "Phase 04: Pre-compute hop context facts for monitor role"
  set_fact:
    hop_target_version: "{{ hop_item | default(target_version | default('')) }}"
    hop_label: "{{ hop_label | default('1/1') }}"
    hop_number: "{{ hop_number | default(1) }}"
    hop_total: "{{ hop_total | default(1) }}"

- name: "Phase 04: Log monitoring hand-off to text run log"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
    line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [INFO] [HARD] Phase 04: Live monitoring initiated for Hop {{ hop_label }} (Target: {{ hop_target_version }})."
    create: true
  when: not (dry_run | default(false) | bool)

- name: "Phase 04: Check if monitor role is present"
  stat:
    path: "{{ playbook_dir }}/roles/monitor/tasks/main.yml"
  register: monitor_role_stat

- name: "Phase 04: Invoke monitor role for live upgrade tracking"
  include_role:
    name: monitor
  when: monitor_role_stat.stat.exists | default(false)

- name: "Phase 04: Log monitoring completion to text run log"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
    line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [INFO] [HARD] Phase 04: Live monitoring hand-off completed for Hop {{ hop_label }} (Target: {{ hop_target_version }})."
    create: true
  when: not (dry_run | default(false) | bool)
