# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (debug, include_role) work on both versions.
#                 | default('') guards are applied on all optional variables.
#                 No `warn:` parameter is used on any task.
#
# Phase 04 — Live Monitoring Upgrade (04_Live_monitoring_upgrade.yaml)
#
# Thin phase wrapper that includes the monitor role for a single hop.
# Invoked per-hop from tasks/hop.yml via include_tasks — NOT imported at
# the top level of main.yml (because monitoring runs inside each hop,
# not as a standalone sequential phase).
#
# The monitor role polls CV/MCP/nodes every poll_interval_minutes (2 min),
# sends heartbeat emails every heartbeat_minutes (20 min), sends immediate
# emails on state change, enforces a hop_timeout_minutes (90 min) timeout
# guard, and asserts the settle-gate before the next hop can proceed.
#
# All cadence values are sourced from vars/upgrade.yml — zero hardcoded literals.
#
# Dependencies:
#   - Unit 18 (monitor role), Unit 05 (sendmail), Unit 04 (progress-mail.j2)
#   - Units 10/11 (mcp/node jq patterns reused)
#   - oc, jq

---
- name: "Phase 04 — Live monitoring for hop {{ hop_label | default('?/?') }} → {{ hop_target_version | default('') }}"
  debug:
    msg: >-
      ═══════════════════════════════════════════════════════════
      Phase 04 — Live Monitoring Upgrade
      Hop: {{ hop_label | default('?/?') }} → {{ hop_target_version | default('') }}
      Cluster: {{ cluster_name | default('UNKNOWN') }}
      Poll: {{ poll_interval_minutes | default(2) }}m | Heartbeat: {{ heartbeat_minutes | default(20) }}m | Timeout: {{ hop_timeout_minutes | default(90) }}m
      ═══════════════════════════════════════════════════════════

- name: "Phase 04 — Execute monitor role for hop {{ hop_label | default('?/?') }}"
  include_role:
    name: monitor

