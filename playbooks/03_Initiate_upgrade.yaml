# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (set_fact, debug, include_tasks)
#                 work on both versions.
#                 | default('') guards are applied on all optional variables.
#                 No `warn:` parameter is used on any task.
#
# Phase 03 — Initiate Upgrade (03_Initiate_upgrade.yaml)
#
# Responsibilities:
#   1. Loops over upgrade_path, executing tasks/hop.yml for each target version.
#   2. Each hop: pre-hop settle assertion → upgrade role → monitor handoff.
#   3. Uses include_tasks + loop (NOT import_playbook) because import_playbook
#      cannot loop on Ansible 2.7.17 — this is the hybrid chaining pattern.
#   4. Session is reused from Phase 01/02 (no re-login per hop).
#   5. On any hop failure: error_handle (alert) → logout → stop chain.
#
# Migration notes from previous phases are preserved:
#   - HARD gates halt the chain; WARN items surface only in reports.
#   - The only cluster write is oc adm upgrade --to.
#   - --to-image ... --force is gated behind explicit manual opt-in.
#
# Dependencies:
#   - Unit 07 (edge validation), Unit 03 (login/logout), Unit 06 (error_handle)
#   - Unit 18 provides monitor (built next; hop.yml references it JIT)
#   - oc, jq

---
- name: Phase 03 — Initiate Upgrade (Per-Hop Loop)
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - vars/upgrade.yml
    - vars/paths.yml
    - vars/secrets.yml
    - vars/smtp.yml
    - vars/report_vars.yml
    - vars/api_regex.yml

  pre_tasks:
    - name: Check existing kubeconfig session
      stat:
        path: "{{ kubeconfig_path }}"
      register: phase03_kubeconfig_stat
      when: not (dry_run | default(false) | bool)

    - name: Test cluster session reachability
      command: oc whoami --show-server --kubeconfig "{{ kubeconfig_path }}"
      register: phase03_whoami_test
      changed_when: false
      failed_when: false
      when:
        - not (dry_run | default(false) | bool)
        - phase03_kubeconfig_stat.stat.exists | default(false)

    - name: Resolve target cluster credentials if re-authentication needed
      set_fact:
        target_cluster_entry: "{{ (clusters | default([]) | selectattr('name', 'equalto', cluster_name) | list | first) | default({}) }}"
      no_log: true
      when:
        - not (dry_run | default(false) | bool)
        - not (phase03_kubeconfig_stat.stat.exists | default(false)) or (phase03_whoami_test.rc | default(1) != 0)

    - name: Set login parameters for cluster {{ cluster_name | default('UNKNOWN') }}
      set_fact:
        login_api_url: "{{ target_cluster_entry.api_url | default(login_api_url | default('')) }}"
        login_username: "{{ target_cluster_entry.username | default(login_username | default('')) }}"
        login_password: "{{ target_cluster_entry.password | default(login_password | default('')) }}"
      no_log: true
      when:
        - not (dry_run | default(false) | bool)
        - not (phase03_kubeconfig_stat.stat.exists | default(false)) or (phase03_whoami_test.rc | default(1) != 0)

    - name: Authenticate to cluster {{ cluster_name | default('UNKNOWN') }} (if not already logged in)
      include_role:
        name: login
      when:
        - not (dry_run | default(false) | bool)
        - not (phase03_kubeconfig_stat.stat.exists | default(false)) or (phase03_whoami_test.rc | default(1) != 0)

  tasks:
    - name: Display Phase 03 start banner
      debug:
        msg: >-
          ═══════════════════════════════════════════════════════════
          Phase 03 — Initiate Upgrade
          Cluster: {{ cluster_name | default('UNKNOWN') }}
          Upgrade Path: {{ upgrade_path | default([]) | join(' → ') }}
          Total Hops: {{ upgrade_path | default([]) | length }}
          ═══════════════════════════════════════════════════════════
      when: not (dry_run | default(false) | bool)

    - name: Validate upgrade_path is non-empty before initiating hops
      fail:
        msg: >-
          Phase 03 cannot proceed: upgrade_path is empty for cluster
          '{{ cluster_name | default('UNKNOWN') }}'.
      when:
        - not (dry_run | default(false) | bool)
        - upgrade_path | default([]) | length == 0

    # ========================================================================
    # PER-HOP UPGRADE LOOP
    # ========================================================================
    # Uses include_tasks + loop because import_playbook cannot loop on
    # Ansible 2.7.17. Each iteration calls tasks/hop.yml which wraps the
    # upgrade role call in block/rescue for per-hop error handling.
    - name: Execute upgrade hops via include_tasks loop
      include_tasks: tasks/hop.yml
      loop: "{{ upgrade_path }}"
      loop_control:
        loop_var: hop_item
        index_var: hop_index
      when: not (dry_run | default(false) | bool)

    - name: Confirm all upgrade hops completed
      debug:
        msg: >-
          ═══════════════════════════════════════════════════════════
          ✔ Phase 03 — All {{ upgrade_path | length }} upgrade hop(s) triggered
          successfully on cluster '{{ cluster_name | default('UNKNOWN') }}'.
          Final target: {{ upgrade_path | last | default('unknown') }}.
          ═══════════════════════════════════════════════════════════
      when: not (dry_run | default(false) | bool)
