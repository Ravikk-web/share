---
# ============================================================================
# Phase 03 Playbook: Sequential Upgrade Hop Execution
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses standard play-level vars_files, include_tasks with loop,
#                 and include_role; compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Orchestrates Phase 03 sequential minor-version upgrade hops across
#          the defined upgrade_path:
#          1. Reuses existing authenticated cluster session from Phase 01/02
#             (with fallback session establishment via login role).
#          2. Validates non-empty upgrade_path list.
#          3. Sequentially executes minor-version upgrade hops via tasks/hop.yml:
#             - Channel switch ('oc adm upgrade channel')
#             - Update edge re-verification
#             - Dynamic admin-ack application
#             - Safety-guarded upgrade trigger ('oc adm upgrade --to')
#             - Live monitoring hand-off (Phase 04)
#             - Settle-gate verification (cv at target, COs available, MCPs updated)
#             - Hop completion notification via sendmail with HTML audit report attached
#          4. Encloses execution in block/rescue/always for fail-safe error handling
#             and guaranteed session logout on abort.
# Dependencies: vars/upgrade.yml, vars/secrets.yml, vars/paths.yml,
#               vars/smtp.yml, vars/report_vars.yml, vars/api_regex.yml,
#               tasks/hop.yml, roles/upgrade, roles/sendmail,
#               roles/error_handle, roles/login, roles/logout
# Gate type: HARD (strictly gates on version format, edge verification, and settle-gate)
# ============================================================================

- name: "Phase 03 — Sequential Upgrade Hop Execution"
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/upgrade.yml
    - vars/secrets.yml
    - vars/paths.yml
    - vars/smtp.yml
    - vars/report_vars.yml
    - vars/api_regex.yml

  # --------------------------------------------------------------------------
  # Pre-Tasks: Session Verification & Re-use
  # Why: Reuses authenticated session from Phase 01/02. If invoked standalone,
  #      safely establishes cluster session via login role.
  # --------------------------------------------------------------------------
  pre_tasks:
    - name: "Phase 03: Check if existing authenticated cluster session is present"
      stat:
        path: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: p03_kubeconfig_stat

    - name: "Phase 03: Establish authenticated cluster session via login role if needed"
      include_role:
        name: login
      when: not (p03_kubeconfig_stat.stat.exists | default(false))

  # --------------------------------------------------------------------------
  # Main Tasks: Sequential Upgrade Hop Loop
  # --------------------------------------------------------------------------
  tasks:
    - name: "Phase 03: Execute Sequential Upgrade Hop Loop"
      block:
        # 1. Establish run timestamp for consistent file naming across phases
        - name: "Ensure run timestamp is established for logs and reports"
          set_fact:
            run_timestamp: "{{ run_timestamp | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"
          when: run_timestamp is not defined or run_timestamp | length == 0

        # 2. Display Phase 03 Initiation Banner
        - name: "Display Phase 03 initiation banner"
          debug:
            msg:
              - "============================================================================"
              - "PHASE 03: SEQUENTIAL UPGRADE HOP EXECUTION INITIATED"
              - "============================================================================"
              - "Target Cluster       : {{ cluster_name }}"
              - "Upgrade Journey      : {{ upgrade_path | join(' -> ') }}"
              - "Total Hops Queued    : {{ upgrade_path | length }}"
              - "Auto-Remediation     : {{ auto_remediation_enabled | default(true) | bool }}"
              - "Dry Run Mode         : {{ dry_run | default(false) | bool }}"
              - "Kubeconfig           : {{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
              - "============================================================================"

        # 3. Validate upgrade_path is non-empty
        - name: "Assert upgrade_path contains at least one target version"
          assert:
            that:
              - upgrade_path is defined
              - upgrade_path | length > 0
            fail_msg: "[HARD GATE FAILURE] Phase 03 requires a non-empty 'upgrade_path' list."
            success_msg: "Phase 03 upgrade path validated ({{ upgrade_path | length }} hops queued)."

        # 4. Sequential Hop Execution via tasks/hop.yml
        # Why: Per-hop loop using include_tasks guarantees compatibility with
        #      Ansible 2.7.17 (which cannot loop import_playbook) and Ansible 2.14.18.
        - name: "Execute sequential upgrade hops"
          include_tasks: tasks/hop.yml
          loop: "{{ upgrade_path }}"
          loop_control:
            loop_var: hop_item
            index_var: hop_index

        # 5. Display Phase 03 All-Hops Completed Banner
        - name: "Display Phase 03 All-Hops completed banner"
          debug:
            msg:
              - "============================================================================"
              - "PHASE 03: ALL UPGRADE HOPS COMPLETED SUCCESSFULLY"
              - "============================================================================"
              - "Target Cluster       : {{ cluster_name }}"
              - "Completed Path       : {{ upgrade_path | join(' -> ') }}"
              - "Final Cluster Version: {{ upgrade_path[-1] }}"
              - "Next Step            : Proceed to Phase 05 Postvalidation"
              - "============================================================================"

      # ----------------------------------------------------------------------
      # Rescue: Error Extraction, Alert Dispatch & Clean Session Logout
      # ----------------------------------------------------------------------
      rescue:
        - name: "Extract sanitized error message from failure result in Phase 03"
          set_fact:
            resolved_error: >-
              {{ ansible_failed_result.stderr | default('')
                 if (ansible_failed_result.stderr | default('') | length > 0)
                 else (ansible_failed_result.stderr_lines | default([]) | join('\n'))
                 if (ansible_failed_result.stderr_lines | default([]) | length > 0)
                 else ansible_failed_result.msg | default('Unknown error — inspect logs') }}

        - name: "Evaluate whether failure is an RBAC / authorization error in Phase 03"
          set_fact:
            is_rbac_error: >-
              {{ (resolved_error | lower is search('forbidden'))
                 or (resolved_error | lower is search('cannot patch'))
                 or (resolved_error | lower is search('unauthorized'))
                 or (resolved_error | lower is search('cannot get'))
                 or (resolved_error | lower is search('cannot list'))
                 or (resolved_error | lower is search('cannot create')) }}

        - name: "Configure Phase 03 error context facts"
          set_fact:
            current_step_no: "Phase 03"
            current_task_name: "Phase 03 Sequential Upgrade Hops"
            current_gate_type: "HARD"
            failure_reason: "Sequential minor upgrade hop execution failed in Phase 03"
            failure_observed: "{{ resolved_error }}"
            phase_03_failed: true

        - name: "Record Phase 03 failure and dispatch alert via error_handle role"
          include_role:
            name: error_handle

        - name: "Execute session logout on Phase 03 playbook failure"
          include_role:
            name: logout
          failed_when: false

        - name: "Halt execution on Phase 03 playbook failure"
          fail:
            msg: "Phase 03 Sequential Upgrade Hops failed: {{ resolved_error }}"

      # ----------------------------------------------------------------------
      # Always: Fail-Safe Session Logout Guarantee
      # ----------------------------------------------------------------------
      always:
        - name: "Guarantee session logout if Phase 03 failed"
          include_role:
            name: logout
          when: phase_03_failed | default(false) | bool
          failed_when: false
