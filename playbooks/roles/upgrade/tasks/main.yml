---
# ============================================================================
# Role Tasks: upgrade
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses standard command, shell, set_fact, assert, fail, debug modules;
#                 compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Drives the single-hop upgrade mutation against an ARO OpenShift cluster:
#          1. Validates target version format and extracts major.minor prefix.
#          2. Dynamically derives and updates upgrade channel ('oc adm upgrade channel').
#          3. Re-verifies that target version exists as a valid update edge.
#          4. Dynamically checks and applies administrator acknowledgements (admin-acks).
#          5. Enforces strict safety guard against unauthorized force upgrades.
#          6. Triggers cluster upgrade via 'oc adm upgrade --to=<version>'.
# Dependencies: playbooks/vars/upgrade.yml, playbooks/vars/paths.yml,
#               roles/remediate/tasks/admin_acks.yml
# Gate type: HARD (strictly gates on version format, edge validity, and force safety)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Target Version Validation & Channel Resolution
# Why: Guarantees that target_version is non-empty, well-formed, and derives
#      the appropriate target channel prefix (e.g. 4.15.35 -> stable-4.15).
# ----------------------------------------------------------------------------
- name: "Upgrade Role: Validate target version parameter"
  assert:
    that:
      - target_version is defined
      - target_version | length > 0
    fail_msg: "[HARD GATE FAILURE] upgrade role requires a non-empty 'target_version' parameter."
    success_msg: "Target version provided: {{ target_version }}"

- name: "Upgrade Role: Extract major.minor version prefix"
  set_fact:
    target_major_minor: "{{ target_version | regex_search('^[0-9]+\\.[0-9]+') }}"

- name: "Upgrade Role: Assert target version prefix was parsed successfully"
  assert:
    that:
      - target_major_minor is defined
      - target_major_minor | length > 0
    fail_msg: "[HARD GATE FAILURE] Unable to parse major.minor prefix from target version '{{ target_version }}'."
    success_msg: "Parsed major.minor prefix: {{ target_major_minor }}"

- name: "Upgrade Role: Derive target channel"
  set_fact:
    resolved_target_channel: >-
      {{ target_channel
         if (target_channel is defined and target_channel | length > 0)
         else ((target_channel_prefix | default('stable')) ~ '-' ~ target_major_minor) }}

- name: "Upgrade Role: Display resolved target parameters"
  debug:
    msg:
      - "Target Version : {{ target_version }}"
      - "Target Channel : {{ resolved_target_channel }}"
      - "Major.Minor    : {{ target_major_minor }}"
      - "Force Enabled  : {{ allow_force_upgrade | default(false) | bool }}"

# ----------------------------------------------------------------------------
# 2. Inspect Live Cluster State & Current Channel
# Why: Queries live ClusterVersion to inspect current version and channel.
# ----------------------------------------------------------------------------
- name: "Upgrade Role: Query live ClusterVersion metadata"
  shell: |
    set -o pipefail
    oc get clusterversion version -o json | jq -r '
      {
        current_version: (.status.history[0]?.version // ""),
        channel: (.spec.channel // "")
      } | tojson
    '
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: cv_meta_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: cv_meta_raw.rc == 0
  when: not (dry_run | default(false) | bool)

- name: "Upgrade Role: Parse current cluster metadata"
  set_fact:
    current_cluster_version: "{{ (cv_meta_raw.stdout | from_json).current_version | default('') }}"
    current_cluster_channel: "{{ (cv_meta_raw.stdout | from_json).channel | default('') }}"
  when: not (dry_run | default(false) | bool)

- name: "Upgrade Role: Mock current cluster metadata for dry-run mode"
  set_fact:
    current_cluster_version: "4.14.30"
    current_cluster_channel: "{{ resolved_target_channel }}"
  when: dry_run | default(false) | bool

# ----------------------------------------------------------------------------
# 3. Channel Update
# Why: If current channel differs from resolved target channel, update channel
#      using 'oc adm upgrade channel <channel>' so that target edges become available.
# ----------------------------------------------------------------------------
- name: "Upgrade Role: Update cluster upgrade channel if needed"
  shell: |
    set -o pipefail
    oc adm upgrade channel "{{ resolved_target_channel }}"
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: channel_update_result
  changed_when: true
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: channel_update_result.rc == 0
  when:
    - not (dry_run | default(false) | bool)
    - current_cluster_channel != resolved_target_channel

- name: "Upgrade Role: Display channel update status"
  debug:
    msg: >-
      Channel configuration:
      {% if dry_run | default(false) | bool %}
      [DRY-RUN] Would update channel to '{{ resolved_target_channel }}'.
      {% elif current_cluster_channel == resolved_target_channel %}
      Channel is already configured to '{{ resolved_target_channel }}'.
      {% else %}
      Channel updated from '{{ current_cluster_channel }}' to '{{ resolved_target_channel }}'.
      {% endif %}

# ----------------------------------------------------------------------------
# 4. Re-Verify Update Edge
# Why: Cincinnati/CVO requires a few moments to resolve update graphs after channel
#      switching. Retries query up to 6 times (60s) to verify target_version edge.
# ----------------------------------------------------------------------------
- name: "Upgrade Role: Query available update edges from ClusterVersion"
  shell: |
    set -o pipefail
    oc get clusterversion version -o json | jq -r '
      [.status.availableUpdates[]?.version // empty] | unique | .[]
    '
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: cv_available_edges_raw
  changed_when: false
  retries: 6
  delay: 10
  until: >-
    (cv_available_edges_raw.rc == 0) and
    ((target_version in (cv_available_edges_raw.stdout_lines | default([]))) or
     (target_version == current_cluster_version))
  failed_when: false
  when: not (dry_run | default(false) | bool)

- name: "Upgrade Role: Query conditional update edges from ClusterVersion"
  shell: |
    set -o pipefail
    oc get clusterversion version -o json | jq -r '
      [.status.conditionalUpdates[]?.version // empty] | unique | .[]
    '
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: cv_conditional_edges_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: cv_conditional_edges_raw.rc == 0
  failed_when: false
  when: not (dry_run | default(false) | bool)

- name: "Upgrade Role: Consolidate verified update edges"
  set_fact:
    available_edges_list: "{{ cv_available_edges_raw.stdout_lines | default([]) if (cv_available_edges_raw is defined and cv_available_edges_raw.stdout_lines is defined) else [] }}"
    conditional_edges_list: "{{ cv_conditional_edges_raw.stdout_lines | default([]) if (cv_conditional_edges_raw is defined and cv_conditional_edges_raw.stdout_lines is defined) else [] }}"
  when: not (dry_run | default(false) | bool)

- name: "Upgrade Role: Mock verified update edges for dry-run mode"
  set_fact:
    available_edges_list:
      - "{{ target_version }}"
    conditional_edges_list: []
  when: dry_run | default(false) | bool

- name: "Upgrade Role: Assemble combined verified update edges"
  set_fact:
    all_verified_edges: "{{ (available_edges_list + conditional_edges_list) | unique }}"

- name: "Upgrade Role: Verify target version is a valid update edge or already achieved"
  set_fact:
    is_valid_edge: "{{ (target_version in all_verified_edges) or (target_version == current_cluster_version) or (dry_run | default(false) | bool) }}"

- name: "HARD Gate: Enforce target version is a verified update edge"
  fail:
    msg: >-
      [HARD GATE FAILURE] Target version '{{ target_version }}' is NOT a verified update edge
      for cluster '{{ cluster_name }}' in channel '{{ resolved_target_channel }}'
      (current version: '{{ current_cluster_version | default("unknown") }}').
      Available edges: {{ available_edges_list | join(', ') if (available_edges_list | length > 0) else 'None' }}.
      Conditional edges: {{ conditional_edges_list | join(', ') if (conditional_edges_list | length > 0) else 'None' }}.
      Cluster cannot safely upgrade to an unverified edge.
  when: not (is_valid_edge | bool)

# ----------------------------------------------------------------------------
# 5. Dynamic Administrator Acknowledgement Check
# Why: If the target minor version removes deprecated APIs, ClusterVersion blocks
#      with Upgradeable=False (AdminAckRequired). Dynamically checks and applies
#      required acknowledgements to openshift-config/admin-acks ConfigMap.
# ----------------------------------------------------------------------------
- name: "Upgrade Role: Check and apply dynamic administrator acknowledgements if enabled"
  include_tasks: "{{ playbook_dir }}/roles/remediate/tasks/admin_acks.yml"
  when:
    - not (dry_run | default(false) | bool)
    - auto_apply_admin_acks | default(true) | bool

# ----------------------------------------------------------------------------
# 6. Safety Guard: Force Upgrade Gate
# Why: Strictly forbids automated or unconfirmed --force upgrades. The emergency
#      path is only accessible when allow_force_upgrade is true AND explicit token
#      confirmation 'CONFIRM_FORCE_UPGRADE' is provided.
# ----------------------------------------------------------------------------
- name: "Safety Guard: Assert force upgrade parameters if force mode is requested"
  assert:
    that:
      - force_image_pullspec is defined
      - force_image_pullspec | length > 0
      - force_upgrade_confirm_token == 'CONFIRM_FORCE_UPGRADE'
    fail_msg: >-
      [HARD GATE FAILURE] Emergency force upgrade path rejected:
      allow_force_upgrade is set to true, but required 'force_image_pullspec' is missing
      or 'force_upgrade_confirm_token' does not match 'CONFIRM_FORCE_UPGRADE'.
      Automated runs cannot force upgrade without explicit manual confirmation.
    success_msg: "Emergency force upgrade explicitly confirmed."
  when: allow_force_upgrade | default(false) | bool

# ----------------------------------------------------------------------------
# 7. Trigger Cluster Upgrade
# Why: The single cluster write operation. Executes 'oc adm upgrade --to=<version>'
#      or emergency '--to-image' path.
# ----------------------------------------------------------------------------
- name: "Upgrade Role: Trigger cluster upgrade to target version (Standard)"
  command: "oc adm upgrade --to={{ target_version }}"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: upgrade_trigger_result
  changed_when: true
  failed_when:
    - upgrade_trigger_result.rc != 0
    - "'already at' not in upgrade_trigger_result.stderr"
    - "'already at' not in upgrade_trigger_result.stdout"
  when:
    - not (dry_run | default(false) | bool)
    - not (allow_force_upgrade | default(false) | bool)

- name: "Upgrade Role: Trigger cluster upgrade to specific image pullspec (Emergency Force)"
  command: "oc adm upgrade --to-image={{ force_image_pullspec }} --allow-not-recommended --force"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: force_upgrade_result
  changed_when: true
  when:
    - not (dry_run | default(false) | bool)
    - allow_force_upgrade | default(false) | bool

- name: "Upgrade Role: Simulate cluster upgrade trigger for dry-run mode"
  set_fact:
    upgrade_trigger_result:
      rc: 0
      stdout: "DRY-RUN: oc adm upgrade --to={{ target_version }} simulated successfully."
      stderr: ""
  when: dry_run | default(false) | bool

- name: "Upgrade Role: Display upgrade trigger confirmation"
  debug:
    msg:
      - "============================================================================"
      - "UPGRADE TRIGGER CONFIRMATION"
      - "============================================================================"
      - "Target Cluster   : {{ cluster_name }}"
      - "Target Version   : {{ target_version }}"
      - "Target Channel   : {{ resolved_target_channel }}"
      - "Dry Run Mode     : {{ dry_run | default(false) | bool }}"
      - "Trigger Output   : {{ (upgrade_trigger_result.stdout | default('') if (upgrade_trigger_result is defined and upgrade_trigger_result.stdout is defined) else (force_upgrade_result.stdout | default('Triggered'))) | trim }}"
      - "============================================================================"
