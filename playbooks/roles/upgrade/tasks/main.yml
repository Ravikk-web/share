# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (command, shell, set_fact, fail, debug)
#                 work on both versions.
#                 | default('') guards are applied on all optional variables.
#                 No `warn:` parameter is used on any task.
#
# upgrade role — per-hop upgrade trigger sequence.
#
# Sequence:
#   1. Set the update channel to stable-<major>.<minor> for the target version.
#   2. Re-verify the target version is a live available/conditional edge.
#   3. Apply required admin-ack ConfigMap if the target needs it.
#   4. Trigger the upgrade: oc adm upgrade --to=<version>.
#
# The only cluster write is `oc adm upgrade --to`. The `--to-image ... --force`
# path exists only as a hard-gated manual last resort, never automatic.
#
# A fail: guard blocks force mode execution unless the operator deliberately
# sets `force_upgrade: true` AND provides `force_upgrade_image`.
#
# Dependencies:
#   - Unit 07 (edge validation logic), Unit 03 (login/logout), Unit 06 (error_handle)
#   - oc, jq

---
# ==============================================================================
# STEP 1: Set the update channel to stable-<major>.<minor>
# ==============================================================================
- name: Compute target channel from hop version {{ hop_target_version | default('') }}
  set_fact:
    hop_target_channel: "stable-{{ hop_target_version.split('.')[:2] | join('.') }}"
  when: hop_target_version | default('') != ''

- name: Display target channel for hop
  debug:
    msg: "Setting update channel to '{{ hop_target_channel | default('unknown') }}' for target version '{{ hop_target_version | default('') }}'."

- name: Set cluster update channel to {{ hop_target_channel | default('unknown') }}
  command: >-
    oc adm upgrade channel {{ hop_target_channel }}
    --kubeconfig {{ kubeconfig_path }}
  register: channel_set_result
  changed_when: channel_set_result.rc == 0
  failed_when: channel_set_result.rc != 0

- name: Confirm channel set to {{ hop_target_channel | default('unknown') }}
  debug:
    msg: "✔ Update channel set to '{{ hop_target_channel }}' on cluster '{{ cluster_name | default('UNKNOWN') }}'."

# ==============================================================================
# STEP 2: Re-verify target version is a live available/conditional edge
# ==============================================================================
# NOTE: Channel change may take a moment to propagate available edges.
#       A short pause is applied before re-querying to allow the cluster
#       to refresh its available update graph after the channel change.
- name: Brief settle pause after channel change (allow edge graph refresh)
  command: sleep 10
  changed_when: false

- name: Query ClusterVersion for live available edges after channel change
  command: oc get clusterversion version -o json --kubeconfig {{ kubeconfig_path }}
  register: upgrade_cv_raw
  changed_when: false
  failed_when: upgrade_cv_raw.rc != 0

- name: Parse current version and available edges for hop verification
  set_fact:
    upgrade_current_version: "{{ (upgrade_cv_raw.stdout | from_json).status.desired.version | default(((upgrade_cv_raw.stdout | from_json).status.history | default([{}]) | first).version | default('unknown')) }}"
    upgrade_available_edges: >-
      [
        {% for upd in (upgrade_cv_raw.stdout | from_json).status.availableUpdates | default([]) %}
          "{{ upd.version | default('') }}"{{ '' if loop.last else ',' }}
        {% endfor %}
      ]
    upgrade_conditional_edges: >-
      [
        {% for cond in (upgrade_cv_raw.stdout | from_json).status.conditionalUpdates | default([]) %}
          "{{ cond.release.version | default('') }}"{{ '' if loop.last else ',' }}
        {% endfor %}
      ]

- name: Combine available and conditional edges for hop target validation
  set_fact:
    upgrade_all_edges: "{{ (upgrade_available_edges | default([])) + (upgrade_conditional_edges | default([])) }}"

- name: Display live edges detected for hop verification
  debug:
    msg:
      - "Cluster:            {{ cluster_name | default('UNKNOWN') }}"
      - "Current Version:    {{ upgrade_current_version }}"
      - "Hop Target:         {{ hop_target_version }}"
      - "Channel:            {{ hop_target_channel | default('unknown') }}"
      - "Available Edges:    {{ upgrade_available_edges | default([]) }}"
      - "Conditional Edges:  {{ upgrade_conditional_edges | default([]) }}"

- name: Enforce HARD gate — target version must be a valid live edge
  fail:
    msg: >-
      HARD GATE FAILURE in upgrade role: Target version '{{ hop_target_version }}'
      is NOT a valid upgrade edge for cluster '{{ cluster_name | default('UNKNOWN') }}'
      (current version: {{ upgrade_current_version }}, channel: {{ hop_target_channel | default('unknown') }}).
      Available edges: {{ upgrade_all_edges | join(', ') if upgrade_all_edges | length > 0 else 'None found' }}.
      Verify the channel and target version before retrying.
  when:
    - hop_target_version | default('') != ''
    - hop_target_version != upgrade_current_version
    - hop_target_version not in (upgrade_all_edges | default([]))

- name: Confirm target version is a valid live edge
  debug:
    msg: "✔ Target '{{ hop_target_version }}' confirmed as valid edge from '{{ upgrade_current_version }}' on channel '{{ hop_target_channel }}'."

# ==============================================================================
# STEP 3: Apply required admin-ack if the target version needs it
# ==============================================================================
- name: Query ClusterVersion Upgradeable condition and admin-acks ConfigMap
  shell: >-
    (oc get clusterversion version -o json --kubeconfig "{{ kubeconfig_path }}" &&
     oc get configmap admin-acks -n openshift-config -o json --kubeconfig "{{ kubeconfig_path }}") | jq -s -r '
      (.[0] // {}) as $cv |
      (.[1] // {}) as $cm |
      {
        "upgradeable_condition": ([($cv.status.conditions // [])[] | select(.type=="Upgradeable")] | first // {}),
        "admin_ack_data": ($cm.data // {})
      }
    '
  register: upgrade_ack_raw
  changed_when: false
  failed_when: false

- name: Parse admin-ack query payload
  set_fact:
    upgrade_ack_parsed: "{{ upgrade_ack_raw.stdout | default('{}') | from_json }}"
  when: (upgrade_ack_raw.rc | default(1) == 0) and (upgrade_ack_raw.stdout | default('') | trim != '')

- name: Fallback admin-ack payload on query failure
  set_fact:
    upgrade_ack_parsed:
      upgradeable_condition:
        status: "True"
        reason: "QueryFailed"
        message: "Could not query ClusterVersion or admin-acks configmap — proceeding"
      admin_ack_data: {}
  when: (upgrade_ack_raw.rc | default(1) != 0) or (upgrade_ack_raw.stdout | default('') | trim == '')

- name: Evaluate whether admin acknowledgement is required for this hop
  set_fact:
    upgrade_ack_required: >-
      {{ (upgrade_ack_parsed.upgradeable_condition.status | default('True') == 'False') and
         (upgrade_ack_parsed.upgradeable_condition.reason | default('') | lower is search('adminack') or
          upgrade_ack_parsed.upgradeable_condition.message | default('') | lower is search('admin ack') or
          upgrade_ack_parsed.upgradeable_condition.message | default('') | lower is search('acknowledgement')) }}
    upgrade_ack_details: >-
      Upgradeable status={{ upgrade_ack_parsed.upgradeable_condition.status | default('True') }},
      reason={{ upgrade_ack_parsed.upgradeable_condition.reason | default('None') }},
      message={{ upgrade_ack_parsed.upgradeable_condition.message | default('None') }}

- name: Derive required admin-ack gate key for target minor version
  set_fact:
    upgrade_ack_gate_key: "ack-{{ hop_target_channel | regex_replace('^stable-', '') }}"
  when: upgrade_ack_required | default(false) | bool

- name: Apply admin-ack ConfigMap for target version {{ hop_target_version | default('') }}
  shell: >-
    oc patch configmap admin-acks -n openshift-config --type merge
    -p '{"data":{"{{ upgrade_ack_gate_key }}":"true"}}'
    --kubeconfig "{{ kubeconfig_path }}"
  register: upgrade_ack_apply_result
  changed_when: upgrade_ack_apply_result.rc == 0
  failed_when: upgrade_ack_apply_result.rc != 0
  when: upgrade_ack_required | default(false) | bool

- name: Confirm admin-ack applied (or not required)
  debug:
    msg: >-
      {% if upgrade_ack_required | default(false) | bool %}
      ✔ Admin acknowledgement applied — key '{{ upgrade_ack_gate_key }}' patched in openshift-config/admin-acks.
      {% else %}
      ✔ No admin acknowledgement required for target version '{{ hop_target_version }}'.
      {% endif %}

# ==============================================================================
# STEP 4: Trigger the upgrade — oc adm upgrade --to=<version>
# ==============================================================================

# --- Last-resort force path (NEVER automatic) --------------------------------
# Gated behind explicit manual opt-in. Default: off.
- name: Guard against accidental force upgrade activation
  fail:
    msg: >-
      CRITICAL SAFETY GATE: --to-image --force mode requested but not properly configured.
      This path is a MANUAL LAST RESORT ONLY.
      Requirements: force_upgrade=true AND force_upgrade_image must be a valid image digest.
      Current: force_upgrade={{ force_upgrade | default(false) }}, force_upgrade_image={{ force_upgrade_image | default('NOT SET') }}.
      Do NOT enable this unless you have explicit approval and understand the consequences.
  when:
    - force_upgrade | default(false) | bool
    - force_upgrade_image | default('') == ''

- name: Execute LAST-RESORT force upgrade (manual opt-in only)
  command: >-
    oc adm upgrade --to-image={{ force_upgrade_image }}
    --allow-not-recommended --force
    --kubeconfig {{ kubeconfig_path }}
  register: force_upgrade_result
  changed_when: true
  failed_when: force_upgrade_result.rc != 0
  when:
    - force_upgrade | default(false) | bool
    - force_upgrade_image | default('') != ''

# --- Standard upgrade path (normal operation) --------------------------------
- name: Trigger upgrade to {{ hop_target_version | default('') }} via oc adm upgrade --to
  command: >-
    oc adm upgrade --to={{ hop_target_version }}
    --kubeconfig {{ kubeconfig_path }}
  register: upgrade_trigger_result
  changed_when: true
  failed_when: upgrade_trigger_result.rc != 0
  when: not (force_upgrade | default(false) | bool)

- name: Validate upgrade trigger response
  set_fact:
    upgrade_triggered_successfully: true
    upgrade_trigger_output: "{{ (upgrade_trigger_result.stdout | default('')) if not (force_upgrade | default(false) | bool) else (force_upgrade_result.stdout | default('')) }}"

- name: Confirm upgrade triggered for {{ hop_target_version | default('') }}
  debug:
    msg: >-
      ✔ Upgrade triggered on cluster '{{ cluster_name | default('UNKNOWN') }}'.
      Target version: {{ hop_target_version }}.
      Channel: {{ hop_target_channel | default('unknown') }}.
      Mode: {{ 'FORCE (--to-image --force)' if (force_upgrade | default(false) | bool) else 'Standard (--to)' }}.
      Output: {{ upgrade_trigger_output | default('') }}.
