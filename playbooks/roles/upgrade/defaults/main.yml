---
# ============================================================================
# Role Defaults: upgrade
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Default configuration parameters for the upgrade role, which executes
#          the cluster mutation command (oc adm upgrade --to) for a single hop,
#          handles channel switching, and enforces force-upgrade safety tokens.
# Role / Playbook Dependencies: vars/upgrade.yml, vars/paths.yml, vars/api_regex.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by upgrade tasks
# ============================================================================

# Target OpenShift version for this upgrade hop (string, mandatory, e.g. "4.15.35")
# Sourced from tasks/hop.yml during sequential upgrade loop execution
target_version: ""

# Target upgrade channel name (string, default: "")
# Sourced from vars/upgrade.yml or dynamically computed from prefix: '{{ target_channel_prefix }}-{{ major.minor }}'
target_channel: ""

# Default channel tier prefix (string, default: "stable")
# Sourced from vars/upgrade.yml ('stable', 'fast', 'candidate')
target_channel_prefix: "stable"

# Safety guard toggle for emergency forced upgrades (boolean, default: false)
# Sourced from vars/upgrade.yml; must remain false in standard one-touch automation
allow_force_upgrade: false

# Container image pullspec digest for emergency upgrades (string, default: "")
# Sourced from vars/upgrade.yml; only evaluated if allow_force_upgrade is true
force_image_pullspec: ""

# Explicit confirmation token required to activate emergency force upgrade (string, default: "")
# Sourced from vars/upgrade.yml; must match "CONFIRM_FORCE_UPGRADE" to prevent unintended mutations
force_upgrade_confirm_token: ""

# Maximum command retry attempts for transient API communication blips (integer, default: 3)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retries: 3

# Delay in seconds between command retry attempts (integer, default: 10)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retry_delay: 10
