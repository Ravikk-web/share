---
# ============================================================================
# Role Defaults: upgrade
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Simple scalar strings and booleans.
#
# Purpose: Default configuration parameters for the cluster upgrade role.
#          Drives minor version channel updates, live update edge validation,
#          dynamic administrator acknowledgement application, and cluster
#          upgrade triggering via 'oc adm upgrade --to'.
# Dependencies: playbooks/vars/upgrade.yml, playbooks/vars/paths.yml
# Gate type: HARD (strictly validates version, channel, and upgrade edge)
# ============================================================================

# Target OpenShift version for this upgrade hop (string, required, e.g. "4.15.35")
# Typically passed from tasks/hop.yml during sequential upgrade loop execution
target_version: ""

# Target upgrade channel name (string, optional, e.g. "stable-4.15" or "fast-4.15")
# If omitted or empty, dynamically computed from target_version prefix:
# "{{ target_channel_prefix }}-{{ major.minor }}"
target_channel: ""

# Default channel tier prefix (string, default: "stable")
# Options: "stable", "fast", "candidate"
target_channel_prefix: "stable"

# Safety guard toggle for emergency forced upgrades (boolean, default: false)
# In standard automation, this must remain false. Setting to true allows the
# '--to-image' path, but fails unconditionally without explicit token confirmation.
allow_force_upgrade: false

# Container image pullspec digest for emergency upgrades (string, default: empty)
# Only evaluated if allow_force_upgrade is explicitly true
force_image_pullspec: ""

# Explicit confirmation token required to activate emergency force upgrade
# Must match "CONFIRM_FORCE_UPGRADE" to prevent unintended automated force upgrades
force_upgrade_confirm_token: ""

# Maximum retry attempts for oc CLI queries to withstand transient API hiccups
# Sourced from vars/upgrade.yml or defaulted locally
oc_command_retries: 3

# Delay in seconds between oc CLI retry attempts
oc_command_retry_delay: 10
