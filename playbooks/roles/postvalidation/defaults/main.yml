---
# ============================================================================
# Role Defaults: postvalidation
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Default configuration parameters for the postvalidation role, which
#          orchestrates the 10-check post-upgrade health contract and baseline diff
#          audit against the Phase 01 snapshot.
# Role / Playbook Dependencies: vars/upgrade.yml, vars/paths.yml, vars/api_regex.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by postvalidation tasks
# ============================================================================

# Target ARO cluster name (string, mandatory)
# Sourced from vars/upgrade.yml or overridden via CLI --cluster
cluster_name: ""

# Path to the Phase 01 baseline snapshot JSON file for baseline diff comparison (string, default: "")
# Sourced from Phase 01 baseline snapshot or resolved dynamically from snapshots/
baseline_snapshot_file: ""

# Master toggle for enforcing HARD gate failure on residual postvalidation failures (boolean, default: true)
# Sourced from vars/upgrade.yml or role defaults
postval_enforce_gate: true

# Allow-list of ClusterOperator names permitted to be degraded or progressing post-upgrade (list of strings, default: [])
# Sourced from vars/upgrade.yml or role defaults
co_allow_list: []

# Maximum number of unschedulable (cordoned) nodes permitted post-upgrade (integer, default: 0)
# Sourced from vars/upgrade.yml (default: 0)
allowed_unschedulable_nodes: 0

# Maximum command retry attempts for transient API communication blips (integer, default: 3)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retries: 3

# Delay in seconds between command retry attempts (integer, default: 10)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retry_delay: 10
