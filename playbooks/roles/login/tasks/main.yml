# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (command, fail, set_fact, debug) work
#                 on both versions. Replace with FQCN only if adopting the
#                 ansible.builtin.* convention project-wide.
#                 | default('') is already applied on all optional variables.
#
# Login role — establishes a single authenticated session with the target
# cluster and writes the kubeconfig under playbook_dir.
#
# Contract:
#   - Login happens ONCE; all later phases reuse this session.
#   - The kubeconfig is written to kubeconfig_path (defaults to playbook_dir/.kubeconfig).
#   - Password handling uses no_log: true — credentials never appear in logs.
#   - Context is validated against desired_cluster_api_regex after login.
#   - On failure, a clear message names the cluster and the error.
#
# Required variables (supplied by vars_files or extra-vars):
#   - login_api_url   (or api_url)   — cluster API endpoint
#   - login_username  (or username)  — service account name
#   - login_password  (or password)  — credential (vault reference)
#   - kubeconfig_path                — where to write the kubeconfig
#   - desired_cluster_api_regex      — regex to validate the API URL
#   - cluster_name                   — used in failure messages

---
- name: Authenticate to cluster {{ cluster_name | default('UNKNOWN') }}
  command: >-
    oc login {{ login_api_url }}
    -u {{ login_username }}
    -p {{ login_password }}
    --kubeconfig {{ kubeconfig_path }}
    --insecure-skip-tls-verify=true
  no_log: true
  register: login_result
  changed_when: login_result.rc == 0
  failed_when: false

- name: Fail if login was unsuccessful
  fail:
    msg: >-
      Login to cluster '{{ cluster_name | default('UNKNOWN') }}' failed
      (API: {{ login_api_url | default('NOT SET') }}).
      Exit code: {{ login_result.rc | default('N/A') }}.
      Check credentials, API URL, and network connectivity.
  when: login_result.rc | default(1) != 0

- name: Verify authenticated context — oc whoami --show-server
  command: oc whoami --show-server --kubeconfig {{ kubeconfig_path }}
  register: whoami_result
  changed_when: false
  failed_when: whoami_result.rc != 0

- name: Store authenticated server URL
  set_fact:
    authenticated_server_url: "{{ whoami_result.stdout | trim }}"

- name: Display authenticated server URL
  debug:
    msg: "Authenticated to: {{ authenticated_server_url }}"

- name: Validate server URL against desired_cluster_api_regex
  fail:
    msg: >-
      Context validation failed for cluster '{{ cluster_name | default('UNKNOWN') }}'.
      Expected API URL to match regex '{{ desired_cluster_api_regex | default('NOT SET') }}'
      but got '{{ authenticated_server_url }}'.
      This may indicate login connected to the wrong cluster.
  when: authenticated_server_url is not match(desired_cluster_api_regex | default(''))

- name: Confirm session established for {{ cluster_name | default('UNKNOWN') }}
  debug:
    msg: >-
      ✔ Session established — cluster '{{ cluster_name | default('UNKNOWN') }}'
      at {{ authenticated_server_url }}.
      Kubeconfig: {{ kubeconfig_path }}.
