---
# ============================================================================
# Role Defaults: api_check
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Defines default input parameters for the api_check role, which verifies
#          that the active cluster API URL matches the intended cluster pattern
#          to prevent mutating operations against an unintended cluster.
# Role / Playbook Dependencies: vars/api_regex.yml, vars/upgrade.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by api_check tasks
# ============================================================================

# Target ARO cluster name (string, mandatory)
# Sourced from vars/upgrade.yml or overridden via CLI --cluster
cluster_name: ""

# Regular expression pattern for validating active cluster API endpoint URL (string, default: regex)
# Sourced from vars/api_regex.yml or role defaults
# Matches both standard ARO endpoints (api.aro-d01...) and custom enterprise domains (api.arod01...)
desired_cluster_api_regex: '^https://api\.[a-zA-Z0-9.-]+:6443/?$'

# Master toggle for enforcing HARD gate failure on validation error (boolean, default: true)
# Sourced from role defaults or overridden by prevalidation scan during diagnostic sweeps
api_check_enforce_gate: true
