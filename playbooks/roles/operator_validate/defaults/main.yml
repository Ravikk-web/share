---
# ============================================================================
# Role Defaults: operator_validate
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Standard YAML key-value pairs; fully compatible.
#
# Purpose: Default configuration variables for the OLM operator validation role.
#          Asserts subscription installedCSV matches active CSV, confirms
#          all CSVs report phase Succeeded, and generates the standalone
#          Operator Validation HTML report.
# Dependencies: playbooks/vars/upgrade.yml, playbooks/vars/paths.yml,
#               playbooks/roles/report
# Gate type: HARD (Blocks Phase 06 if operator validation fails)
# ============================================================================

# Whether to enforce HARD gate failure on invalid/unhealthy operators (boolean)
# Default: true
operator_validate_enforce_gate: true

# Transient oc CLI retry parameters
oc_command_retries: 3
oc_command_retry_delay: 10

# Template for operator validation report
operator_report_template: "health-overview.j2"

# Internal fact containers
operators: []
operator_health_checks: []
validated_operator_records: []
