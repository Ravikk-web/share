---
# ============================================================================
# Role Defaults: operator_upgrade
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Default configuration parameters for the operator_upgrade role, which
#          identifies pending manual InstallPlans, applies approval patches,
#          monitors CSV rollout, and provides Tier 2 one-shot recovery on stalls.
# Role / Playbook Dependencies: vars/upgrade.yml, vars/paths.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by operator_upgrade tasks
# ============================================================================

# Maximum duration in seconds to wait for operator CSV rollout to reach Succeeded phase (integer, default: 600)
# Sourced from vars/upgrade.yml
operator_upgrade_timeout_seconds: 600

# Cadence in seconds between polling passes for CSV phase progression (integer, default: 15)
# Sourced from vars/upgrade.yml
operator_upgrade_poll_interval_seconds: 15

# Master toggle for Tier 2 one-shot recovery (deleting failed/stalled CSV to trigger recreation) (boolean, default: true)
# Sourced from vars/upgrade.yml
operator_upgrade_auto_recover: true

# Bypass operator InstallPlan approval and mutations, executing in validation-only mode (boolean, default: false)
# Sourced from vars/upgrade.yml or CLI flag --skip-operator-upgrade
skip_operator_upgrade: false

# Master toggle for enforcing HARD gate failure on unresolved CSV upgrade failures (boolean, default: true)
# Sourced from role defaults
operator_upgrade_enforce_gate: true

# Maximum command retry attempts for transient API communication blips (integer, default: 3)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retries: 3

# Delay in seconds between command retry attempts (integer, default: 10)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retry_delay: 10
