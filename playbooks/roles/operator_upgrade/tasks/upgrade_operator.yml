# Targets Ansible 2.7.17.
---
- name: Find pending InstallPlan for {{ operator_item.name }}
  shell: |
    set -euo pipefail
    oc get installplan -n "{{ operator_item.namespace }}" -o json --kubeconfig "{{ kubeconfig_path }}" | jq -r '
      .items[] | select(.spec.approved == false and (.spec.clusterServiceVersionNames | index("{{ operator_item.currentCSV }}"))) | .metadata.name
    '
  register: pending_ip_query
  changed_when: false

- name: Approve pending InstallPlan for {{ operator_item.name }}
  shell: |
    # MIGRATION 2.14: JSON quoting in oc patch might require strict quoting for Python 3.
    oc patch installplan "{{ pending_ip_query.stdout_lines[0] }}" -n "{{ operator_item.namespace }}" --type merge -p '{"spec":{"approved":true}}' --kubeconfig "{{ kubeconfig_path }}"
  when: (pending_ip_query.stdout_lines | default([])) | length > 0
  register: patch_result
  changed_when: true
  failed_when: patch_result.rc != 0

- name: Wait for Operator CSV {{ operator_item.currentCSV }} to reach Succeeded phase
  shell: |
    oc get csv "{{ operator_item.currentCSV }}" -n "{{ operator_item.namespace }}" -o json --kubeconfig "{{ kubeconfig_path }}" | jq -r '.status.phase // "Unknown"'
  register: csv_phase_poll
  until: csv_phase_poll.stdout == "Succeeded"
  retries: "{{ operator_upgrade_timeout_retries | default(30) }}"
  delay: 30
  ignore_errors: true
  changed_when: false

- name: Handle Operator Upgrade Timeout
  block:
    - name: Set Operator Timeout Details
      set_fact:
        failure_observed: "CSV {{ operator_item.currentCSV }} phase is {{ csv_phase_poll.stdout | default('Unknown') }}"
        failure_reason: "Operator {{ operator_item.name }} upgrade timed out after {{ (operator_upgrade_timeout_retries | default(30) | int) * 30 }} seconds."

    - name: Trigger HARD finding fail on timeout
      fail:
        msg: "Operator {{ operator_item.name }} upgrade timed out. {{ failure_reason }}"
  when: csv_phase_poll.stdout != "Succeeded"
