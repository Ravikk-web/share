# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (shell, set_fact, debug) work on both
#                 versions. Replace with FQCN only if adopting the
#                 ansible.builtin.* convention project-wide.
#                 | default('') guards are applied on all optional variables.
#
# pv role — validates Persistent Volume (PV) status (WARN gate).
#
# Contract:
#   - Queries `oc get pv -o json` piped to `jq` (jq v1.5 compatible).
#   - Read-only operation; changed_when: false.
#   - Identifies non-healthy PVs (phases other than Bound or Available, e.g. Released, Failed).
#   - Respects optional pv_allow_list overrides.
#   - WARN gate: failed_when: false + recorded status; never fail:, never auto-remediate.
#   - Exposes parsed facts (pv_parsed_data, pv_all_pvs, pv_offending_pvs, pv_status) for reporting.
#   - Records a structured entry (PASS or WARN) into `health_summary` list via set_fact.

---
# Shell module chosen to pipe oc get pv JSON output to jq (v1.5 compatible)
- name: Query Persistent Volumes and evaluate phase status — oc get pv
  shell: >-
    oc get pv -o json --kubeconfig "{{ kubeconfig_path }}" | jq -r '
      .items // [] | {
        "all": [
          .[] | {
            "name": .metadata.name,
            "status": (.status.phase // "Unknown"),
            "capacity": (.spec.capacity.storage // "N/A"),
            "storageClass": (.spec.storageClassName // "N/A"),
            "claim": (if .spec.claimRef then ((.spec.claimRef.namespace // "") + "/" + (.spec.claimRef.name // "")) else "None" end),
            "reclaimPolicy": (.spec.persistentVolumeReclaimPolicy // "N/A"),
            "accessModes": (.spec.accessModes // [])
          }
        ],
        "offenders": [
          .[] | {
            "name": .metadata.name,
            "status": (.status.phase // "Unknown"),
            "capacity": (.spec.capacity.storage // "N/A"),
            "storageClass": (.spec.storageClassName // "N/A"),
            "claim": (if .spec.claimRef then ((.spec.claimRef.namespace // "") + "/" + (.spec.claimRef.name // "")) else "None" end),
            "reclaimPolicy": (.spec.persistentVolumeReclaimPolicy // "N/A"),
            "accessModes": (.spec.accessModes // []),
            "reason": ("PV is in " + (.status.phase // "Unknown") + " phase (expected Bound or Available)")
          } | select(.status != "Bound" and .status != "Available")
        ]
      }
    '
  register: pv_raw_query
  changed_when: false
  failed_when: false

- name: Parse Persistent Volumes JSON payload
  set_fact:
    pv_parsed_data: "{{ pv_raw_query.stdout | from_json }}"
  when: (pv_raw_query.rc | default(1) == 0) and (pv_raw_query.stdout | default('') | trim != '')

- name: Fallback Persistent Volumes payload on query failure
  set_fact:
    pv_parsed_data:
      all: []
      offenders:
        - name: "pv-query-failure"
          status: "Error"
          capacity: "N/A"
          storageClass: "N/A"
          claim: "N/A"
          reclaimPolicy: "N/A"
          accessModes: []
          reason: "Failed to execute oc get pv: {{ pv_raw_query.stderr | default(pv_raw_query.stdout | default('Unknown error')) | trim }}"
  when: (pv_raw_query.rc | default(1) != 0) or (pv_raw_query.stdout | default('') | trim == '')

- name: Extract all Persistent Volumes list
  set_fact:
    pv_all_pvs: "{{ pv_parsed_data.all | default([]) }}"

- name: Initialize offending Persistent Volumes list
  set_fact:
    pv_offending_pvs: []

- name: Filter offending Persistent Volumes against pv_allow_list
  set_fact:
    pv_offending_pvs: "{{ pv_offending_pvs + [item] }}"
  loop: "{{ pv_parsed_data.offenders | default([]) }}"
  when: item.name not in (pv_allow_list | default([]))

- name: Determine Persistent Volumes health verdict
  set_fact:
    pv_status: "{{ 'WARN' if ((pv_offending_pvs | length) > 0) else 'PASS' }}"

- name: Display Persistent Volumes inspection summary
  debug:
    msg: >-
      Cluster '{{ cluster_name | default('UNKNOWN') }}': Scanned {{ pv_all_pvs | length }} Persistent Volume(s).
      Found {{ pv_offending_pvs | length }} non-healthy PV(s)
      (Allow-listed: {{ pv_allow_list | default([]) | length }}).
      Status: {{ pv_status }}.

- name: Record Persistent Volumes status in health_summary
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [pv_summary_entry] }}"
  vars:
    pv_summary_entry:
      id: "{{ pv_id | default('08') }}"
      name: "{{ pv_name | default('Persistent Volume (PV) Status') }}"
      gate: "{{ pv_gate | default('WARN') }}"
      status: "{{ pv_status }}"
      observed: >-
        {% if pv_status == 'PASS' %}
        All {{ pv_all_pvs | length }} Persistent Volume(s) are in healthy phase (Bound/Available)
        {% else %}
        Found {{ pv_offending_pvs | length }} non-healthy Persistent Volume(s) (Released/Failed/Error)
        {% endif %}
      details: >-
        {% if pv_status == 'PASS' %}
        Verified {{ pv_all_pvs | length }} Persistent Volumes on cluster {{ cluster_name | default('cluster') }}.
        {% else %}
        Non-healthy PVs: {% for p in pv_offending_pvs %}{{ p.name }} ({{ p.status }} - {{ p.reason }}){% if not loop.last %}, {% endif %}{% endfor %}.
        {% endif %}
      raw_output: "{{ pv_offending_pvs | to_json if pv_status == 'WARN' else pv_all_pvs | to_json }}"

- name: Confirm Persistent Volumes check evaluation
  debug:
    msg: >-
      {% if pv_status == 'PASS' %}
      ✔ PASS [Check {{ pv_id | default('08') }} - {{ pv_name | default('Persistent Volume (PV) Status') }}] —
      All {{ pv_all_pvs | length }} PV(s) are healthy (Bound/Available).
      {% else %}
      ! WARN [Check {{ pv_id | default('08') }} - {{ pv_name | default('Persistent Volume (PV) Status') }}] —
      Found {{ pv_offending_pvs | length }} non-healthy PV(s). Non-blocking warning recorded.
      {% endif %}
