---
# ============================================================================
# Role Tasks: pv (PersistentVolumes)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (shell, set_fact, fail, debug).
#                 Compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Ensures all persistent storage volumes are healthy (Bound or Available).
#          Surfaces Failed or Released volumes in the prevalidation report.
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: WARN
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Query Live PersistentVolumes via oc CLI & jq v1.5
# Why: oc get pv -o json parsed with jq 1.5 extracts volume phases.
# Why: Shell with set -o pipefail and args: executable: /bin/bash captures errors.
# Why: Parentheses around 'and' operands comply strictly with jq 1.5.
# Why: Bracket notation and null-coalescing handle empty clusters cleanly.
# ----------------------------------------------------------------------------
- name: "Query live persistent volumes and parse phases via jq"
  shell: |
    set -o pipefail
    oc get pv -o json | jq -c '
      {
        total_count: (.items // [] | length),
        pvs: [.items[]? | {
          name: .metadata.name,
          phase: (.status.phase // "Unknown" | tostring),
          storage_class: (.spec.storageClassName // "none" | tostring),
          capacity: (.spec.capacity.storage // "unknown" | tostring),
          claim: (if .spec.claimRef then ((.spec.claimRef.namespace // "") + "/" + (.spec.claimRef.name // "")) else "none" end)
        }],
        unhealthy: [.items[]? | select((((.status.phase // "") | tostring) != "Bound") and (((.status.phase // "") | tostring) != "Available")) | {
          name: .metadata.name,
          phase: (.status.phase // "Unknown" | tostring),
          reason: (.status.reason // "" | tostring),
          message: (.status.message // "" | tostring)
        }],
        failed: [.items[]? | select(((.status.phase // "") | tostring) == "Failed") | .metadata.name],
        released: [.items[]? | select(((.status.phase // "") | tostring) == "Released") | .metadata.name]
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: pv_query_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: pv_query_raw.rc == 0

# ----------------------------------------------------------------------------
# 2. Extract Facts & Evaluate PersistentVolume Health
# Why: Bracket notation ['pvs'] avoids collisions with Python dict.items().
# Why: pv check is a WARN gate: surfaces issues without blocking upgrade chain.
# ----------------------------------------------------------------------------
- name: "Extract persistent volume health facts"
  set_fact:
    pv_total_count: "{{ (pv_query_raw.stdout | default('{}') | from_json)['total_count'] | default(0) | int }}"
    pv_all_volumes: "{{ (pv_query_raw.stdout | default('{}') | from_json)['pvs'] | default([]) }}"
    pv_unhealthy_volumes: "{{ (pv_query_raw.stdout | default('{}') | from_json)['unhealthy'] | default([]) }}"
    pv_failed_volumes: "{{ (pv_query_raw.stdout | default('{}') | from_json)['failed'] | default([]) }}"
    pv_released_volumes: "{{ (pv_query_raw.stdout | default('{}') | from_json)['released'] | default([]) }}"

- name: "Evaluate persistent volume compliance"
  set_fact:
    pv_check_valid: "{{ (pv_unhealthy_volumes | length) == 0 }}"

# ----------------------------------------------------------------------------
# 3. Construct Structured Health Record & Append to Summary
# Why: Appends structured dictionary with gate: WARN into health_summary.
# ----------------------------------------------------------------------------
- name: "Construct structured pv health record"
  set_fact:
    pv_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "PersistentVolumes Health"
      gate: "WARN"
      status: "{{ 'PASS' if (pv_check_valid | bool) else 'WARN' }}"
      observed: >-
        {{ ('All ' ~ pv_total_count ~ ' PersistentVolumes are in healthy state (Bound/Available)')
           if ((pv_check_valid | bool) and (pv_total_count > 0))
           else ('No PersistentVolumes found on cluster (PASS)')
           if ((pv_check_valid | bool) and (pv_total_count == 0))
           else ('Unhealthy PersistentVolumes detected: failed=[' ~ (pv_failed_volumes | join(', ')) ~ '], released=[' ~ (pv_released_volumes | join(', ')) ~ '], total_unhealthy=' ~ (pv_unhealthy_volumes | length)) }}

- name: "Record pv result to health_summary tracking list"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [pv_health_item] }}"

- name: "Log persistent volume evaluation outcome"
  debug:
    msg:
      - "Check        : {{ pv_health_item.name }}"
      - "Gate         : {{ pv_health_item.gate }}"
      - "Status       : {{ pv_health_item.status }}"
      - "Observed     : {{ pv_health_item.observed }}"
      - "Gate Enforced: {{ pv_enforce_gate | default(false) | bool }}"

# ----------------------------------------------------------------------------
# 4. Optional Gate Enforcement (WARN gate: does not halt by default)
# Why: WARN gate allows non-critical storage warnings to surface in reports.
# ----------------------------------------------------------------------------
- name: "Enforce gate for PersistentVolumes check if strict mode configured"
  fail:
    msg: "GATE FAILURE [pv]: Problematic PersistentVolumes detected on cluster '{{ cluster_name }}'. Failed: {{ pv_failed_volumes | to_json }}, Released: {{ pv_released_volumes | to_json }}."
  when:
    - not (pv_check_valid | bool)
    - pv_enforce_gate | default(false) | bool
