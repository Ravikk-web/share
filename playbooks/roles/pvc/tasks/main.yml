# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (shell, set_fact, debug) work on both
#                 versions. Replace with FQCN only if adopting the
#                 ansible.builtin.* convention project-wide.
#                 | default('') guards are applied on all optional variables.
#
# pvc role — validates Persistent Volume Claim (PVC) status across all namespaces (WARN gate).
#
# Contract:
#   - Queries `oc get pvc --all-namespaces -o json` piped to `jq` (jq v1.5 compatible).
#   - Read-only operation; changed_when: false.
#   - Identifies non-Bound PVCs (e.g. Pending, Lost, or Error phases).
#   - Respects optional pvc_allow_list overrides (supports "namespace/name" or "name").
#   - WARN gate: failed_when: false + recorded status; never fail:, never auto-remediate.
#   - Exposes parsed facts (pvc_parsed_data, pvc_all_pvcs, pvc_offending_pvcs, pvc_status) for reporting.
#   - Records a structured entry (PASS or WARN) into `health_summary` list via set_fact.

---
# Shell module chosen to pipe oc get pvc JSON output to jq (v1.5 compatible)
- name: Query Persistent Volume Claims and evaluate phase status — oc get pvc
  shell: >-
    oc get pvc --all-namespaces -o json --kubeconfig "{{ kubeconfig_path }}" | jq -r '
      .items // [] | {
        "all": [
          .[] | {
            "namespace": .metadata.namespace,
            "name": .metadata.name,
            "status": (.status.phase // "Unknown"),
            "volume": (.spec.volumeName // "N/A"),
            "storageClass": (.spec.storageClassName // "N/A"),
            "requested": (.spec.resources.requests.storage // "N/A"),
            "capacity": (.status.capacity.storage // "N/A"),
            "accessModes": (.spec.accessModes // [])
          }
        ],
        "offenders": [
          .[] | {
            "namespace": .metadata.namespace,
            "name": .metadata.name,
            "status": (.status.phase // "Unknown"),
            "volume": (.spec.volumeName // "N/A"),
            "storageClass": (.spec.storageClassName // "N/A"),
            "requested": (.spec.resources.requests.storage // "N/A"),
            "capacity": (.status.capacity.storage // "N/A"),
            "accessModes": (.spec.accessModes // []),
            "reason": ("PVC is in " + (.status.phase // "Unknown") + " phase (expected Bound)")
          } | select(.status != "Bound")
        ]
      }
    '
  register: pvc_raw_query
  changed_when: false
  failed_when: false

- name: Parse Persistent Volume Claims JSON payload
  set_fact:
    pvc_parsed_data: "{{ pvc_raw_query.stdout | from_json }}"
  when: (pvc_raw_query.rc | default(1) == 0) and (pvc_raw_query.stdout | default('') | trim != '')

- name: Fallback Persistent Volume Claims payload on query failure
  set_fact:
    pvc_parsed_data:
      all: []
      offenders:
        - namespace: "all"
          name: "pvc-query-failure"
          status: "Error"
          volume: "N/A"
          storageClass: "N/A"
          requested: "N/A"
          capacity: "N/A"
          accessModes: []
          reason: "Failed to execute oc get pvc: {{ pvc_raw_query.stderr | default(pvc_raw_query.stdout | default('Unknown error')) | trim }}"
  when: (pvc_raw_query.rc | default(1) != 0) or (pvc_raw_query.stdout | default('') | trim == '')

- name: Extract all Persistent Volume Claims list
  set_fact:
    pvc_all_pvcs: "{{ pvc_parsed_data.all | default([]) }}"

- name: Initialize offending Persistent Volume Claims list
  set_fact:
    pvc_offending_pvcs: []

- name: Filter offending Persistent Volume Claims against pvc_allow_list
  set_fact:
    pvc_offending_pvcs: "{{ pvc_offending_pvcs + [item] }}"
  loop: "{{ pvc_parsed_data.offenders | default([]) }}"
  when: >-
    (item.name not in (pvc_allow_list | default([]))) and
    ((item.namespace + '/' + item.name) not in (pvc_allow_list | default([])))

- name: Determine Persistent Volume Claims health verdict
  set_fact:
    pvc_status: "{{ 'WARN' if ((pvc_offending_pvcs | length) > 0) else 'PASS' }}"

- name: Display Persistent Volume Claims inspection summary
  debug:
    msg: >-
      Cluster '{{ cluster_name | default('UNKNOWN') }}': Scanned {{ pvc_all_pvcs | length }} Persistent Volume Claim(s).
      Found {{ pvc_offending_pvcs | length }} non-Bound PVC(s)
      (Allow-listed: {{ pvc_allow_list | default([]) | length }}).
      Status: {{ pvc_status }}.

- name: Record Persistent Volume Claims status in health_summary
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [pvc_summary_entry] }}"
  vars:
    pvc_summary_entry:
      id: "{{ pvc_id | default('09') }}"
      name: "{{ pvc_name | default('Persistent Volume Claim (PVC) Status') }}"
      gate: "{{ pvc_gate | default('WARN') }}"
      status: "{{ pvc_status }}"
      observed: >-
        {% if pvc_status == 'PASS' %}
        All {{ pvc_all_pvcs | length }} Persistent Volume Claim(s) are Bound
        {% else %}
        Found {{ pvc_offending_pvcs | length }} non-Bound Persistent Volume Claim(s) (Pending/Lost/Error)
        {% endif %}
      details: >-
        {% if pvc_status == 'PASS' %}
        Verified {{ pvc_all_pvcs | length }} Persistent Volume Claims across all namespaces on cluster {{ cluster_name | default('cluster') }}.
        {% else %}
        Non-Bound PVCs: {% for c in pvc_offending_pvcs %}{{ c.namespace }}/{{ c.name }} ({{ c.status }} - {{ c.reason }}){% if not loop.last %}, {% endif %}{% endfor %}.
        {% endif %}
      raw_output: "{{ pvc_offending_pvcs | to_json if pvc_status == 'WARN' else pvc_all_pvcs | to_json }}"

- name: Confirm Persistent Volume Claims check evaluation
  debug:
    msg: >-
      {% if pvc_status == 'PASS' %}
      ✔ PASS [Check {{ pvc_id | default('09') }} - {{ pvc_name | default('Persistent Volume Claim (PVC) Status') }}] —
      All {{ pvc_all_pvcs | length }} PVC(s) are Bound.
      {% else %}
      ! WARN [Check {{ pvc_id | default('09') }} - {{ pvc_name | default('Persistent Volume Claim (PVC) Status') }}] —
      Found {{ pvc_offending_pvcs | length }} non-Bound PVC(s). Non-blocking warning recorded.
      {% endif %}
