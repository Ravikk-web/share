---
# ============================================================================
# Role Tasks: pvc (PersistentVolumeClaims)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (shell, set_fact, fail, debug).
#                 Compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Ensures workload volume claims are satisfied across all namespaces.
#          Surfaces Pending or Lost claims in the prevalidation report.
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: WARN
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Query Live PersistentVolumeClaims via oc CLI & jq v1.5
# Why: oc get pvc -A -o json parsed with jq 1.5 extracts claim phases.
# Why: Shell with set -o pipefail and args: executable: /bin/bash captures errors.
# Why: Bracket notation and null-coalescing handle empty clusters cleanly.
# ----------------------------------------------------------------------------
- name: "Query live persistent volume claims across all namespaces via jq"
  shell: |
    set -o pipefail
    oc get pvc -A -o json | jq -c '
      {
        total_count: (.items // [] | length),
        pvcs: [.items[]? | {
          namespace: .metadata.namespace,
          name: .metadata.name,
          phase: (.status.phase // "Unknown" | tostring),
          volume_name: (.spec.volumeName // "none" | tostring),
          storage_class: (.spec.storageClassName // "none" | tostring)
        }],
        unhealthy: [.items[]? | select(((.status.phase // "") | tostring) != "Bound") | {
          namespace: .metadata.namespace,
          name: .metadata.name,
          phase: (.status.phase // "Unknown" | tostring),
          volume_name: (.spec.volumeName // "none" | tostring)
        }],
        pending: [.items[]? | select(((.status.phase // "") | tostring) == "Pending") | ((.metadata.namespace // "") + "/" + (.metadata.name // ""))],
        lost: [.items[]? | select(((.status.phase // "") | tostring) == "Lost") | ((.metadata.namespace // "") + "/" + (.metadata.name // ""))]
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: pvc_query_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: pvc_query_raw.rc == 0

# ----------------------------------------------------------------------------
# 2. Extract Facts & Evaluate PersistentVolumeClaim Health
# Why: Bracket notation ['pvcs'] avoids collisions with Python dict.items().
# Why: pvc check is a WARN gate: surfaces issues without blocking upgrade chain.
# ----------------------------------------------------------------------------
- name: "Extract persistent volume claim health facts"
  set_fact:
    pvc_total_count: "{{ (pvc_query_raw.stdout | default('{}') | from_json)['total_count'] | default(0) | int }}"
    pvc_all_claims: "{{ (pvc_query_raw.stdout | default('{}') | from_json)['pvcs'] | default([]) }}"
    pvc_unhealthy_claims: "{{ (pvc_query_raw.stdout | default('{}') | from_json)['unhealthy'] | default([]) }}"
    pvc_pending_claims: "{{ (pvc_query_raw.stdout | default('{}') | from_json)['pending'] | default([]) }}"
    pvc_lost_claims: "{{ (pvc_query_raw.stdout | default('{}') | from_json)['lost'] | default([]) }}"

- name: "Evaluate persistent volume claim compliance"
  set_fact:
    pvc_check_valid: "{{ (pvc_unhealthy_claims | length) == 0 }}"

# ----------------------------------------------------------------------------
# 3. Construct Structured Health Record & Append to Summary
# Why: Appends structured dictionary with gate: WARN into health_summary.
# ----------------------------------------------------------------------------
- name: "Construct structured pvc health record"
  set_fact:
    pvc_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "PersistentVolumeClaims Health"
      gate: "WARN"
      status: "{{ 'PASS' if (pvc_check_valid | bool) else 'WARN' }}"
      observed: >-
        {{ ('All ' ~ pvc_total_count ~ ' PersistentVolumeClaims are Bound across all namespaces')
           if ((pvc_check_valid | bool) and (pvc_total_count > 0))
           else ('No PersistentVolumeClaims found on cluster (PASS)')
           if ((pvc_check_valid | bool) and (pvc_total_count == 0))
           else ('Unhealthy PersistentVolumeClaims detected: pending=[' ~ (pvc_pending_claims | join(', ')) ~ '], lost=[' ~ (pvc_lost_claims | join(', ')) ~ '], total_unhealthy=' ~ (pvc_unhealthy_claims | length)) }}

- name: "Record pvc result to health_summary tracking list"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [pvc_health_item] }}"

- name: "Log persistent volume claim evaluation outcome"
  debug:
    msg:
      - "Check        : {{ pvc_health_item.name }}"
      - "Gate         : {{ pvc_health_item.gate }}"
      - "Status       : {{ pvc_health_item.status }}"
      - "Observed     : {{ pvc_health_item.observed }}"
      - "Gate Enforced: {{ pvc_enforce_gate | default(false) | bool }}"

# ----------------------------------------------------------------------------
# 4. Optional Gate Enforcement (WARN gate: does not halt by default)
# Why: WARN gate allows non-critical storage claim warnings to surface in reports.
# ----------------------------------------------------------------------------
- name: "Enforce gate for PersistentVolumeClaims check if strict mode configured"
  fail:
    msg: "GATE FAILURE [pvc]: Unfulfilled PersistentVolumeClaims detected on cluster '{{ cluster_name }}'. Pending: {{ pvc_pending_claims | to_json }}, Lost: {{ pvc_lost_claims | to_json }}."
  when:
    - not (pvc_check_valid | bool)
    - pvc_enforce_gate | default(false) | bool
