---
# ============================================================================
# Role Defaults: pvc (PersistentVolumeClaims)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Simple scalar and boolean values.
#
# Purpose: Defines default parameters for the pvc role, which audits workload
#          PersistentVolumeClaims across all namespaces to verify that claims are
#          in Bound phase, alerting on Pending or Lost claims prior to upgrade.
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: WARN
# ============================================================================

# Target cluster identifier (string, required)
cluster_name: ""

# Master toggle for enforcing gate failure on validation error (WARN gate does not fail by default)
pvc_enforce_gate: false

# Transient retry parameters for oc CLI execution
oc_command_retries: 3
oc_command_retry_delay: 10
