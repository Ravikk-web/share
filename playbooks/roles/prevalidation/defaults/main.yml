---
# ============================================================================
# Role Defaults: prevalidation
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Default configuration parameters for the prevalidation aggregator role,
#          which executes the full 14-check prevalidation contract before initiating
#          cluster upgrade mutations.
# Role / Playbook Dependencies: vars/upgrade.yml, vars/paths.yml, vars/api_regex.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by prevalidation tasks
# ============================================================================

# Target ARO cluster name (string, mandatory)
# Sourced from vars/upgrade.yml or overridden via CLI --cluster
cluster_name: ""

# Master toggle for enforcing HARD gate failure on residual prevalidation failures (boolean, default: true)
# Sourced from vars/upgrade.yml or role defaults
preval_enforce_gate: true

# Emit advisory warning on pending CertificateSigningRequests during prevalidation (boolean, default: true)
# Sourced from vars/upgrade.yml or role defaults (non-blocking WARN advisory)
preval_warn_on_pending_csrs: true

# Emit advisory warning on crashlooping pods in platform namespaces during prevalidation (boolean, default: true)
# Sourced from vars/upgrade.yml or role defaults (non-blocking WARN advisory)
preval_warn_on_pod_crashloops: true

# Maximum command retry attempts for transient API communication blips (integer, default: 3)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retries: 3

# Delay in seconds between command retry attempts (integer, default: 10)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retry_delay: 10

# Namespace prefix defining core platform namespaces for health auditing (string, default: "openshift-")
# Sourced from role defaults
critical_namespace_prefix: "openshift-"

# Master toggle to bypass cgroupMode v2 validation and auto-patching entirely (boolean, default: false)
# Sourced from vars/upgrade.yml or CLI flag --skip-cgroup
skip_cgroup_check: false

# Master toggle for enforcing HARD gate on cgroupMode v1 status (boolean, default: false)
# Sourced from vars/upgrade.yml or role defaults (default: false — non-blocking WARN advisory)
cgroup_enforce_gate: false
