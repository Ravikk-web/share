# Targets Ansible 2.7.17.
# MIGRATION 2.14: No changes required — pure variable definitions.
#                 | default('') guards applied on all optional variables.
#
# Defaults for prevalidation role (13-check pre-upgrade health aggregator).

---
kubeconfig_path: "{{ playbook_dir }}/logs/kubeconfig"
cluster_name: "cluster"
upgrade_path: []

# HARD gate thresholds
max_cpu_percent: 90
max_memory_percent: 90
max_drain_headroom_percent: 95
fail_on_zero_disruption_pdb: false

# Allow-lists for permitted exceptions
allowed_unschedulable_nodes: []
co_allow_list: []
node_allow_list: []
mcp_allow_list: []
etcd_allow_list: []
pdb_allow_list: []
csr_allow_list: []
disk_pressure_allow_list: []
critical_pod_allow_list: []
alert_allow_list: []

# Namespaces considered critical for pod readiness inspection
critical_namespace_pattern: "openshift-|kube-system"
