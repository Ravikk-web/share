---
# ============================================================================
# Role Tasks: api_readiness
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (command, set_fact, fail, debug).
#                 Compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Verifies OpenShift API server readiness status via raw endpoint query
#          (e.g. /readyz). Enforces HARD gate if the endpoint fails to return 'ok'.
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: HARD
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Query Raw Readiness Endpoint via oc CLI
# Why: oc get --raw=/readyz returns the raw healthz/readyz payload from kube-apiserver.
# Why: Retry loop with delay absorbs transient 503 Service Unavailable or restarts.
# Why: changed_when: false keeps audit reports honest since queries are read-only.
# ----------------------------------------------------------------------------
- name: "Query cluster API readiness endpoint via oc CLI"
  command: "oc get --raw={{ api_readiness_endpoint | default('/readyz') }}"
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: api_readyz_query
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: api_readyz_query.rc == 0 and ((api_readyz_query.stdout | default('') | trim) == 'ok')

# ----------------------------------------------------------------------------
# 2. Extract & Validate Readiness Output
# Why: Normalizes output with trim and ensures strict equality with 'ok' and rc 0.
# ----------------------------------------------------------------------------
- name: "Extract API readiness endpoint payload fact"
  set_fact:
    readyz_payload: "{{ api_readyz_query.stdout | default('') | trim }}"

- name: "Evaluate API readiness validation result"
  set_fact:
    api_readiness_valid: "{{ (api_readyz_query.rc == 0) and (readyz_payload == 'ok') }}"

# ----------------------------------------------------------------------------
# 3. Construct Structured Health Record & Append to Summary
# Why: Records structured dictionary into health_summary for reporting.
# ----------------------------------------------------------------------------
- name: "Construct structured api_readiness health record"
  set_fact:
    api_readiness_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "API Server Readiness"
      gate: "HARD"
      status: "{{ 'PASS' if (api_readiness_valid | bool) else 'FAIL' }}"
      observed: >-
        {{ ('Readiness endpoint ' ~ (api_readiness_endpoint | default('/readyz')) ~ ' responded with ok')
           if (api_readiness_valid | bool)
           else ('Readiness endpoint ' ~ (api_readiness_endpoint | default('/readyz')) ~ ' returned payload: ' ~ (readyz_payload | default(api_readyz_query.stderr | default('unresponsive')))) }}

- name: "Record api_readiness result to health_summary tracking list"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [api_readiness_item] }}"

- name: "Log api_readiness evaluation outcome"
  debug:
    msg:
      - "Check        : {{ api_readiness_item.name }}"
      - "Status       : {{ api_readiness_item.status }}"
      - "Observed     : {{ api_readiness_item.observed }}"
      - "Gate Enforced: {{ api_readiness_enforce_gate | default(true) | bool }}"

# ----------------------------------------------------------------------------
# 4. Enforce HARD Gate
# Why: Halts execution immediately if the API readiness endpoint is unhealthy.
# ----------------------------------------------------------------------------
- name: "Enforce HARD gate for API readiness check"
  fail:
    msg: "HARD GATE FAILURE [api_readiness]: API endpoint '{{ api_readiness_endpoint }}' on cluster '{{ cluster_name }}' is NOT ready. Observed: '{{ readyz_payload | default(api_readyz_query.stderr | default('failed query')) }}' (rc: {{ api_readyz_query.rc }})."
  when:
    - not (api_readiness_valid | bool)
    - api_readiness_enforce_gate | default(true) | bool
