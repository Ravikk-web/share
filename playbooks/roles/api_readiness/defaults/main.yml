---
# ============================================================================
# Role Defaults: api_readiness
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Simple scalar values.
#
# Purpose: Defines default input parameters for the api_readiness role, which
#          confirms that the OpenShift API server readiness endpoint (/readyz)
#          is responding with 'ok' and return code 0.
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: HARD
# ============================================================================

# Target cluster identifier (string, required)
cluster_name: ""

# Target readiness endpoint to query via oc get --raw
# In OpenShift 4, /readyz aggregates readiness across all API server subsystems
api_readiness_endpoint: "/readyz"

# Master toggle for enforcing HARD gate failure on validation error
# Set to false by prevalidation aggregator during diagnostic sweeps before remediation
api_readiness_enforce_gate: true

# Transient retry parameters for oc CLI execution
oc_command_retries: 3
oc_command_retry_delay: 10
