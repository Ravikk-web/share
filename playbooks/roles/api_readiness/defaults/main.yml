# Targets Ansible 2.7.17.
# MIGRATION 2.14: No changes required — pure variable definitions.
#                 | default('') guards are already in place for Jinja2 strictness.
#
# Default variables for the api_readiness role.
# Confirms the API server is responsive and ready (/readyz) before heavier checks.
#
# Contract:
#   - Read-only; queries `oc get --raw='/readyz'`.
#   - Asserts healthy response ('ok').
#   - Appends a structured PASS/FAIL entry to the `health_summary` list.
#   - On non-ready response, fails immediately with a HARD gate failure.

---
# Path to the active kubeconfig (defaults to playbook_dir/.kubeconfig)
kubeconfig_path: "{{ playbook_dir }}/.kubeconfig"

# Target cluster name (used for logging and failure messages)
cluster_name: ""

# Endpoint to query for readiness
api_readiness_endpoint: "/readyz"

# Expected healthy response body
api_readiness_expected_response: "ok"

# Metadata for health_summary reporting
api_readiness_id: "02"
api_readiness_name: "API Server Readiness (/readyz)"
api_readiness_gate: "HARD"
