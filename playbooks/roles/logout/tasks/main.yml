# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (command, file, stat, debug) work
#                 on both versions. Replace with FQCN only if adopting the
#                 ansible.builtin.* convention project-wide.
#                 | default('') is already applied on all optional variables.
#
# Logout role — tears down the authenticated session and removes the
# kubeconfig file.
#
# Contract:
#   - Logout NEVER fails teardown. Every task uses failed_when: false
#     so this role is safe inside an always: block, even after a failed login.
#   - Idempotent: safe to call multiple times or if no session exists.
#   - The kubeconfig file at kubeconfig_path is removed/invalidated.
#   - No run should ever leave an authenticated session open on the jump server.
#
# Required variables:
#   - kubeconfig_path — path to the kubeconfig written by the login role

---
- name: Check if kubeconfig file exists
  stat:
    path: "{{ kubeconfig_path | default('') }}"
  register: kubeconfig_stat
  changed_when: false
  failed_when: false

- name: Logout from cluster (oc logout)
  command: oc logout --kubeconfig {{ kubeconfig_path }}
  register: logout_result
  changed_when: false
  failed_when: false
  when: kubeconfig_stat.stat.exists | default(false)

- name: Display logout result
  debug:
    msg: >-
      Logout command completed
      (rc={{ logout_result.rc | default('skipped') }}).
      {{ 'Session terminated.' if (logout_result.rc | default(1)) == 0
         else 'Logout may have been a no-op (no active session or already logged out).' }}
  when: kubeconfig_stat.stat.exists | default(false)

- name: Remove kubeconfig file
  file:
    path: "{{ kubeconfig_path | default('') }}"
    state: absent
  failed_when: false
  when: kubeconfig_stat.stat.exists | default(false)

- name: Confirm kubeconfig removed
  debug:
    msg: >-
      {{ '✔ Kubeconfig removed: ' ~ kubeconfig_path
         if (kubeconfig_stat.stat.exists | default(false))
         else '✔ No kubeconfig found at ' ~ kubeconfig_path ~ ' — nothing to clean up.' }}

- name: Session teardown complete
  debug:
    msg: "✔ Logout role complete — no authenticated session remains."
