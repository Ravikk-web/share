---
# ============================================================================
# Role Tasks: snapshot
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (file, set_fact, shell, copy);
#                 compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Queries live cluster state via oc CLI with retry protection and jq 1.5
#          parsing, constructs a structured baseline dictionary (cluster metadata,
#          nodes, cluster operators, and routes), and writes an immutable
#          JSON snapshot to disk for downstream postvalidation diffing.
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: HARD (fails immediately if cluster queries fail)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Directory & Path Initialization
# ----------------------------------------------------------------------------
# Why: Ensures destination snapshot directory exists prior to file operations.
- name: "Ensure baseline snapshot directory exists"
  file:
    path: "{{ snapshot_dir | default(playbook_dir ~ '/snapshots') }}"
    state: directory
    mode: "0755"

# Why: Dynamically derives snapshot file path incorporating cluster_name and run_timestamp.
- name: "Establish snapshot output file path"
  set_fact:
    snapshot_file: "{{ (snapshot_dir | default(playbook_dir ~ '/snapshots')) }}/{{ cluster_name }}_{{ run_timestamp | default('baseline') }}_baseline.json"

# ----------------------------------------------------------------------------
# 2. Query Live Cluster Resources via oc CLI & jq 1.5
# ----------------------------------------------------------------------------
# Why: oc CLI with retry logic (3 retries, 10s delay) absorbs transient network
#      blips, API server restarts, or 503 Service Unavailable responses.
# Why: set -o pipefail + executable: /bin/bash guarantees failure detection across pipes.
# Why: changed_when: false keeps audit reports honest since queries are read-only.

# Why: Extract current version, active channel, and cluster ID from ClusterVersion.
# Why: Parentheses around // operands satisfy jq 1.5 operator precedence rules.
- name: "Query and extract live clusterversion metadata"
  shell: |
    set -o pipefail
    oc get clusterversion version -o json | jq -c '
      {
        current_version: (((.status.history // []) | map(select(.state == "Completed")) | .[0].version) // (.status.desired.version // "unknown")),
        channel: (.spec.channel // "unknown"),
        cluster_id: (.spec.clusterID // "unknown")
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: cv_query_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: cv_query_raw.rc == 0

# Why: Extract operator names, versions, and health conditions (Available, Progressing, Degraded).
# Why: Parentheses around 'or' operands ensure jq 1.5 evaluates boolean conditions correctly.
- name: "Query and extract live clusteroperators snapshot"
  shell: |
    set -o pipefail
    oc get clusteroperators -o json | jq -c '
      [.items[]? | {
        name: .metadata.name,
        version: (([.status.versions[]? | select((.name == "operator") or (.name == "cluster-version-operator") or (.name == .metadata.name)) | .version] | first) // ([.status.versions[]?.version] | first) // "unknown"),
        available: (([.status.conditions[]? | select(.type == "Available") | .status] | first) // "Unknown"),
        progressing: (([.status.conditions[]? | select(.type == "Progressing") | .status] | first) // "Unknown"),
        degraded: (([.status.conditions[]? | select(.type == "Degraded") | .status] | first) // "Unknown")
      }] | sort_by(.name)'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: co_query_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: co_query_raw.rc == 0

# Why: Extract node names, roles, kubelet versions, readiness status, and scheduling state.
# Why: Extracts roles from labels prefixed with node-role.kubernetes.io/.
- name: "Query and extract live node snapshot"
  shell: |
    set -o pipefail
    oc get nodes -o json | jq -c '
      [.items[]? | {
        name: .metadata.name,
        roles: ([.metadata.labels // {} | to_entries[]? | select(.key | startswith("node-role.kubernetes.io/")) | .key | split("/")[1]] | sort),
        kubelet_version: (.status.nodeInfo.kubeletVersion // "unknown"),
        ready: (([.status.conditions[]? | select(.type == "Ready") | .status] | first) // "Unknown"),
        unschedulable: (.spec.unschedulable // false)
      }] | sort_by(.name)'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: nodes_query_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: nodes_query_raw.rc == 0

# Why: Extract route names, namespaces, and exposed hostnames across all namespaces.
- name: "Query and extract live cluster routes snapshot"
  shell: |
    set -o pipefail
    oc get routes -A -o json | jq -c '
      [.items[]? | {
        name: .metadata.name,
        namespace: .metadata.namespace,
        host: (.spec.host // "")
      }] | sort_by(.namespace, .name)'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: routes_query_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: routes_query_raw.rc == 0

# ----------------------------------------------------------------------------
# 3. Assemble Baseline Data Structures
# ----------------------------------------------------------------------------
# Why: Converts JSON stdout from queries into native Ansible dictionary and list facts.
- name: "Parse queried JSON outputs into structured facts"
  set_fact:
    baseline_cv_parsed: "{{ cv_query_raw.stdout | from_json }}"
    baseline_operators_parsed: "{{ co_query_raw.stdout | from_json }}"
    baseline_nodes_parsed: "{{ nodes_query_raw.stdout | from_json }}"
    baseline_routes_parsed: "{{ routes_query_raw.stdout | from_json }}"

# Why: Constructs the unified baseline snapshot dictionary conforming to the
#      single cross-phase persistence schema.
- name: "Assemble structured cluster baseline dictionary"
  set_fact:
    baseline_dict:
      cluster_metadata:
        name: "{{ cluster_name }}"
        api_url: "{{ active_cluster_server | default(cluster_api_url | default('')) }}"
        current_version: "{{ baseline_cv_parsed.current_version }}"
        channel: "{{ baseline_cv_parsed.channel }}"
        cluster_id: "{{ baseline_cv_parsed.cluster_id }}"
        captured_at: "{{ run_timestamp | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"
      nodes: "{{ baseline_nodes_parsed }}"
      cluster_operators: "{{ baseline_operators_parsed }}"
      routes: "{{ baseline_routes_parsed }}"

# ----------------------------------------------------------------------------
# 4. Persist Snapshot Artifact
# ----------------------------------------------------------------------------
# Why: Persists the structured baseline JSON snapshot to disk.
# Why: This file is the ONLY cross-phase state artifact permitted by architecture.
- name: "Write immutable baseline JSON snapshot to disk"
  copy:
    content: "{{ baseline_dict | to_nice_json }}"
    dest: "{{ snapshot_file }}"
    mode: "0644"

# ----------------------------------------------------------------------------
# 5. Export Baseline Facts for Downstream Phases
# ----------------------------------------------------------------------------
# Why: Exports facts required by Phase 01 edge check, logging, and Phase 05 diffing.
- name: "Export baseline snapshot file path and summary facts"
  set_fact:
    baseline_snapshot_file_path: "{{ snapshot_file }}"
    baseline_current_version: "{{ baseline_cv_parsed.current_version }}"
    baseline_channel: "{{ baseline_cv_parsed.channel }}"
    baseline_cluster_id: "{{ baseline_cv_parsed.cluster_id }}"
    baseline_nodes_count: "{{ baseline_nodes_parsed | length }}"
    baseline_operators_count: "{{ baseline_operators_parsed | length }}"
    baseline_routes_count: "{{ baseline_routes_parsed | length }}"
