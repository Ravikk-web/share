---
# ============================================================================
# Role Tasks: remediate - restart_operator (Blocker 4, Tier 2 Guided)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (shell, set_fact, debug, fail, pause, lineinfile, stat).
#                 Compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Detects degraded ClusterOperators and attempts non-destructive
#          guided recovery by deleting degraded operator pods to force
#          controller reconciliation and leader re-election.
#          Tier 2 handling: Disabled by default (auto_restart_degraded_operators: false)
#          and requires explicit opt-in via vars/upgrade.yml.
# Dependencies: playbooks/vars/upgrade.yml, playbooks/vars/paths.yml
# Gate type: HARD (Remediated: AUTO-FIXED / FIX-FAILED)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Detect Condition: Query live ClusterOperators & identify degraded operators
# Why: Resilient oc query with retry protection handles transient API server blips.
# Why: jq 1.5 expression extracts degraded operators safely.
# ----------------------------------------------------------------------------
- name: "Query live ClusterOperators to detect degraded components"
  shell: |
    set -o pipefail
    oc get clusteroperators -o json | jq -c '
      [.items[] | select((((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "False" | tostring) == "True") | .metadata.name]
    '
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: live_degraded_co_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: live_degraded_co_raw.rc == 0

- name: "Identify candidate degraded operators excluding allow-list"
  set_fact:
    raw_degraded_co: "{{ live_degraded_co_raw.stdout | default('[]') | from_json }}"
    configured_co_allow_list: "{{ co_allow_list | default([]) }}"

- name: "Filter candidate degraded operators"
  set_fact:
    actionable_degraded_co: "{{ raw_degraded_co | difference(configured_co_allow_list) }}"
    co_remediation_needed: "{{ (raw_degraded_co | difference(configured_co_allow_list) | length) > 0 }}"

- name: "Log detected degraded ClusterOperators status"
  debug:
    msg:
      - "Degraded COs Detected : {{ raw_degraded_co }}"
      - "Allow-list Excluded   : {{ raw_degraded_co | intersect(configured_co_allow_list) }}"
      - "Actionable Degraded   : {{ actionable_degraded_co }}"
      - "Tier 2 Toggle State   : {{ auto_restart_degraded_operators | default(false) | bool }}"

# ----------------------------------------------------------------------------
# 2. Skip if No Degraded Operators Detected
# ----------------------------------------------------------------------------
- name: "Confirm no actionable degraded ClusterOperators detected"
  debug:
    msg: "[PASS] No degraded ClusterOperators detected requiring recovery. No remediation required."
  when: not (co_remediation_needed | bool)

# ----------------------------------------------------------------------------
# 3. Handle Disabled Tier 2 State
# ----------------------------------------------------------------------------
- name: "Log informational note if operator recovery is disabled (Default Tier 2 Behavior)"
  debug:
    msg: "[INFO] Degraded ClusterOperator(s) detected ({{ actionable_degraded_co | join(', ') }}), but Tier 2 guided recovery is disabled (auto_restart_degraded_operators: false). Cluster operator restart requires explicit opt-in."
  when:
    - co_remediation_needed | bool
    - not (auto_remediation_enabled | default(true) | bool) or not (auto_restart_degraded_operators | default(false) | bool)

# ----------------------------------------------------------------------------
# 4. Apply Deterministic Remediation: Force Pod Recreation
# Why: Deletes degraded operator pod to trigger ReplicaSet/DaemonSet recreation.
# ----------------------------------------------------------------------------
- name: "Identify operator pods for actionable degraded ClusterOperators"
  shell: |
    set -o pipefail
    oc get pods -A -o json | jq -r --arg op "{{ item }}" '
      [.items[] | select((.metadata.namespace | startswith("openshift-")) and (((.metadata.labels.app // "") == $op) or (.metadata.name | test($op)))) | {ns: .metadata.namespace, name: .metadata.name}] | .[0] // empty | "\(.ns) \(.name)"
    '
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: degraded_pod_lookups
  changed_when: false
  failed_when: false
  loop: "{{ actionable_degraded_co }}"
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool

- name: "[GUIDED] Delete degraded operator pod to trigger reconciliation"
  shell: |
    set -o pipefail
    POD_NS=$(echo "{{ item.stdout | default('') }}" | awk '{print $1}')
    POD_NAME=$(echo "{{ item.stdout | default('') }}" | awk '{print $2}')
    if [ -n "$POD_NS" ] && [ -n "$POD_NAME" ]; then
      oc delete pod -n "$POD_NS" "$POD_NAME" --wait=false
    fi
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: pod_delete_results
  changed_when: true
  failed_when: false
  loop: "{{ degraded_pod_lookups.results | default([]) }}"
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool
    - (item.stdout | default('') | trim | length) > 0

- name: "Wait operator_restart_grace_seconds for operator controller reconciliation"
  pause:
    seconds: "{{ operator_restart_grace_seconds | default(180) | int }}"
    prompt: "Awaiting operator pod recreation and status condition convergence..."
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool
    - (degraded_pod_lookups.results | default([]) | length) > 0

# ----------------------------------------------------------------------------
# 5. Re-Verify Condition: Confirm ClusterOperators Available & Not Degraded
# ----------------------------------------------------------------------------
- name: "Re-query ClusterOperators to verify post-restart status"
  shell: |
    set -o pipefail
    oc get clusteroperators -o json | jq -c '
      [.items[] | select((((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "False" | tostring) == "True") | .metadata.name]
    '
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: reverified_degraded_co_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: reverified_degraded_co_raw.rc == 0
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool

- name: "Evaluate operator recovery outcome"
  set_fact:
    post_remediation_degraded_co: "{{ reverified_degraded_co_raw.stdout | default('[]') | from_json }}"
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool

- name: "Determine recovered and still-degraded operator sets"
  set_fact:
    recovered_co_list: "{{ actionable_degraded_co | difference(post_remediation_degraded_co | default([])) }}"
    still_degraded_co_list: "{{ actionable_degraded_co | intersect(post_remediation_degraded_co | default([])) }}"
    co_recovery_verified: "{{ (actionable_degraded_co | intersect(post_remediation_degraded_co | default([])) | length) == 0 }}"
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool

# ----------------------------------------------------------------------------
# 6. Update Tracking Facts: autofix_items & health_summary
# ----------------------------------------------------------------------------
- name: "Append operator recovery remediation records to autofix_items"
  set_fact:
    autofix_items: >-
      {{ (autofix_items | default([])) + [{
        'name': 'Degraded Operator Recovery (' ~ item ~ ')',
        'action': 'Restarted degraded operator pod for ' ~ item ~ ' and verified recovery to Available=True / Degraded=False.',
        'reference': 'https://docs.openshift.com/container-platform/4.14/support/troubleshooting/investigating-cluster-operators.html'
      }] }}
  loop: "{{ recovered_co_list | default([]) }}"
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool
    - (recovered_co_list | default([]) | length) > 0

- name: "Update health_summary tracking list with operator recovery result"
  set_fact:
    health_summary: >-
      {%- set updated = [] -%}
      {%- set matching = [] -%}
      {%- for item in health_summary | default([]) -%}
        {%- if ('ClusterOperator' in (item.name | default(''))) or ('Operator' in (item.name | default(''))) -%}
          {%- set _ = matching.append(1) -%}
          {%- set final_status = 'AUTO-FIXED' if (co_recovery_verified | default(false) | bool) else 'FIX-FAILED' -%}
          {%- set _ = updated.append({
            'num': item.num,
            'name': item.name,
            'gate': item.gate,
            'status': final_status,
            'observed': ('Recovered degraded operators: ' ~ (recovered_co_list | join(', ')) if (co_recovery_verified | default(false) | bool) else ('Operator restart failed; still degraded: ' ~ (still_degraded_co_list | default([]) | join(', '))))
          }) -%}
        {%- else -%}
          {%- set _ = updated.append(item) -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if matching | length == 0 -%}
        {%- set final_status = 'AUTO-FIXED' if (co_recovery_verified | default(false) | bool) else 'FIX-FAILED' -%}
        {%- set _ = updated.append({
          'num': ((health_summary | default([]) | length) + 1),
          'name': 'ClusterOperators Health',
          'gate': 'HARD',
          'status': final_status,
          'observed': ('Recovered degraded operators: ' ~ (recovered_co_list | join(', ')) if (co_recovery_verified | default(false) | bool) else ('Operator restart failed; still degraded: ' ~ (still_degraded_co_list | default([]) | join(', '))))
        }) -%}
      {%- endif -%}
      {{ updated }}
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool

# ----------------------------------------------------------------------------
# 7. Dual Audit Logging: Human-Readable (.txt) and Machine-Parseable (.csv)
# ----------------------------------------------------------------------------
- name: "Log operator recovery outcome to text run log"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.txt"
    line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [{{ 'AUTO-FIX' if (co_recovery_verified | bool) else 'FIX-FAILED' }}] [HARD] Task 'Degraded Operator Recovery': {{ 'Successfully recovered operator(s): ' ~ (recovered_co_list | join(', ')) if (co_recovery_verified | bool) else 'Failed to recover operator(s): ' ~ (still_degraded_co_list | join(', ')) }} | Observed: {{ post_remediation_degraded_co | default([]) | join(', ') }}"
    create: true
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool

- name: "Check if CSV run log exists"
  stat:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.csv"
  register: co_csv_stat
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool

- name: "Initialize CSV run log header if new"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.csv"
    line: "timestamp,cluster,task_name,gate_type,status,reason,observed"
    create: true
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool
    - not (co_csv_stat.stat.exists | default(false))

- name: "Log operator recovery outcome to CSV run log"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.csv"
    line: '"{{ lookup(''pipe'', ''date +%Y-%m-%dT%H:%M:%S'') }}","{{ cluster_name | default(''cluster'') }}","Degraded Operator Recovery","HARD","{{ ''AUTO-FIXED'' if (co_recovery_verified | bool) else ''FIX-FAILED'' }}","{{ ''Recovered operator(s): '' ~ (recovered_co_list | join(''; '')) if (co_recovery_verified | bool) else ''Operator recovery failed'' }}","{{ post_remediation_degraded_co | default([]) | join(''; '') }}"'
    create: true
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool

# ----------------------------------------------------------------------------
# 8. Console Feedback & Optional Gate Enforcement
# ----------------------------------------------------------------------------
- name: "Display operator recovery confirmation banner"
  debug:
    msg:
      - "============================================================================"
      - "[AUTO-FIX] DEGRADED OPERATOR RECOVERY APPLIED & VERIFIED"
      - "============================================================================"
      - "Cluster             : {{ cluster_name | default('cluster') }}"
      - "Recovered Operators : {{ recovered_co_list | default([]) | join(', ') }}"
      - "Still Degraded      : {{ still_degraded_co_list | default([]) | join(', ') }}"
      - "Status              : {{ 'AUTO-FIXED' if (co_recovery_verified | bool) else 'FIX-FAILED' }}"
      - "============================================================================"
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool

- name: "Halt execution if operator recovery failed and gate enforcement is enabled"
  fail:
    msg: "AUTO-REMEDIATION HALT: Attempted pod restart for degraded ClusterOperators '{{ actionable_degraded_co | join(', ') }}', but operator(s) '{{ still_degraded_co_list | default([]) | join(', ') }}' remain degraded after {{ operator_restart_grace_seconds }}s. Halting upgrade."
  when:
    - co_remediation_needed | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool
    - not (co_recovery_verified | bool)
    - remediate_enforce_gate | default(false) | bool
