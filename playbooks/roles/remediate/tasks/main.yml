---
# ============================================================================
# Role Tasks: remediate - Main Dispatcher
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses include_tasks (dynamic) for sub-task routing.
#                 Never uses bare include:. Compatible across 2.7 and 2.14.
#
# Purpose: Master dispatcher for the dedicated auto-remediation engine.
#          Evaluates master and individual feature toggles, inspects trigger
#          flags, and routes execution through Tier 1 (Auto-Fix) and Tier 2
#          (Guided) remediation tasks. Ensures strict verification cycle:
#          detect -> toggle check -> apply -> re-verify -> audit log.
# Dependencies: playbooks/vars/upgrade.yml, playbooks/vars/paths.yml
# Gate type: N/A (Dispatcher routing)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Master Toggle Verification
# Why: If auto_remediation_enabled is false, bypass all remediation sweeps cleanly.
# ----------------------------------------------------------------------------
- name: "Check whether auto-remediation engine is globally enabled"
  debug:
    msg: "[INFO] Auto-remediation is disabled via auto_remediation_enabled: false. Bypassing all automated remediation sweeps."
  when: not (auto_remediation_enabled | default(true) | bool)

# ----------------------------------------------------------------------------
# 2. Dispatcher Banner & Trigger Mode Evaluation
# Why: Identifies whether specific triggers were supplied (e.g. from Phase 03
#      hop loop or Phase 04 monitor) or if this is a general prevalidation sweep.
# ----------------------------------------------------------------------------
- name: "Evaluate active remediation trigger mode"
  set_fact:
    specific_triggers_active: >-
      {{ (trigger_cgroup_remediation | default(false) | bool)
         or (trigger_admin_ack_remediation | default(false) | bool)
         or (trigger_unpause_mcp_remediation | default(false) | bool)
         or (trigger_co_restart_remediation | default(false) | bool) }}
  when: auto_remediation_enabled | default(true) | bool

- name: "Display Auto-Remediation Engine dispatcher banner"
  debug:
    msg:
      - "============================================================================"
      - "AUTO-REMEDIATION ENGINE: EVALUATING & DISPATCHING BLOCKER RESOLUTIONS"
      - "============================================================================"
      - "Master Toggle          : {{ auto_remediation_enabled | default(true) | bool }}"
      - "Specific Triggers Only : {{ specific_triggers_active | default(false) | bool }}"
      - "Tier 1 CGroup v2       : {{ auto_fix_cgroup_v2 | default(true) | bool }} (Trigger: {{ trigger_cgroup_remediation | default(false) | bool }})"
      - "Tier 1 Admin-Acks      : {{ auto_apply_admin_acks | default(true) | bool }} (Trigger: {{ trigger_admin_ack_remediation | default(false) | bool }})"
      - "Tier 1 Unpause MCP     : {{ auto_unpause_mcp | default(true) | bool }} (Trigger: {{ trigger_unpause_mcp_remediation | default(false) | bool }})"
      - "Tier 2 Restart Degraded: {{ auto_restart_degraded_operators | default(false) | bool }} (Trigger: {{ trigger_co_restart_remediation | default(false) | bool }})"
      - "============================================================================"
  when: auto_remediation_enabled | default(true) | bool

# ----------------------------------------------------------------------------
# 3. Tier 1: Blocker 1 — CGroup v1 to v2 Mode Migration
# Why: Dynamic include_tasks evaluates cgroupMode on nodes.config/cluster.
# ----------------------------------------------------------------------------
- name: "Dispatch Tier 1: CGroup v1 to v2 Migration Task"
  include_tasks: cgroup_v2.yml
  when:
    - auto_remediation_enabled | default(true) | bool
    - auto_fix_cgroup_v2 | default(true) | bool
    - (trigger_cgroup_remediation | default(false) | bool) or not (specific_triggers_active | bool)

# ----------------------------------------------------------------------------
# 4. Tier 1: Blocker 2 — Dynamic Administrator Acknowledgements (Admin-Acks)
# Why: Dynamic include_tasks evaluates ClusterVersion conditions and applies ack keys.
# ----------------------------------------------------------------------------
- name: "Dispatch Tier 1: Dynamic Administrator Acknowledgement Task"
  include_tasks: admin_acks.yml
  when:
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool
    - (trigger_admin_ack_remediation | default(false) | bool) or not (specific_triggers_active | bool)

# ----------------------------------------------------------------------------
# 5. Tier 1: Blocker 3 — MachineConfigPool Unpausing
# Why: Dynamic include_tasks detects paused MCPs and unpauses permitted pools.
# ----------------------------------------------------------------------------
- name: "Dispatch Tier 1: MachineConfigPool Unpausing Task"
  include_tasks: unpause_mcp.yml
  when:
    - auto_remediation_enabled | default(true) | bool
    - auto_unpause_mcp | default(true) | bool
    - (trigger_unpause_mcp_remediation | default(false) | bool) or not (specific_triggers_active | bool)

# ----------------------------------------------------------------------------
# 6. Tier 2: Blocker 4 — Degraded ClusterOperator Pod Restart (Guided)
# Why: Dynamic include_tasks restarts degraded operator pods if explicitly enabled.
# ----------------------------------------------------------------------------
- name: "Dispatch Tier 2: Degraded Operator Pod Restart Task"
  include_tasks: restart_operator.yml
  when:
    - auto_remediation_enabled | default(true) | bool
    - auto_restart_degraded_operators | default(false) | bool
    - (trigger_co_restart_remediation | default(false) | bool) or not (specific_triggers_active | bool)

# ----------------------------------------------------------------------------
# 7. Summary & Final Dispatch Logging
# ----------------------------------------------------------------------------
- name: "Display Auto-Remediation Engine execution summary"
  debug:
    msg:
      - "============================================================================"
      - "AUTO-REMEDIATION ENGINE: PASS COMPLETE"
      - "============================================================================"
      - "Cluster              : {{ cluster_name | default('cluster') }}"
      - "Total Remediation Items Applied : {{ (autofix_items | default([]) | length) }}"
      - "Autofixed Details    : {{ autofix_items | default([]) | map(attribute='name') | list }}"
      - "============================================================================"
  when: auto_remediation_enabled | default(true) | bool
