---
# ============================================================================
# Role Tasks: remediate - admin_acks (Blocker 2)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (shell, set_fact, debug, fail, lineinfile, stat).
#                 Compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Dynamically detects and applies required administrator acknowledgements
#          for OpenShift upgrades that remove Kubernetes APIs. OpenShift minor
#          upgrades block with Upgradeable=False and reason: AdminAckRequired
#          until an administrator acknowledges the removal by populating the
#          openshift-config/admin-acks ConfigMap.
# Dependencies: playbooks/vars/upgrade.yml, playbooks/vars/paths.yml
# Gate type: HARD (Remediated: AUTO-FIXED / FIX-FAILED)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Detect Condition: Inspect live ClusterVersion conditions & extract ack keys
# Why: Resilient oc query captures Upgradeable conditions and extracts required
#      keys matching 'ack-.*-api-removals-in-.*' dynamically.
# ----------------------------------------------------------------------------
- name: "Query live ClusterVersion to inspect pending admin acknowledgement conditions"
  shell: |
    set -o pipefail
    oc get clusterversion version -o json | jq -r '
      [.status.conditions[]? | select((.type == "Upgradeable") and (((.status // "") == "False") or ((.reason // "") == "AdminAckRequired"))) | .message // ""] | join(" ")
    '
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: cv_upgradeable_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: cv_upgradeable_raw.rc == 0

- name: "Extract dynamic admin-ack keys from condition message"
  shell: |
    set -o pipefail
    echo "{{ cv_upgradeable_raw.stdout | default('') }}" | grep -oE 'ack-[0-9]+\.[0-9]+-api-removals-in-[0-9]+\.[0-9]+' | sort -u || true
  args:
    executable: /bin/bash
  register: extracted_ack_keys_raw
  changed_when: false

- name: "Consolidate list of required admin-ack keys"
  set_fact:
    dynamic_ack_keys: "{{ extracted_ack_keys_raw.stdout_lines | default([]) }}"
    custom_ack_key_list: "{{ [custom_admin_ack_key] if (custom_admin_ack_key is defined and custom_admin_ack_key | length > 0) else [] }}"

- name: "Set final detected admin-ack key list"
  set_fact:
    detected_ack_keys: "{{ (dynamic_ack_keys + custom_ack_key_list) | unique }}"
    admin_ack_required: "{{ ((dynamic_ack_keys + custom_ack_key_list) | unique | length) > 0 }}"

- name: "Log detected admin-ack requirements"
  debug:
    msg:
      - "Admin Ack Required : {{ admin_ack_required | bool }}"
      - "Detected Ack Keys  : {{ detected_ack_keys }}"
      - "Toggle State       : {{ auto_apply_admin_acks | default(true) | bool }}"

# ----------------------------------------------------------------------------
# 2. Skip if No Admin Acknowledgements Pending
# ----------------------------------------------------------------------------
- name: "Confirm no administrator acknowledgements are currently pending"
  debug:
    msg: "[PASS] No pending admin-ack requirements detected on ClusterVersion. No remediation required."
  when: not (admin_ack_required | bool)

# ----------------------------------------------------------------------------
# 3. Apply Deterministic Remediation: Ensure ConfigMap & Apply Keys
# Why: Gated behind master auto_remediation_enabled and specific auto_apply_admin_acks.
# ----------------------------------------------------------------------------
- name: "Ensure admin-acks ConfigMap exists in openshift-config namespace"
  shell: |
    set -o pipefail
    oc -n openshift-config get configmap admin-acks -o json >/dev/null 2>&1 || \
    oc -n openshift-config create configmap admin-acks
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: admin_ack_cm_init
  changed_when: false
  failed_when: false
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool

- name: "[AUTO-FIX] Apply required admin-ack ConfigMap entry"
  shell: >-
    oc -n openshift-config patch cm admin-acks
    --patch '{"data":{"{{ item }}":"true"}}' --type=merge
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: ack_patch_result
  changed_when: true
  failed_when: false
  loop: "{{ detected_ack_keys }}"
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool

# ----------------------------------------------------------------------------
# 4. Re-Verify Condition: Query openshift-config/admin-acks ConfigMap
# Why: Confirms keys exist in .data and are set to 'true'.
# ----------------------------------------------------------------------------
- name: "Re-query admin-acks ConfigMap to verify applied acknowledgement keys"
  shell: |
    set -o pipefail
    oc -n openshift-config get cm admin-acks -o json | jq -c '(.data // {})'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: verified_admin_acks_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: verified_admin_acks_raw.rc == 0
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool

- name: "Evaluate whether all required admin-ack keys were verified"
  set_fact:
    admin_ack_verified_data: "{{ verified_admin_acks_raw.stdout | default('{}') | from_json }}"
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool

- name: "Verify each detected key is present and true"
  set_fact:
    missing_ack_keys: >-
      {%- set missing = [] -%}
      {%- for key in detected_ack_keys -%}
        {%- if (admin_ack_verified_data[key] | default('false') | lower) != 'true' -%}
          {%- set _ = missing.append(key) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ missing }}
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool

- name: "Set admin_ack_verified outcome"
  set_fact:
    admin_ack_verified: "{{ (missing_ack_keys | default([]) | length) == 0 }}"
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool

# ----------------------------------------------------------------------------
# 5. Handle Disabled Auto-Fix State
# ----------------------------------------------------------------------------
- name: "Log warning if admin-ack remediation is disabled but acknowledgements are required"
  debug:
    msg: "[WARN] Pending admin-ack keys ({{ detected_ack_keys | join(', ') }}) require application, but auto_apply_admin_acks is disabled. Upgradeable condition remains blocked."
  when:
    - admin_ack_required | bool
    - not (auto_remediation_enabled | default(true) | bool) or not (auto_apply_admin_acks | default(true) | bool)

# ----------------------------------------------------------------------------
# 6. Update Tracking Facts: autofix_items & health_summary
# ----------------------------------------------------------------------------
- name: "Append Admin-Ack remediation records to autofix_items"
  set_fact:
    autofix_items: >-
      {{ (autofix_items | default([])) + [{
        'name': 'Administrator Acknowledgement (' ~ item ~ ')',
        'action': 'Applied required admin-ack ConfigMap key ' ~ item ~ ' in openshift-config namespace; unblocked Upgradeable condition.',
        'reference': 'https://docs.openshift.com/container-platform/4.15/updating/updating_changes/understanding-upgrade-admin-acks.html'
      }] }}
  loop: "{{ detected_ack_keys }}"
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool
    - admin_ack_verified | bool

- name: "Update health_summary tracking list with Admin-Ack remediation result"
  set_fact:
    health_summary: >-
      {%- set updated = [] -%}
      {%- set matching = [] -%}
      {%- for item in health_summary | default([]) -%}
        {%- if ('AdminAck' in (item.name | default(''))) or ('Admin-Ack' in (item.name | default(''))) or ('Upgradeable' in (item.name | default(''))) -%}
          {%- set _ = matching.append(1) -%}
          {%- set _ = updated.append({
            'num': item.num,
            'name': item.name,
            'gate': item.gate,
            'status': ('AUTO-FIXED' if (admin_ack_verified | default(false) | bool) else 'FIX-FAILED'),
            'observed': ('ConfigMap admin-acks patched with: ' ~ (detected_ack_keys | join(', ')) if (admin_ack_verified | default(false) | bool) else ('ConfigMap admin-acks patch failed; missing: ' ~ (missing_ack_keys | default([]) | join(', '))))
          }) -%}
        {%- else -%}
          {%- set _ = updated.append(item) -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if matching | length == 0 -%}
        {%- set _ = updated.append({
          'num': ((health_summary | default([]) | length) + 1),
          'name': 'Administrator Acknowledgement (Admin-Acks)',
          'gate': 'HARD',
          'status': ('AUTO-FIXED' if (admin_ack_verified | default(false) | bool) else 'FIX-FAILED'),
          'observed': ('ConfigMap admin-acks patched with: ' ~ (detected_ack_keys | join(', ')) if (admin_ack_verified | default(false) | bool) else ('ConfigMap admin-acks patch failed; missing: ' ~ (missing_ack_keys | default([]) | join(', '))))
        }) -%}
      {%- endif -%}
      {{ updated }}
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool

# ----------------------------------------------------------------------------
# 7. Dual Audit Logging: Human-Readable (.txt) and Machine-Parseable (.csv)
# ----------------------------------------------------------------------------
- name: "Log Admin-Ack remediation outcome to text run log"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.txt"
    line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [{{ 'AUTO-FIX' if (admin_ack_verified | bool) else 'FIX-FAILED' }}] [HARD] Task 'Administrator Acknowledgement': {{ 'Successfully applied admin-acks ConfigMap key(s): ' ~ (detected_ack_keys | join(', ')) if (admin_ack_verified | bool) else 'Failed to verify admin-acks ConfigMap keys: ' ~ (missing_ack_keys | default([]) | join(', ')) }} | Observed: {{ detected_ack_keys | join(', ') }}"
    create: true
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool

- name: "Check if CSV run log exists"
  stat:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.csv"
  register: ack_csv_stat
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool

- name: "Initialize CSV run log header if new"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.csv"
    line: "timestamp,cluster,task_name,gate_type,status,reason,observed"
    create: true
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool
    - not (ack_csv_stat.stat.exists | default(false))

- name: "Log Admin-Ack remediation outcome to CSV run log"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.csv"
    line: '"{{ lookup(''pipe'', ''date +%Y-%m-%dT%H:%M:%S'') }}","{{ cluster_name | default(''cluster'') }}","Administrator Acknowledgement","HARD","{{ ''AUTO-FIXED'' if (admin_ack_verified | bool) else ''FIX-FAILED'' }}","{{ ''Applied admin-acks: '' ~ (detected_ack_keys | join(''; '')) if (admin_ack_verified | bool) else ''Patch re-verification failed'' }}","{{ detected_ack_keys | join(''; '') }}"'
    create: true
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool

# ----------------------------------------------------------------------------
# 8. Console Feedback & Optional Gate Enforcement
# ----------------------------------------------------------------------------
- name: "Display Admin-Ack remediation confirmation banner"
  debug:
    msg:
      - "============================================================================"
      - "[AUTO-FIX] ADMINISTRATOR ACKNOWLEDGEMENTS APPLIED & VERIFIED"
      - "============================================================================"
      - "Cluster       : {{ cluster_name | default('cluster') }}"
      - "Applied Keys  : {{ detected_ack_keys | join(', ') }}"
      - "Status        : AUTO-FIXED"
      - "Impact        : ClusterVersion Upgradeable condition unblocked."
      - "============================================================================"
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool
    - admin_ack_verified | bool

- name: "Halt execution if Admin-Ack remediation failed and gate enforcement is enabled"
  fail:
    msg: "AUTO-REMEDIATION HALT: Attempted to apply admin-acks ConfigMap key(s) '{{ detected_ack_keys | join(', ') }}', but keys '{{ missing_ack_keys | default([]) | join(', ') }}' were not verified. Halting upgrade."
  when:
    - admin_ack_required | bool
    - auto_remediation_enabled | default(true) | bool
    - auto_apply_admin_acks | default(true) | bool
    - not (admin_ack_verified | bool)
    - remediate_enforce_gate | default(false) | bool
