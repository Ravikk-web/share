# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (shell, command, fail, set_fact, debug)
#                 work on both versions. Replace with FQCN only if adopting the
#                 ansible.builtin.* convention project-wide.
#                 | default('') guards are applied on all optional variables.
#
# etcd role — validates etcd member health (HARD gate).
#
# Contract:
#   - Queries etcd pods via `oc get pods -n <etcd_namespace> -l <etcd_pod_selector> -o json` piped to `jq`.
#   - Read-only operation; changed_when: false.
#   - Backup is explicitly OUT OF SCOPE (manual operation); no backup or snapshot mutation is attempted.
#   - Asserts every etcd member pod is Running and Ready=True.
#   - Optionally queries etcd cluster operator conditions for operator-level degradation (`oc get etcd`).
#   - Respects optional etcd_allow_list for permitted exceptions.
#   - HARD gate: fails with explicit error naming cluster, offending members, and observed conditions.
#   - Exposes parsed facts (etcd_all_members, etcd_member_count, etcd_offending_members).
#   - Records a structured PASS entry into `health_summary` list via set_fact.

---
# Shell module chosen to pipe oc get pods JSON output to jq (v1.5 compatible)
- name: Query etcd member pods and evaluate health conditions — oc get pods
  shell: >-
    oc get pods -n "{{ etcd_namespace | default('openshift-etcd') }}" -l "{{ etcd_pod_selector | default('app=etcd') }}" -o json --kubeconfig "{{ kubeconfig_path }}" | jq -r '
      .items // [] | {
        "members": [
          .[] | {
            "name": .metadata.name,
            "node": (.spec.nodeName // "unknown"),
            "phase": (.status.phase // "Unknown"),
            "ready": ([.status.conditions[]? | select(.type=="Ready") | .status][0] // "Unknown"),
            "restart_count": ([.status.containerStatuses[]?.restartCount] | add // 0),
            "ip": (.status.podIP // "unknown")
          }
        ],
        "offenders": [
          .[] | {
            "name": .metadata.name,
            "node": (.spec.nodeName // "unknown"),
            "phase": (.status.phase // "Unknown"),
            "ready": ([.status.conditions[]? | select(.type=="Ready") | .status][0] // "Unknown"),
            "restart_count": ([.status.containerStatuses[]?.restartCount] | add // 0),
            "ip": (.status.podIP // "unknown")
          } | select(.ready != "True" or .phase != "Running")
        ]
      }
    '
  register: etcd_raw_query
  changed_when: false
  failed_when: false

- name: Evaluate etcd member pods query execution
  fail:
    msg: >-
      Failed to query etcd member pods for cluster '{{ cluster_name | default('UNKNOWN') }}' in namespace '{{ etcd_namespace | default('openshift-etcd') }}'.
      Command exited with code {{ etcd_raw_query.rc | default(1) }}.
      Error: {{ etcd_raw_query.stderr | default(etcd_raw_query.stdout | default('No output')) | trim }}.
      Check kubeconfig path ({{ kubeconfig_path }}) and cluster reachability.
  when: (etcd_raw_query.rc | default(1) != 0) or (etcd_raw_query.stdout | default('') | trim == '')

- name: Parse etcd pods JSON payload
  set_fact:
    etcd_parsed_data: "{{ etcd_raw_query.stdout | from_json }}"

- name: Extract all etcd members list and count
  set_fact:
    etcd_all_members: "{{ etcd_parsed_data.members | default([]) }}"
    etcd_member_count: "{{ (etcd_parsed_data.members | default([])) | length }}"

- name: Validate at least minimum expected etcd members were discovered
  fail:
    msg: >-
      etcd health check FAILED (HARD gate) for cluster '{{ cluster_name | default('UNKNOWN') }}'.
      Expected at least {{ etcd_min_members | default(1) }} etcd member(s), but found {{ etcd_member_count | default(0) }} in namespace '{{ etcd_namespace | default('openshift-etcd') }}'.
  when: (etcd_member_count | int) < (etcd_min_members | default(1) | int)

- name: Initialize offending etcd members list
  set_fact:
    etcd_offending_members: []

- name: Filter offending etcd members against etcd_allow_list
  set_fact:
    etcd_offending_members: "{{ etcd_offending_members + [item] }}"
  loop: "{{ etcd_parsed_data.offenders | default([]) }}"
  when: item.name not in (etcd_allow_list | default([]))

# Optional operator-level condition query — oc get etcd
- name: Query etcd cluster operator conditions — oc get etcd
  shell: >-
    oc get etcd -o json --kubeconfig "{{ kubeconfig_path }}" | jq -r '
      .items[0].status.conditions // [] | {
        "degraded_conditions": [
          .[] | select((.type | contains("Degraded")) and .status == "True") | {
            "type": .type,
            "status": .status,
            "reason": (.reason // "Unknown"),
            "message": (.message // "No message")
          }
        ]
      }
    '
  register: etcd_operator_raw_query
  changed_when: false
  failed_when: false

- name: Parse etcd operator degraded conditions
  set_fact:
    etcd_operator_degraded: "{{ ((etcd_operator_raw_query.stdout | default('{}') | from_json).degraded_conditions | default([])) if (etcd_operator_raw_query.rc | default(1) == 0 and (etcd_operator_raw_query.stdout | default('') | trim != '')) else [] }}"

- name: Display etcd inspection summary
  debug:
    msg: >-
      Cluster '{{ cluster_name | default('UNKNOWN') }}': Scanned {{ etcd_all_members | length }} etcd member pod(s).
      Found {{ etcd_offending_members | length }} unhealthy member pod(s) and {{ etcd_operator_degraded | length }} degraded operator condition(s)
      (Allow-listed: {{ etcd_allow_list | default([]) | length }}).

- name: Enforce HARD gate on etcd member health
  fail:
    msg: >-
      etcd health check FAILED (HARD gate) on cluster '{{ cluster_name | default('UNKNOWN') }}'.
      {% if (etcd_offending_members | length) > 0 %}
      Found {{ etcd_offending_members | length }} unhealthy etcd member pod(s):
      {% for member in etcd_offending_members %}
        - {{ member.name }} on {{ member.node }}: Phase={{ member.phase | default('Unknown') }}, Ready={{ member.ready | default('Unknown') }}, Restarts={{ member.restart_count | default(0) }}
      {% endfor %}
      {% endif %}
      {% if (etcd_operator_degraded | length) > 0 %}
      Found {{ etcd_operator_degraded | length }} degraded etcd operator condition(s):
      {% for cond in etcd_operator_degraded %}
        - {{ cond.type }}: Status={{ cond.status }}, Reason={{ cond.reason }}, Message={{ cond.message }}
      {% endfor %}
      {% endif %}
      All etcd members must be Running, Ready=True, and non-degraded before upgrade operations can proceed.
  when: (etcd_offending_members | length) > 0 or (etcd_operator_degraded | length) > 0

- name: Record etcd PASS in health_summary
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [etcd_summary_entry] }}"
  vars:
    etcd_summary_entry:
      id: "{{ etcd_id | default('06') }}"
      name: "{{ etcd_name | default('etcd Member Health') }}"
      gate: "{{ etcd_gate | default('HARD') }}"
      status: "PASS"
      observed: "All {{ etcd_all_members | length }} etcd members are Running and Ready"
      details: "Verified {{ etcd_all_members | length }} etcd member pods in namespace {{ etcd_namespace | default('openshift-etcd') }} on cluster {{ cluster_name | default('cluster') }}"
      raw_output: "{{ etcd_all_members | to_json }}"

- name: Confirm etcd health passed
  debug:
    msg: >-
      ✔ PASS [Check {{ etcd_id | default('06') }} - {{ etcd_name | default('etcd Member Health') }}] —
      All {{ etcd_all_members | length }} etcd member pods are Running and Ready (0 degraded conditions).
