---
# ============================================================================
# Role Tasks: utilization (Node Capacity Headroom)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (shell, set_fact, fail, debug).
#                 Compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Calculates total cluster CPU and memory request allocations vs total
#          allocatable capacity to guarantee drain headroom during node upgrades.
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: HARD
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Query Node Allocatable Capacity via oc CLI & jq v1.5
# Why: oc get nodes -o json parsed with jq 1.5 extracts total allocatable CPU/memory.
# Why: Shell with set -o pipefail and args: executable: /bin/bash captures errors.
# Why: Unit conversions normalize CPU to millicores (m) and Memory to bytes.
# ----------------------------------------------------------------------------
- name: "Query live node allocatable capacity via jq"
  shell: |
    set -o pipefail
    oc get nodes -o json | jq -c '
      def parse_cpu:
        if . == null then 0
        elif (tostring | endswith("m")) then (tostring | sub("m$"; "") | tonumber)
        elif (tostring | endswith("u")) then (tostring | sub("u$"; "") | tonumber / 1000)
        elif (tostring | endswith("n")) then (tostring | sub("n$"; "") | tonumber / 1000000)
        else ((tostring | tonumber) * 1000) end;
      def parse_mem:
        if . == null then 0
        elif (tostring | endswith("Ki")) then ((tostring | sub("Ki$"; "") | tonumber) * 1024)
        elif (tostring | endswith("Mi")) then ((tostring | sub("Mi$"; "") | tonumber) * 1048576)
        elif (tostring | endswith("Gi")) then ((tostring | sub("Gi$"; "") | tonumber) * 1073741824)
        elif (tostring | endswith("Ti")) then ((tostring | sub("Ti$"; "") | tonumber) * 1099511627776)
        elif (tostring | endswith("Pi")) then ((tostring | sub("Pi$"; "") | tonumber) * 1125899906842624)
        elif (tostring | endswith("m")) then ((tostring | sub("m$"; "") | tonumber) / 1000)
        elif (tostring | endswith("k")) then ((tostring | sub("k$"; "") | tonumber) * 1000)
        elif (tostring | endswith("M")) then ((tostring | sub("M$"; "") | tonumber) * 1000000)
        elif (tostring | endswith("G")) then ((tostring | sub("G$"; "") | tonumber) * 1000000000)
        elif (tostring | endswith("T")) then ((tostring | sub("T$"; "") | tonumber) * 1000000000000)
        elif (tostring | endswith("P")) then ((tostring | sub("P$"; "") | tonumber) * 1000000000000000)
        else (tostring | tonumber) end;
      {
        total_cpu_allocatable_m: ([.items[]? | .status.allocatable.cpu | parse_cpu] | add // 0),
        total_mem_allocatable_b: ([.items[]? | .status.allocatable.memory | parse_mem] | add // 0),
        node_count: (.items // [] | length)
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: utilization_nodes_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: utilization_nodes_raw.rc == 0

# ----------------------------------------------------------------------------
# 2. Query Running Pods Resource Requests via oc CLI & jq v1.5
# Why: oc get pods -A --field-selector=status.phase=Running extracts workload requests.
# Why: Sums container requests to assess aggregate cluster demand.
# ----------------------------------------------------------------------------
- name: "Query running pods resource requests via jq"
  shell: |
    set -o pipefail
    oc get pods -A --field-selector=status.phase=Running -o json | jq -c '
      def parse_cpu:
        if . == null then 0
        elif (tostring | endswith("m")) then (tostring | sub("m$"; "") | tonumber)
        elif (tostring | endswith("u")) then (tostring | sub("u$"; "") | tonumber / 1000)
        elif (tostring | endswith("n")) then (tostring | sub("n$"; "") | tonumber / 1000000)
        else ((tostring | tonumber) * 1000) end;
      def parse_mem:
        if . == null then 0
        elif (tostring | endswith("Ki")) then ((tostring | sub("Ki$"; "") | tonumber) * 1024)
        elif (tostring | endswith("Mi")) then ((tostring | sub("Mi$"; "") | tonumber) * 1048576)
        elif (tostring | endswith("Gi")) then ((tostring | sub("Gi$"; "") | tonumber) * 1073741824)
        elif (tostring | endswith("Ti")) then ((tostring | sub("Ti$"; "") | tonumber) * 1099511627776)
        elif (tostring | endswith("Pi")) then ((tostring | sub("Pi$"; "") | tonumber) * 1125899906842624)
        elif (tostring | endswith("m")) then ((tostring | sub("m$"; "") | tonumber) / 1000)
        elif (tostring | endswith("k")) then ((tostring | sub("k$"; "") | tonumber) * 1000)
        elif (tostring | endswith("M")) then ((tostring | sub("M$"; "") | tonumber) * 1000000)
        elif (tostring | endswith("G")) then ((tostring | sub("G$"; "") | tonumber) * 1000000000)
        elif (tostring | endswith("T")) then ((tostring | sub("T$"; "") | tonumber) * 1000000000000)
        elif (tostring | endswith("P")) then ((tostring | sub("P$"; "") | tonumber) * 1000000000000000)
        else (tostring | tonumber) end;
      {
        total_cpu_requests_m: ([.items[]? | .spec.containers[]? | .resources.requests.cpu // null | parse_cpu] | add // 0),
        total_mem_requests_b: ([.items[]? | .spec.containers[]? | .resources.requests.memory // null | parse_mem] | add // 0),
        pod_count: (.items // [] | length)
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: utilization_pods_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: utilization_pods_raw.rc == 0

# ----------------------------------------------------------------------------
# 3. Extract Raw Metrics & Compute Percentages via jq v1.5
# Why: Bracket notation ['total_cpu_allocatable_m'] avoids dict.items() clash.
# Why: Uses custom def rnd2: . * 100 | floor / 100; compliant with jq 1.5.
# ----------------------------------------------------------------------------
- name: "Extract node allocatable and pod request facts"
  set_fact:
    utilization_node_count: "{{ (utilization_nodes_raw.stdout | default('{}') | from_json)['node_count'] | default(0) | int }}"
    utilization_nodes_cpu_m: "{{ (utilization_nodes_raw.stdout | default('{}') | from_json)['total_cpu_allocatable_m'] | default(0) }}"
    utilization_nodes_mem_b: "{{ (utilization_nodes_raw.stdout | default('{}') | from_json)['total_mem_allocatable_b'] | default(0) }}"
    utilization_pod_count: "{{ (utilization_pods_raw.stdout | default('{}') | from_json)['pod_count'] | default(0) | int }}"
    utilization_pods_cpu_m: "{{ (utilization_pods_raw.stdout | default('{}') | from_json)['total_cpu_requests_m'] | default(0) }}"
    utilization_pods_mem_b: "{{ (utilization_pods_raw.stdout | default('{}') | from_json)['total_mem_requests_b'] | default(0) }}"

- name: "Calculate utilization percentages using jq v1.5 rnd2 formulation"
  shell: |
    set -o pipefail
    jq -n \
      --argjson cpu_req "{{ utilization_pods_cpu_m }}" \
      --argjson cpu_alloc "{{ utilization_nodes_cpu_m }}" \
      --argjson mem_req "{{ utilization_pods_mem_b }}" \
      --argjson mem_alloc "{{ utilization_nodes_mem_b }}" '
      def rnd2: . * 100 | floor / 100;
      {
        cpu_percent: (if ($cpu_alloc > 0) then ((($cpu_req / $cpu_alloc) * 100) | rnd2) else 0 end),
        mem_percent: (if ($mem_alloc > 0) then ((($mem_req / $mem_alloc) * 100) | rnd2) else 0 end),
        cpu_req_cores: (($cpu_req / 1000) | rnd2),
        cpu_alloc_cores: (($cpu_alloc / 1000) | rnd2),
        mem_req_gib: ((($mem_req / 1073741824)) | rnd2),
        mem_alloc_gib: ((($mem_alloc / 1073741824)) | rnd2)
      }'
  args:
    executable: /bin/bash
  register: utilization_calc_raw
  changed_when: false

# ----------------------------------------------------------------------------
# 4. Evaluate Thresholds & Construct Health Record
# Why: HARD gate: if CPU or memory requests exceed thresholds, node draining risks deadlock.
# ----------------------------------------------------------------------------
- name: "Extract calculated utilization facts"
  set_fact:
    utilization_cpu_percent: "{{ (utilization_calc_raw.stdout | default('{}') | from_json)['cpu_percent'] | default(0.0) | float }}"
    utilization_mem_percent: "{{ (utilization_calc_raw.stdout | default('{}') | from_json)['mem_percent'] | default(0.0) | float }}"
    utilization_cpu_req_cores: "{{ (utilization_calc_raw.stdout | default('{}') | from_json)['cpu_req_cores'] | default(0.0) }}"
    utilization_cpu_alloc_cores: "{{ (utilization_calc_raw.stdout | default('{}') | from_json)['cpu_alloc_cores'] | default(0.0) }}"
    utilization_mem_req_gib: "{{ (utilization_calc_raw.stdout | default('{}') | from_json)['mem_req_gib'] | default(0.0) }}"
    utilization_mem_alloc_gib: "{{ (utilization_calc_raw.stdout | default('{}') | from_json)['mem_alloc_gib'] | default(0.0) }}"

- name: "Evaluate capacity headroom against thresholds"
  set_fact:
    utilization_cpu_exceeded: "{{ (utilization_cpu_percent | float) > (max_cpu_percent | default(90) | float) }}"
    utilization_mem_exceeded: "{{ (utilization_mem_percent | float) > (max_memory_percent | default(90) | float) }}"
    utilization_check_valid: >-
      {{ ((utilization_cpu_percent | float) <= (max_cpu_percent | default(90) | float)) and
         ((utilization_mem_percent | float) <= (max_memory_percent | default(90) | float)) }}

- name: "Construct structured utilization health record"
  set_fact:
    utilization_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "Cluster Resource Utilization Headroom"
      gate: "HARD"
      status: "{{ 'PASS' if (utilization_check_valid | bool) else 'FAIL' }}"
      observed: >-
        {{ ('CPU: ' ~ utilization_cpu_percent ~ '% (' ~ utilization_cpu_req_cores ~ '/' ~ utilization_cpu_alloc_cores ~ ' cores, max ' ~ max_cpu_percent ~ '%), Memory: ' ~ utilization_mem_percent ~ '% (' ~ utilization_mem_req_gib ~ '/' ~ utilization_mem_alloc_gib ~ ' GiB, max ' ~ max_memory_percent ~ '%) across ' ~ utilization_node_count ~ ' nodes and ' ~ utilization_pod_count ~ ' running pods')
           if (utilization_check_valid | bool)
           else ('Cluster capacity headroom exceeded: CPU: ' ~ utilization_cpu_percent ~ '% (max ' ~ max_cpu_percent ~ '%), Memory: ' ~ utilization_mem_percent ~ '% (max ' ~ max_memory_percent ~ '%)') }}

- name: "Record utilization result to health_summary tracking list"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [utilization_health_item] }}"

- name: "Log cluster utilization outcome"
  debug:
    msg:
      - "Check        : {{ utilization_health_item.name }}"
      - "Status       : {{ utilization_health_item.status }}"
      - "Observed     : {{ utilization_health_item.observed }}"
      - "Gate Enforced: {{ utilization_enforce_gate | default(true) | bool }}"

# ----------------------------------------------------------------------------
# 5. Enforce HARD Gate
# Why: Halts execution immediately if cluster CPU or memory request allocation exceeds 90%.
# ----------------------------------------------------------------------------
- name: "Enforce HARD gate for utilization check"
  fail:
    msg: "HARD GATE FAILURE [utilization]: Cluster resource utilization exceeds threshold on cluster '{{ cluster_name }}'. Observed CPU requests: {{ utilization_cpu_percent }}% (max: {{ max_cpu_percent }}%), Memory requests: {{ utilization_mem_percent }}% (max: {{ max_memory_percent }}%). High utilization endangers workload evacuation during node reboots."
  when:
    - not (utilization_check_valid | bool)
    - utilization_enforce_gate | default(true) | bool
