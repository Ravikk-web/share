---
# ============================================================================
# Role Defaults: utilization (Cluster Capacity & Headroom)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Defines default input parameters and capacity thresholds for the
#          utilization role, which validates aggregate CPU and memory allocations
#          to prevent node eviction deadlock during upgrade evacuation.
# Role / Playbook Dependencies: vars/upgrade.yml, vars/paths.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by utilization tasks
# ============================================================================

# Target ARO cluster name (string, mandatory)
# Sourced from vars/upgrade.yml or overridden via CLI --cluster
cluster_name: ""

# Maximum allowable cluster CPU request utilization percentage before failing (integer, 1-100, default: 90)
# Sourced from vars/upgrade.yml
max_cpu_percent: 90

# Maximum allowable cluster memory request utilization percentage before failing (integer, 1-100, default: 90)
# Sourced from vars/upgrade.yml
max_memory_percent: 90

# Master toggle for enforcing HARD gate failure on validation error (boolean, default: true)
# Sourced from role defaults or overridden by prevalidation scan during diagnostic sweeps
utilization_enforce_gate: true

# Maximum command retry attempts for transient API communication blips (integer, default: 3)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retries: 3

# Delay in seconds between command retry attempts (integer, default: 10)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retry_delay: 10
