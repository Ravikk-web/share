---
# ============================================================================
# Role Defaults: co (ClusterOperators)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Simple list, scalar, and boolean values.
#
# Purpose: Defines default input parameters for the co role, which validates
#          that all OpenShift core ClusterOperators report Available=True and
#          Degraded=False prior to upgrading.
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: HARD
# ============================================================================

# Target cluster identifier (string, required)
cluster_name: ""

# Optional allow-list of ClusterOperator names permitted to be degraded or
# unavailable (e.g. non-critical platform extensions or third-party add-ons).
# Default empty: all operators must be healthy.
co_allow_list: []

# Master toggle for enforcing HARD gate failure on validation error
# Set to false by prevalidation aggregator during diagnostic sweeps before remediation
co_enforce_gate: true

# Transient retry parameters for oc CLI execution
oc_command_retries: 3
oc_command_retry_delay: 10
