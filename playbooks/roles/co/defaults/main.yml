---
# ============================================================================
# Role Defaults: co (ClusterOperators)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Defines default input parameters for the co role, which validates
#          that all OpenShift core ClusterOperators report Available=True and
#          Degraded=False prior to upgrading.
# Role / Playbook Dependencies: vars/paths.yml, vars/upgrade.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by co tasks
# ============================================================================

# Target ARO cluster name (string, mandatory)
# Sourced from vars/upgrade.yml or overridden via CLI --cluster
cluster_name: ""

# Optional allow-list of ClusterOperator names permitted to be degraded or unavailable (list of strings, default: [])
# Sourced from vars/upgrade.yml or role defaults (default empty: all operators must be healthy)
co_allow_list: []

# Master toggle for enforcing HARD gate failure on validation error (boolean, default: true)
# Sourced from role defaults or overridden by prevalidation scan during diagnostic sweeps
co_enforce_gate: true
