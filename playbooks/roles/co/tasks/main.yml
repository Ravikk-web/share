---
# ============================================================================
# Role Tasks: co (ClusterOperators)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (shell, set_fact, fail, debug).
#                 Compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Ensures all OpenShift core platform operators are fully functional
#          prior to upgrade initiation (Available=True, Degraded=False).
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: HARD
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Query Live ClusterOperators via oc CLI & jq v1.5
# Why: oc get clusteroperators -o json parsed with jq 1.5 extracts status conditions.
# Why: shell with set -o pipefail and args: executable: /bin/bash guarantees error trapping.
# Why: Parentheses around // operands prevent jq 1.5 operator precedence errors.
# ----------------------------------------------------------------------------
- name: "Query live clusteroperators and parse condition status via jq"
  shell: |
    set -o pipefail
    oc get clusteroperators -o json | jq -c '
      {
        operators: [.items[] | {
          name: .metadata.name,
          version: (((.status.versions // []) | map(select(.name == "operator")) | .[0].version) // "unknown"),
          available: (((.status.conditions // []) | map(select(.type == "Available")) | .[0].status) // "False" | tostring),
          degraded: (((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "True" | tostring),
          progressing: (((.status.conditions // []) | map(select(.type == "Progressing")) | .[0].status) // "Unknown" | tostring),
          message: (((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].message) // "")
        }],
        degraded: [.items[] | select((((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "True" | tostring) == "True") | .metadata.name],
        unavailable: [.items[] | select((((.status.conditions // []) | map(select(.type == "Available")) | .[0].status) // "False" | tostring) != "True") | .metadata.name]
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: co_query_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: co_query_raw.rc == 0

# ----------------------------------------------------------------------------
# 2. Extract Operator Condition Facts & Apply Allow-List
# Why: Bracket notation ['operators'] avoids Jinja2 .items() dictionary method clash.
# Why: difference() filter excludes non-critical operators present in co_allow_list.
# ----------------------------------------------------------------------------
- name: "Extract cluster operator lists and apply allow-list exclusions"
  set_fact:
    co_all_operators: "{{ (co_query_raw.stdout | default('{}') | from_json)['operators'] | default([]) }}"
    co_degraded: "{{ ((co_query_raw.stdout | default('{}') | from_json)['degraded'] | default([])) | difference(co_allow_list | default([])) }}"
    co_unavailable: "{{ ((co_query_raw.stdout | default('{}') | from_json)['unavailable'] | default([])) | difference(co_allow_list | default([])) }}"

- name: "Identify combined list of offending cluster operators"
  set_fact:
    co_unhealthy_operators: "{{ (co_degraded + co_unavailable) | unique }}"
    co_check_valid: "{{ ((co_degraded + co_unavailable) | unique | length) == 0 }}"

# ----------------------------------------------------------------------------
# 3. Construct Structured Health Record & Append to Summary
# Why: Appends structured dictionary into health_summary for reporting.
# ----------------------------------------------------------------------------
- name: "Construct structured co health record"
  set_fact:
    co_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "ClusterOperators Health"
      gate: "HARD"
      status: "{{ 'PASS' if (co_check_valid | bool) else 'FAIL' }}"
      observed: >-
        {{ ('All ' ~ (co_all_operators | length) ~ ' ClusterOperators healthy (Available=True, Degraded=False)')
           if (co_check_valid | bool)
           else ('Offending operators: degraded=[' ~ (co_degraded | join(', ')) ~ '], unavailable=[' ~ (co_unavailable | join(', ')) ~ ']') }}

- name: "Record co result to health_summary tracking list"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [co_health_item] }}"

- name: "Log ClusterOperator evaluation outcome"
  debug:
    msg:
      - "Check        : {{ co_health_item.name }}"
      - "Status       : {{ co_health_item.status }}"
      - "Observed     : {{ co_health_item.observed }}"
      - "Gate Enforced: {{ co_enforce_gate | default(true) | bool }}"

# ----------------------------------------------------------------------------
# 4. Enforce HARD Gate
# Why: Halts execution immediately if any core ClusterOperator is degraded/unavailable.
# ----------------------------------------------------------------------------
- name: "Enforce HARD gate for ClusterOperators check"
  fail:
    msg: "HARD GATE FAILURE [co]: One or more ClusterOperators are degraded or unavailable on cluster '{{ cluster_name }}'. Degraded: {{ co_degraded | to_json }}, Unavailable: {{ co_unavailable | to_json }}."
  when:
    - not (co_check_valid | bool)
    - co_enforce_gate | default(true) | bool
