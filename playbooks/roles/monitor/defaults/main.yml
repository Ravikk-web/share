---
# ============================================================================
# Role Defaults: monitor (Live Upgrade Monitoring & Settle-Gate)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Default configuration parameters for the monitor role, which provides
#          bounded polling loops, progress percentage calculations, 20-minute
#          heartbeat emails, Tier 2 stalled node auto-remediation, and settle-gate
#          verification during an active cluster upgrade hop.
# Role / Playbook Dependencies: vars/upgrade.yml, vars/smtp.yml, vars/paths.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by monitor tasks
# ============================================================================

# Target ARO cluster name (string, mandatory)
# Sourced from vars/upgrade.yml or overridden via CLI --cluster
cluster_name: ""

# Polling cadence in minutes between cluster status evaluation passes (integer, default: 2)
# Sourced from vars/upgrade.yml
poll_interval_minutes: 2

# Maximum allowable duration in minutes before declaring hop timeout gate failure (integer, default: 90)
# Sourced from vars/upgrade.yml
hop_timeout_minutes: 90

# Periodic cadence in minutes for dispatching progress heartbeat emails (integer, default: 20)
# Sourced from vars/upgrade.yml
heartbeat_minutes: 20

# Master toggle for Tier 2 automated recovery on stalled node rollouts (boolean, default: false)
# Sourced from vars/upgrade.yml (guided opt-in; creates force file via oc debug node)
auto_force_stalled_node: false

# Duration in minutes an active updating node can remain stalled before force recovery (integer, default: 30)
# Sourced from vars/upgrade.yml
node_stall_threshold_minutes: 30

# Master toggle for enforcing HARD gate failure on monitoring timeout (boolean, default: true)
# Sourced from role defaults
monitor_enforce_gate: true

# Dry-run execution toggle (boolean, default: false)
# Sourced from CLI flag -d/--dry-run
dry_run: false

# Maximum command retry attempts for transient API communication blips (integer, default: 3)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retries: 3

# Delay in seconds between command retry attempts (integer, default: 10)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retry_delay: 10

# Allow-list of ClusterOperator names permitted to be degraded or progressing during settle-gate (list of strings, default: [])
# Sourced from vars/upgrade.yml
co_allow_list: []

# Email subject prefix for live upgrade heartbeat notifications (string, default: "[ARO Upgrade]")
# Sourced from vars/smtp.yml
heartbeat_subject_prefix: "[ARO Upgrade]"

# Recipient list for live upgrade heartbeat progress notifications (list of strings, default: [])
# Sourced from vars/smtp.yml or overridden via CLI --mail-to
mail_to: []

# Target version string for the active upgrade hop (string, default: "")
# Sourced from tasks/hop.yml
hop_target_version: ""

# Sequential hop index number (integer, default: 1)
# Sourced from tasks/hop.yml
hop_number: 1

# Total number of hops in the current upgrade journey (integer, default: 1)
# Sourced from tasks/hop.yml
hop_total: 1

# Human-readable hop identifier label (string, default: "1/1")
# Sourced from tasks/hop.yml
hop_label: "1/1"
