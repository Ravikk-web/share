---
# ============================================================================
# Role Tasks: monitor / poll_iteration.yml — Single Polling Iteration
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses standard shell, set_fact, debug, include_role, pause;
#                 compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Executes a single status poll during live upgrade monitoring:
#          1. Checks if cluster already settled; skips iteration if hop_settled is true.
#          2. Computes elapsed duration from start of monitoring.
#          3. Queries live ClusterVersion, MachineConfigPools, ClusterOperators, and Nodes.
#          4. Calculates rollout progress percentage across control plane and worker MCPs.
#          5. Detects cluster state changes vs previous poll.
#          6. Dispatches immediate notification email on state change or 20-min heartbeat.
#          7. Detects stalled nodes and optionally executes Tier 2 MCD force recovery.
#          8. Evaluates settle-gate conditions (CV at target, COs healthy, MCPs updated).
#          9. Pauses for poll_interval_minutes if cluster is not yet settled.
# Dependencies: playbooks/vars/upgrade.yml, roles/sendmail
# Gate type: HARD (timeout guard and settle-gate evaluated in tasks/main.yml)
# ============================================================================

- name: "Monitor: Execute Poll Iteration {{ poll_iteration_idx }} of {{ monitor_max_iterations }} for Hop {{ resolved_hop_label }}"
  block:
    # ------------------------------------------------------------------------
    # 1. Update Iteration Tracker
    # ------------------------------------------------------------------------
    - name: "Poll Iteration: Update completed iteration count"
      set_fact:
        monitor_iterations_completed: "{{ poll_iteration_idx }}"

    # ------------------------------------------------------------------------
    # 2. Dry-Run Mode Simulation
    # Why: In dry-run mode, immediately mark hop as settled with realistic mock
    #      data without sleeping for 90 minutes.
    # ------------------------------------------------------------------------
    - name: "Poll Iteration (Dry-Run): Simulate cluster settle state"
      set_fact:
        hop_settled: true
        poll_cv_version: "{{ resolved_target_version }}"
        poll_cv_history_state: "Completed"
        poll_cv_available: "True"
        poll_cv_progressing: "False"
        poll_cv_degraded: "False"
        poll_co_degraded_list: []
        poll_co_progressing_list: []
        poll_co_unavailable_list: []
        poll_mcp_degraded_list: []
        poll_mcp_updating_list: []
        poll_mcp_not_updated_list: []
        current_percent_complete: 100
        elapsed_formatted: "00:02:00"
        poll_mcp_status_list:
          - name: "master"
            ready_count: 3
            total_count: 3
            updated: "True"
            updating: "False"
            degraded: "False"
          - name: "worker"
            ready_count: 6
            total_count: 6
            updated: "True"
            updating: "False"
            degraded: "False"
        poll_active_nodes: []
        poll_degraded_nodes: []
      when: dry_run | default(false) | bool

    - name: "Poll Iteration (Dry-Run): Log simulated monitoring status"
      debug:
        msg: "[DRY-RUN] Simulating live monitoring: Hop {{ resolved_hop_label }} (Target: {{ resolved_target_version }}) settled immediately."
      when: dry_run | default(false) | bool

    # ------------------------------------------------------------------------
    # 3. Live Cluster Polling Queries (Non Dry-Run)
    # ------------------------------------------------------------------------
    - name: "Poll Iteration: Calculate polling timestamp and elapsed duration"
      set_fact:
        current_epoch: "{{ ansible_date_time.epoch if (ansible_date_time is defined and ansible_date_time.epoch is defined) else lookup('pipe', 'date +%s') }}"
      when: not (dry_run | default(false) | bool)

    - name: "Poll Iteration: Format elapsed duration string"
      set_fact:
        elapsed_seconds: "{{ (current_epoch | int) - (monitor_start_epoch | int) }}"
        elapsed_minutes: "{{ ((current_epoch | int) - (monitor_start_epoch | int)) // 60 }}"
        elapsed_hours: "{{ (((current_epoch | int) - (monitor_start_epoch | int)) // 60) // 60 }}"
      when: not (dry_run | default(false) | bool)

    - name: "Poll Iteration: Set formatted elapsed duration fact"
      set_fact:
        elapsed_formatted: "{{ '%02d' | format(elapsed_hours | int) }}:{{ '%02d' | format((elapsed_minutes | int) % 60) }}:{{ '%02d' | format((elapsed_seconds | int) % 60) }}"
      when: not (dry_run | default(false) | bool)

    # 3a. ClusterVersion live query
    - name: "Poll Iteration: Query ClusterVersion live status"
      shell: |
        set -o pipefail
        oc get clusterversion version -o json | jq -r '
          {
            current_version: (.status.history[0]?.version // ""),
            history_state: (.status.history[0]?.state // ""),
            available: ([.status.conditions[]? | select(.type=="Available") | .status // "False"] | first // "False"),
            progressing: ([.status.conditions[]? | select(.type=="Progressing") | .status // "False"] | first // "False"),
            degraded: ([.status.conditions[]? | select((.type=="Failing") or (.type=="Degraded")) | .status // "False"] | first // "False"),
            message: ([.status.conditions[]? | select(.type=="Progressing") | .message // ""] | first // "")
          } | tojson
        '
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: poll_cv_raw
      changed_when: false
      retries: "{{ oc_command_retries | default(3) }}"
      delay: "{{ oc_command_retry_delay | default(10) }}"
      until: poll_cv_raw.rc == 0
      when: not (dry_run | default(false) | bool)

    # 3b. MachineConfigPool live query
    - name: "Poll Iteration: Query MachineConfigPool live rollout status"
      shell: |
        set -o pipefail
        oc get mcp -o json | jq -r '
          {
            pool_list: [.items[]? | {
              name: .metadata.name,
              ready_count: (.status.readyMachineCount // 0),
              total_count: (.status.machineCount // 0),
              updated_count: (.status.updatedMachineCount // 0),
              updating_count: (.status.updatingMachineCount // 0),
              degraded_count: (.status.degradedMachineCount // 0),
              updated: ([.status.conditions[]? | select(.type=="Updated") | .status // "False"] | first // "False"),
              updating: ([.status.conditions[]? | select(.type=="Updating") | .status // "False"] | first // "False"),
              degraded: ([.status.conditions[]? | select(.type=="Degraded") | .status // "False"] | first // "False"),
              paused: (.spec.paused // false)
            }],
            total_machines: ([.items[]?.status.machineCount // 0] | add // 0),
            total_updated: ([.items[]?.status.updatedMachineCount // 0] | add // 0),
            total_updating: ([.items[]?.status.updatingMachineCount // 0] | add // 0),
            total_degraded: ([.items[]?.status.degradedMachineCount // 0] | add // 0),
            degraded_pools: [.items[]? | select((.status.conditions[]? | select(.type=="Degraded") | .status // "False") == "True") | .metadata.name],
            updating_pools: [.items[]? | select((.status.conditions[]? | select(.type=="Updating") | .status // "False") == "True") | .metadata.name],
            not_updated_pools: [.items[]? | select((.status.conditions[]? | select(.type=="Updated") | .status // "False") != "True") | .metadata.name]
          } | tojson
        '
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: poll_mcp_raw
      changed_when: false
      retries: "{{ oc_command_retries | default(3) }}"
      delay: "{{ oc_command_retry_delay | default(10) }}"
      until: poll_mcp_raw.rc == 0
      when: not (dry_run | default(false) | bool)

    # 3c. ClusterOperators live query
    - name: "Poll Iteration: Query ClusterOperators live condition status"
      shell: |
        set -o pipefail
        oc get clusteroperators -o json | jq -r --argjson allow '{{ co_allow_list | default([]) | to_json }}' '
          {
            degraded: ([.items[]? | select((.status.conditions[]? | select(.type=="Degraded") | .status // "False") == "True") | .metadata.name] - $allow),
            progressing: ([.items[]? | select((.status.conditions[]? | select(.type=="Progressing") | .status // "False") == "True") | .metadata.name] - $allow),
            unavailable: ([.items[]? | select((.status.conditions[]? | select(.type=="Available") | .status // "False") != "True") | .metadata.name] - $allow)
          } | tojson
        '
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: poll_co_raw
      changed_when: false
      retries: "{{ oc_command_retries | default(3) }}"
      delay: "{{ oc_command_retry_delay | default(10) }}"
      until: poll_co_raw.rc == 0
      when: not (dry_run | default(false) | bool)

    # 3d. Nodes live query (Actively updating & degraded nodes)
    - name: "Poll Iteration: Query Nodes live status and active updates"
      shell: |
        set -o pipefail
        oc get nodes -o json | jq -r '
          {
            active_nodes: [.items[]? | select(
              ((.spec.unschedulable // false) == true) or
              ((.metadata.annotations["machineconfiguration.openshift.io/state"] // "") == "Working") or
              ((([.status.conditions[]? | select(.type=="Ready") | .status // "True"] | first // "True")) != "True")
            ) | {
              name: .metadata.name,
              role: ((([.metadata.labels // {} | to_entries[]? | select(.key | startswith("node-role.kubernetes.io/")) | .key | split("/")[1]] | first) // "worker")),
              action: (
                if ((([.status.conditions[]? | select(.type=="Ready") | .status // "True"] | first // "True")) != "True") then "Rebooting"
                elif ((.spec.unschedulable // false) == true) then "Draining / Updating"
                else "Applying Config" end
              )
            }],
            degraded_nodes: [.items[]? | select(
              ((([.status.conditions[]? | select(.type=="Ready") | .status // "True"] | first // "True")) != "True") or
              ((([.status.conditions[]? | select(.type=="DiskPressure") | .status // "False"] | first // "False")) == "True") or
              ((([.status.conditions[]? | select(.type=="MemoryPressure") | .status // "False"] | first // "False")) == "True") or
              ((([.status.conditions[]? | select(.type=="PIDPressure") | .status // "False"] | first // "False")) == "True")
            ) | {
              name: .metadata.name,
              role: ((([.metadata.labels // {} | to_entries[]? | select(.key | startswith("node-role.kubernetes.io/")) | .key | split("/")[1]] | first) // "worker")),
              condition: (
                if ((([.status.conditions[]? | select(.type=="Ready") | .status // "True"] | first // "True")) != "True") then "NotReady"
                elif ((([.status.conditions[]? | select(.type=="DiskPressure") | .status // "False"] | first // "False")) == "True") then "DiskPressure"
                elif ((([.status.conditions[]? | select(.type=="MemoryPressure") | .status // "False"] | first // "False")) == "True") then "MemoryPressure"
                else "PIDPressure" end
              ),
              message: (
                [.status.conditions[]? | select(
                  ((.type=="Ready") and (.status!="True")) or
                  (((.type=="DiskPressure") or (.type=="MemoryPressure") or (.type=="PIDPressure")) and (.status=="True"))
                ) | .message // "Condition degraded"] | first // "Degraded"
              )
            }]
          } | tojson
        '
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: poll_nodes_raw
      changed_when: false
      retries: "{{ oc_command_retries | default(3) }}"
      delay: "{{ oc_command_retry_delay | default(10) }}"
      until: poll_nodes_raw.rc == 0
      when: not (dry_run | default(false) | bool)

    # ------------------------------------------------------------------------
    # 4. Parse Live Status Facts
    # ------------------------------------------------------------------------
    - name: "Poll Iteration: Parse live cluster status facts"
      set_fact:
        poll_cv_version: "{{ (poll_cv_raw.stdout | from_json).current_version | string | trim }}"
        poll_cv_history_state: "{{ (poll_cv_raw.stdout | from_json).history_state | string | trim }}"
        poll_cv_available: "{{ (poll_cv_raw.stdout | from_json).available | string | trim }}"
        poll_cv_progressing: "{{ (poll_cv_raw.stdout | from_json).progressing | string | trim }}"
        poll_cv_degraded: "{{ (poll_cv_raw.stdout | from_json).degraded | string | trim }}"
        poll_cv_message: "{{ (poll_cv_raw.stdout | from_json).message | string | trim }}"
        poll_mcp_status_list: "{{ (poll_mcp_raw.stdout | from_json).pool_list | default([]) }}"
        poll_mcp_total_machines: "{{ (poll_mcp_raw.stdout | from_json).total_machines | default(0) | int }}"
        poll_mcp_total_updated: "{{ (poll_mcp_raw.stdout | from_json).total_updated | default(0) | int }}"
        poll_mcp_total_updating: "{{ (poll_mcp_raw.stdout | from_json).total_updating | default(0) | int }}"
        poll_mcp_total_degraded: "{{ (poll_mcp_raw.stdout | from_json).total_degraded | default(0) | int }}"
        poll_mcp_degraded_list: "{{ (poll_mcp_raw.stdout | from_json).degraded_pools | default([]) }}"
        poll_mcp_updating_list: "{{ (poll_mcp_raw.stdout | from_json).updating_pools | default([]) }}"
        poll_mcp_not_updated_list: "{{ (poll_mcp_raw.stdout | from_json).not_updated_pools | default([]) }}"
        poll_co_degraded_list: "{{ (poll_co_raw.stdout | from_json).degraded | default([]) }}"
        poll_co_progressing_list: "{{ (poll_co_raw.stdout | from_json).progressing | default([]) }}"
        poll_co_unavailable_list: "{{ (poll_co_raw.stdout | from_json).unavailable | default([]) }}"
        poll_active_nodes: "{{ (poll_nodes_raw.stdout | from_json).active_nodes | default([]) }}"
        poll_degraded_nodes: "{{ (poll_nodes_raw.stdout | from_json).degraded_nodes | default([]) }}"
      when: not (dry_run | default(false) | bool)

    # ------------------------------------------------------------------------
    # 5. Calculate Rollout Progress Percentage
    # Why: Provides a representative 0-100% progress indicator for terminal and emails.
    #      Control plane upgrade accounts for ~50%, and worker MCP rollout for ~50%.
    # ------------------------------------------------------------------------
    - name: "Poll Iteration: Calculate machine rollout percentage"
      set_fact:
        poll_mcp_pct: >-
          {{ ((poll_mcp_total_updated | int) * 100 // (poll_mcp_total_machines | int))
             if ((poll_mcp_total_machines | default(0) | int) > 0)
             else 0 }}
      when: not (dry_run | default(false) | bool)

    - name: "Poll Iteration: Calculate aggregate rollout progress percentage"
      set_fact:
        current_percent_complete: >-
          {{ [100, (50 + ((poll_mcp_pct | int) // 2))] | min
             if ((poll_cv_version == resolved_target_version) and (poll_cv_progressing != 'True'))
             else [5, [90, ((poll_mcp_pct | int) // 2)] | min] | max }}
      when: not (dry_run | default(false) | bool)

    # ------------------------------------------------------------------------
    # 6. Detect State Changes vs Previous Poll
    # Why: State change (e.g. node enters update/reboot, MCP reports degraded,
    #      active node switches) triggers an immediate notification email.
    # ------------------------------------------------------------------------
    - name: "Poll Iteration: Compute current cluster state signature"
      set_fact:
        current_state_signature: >-
          {{ poll_cv_progressing | default('False') }}_{{ poll_cv_version | default('') }}_{{ poll_mcp_updating_list | default([]) | join(',') }}_{{ poll_mcp_degraded_list | default([]) | join(',') }}_{{ poll_active_nodes | default([]) | map(attribute='name') | sort | join(',') }}_{{ poll_degraded_nodes | default([]) | map(attribute='name') | sort | join(',') }}
      when: not (dry_run | default(false) | bool)

    - name: "Poll Iteration: Evaluate state change and heartbeat triggers"
      set_fact:
        state_changed: >-
          {{ (previous_state_signature | default('') | length > 0) and
             (current_state_signature != previous_state_signature) }}
        heartbeat_due: >-
          {{ (((current_epoch | int) - (last_heartbeat_epoch | int)) >= ((heartbeat_minutes | default(20) | int) * 60)) or
             (poll_iteration_idx == 1) }}
      when: not (dry_run | default(false) | bool)

    # ------------------------------------------------------------------------
    # 7. Dispatch Notification Email (State Change or Heartbeat)
    # ------------------------------------------------------------------------
    - name: "Poll Iteration: Pre-compute notification parameters"
      set_fact:
        mail_template: "progress-mail.j2"
        mail_subject: >-
          {{ (heartbeat_subject_prefix | default('[ARO Upgrade]')) ~ ' ' ~ cluster_name ~ ' Hop ' ~ resolved_hop_label ~ ' State Change: ' ~ resolved_target_version ~ ' (' ~ current_percent_complete ~ '%)'
             if (state_changed | bool)
             else ((heartbeat_subject_prefix | default('[ARO Upgrade]')) ~ ' ' ~ cluster_name ~ ' Hop ' ~ resolved_hop_label ~ ' Heartbeat: ' ~ resolved_target_version ~ ' (' ~ current_percent_complete ~ '%)') }}
        mail_to: "{{ mail_to | default(['platform-team@example.com']) }}"
        is_hop_complete: false
        current_hop: "{{ resolved_hop_number }}"
        total_hops: "{{ resolved_hop_total }}"
        target_version: "{{ resolved_target_version }}"
        elapsed_time: "{{ elapsed_formatted }}"
        percent_complete: "{{ current_percent_complete }}"
        mcp_status_list: "{{ poll_mcp_status_list }}"
        active_nodes: "{{ poll_active_nodes }}"
        degraded_nodes: "{{ poll_degraded_nodes }}"
        poll_interval: "{{ poll_interval_minutes | default(2) }}m"
        heartbeat_cadence: "{{ heartbeat_minutes | default(20) }}m"
        mail_attachments: []
      when:
        - not (dry_run | default(false) | bool)
        - (state_changed | bool) or (heartbeat_due | bool)

    - name: "Poll Iteration: Dispatch progress notification email via sendmail role"
      include_role:
        name: sendmail
      when:
        - not (dry_run | default(false) | bool)
        - (state_changed | bool) or (heartbeat_due | bool)
        - (mail_to | default([]) | length) > 0

    - name: "Poll Iteration: Update heartbeat and signature tracking facts"
      set_fact:
        last_heartbeat_epoch: "{{ current_epoch if (heartbeat_due | bool) else last_heartbeat_epoch }}"
        previous_state_signature: "{{ current_state_signature }}"
      when: not (dry_run | default(false) | bool)

    # ------------------------------------------------------------------------
    # 8. Node Stall Detection & Tier 2 Auto-Remediation
    # Why: If a single node remains in updating state exceeding node_stall_threshold_minutes
    #      and auto_force_stalled_node is enabled, touch /run/machine-config-daemon-force.
    # ------------------------------------------------------------------------
    - name: "Poll Iteration: Evaluate active node stall condition"
      set_fact:
        current_active_node_name: "{{ poll_active_nodes[0].name if (poll_active_nodes | default([]) | length == 1) else '' }}"
      when: not (dry_run | default(false) | bool)

    - name: "Poll Iteration: Track single active node duration"
      set_fact:
        stalled_tracking_node: "{{ current_active_node_name }}"
        stalled_tracking_start_epoch: >-
          {{ stalled_tracking_start_epoch
             if (current_active_node_name | length > 0 and stalled_tracking_node == current_active_node_name)
             else current_epoch }}
        stalled_node_force_attempted: >-
          {{ stalled_node_force_attempted
             if (current_active_node_name | length > 0 and stalled_tracking_node == current_active_node_name)
             else false }}
      when: not (dry_run | default(false) | bool)

    - name: "Poll Iteration: Calculate active node stall duration"
      set_fact:
        active_node_stall_seconds: "{{ (current_epoch | int) - (stalled_tracking_start_epoch | int) }}"
      when:
        - not (dry_run | default(false) | bool)
        - current_active_node_name | length > 0

    # Auto-remediation action on stalled node
    - name: "Auto-Remediation (Tier 2): Force MCD progress on stalled node {{ stalled_tracking_node }}"
      shell: |
        set -o pipefail
        oc debug "node/{{ stalled_tracking_node }}" -- chroot /host touch /run/machine-config-daemon-force
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: mcd_force_raw
      changed_when: true
      failed_when: false
      when:
        - not (dry_run | default(false) | bool)
        - auto_force_stalled_node | default(false) | bool
        - not (stalled_node_force_attempted | default(false) | bool)
        - current_active_node_name | length > 0
        - (active_node_stall_seconds | default(0) | int) >= ((node_stall_threshold_minutes | default(30) | int) * 60)

    - name: "Auto-Remediation (Tier 2): Mark MCD force attempt completed"
      set_fact:
        stalled_node_force_attempted: true
      when:
        - not (dry_run | default(false) | bool)
        - auto_force_stalled_node | default(false) | bool
        - not (stalled_node_force_attempted | default(false) | bool)
        - current_active_node_name | length > 0
        - (active_node_stall_seconds | default(0) | int) >= ((node_stall_threshold_minutes | default(30) | int) * 60)

    - name: "Auto-Remediation (Tier 2): Log MCD force action to console"
      debug:
        msg: "[AUTO-FIX] Stalled node '{{ stalled_tracking_node }}' exceeded {{ node_stall_threshold_minutes }}m updating. Executed MCD force trigger."
      when:
        - not (dry_run | default(false) | bool)
        - mcd_force_raw is defined
        - mcd_force_raw.changed | default(false) | bool

    - name: "Auto-Remediation (Tier 2): Log MCD force action to text run log"
      lineinfile:
        path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
        line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [AUTO-FIX] Phase 04: Node '{{ stalled_tracking_node }}' stalled >{{ node_stall_threshold_minutes }}m. Applied /run/machine-config-daemon-force."
        create: true
      when:
        - not (dry_run | default(false) | bool)
        - mcd_force_raw is defined
        - mcd_force_raw.changed | default(false) | bool

    - name: "Auto-Remediation (Tier 2): Log MCD force action to CSV audit log"
      lineinfile:
        path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
        line: '"{{ lookup(''pipe'', ''date +%Y-%m-%dT%H:%M:%S'') }}","{{ cluster_name }}","Phase 04 MCD Force Stalled Node","AUTO-FIXED","APPLIED","Node: {{ stalled_tracking_node }}","Exceeded {{ node_stall_threshold_minutes }}m updating threshold"'
        create: true
      when:
        - not (dry_run | default(false) | bool)
        - mcd_force_raw is defined
        - mcd_force_raw.changed | default(false) | bool

    # ------------------------------------------------------------------------
    # 9. Evaluate Settle-Gate Conditions
    # Why: Cluster is settled when ClusterVersion is at target with Available=True,
    #      Progressing=False, and history Completed; all ClusterOperators are healthy;
    #      and all MachineConfigPools are Updated=True, Updating=False, Degraded=False.
    # ------------------------------------------------------------------------
    - name: "Poll Iteration: Evaluate live settle-gate conditions"
      set_fact:
        hop_settled: >-
          {{ ((poll_cv_version == resolved_target_version) and
              ((poll_cv_available | bool)) and
              (not (poll_cv_progressing | bool)) and
              (not (poll_cv_degraded | bool)) and
              ((poll_cv_history_state == 'Completed') or (poll_cv_history_state | length == 0)) and
              ((poll_co_degraded_list | length) == 0) and
              ((poll_co_progressing_list | length) == 0) and
              ((poll_co_unavailable_list | length) == 0) and
              ((poll_mcp_degraded_list | length) == 0) and
              ((poll_mcp_updating_list | length) == 0) and
              ((poll_mcp_not_updated_list | length) == 0)) }}
      when: not (dry_run | default(false) | bool)

    - name: "Poll Iteration: Update progress percentage to 100% on settle"
      set_fact:
        current_percent_complete: 100
      when:
        - not (dry_run | default(false) | bool)
        - hop_settled | bool

    # ------------------------------------------------------------------------
    # 10. Iteration Status Summary & Cadence Pause
    # ------------------------------------------------------------------------
    - name: "Poll Iteration: Display polling status row"
      debug:
        msg: >-
          [POLL {{ '%02d' | format(poll_iteration_idx | int) }}/{{ monitor_max_iterations }}]
          Elapsed: {{ elapsed_formatted }} | Progress: {{ current_percent_complete }}% |
          CV: {{ poll_cv_version }} (Prog: {{ poll_cv_progressing }}, Avail: {{ poll_cv_available }}) |
          Updating MCPs: {{ poll_mcp_updating_list | length }} | Degraded MCPs: {{ poll_mcp_degraded_list | length }} |
          Active Nodes: {{ poll_active_nodes | length }}{% if poll_active_nodes | length > 0 %} ({{ poll_active_nodes | map(attribute='name') | join(', ') }}){% endif %} |
          Settled: {{ hop_settled | bool }}

    - name: "Poll Iteration: Sleep before next status poll"
      pause:
        seconds: "{{ (poll_interval_minutes | default(2) | int) * 60 }}"
      when:
        - not (dry_run | default(false) | bool)
        - not (hop_settled | default(false) | bool)

  # Only execute this poll iteration if the cluster has not already settled
  when: not (hop_settled | default(false) | bool)
