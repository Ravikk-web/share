---
# ============================================================================
# Role Tasks: monitor
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses standard assert, set_fact, debug, include_tasks, fail, lineinfile;
#                 compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Master driver for the live upgrade monitoring lifecycle:
#          1. Validates target version and hop metadata inputs.
#          2. Initializes tracking metrics (start epoch, iteration index, state signature).
#          3. Displays monitoring initiation banner and logs to text run log.
#          4. Drives bounded polling loop (2-minute intervals, 90-minute timeout guard)
#             via dynamic include_tasks over range(1, max_iterations).
#          5. Enforces HARD timeout guard if loop terminates without cluster settling.
#          6. Strictly verifies settle-gate contract (CV at target, COs healthy, MCPs updated).
#          7. Exports duration and settle facts for downstream hop completion notifications.
# Dependencies: playbooks/vars/upgrade.yml, playbooks/vars/smtp.yml,
#               roles/monitor/tasks/poll_iteration.yml, roles/sendmail
# Gate type: HARD (strictly gates on timeout guard and settle contract)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Parameter Validation & Monitoring State Initialization
# Why: Pre-computes normalized facts to avoid Jinja2 lazy-evaluation loops,
#      asserts required target version, and sets initial tracking epochs.
# ----------------------------------------------------------------------------
- name: "Monitor: Resolve and normalize target hop parameters"
  set_fact:
    resolved_target_version: "{{ hop_target_version | default(target_version | default('')) }}"
    resolved_hop_label: "{{ hop_label | default('1/1') }}"
    resolved_hop_number: "{{ hop_number | default(1) }}"
    resolved_hop_total: "{{ hop_total | default(1) }}"
    monitor_poll_interval: "{{ poll_interval_minutes | default(2) | int }}"
    monitor_timeout_limit: "{{ hop_timeout_minutes | default(90) | int }}"
    monitor_heartbeat_cadence: "{{ heartbeat_minutes | default(20) | int }}"

- name: "Monitor: Validate target version input parameter"
  assert:
    that:
      - resolved_target_version is defined
      - resolved_target_version | length > 0
    fail_msg: "[HARD GATE FAILURE] monitor role requires a non-empty 'hop_target_version' or 'target_version'."
    success_msg: "Monitor target version validated: {{ resolved_target_version }}"

- name: "Monitor: Compute loop bounds and initialize state tracking metrics"
  set_fact:
    monitor_max_iterations: >-
      {{ (((monitor_timeout_limit | int) + (monitor_poll_interval | int) - 1) // (monitor_poll_interval | int)) | int }}
    monitor_start_epoch: "{{ ansible_date_time.epoch if (ansible_date_time is defined and ansible_date_time.epoch is defined) else lookup('pipe', 'date +%s') }}"
    last_heartbeat_epoch: "{{ ansible_date_time.epoch if (ansible_date_time is defined and ansible_date_time.epoch is defined) else lookup('pipe', 'date +%s') }}"
    stalled_tracking_start_epoch: "{{ ansible_date_time.epoch if (ansible_date_time is defined and ansible_date_time.epoch is defined) else lookup('pipe', 'date +%s') }}"
    previous_state_signature: ""
    hop_settled: false
    stalled_tracking_node: ""
    stalled_node_force_attempted: false
    monitor_iterations_completed: 0

- name: "Monitor: Display Live Monitoring Initiation Banner"
  debug:
    msg:
      - "============================================================================"
      - "PHASE 04: LIVE UPGRADE MONITORING INITIATED"
      - "============================================================================"
      - "Target Cluster       : {{ cluster_name }}"
      - "Target Version       : {{ resolved_target_version }}"
      - "Hop Identifier       : {{ resolved_hop_label }} (Hop {{ resolved_hop_number }} of {{ resolved_hop_total }})"
      - "Polling Cadence      : Every {{ monitor_poll_interval }} minutes"
      - "Heartbeat Cadence    : Every {{ monitor_heartbeat_cadence }} minutes"
      - "Hop Timeout Guard    : {{ monitor_timeout_limit }} minutes (Max {{ monitor_max_iterations }} poll iterations)"
      - "Auto-Force Stalled   : {{ auto_force_stalled_node | default(false) | bool }} (Threshold: {{ node_stall_threshold_minutes | default(30) }}m)"
      - "============================================================================"

- name: "Monitor: Log monitoring start to text run log"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
    line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [INFO] [HARD] Phase 04: Live monitoring tracking Hop {{ resolved_hop_label }} (Target: {{ resolved_target_version }}). Timeout guard: {{ monitor_timeout_limit }}m ({{ monitor_max_iterations }} iterations)."
    create: true
  when: not (dry_run | default(false) | bool)

# ----------------------------------------------------------------------------
# 2. Bounded Polling Loop Execution
# Why: Executes poll_iteration.yml per iteration up to monitor_max_iterations.
#      Skipping logic inside poll_iteration.yml ensures that as soon as hop_settled
#      becomes true, remaining iterations terminate without delay.
# ----------------------------------------------------------------------------
- name: "Monitor: Execute bounded live upgrade polling loop"
  include_tasks: poll_iteration.yml
  loop: "{{ range(1, (monitor_max_iterations | int) + 1) | list }}"
  loop_control:
    loop_var: poll_iteration_idx

# ----------------------------------------------------------------------------
# 3. Timeout Guard & Settle-Gate Contract Enforcement
# Why: If the loop finishes without achieving settled state, the upgrade hop has
#      exceeded hop_timeout_minutes (default 90m). Strict HARD gate halts execution,
#      triggers Phase 03 rescue block, dispatches failure alert, and logs out.
# ----------------------------------------------------------------------------
- name: "Monitor: Enforce hop timeout guard"
  fail:
    msg: >-
      [HARD GATE FAILURE] Upgrade hop exceeded {{ monitor_timeout_limit }}m timeout without settling.
      MCP or ClusterVersion rollout stalled for cluster '{{ cluster_name }}' (Hop {{ resolved_hop_label }} -> {{ resolved_target_version }}).
      Current Version: {{ poll_cv_version | default('unknown') }} | Progressing: {{ poll_cv_progressing | default('unknown') }}.
      Offending MCPs (Updating/Degraded): {{ ((poll_mcp_updating_list | default([])) + (poll_mcp_degraded_list | default([]))) | join(', ') }}.
  when:
    - monitor_enforce_gate | default(true) | bool
    - not (hop_settled | default(false) | bool)

# ----------------------------------------------------------------------------
# 4. Settle-Gate Confirmation & Fact Export
# Why: Confirms cluster settled cleanly, displays success banner, logs to audit
#      trails, and exports hop_elapsed_duration for hop.yml notifications.
# ----------------------------------------------------------------------------
- name: "Monitor: Display Settle-Gate Success Banner"
  debug:
    msg:
      - "============================================================================"
      - "SETTLE-GATE PASSED: HOP {{ resolved_hop_label }} SETTLED CLEANLY"
      - "============================================================================"
      - "Target Cluster       : {{ cluster_name }}"
      - "Target Version       : {{ resolved_target_version }}"
      - "Achieved Version     : {{ poll_cv_version | default(resolved_target_version) }}"
      - "Elapsed Duration     : {{ elapsed_formatted | default('00:00:00') }}"
      - "Total Polls Run      : {{ monitor_iterations_completed | default(1) }} of {{ monitor_max_iterations }}"
      - "ClusterVersion State : Completed (Available=True, Progressing=False)"
      - "ClusterOperators     : 100% Settled (Zero Degraded, Zero Progressing)"
      - "MachineConfigPools   : 100% Updated (Zero Updating, Zero Degraded)"
      - "============================================================================"

- name: "Monitor: Export settle metrics and duration facts for tasks/hop.yml"
  set_fact:
    hop_settled: true
    hop_elapsed_duration: "{{ elapsed_formatted | default('00:00:00') }}"
    settle_gate_passed: true

- name: "Monitor: Log settle-gate pass to human-readable text run log"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
    line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [PASS] [HARD] Phase 04: Live monitoring completed. Settle-gate verified for Hop {{ resolved_hop_label }} (Target: {{ resolved_target_version }}) in {{ elapsed_formatted | default('00:00:00') }}."
    create: true
  when: not (dry_run | default(false) | bool)

- name: "Monitor: Log settle-gate pass to CSV audit log"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
    line: '"{{ lookup(''pipe'', ''date +%Y-%m-%dT%H:%M:%S'') }}","{{ cluster_name }}","Phase 04 Live Monitoring","HARD","PASS","Hop {{ resolved_hop_label }} settled","Duration: {{ elapsed_formatted | default(''00:00:00'') }}"'
    create: true
  when: not (dry_run | default(false) | bool)
