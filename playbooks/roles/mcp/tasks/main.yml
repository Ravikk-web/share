---
# ============================================================================
# Role Tasks: mcp (MachineConfigPools)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (shell, set_fact, fail, debug).
#                 Compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Verifies that all MachineConfigPools are synchronized (Updated=True),
#          unpaused (spec.paused=false), and not degraded prior to upgrade.
#          Exports mcp_parsed_data and mcp_all_pools for monitor/remediate roles.
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: HARD
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Query MachineConfigPools via oc CLI & jq v1.5
# Why: oc get mcp -o json parsed with jq 1.5 extracts conditions and machine counts.
# Why: Shell with set -o pipefail and executable: /bin/bash captures pipeline errors.
# Why: Parentheses around // operands satisfy jq 1.5 operator precedence rules.
# ----------------------------------------------------------------------------
- name: "Query live MachineConfigPools and parse status conditions via jq"
  shell: |
    set -o pipefail
    oc get mcp -o json | jq -c '
      {
        pools: [.items[] | {
          name: .metadata.name,
          paused: (.spec.paused // false),
          updated: (((.status.conditions // []) | map(select(.type == "Updated")) | .[0].status) // "False" | tostring),
          updating: (((.status.conditions // []) | map(select(.type == "Updating")) | .[0].status) // "False" | tostring),
          degraded: (((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "True" | tostring),
          machine_count: (.status.machineCount // 0),
          updated_machine_count: (.status.updatedMachineCount // 0),
          ready_machine_count: (.status.readyMachineCount // 0),
          unavailable_machine_count: (.status.unavailableMachineCount // 0),
          degraded_machine_count: (.status.degradedMachineCount // 0)
        }],
        paused_pools: [.items[] | select((.spec.paused // false) == true) | .metadata.name],
        degraded_pools: [.items[] | select((((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "True" | tostring) == "True") | .metadata.name],
        not_updated_pools: [.items[] | select((((.status.conditions // []) | map(select(.type == "Updated")) | .[0].status) // "False" | tostring) != "True") | .metadata.name]
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: mcp_query_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: mcp_query_raw.rc == 0

# ----------------------------------------------------------------------------
# 2. Export Facts for Monitor and Remediate Roles
# Why: Exports mcp_parsed_data and mcp_all_pools as mandated by system contract.
# Why: Bracket notation ['pools'] avoids collision with Python dict.items().
# ----------------------------------------------------------------------------
- name: "Export MachineConfigPool facts for monitor and remediate roles"
  set_fact:
    mcp_parsed_data: "{{ (mcp_query_raw.stdout | default('{}') | from_json)['pools'] | default([]) }}"
    mcp_all_pools: "{{ (mcp_query_raw.stdout | default('{}') | from_json)['pools'] | default([]) | map(attribute='name') | list }}"
    mcp_paused_pools: "{{ (mcp_query_raw.stdout | default('{}') | from_json)['paused_pools'] | default([]) }}"
    mcp_degraded_pools: "{{ (mcp_query_raw.stdout | default('{}') | from_json)['degraded_pools'] | default([]) }}"
    mcp_not_updated_pools: "{{ (mcp_query_raw.stdout | default('{}') | from_json)['not_updated_pools'] | default([]) }}"

- name: "Identify combined list of offending MachineConfigPools"
  set_fact:
    mcp_offending_pools: "{{ (mcp_paused_pools + mcp_degraded_pools + mcp_not_updated_pools) | unique }}"
    mcp_check_valid: "{{ ((mcp_paused_pools + mcp_degraded_pools + mcp_not_updated_pools) | unique | length) == 0 }}"

# ----------------------------------------------------------------------------
# 3. Construct Structured Health Record & Append to Summary
# Why: Appends structured dictionary into health_summary for reporting.
# ----------------------------------------------------------------------------
- name: "Construct structured mcp health record"
  set_fact:
    mcp_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "MachineConfigPools Synchronization"
      gate: "HARD"
      status: "{{ 'PASS' if (mcp_check_valid | bool) else 'FAIL' }}"
      observed: >-
        {{ ('All ' ~ (mcp_all_pools | length) ~ ' MCPs synchronized and unpaused (' ~ (mcp_all_pools | join(', ')) ~ ')')
           if (mcp_check_valid | bool)
           else ('Offending MCPs: paused=[' ~ (mcp_paused_pools | join(', ')) ~ '], degraded=[' ~ (mcp_degraded_pools | join(', ')) ~ '], not_updated=[' ~ (mcp_not_updated_pools | join(', ')) ~ ']') }}

- name: "Record mcp result to health_summary tracking list"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [mcp_health_item] }}"

- name: "Log MachineConfigPool evaluation outcome"
  debug:
    msg:
      - "Check        : {{ mcp_health_item.name }}"
      - "Status       : {{ mcp_health_item.status }}"
      - "Observed     : {{ mcp_health_item.observed }}"
      - "Gate Enforced: {{ mcp_enforce_gate | default(true) | bool }}"

# ----------------------------------------------------------------------------
# 4. Enforce HARD Gate
# Why: Halts execution immediately if any MCP is paused, degraded, or not updated.
# ----------------------------------------------------------------------------
- name: "Enforce HARD gate for MachineConfigPools check"
  fail:
    msg: "HARD GATE FAILURE [mcp]: One or more MachineConfigPools are unhealthy or paused on cluster '{{ cluster_name }}'. Paused: {{ mcp_paused_pools | to_json }}, Degraded: {{ mcp_degraded_pools | to_json }}, Not Updated: {{ mcp_not_updated_pools | to_json }}."
  when:
    - not (mcp_check_valid | bool)
    - mcp_enforce_gate | default(true) | bool
