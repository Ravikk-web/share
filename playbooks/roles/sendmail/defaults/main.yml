---
# ============================================================================
# Role Defaults: sendmail
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Standard variable declarations.
#
# Purpose: Default configuration parameters for email notifications dispatched
#          via Ansible's native mail module (direct SMTP).
# Dependencies: playbooks/vars/smtp.yml (overrides if loaded)
# Gate type: N/A
# ============================================================================

# SMTP server hostname or IP reachable from jump server
smtp_host: "smtp.example.com"

# SMTP port (25 for direct internal relay, 587 for STARTTLS)
smtp_port: 25

# Sender email address
mail_from: "aro-upgrades@example.com"

# Recipient list for email dispatch
mail_to: []

# Email subject line
mail_subject: "[ARO Upgrade] Notification"

# Template file path to render (relative to playbooks/templates/ or absolute)
mail_template: ""

# Pre-rendered HTML email body (if not rendering from mail_template)
mail_html_body: ""

# List of file attachments to include in email
mail_attachments: []

# Email character encoding
mail_charset: "utf-8"

# Optional SMTP authentication credentials (empty for unauthenticated relay)
smtp_username: ""
smtp_password: ""

# SMTP security mode: 'never', 'starttls', or 'ssl'
smtp_secure: "never"
