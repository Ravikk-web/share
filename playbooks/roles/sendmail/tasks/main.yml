---
# ============================================================================
# Role Tasks: sendmail
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (mail, set_fact, assert).
#
# Purpose: Renders Jinja2 HTML templates and dispatches notification emails via
#          Ansible's native direct SMTP mail module (Python smtplib). Enforces
#          a strict template rendering lifecycle with mandatory post-dispatch
#          fact resets to prevent stale body caching across upgrade hops.
# Dependencies: playbooks/vars/smtp.yml, playbooks/vars/report_vars.yml
# Gate type: N/A (Notification dispatch)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Template Path Resolution
# ----------------------------------------------------------------------------
- name: "Resolve email template path"
  set_fact:
    resolved_template_path: >-
      {{ mail_template
         if (mail_template.startswith('/') or (mail_template | length > 1 and mail_template[1] == ':'))
         else (playbook_dir ~ '/templates/' ~ (mail_template | regex_replace('^templates/', ''))) }}
  when: mail_template | default('') | length > 0

# ----------------------------------------------------------------------------
# 2. Template Rendering Lifecycle
# Always render fresh HTML from disk — never reuse cached mail_html_body
# ----------------------------------------------------------------------------
- name: "Render email HTML template"
  set_fact:
    mail_html_body: "{{ lookup('template', resolved_template_path) }}"
  when: mail_template | default('') | length > 0

# ----------------------------------------------------------------------------
# 3. Pre-Dispatch Validation
# ----------------------------------------------------------------------------
- name: "Validate email parameters prior to dispatch"
  assert:
    that:
      - mail_html_body | default('') | length > 0
      - mail_to | default([]) | length > 0
    fail_msg: >-
      Email dispatch aborted: either mail_html_body is empty
      (resolved_template_path: {{ resolved_template_path | default('none') }})
      or mail_to recipient list is empty.

# ----------------------------------------------------------------------------
# 4. Native SMTP Dispatch
# Dispatched on localhost via Python smtplib (no local MTA / sendmail binary)
# ----------------------------------------------------------------------------
- name: "Dispatch email notification via direct SMTP"
  mail:
    host: "{{ smtp_host }}"
    port: "{{ smtp_port | int }}"
    from: "{{ mail_from }}"
    to: "{{ mail_to }}"
    subject: "{{ mail_subject }}"
    body: "{{ mail_html_body }}"
    subtype: html
    charset: "{{ mail_charset | default('utf-8') }}"
    attach: "{{ mail_attachments | default([]) }}"
    username: "{{ smtp_username if (smtp_username | default('') | length > 0) else omit }}"
    password: "{{ smtp_password if (smtp_password | default('') | length > 0) else omit }}"
    secure: "{{ smtp_secure if (smtp_secure | default('') | length > 0) else omit }}"
  delegate_to: localhost

# ----------------------------------------------------------------------------
# 5. Post-Dispatch Fact Cleanup (Anti-Pattern Prevention)
# Clears body, attachment, and template facts to guarantee subsequent hops
# or alert dispatches never inherit stale data from previous executions.
# ----------------------------------------------------------------------------
- name: "Reset email body facts to prevent cross-hop caching"
  set_fact:
    mail_html_body: ""
    mail_final_body: ""
    mail_attachments: []
    mail_template: ""
    resolved_template_path: ""
