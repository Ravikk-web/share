---
# ============================================================================
# Role Tasks: node (Node Health)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (shell, set_fact, fail, debug).
#                 Compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Ensures all cluster nodes are in Ready=True status with no DiskPressure,
#          MemoryPressure, or PIDPressure conditions, and verifies schedulability.
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: HARD
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Query Node Inventory & Status Conditions via oc CLI & jq v1.5
# Why: oc get nodes -o json parsed with jq 1.5 extracts condition states and pressures.
# Why: Shell with set -o pipefail and executable: /bin/bash captures errors.
# Why: Parentheses around 'or' and '//' operands comply strictly with jq 1.5.
# ----------------------------------------------------------------------------
- name: "Query live cluster nodes and parse status conditions via jq"
  shell: |
    set -o pipefail
    oc get nodes -o json | jq -c '
      {
        nodes: [.items[] | {
          name: .metadata.name,
          ready: (((.status.conditions // []) | map(select(.type == "Ready")) | .[0].status) // "False" | tostring),
          disk_pressure: (((.status.conditions // []) | map(select(.type == "DiskPressure")) | .[0].status) // "False" | tostring),
          memory_pressure: (((.status.conditions // []) | map(select(.type == "MemoryPressure")) | .[0].status) // "False" | tostring),
          pid_pressure: (((.status.conditions // []) | map(select(.type == "PIDPressure")) | .[0].status) // "False" | tostring),
          unschedulable: (.spec.unschedulable // false)
        }],
        unready: [.items[] | select((((.status.conditions // []) | map(select(.type == "Ready")) | .[0].status) // "False" | tostring) != "True") | .metadata.name],
        pressured: [.items[] | select(
          ((((.status.conditions // []) | map(select(.type == "DiskPressure")) | .[0].status) // "False" | tostring) == "True") or
          ((((.status.conditions // []) | map(select(.type == "MemoryPressure")) | .[0].status) // "False" | tostring) == "True") or
          ((((.status.conditions // []) | map(select(.type == "PIDPressure")) | .[0].status) // "False" | tostring) == "True")
        ) | .metadata.name],
        unschedulable: [.items[] | select((.spec.unschedulable // false) == true) | .metadata.name]
      }'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: node_query_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: node_query_raw.rc == 0

# ----------------------------------------------------------------------------
# 2. Extract Facts & Evaluate Node Health
# Why: Bracket notation ['nodes'] avoids collision with Python dict.items().
# Why: Compares unschedulable count against allowed_unschedulable_nodes threshold.
# ----------------------------------------------------------------------------
- name: "Extract node health and pressure status lists"
  set_fact:
    nodes_parsed_data: "{{ (node_query_raw.stdout | default('{}') | from_json)['nodes'] | default([]) }}"
    node_unready_list: "{{ (node_query_raw.stdout | default('{}') | from_json)['unready'] | default([]) }}"
    node_pressured_list: "{{ (node_query_raw.stdout | default('{}') | from_json)['pressured'] | default([]) }}"
    node_unschedulable_list: "{{ (node_query_raw.stdout | default('{}') | from_json)['unschedulable'] | default([]) }}"

- name: "Evaluate node health compliance against thresholds"
  set_fact:
    node_unschedulable_exceeded: "{{ (node_unschedulable_list | length) > (allowed_unschedulable_nodes | default(0) | int) }}"
    node_check_valid: >-
      {{ ((node_unready_list | length) == 0) and
         ((node_pressured_list | length) == 0) and
         not ((node_unschedulable_list | length) > (allowed_unschedulable_nodes | default(0) | int)) }}

# ----------------------------------------------------------------------------
# 3. Construct Structured Health Record & Append to Summary
# Why: Appends structured dictionary into health_summary for reporting.
# ----------------------------------------------------------------------------
- name: "Construct structured node health record"
  set_fact:
    node_health_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "Node Health and Conditions"
      gate: "HARD"
      status: "{{ 'PASS' if (node_check_valid | bool) else 'FAIL' }}"
      observed: >-
        {{ ('All ' ~ (nodes_parsed_data | length) ~ ' nodes Ready=True, no resource pressures, unschedulable=' ~ (node_unschedulable_list | length))
           if (node_check_valid | bool)
           else ('Offending nodes: unready=[' ~ (node_unready_list | join(', ')) ~ '], pressured=[' ~ (node_pressured_list | join(', ')) ~ '], unschedulable=[' ~ (node_unschedulable_list | join(', ')) ~ '] (allowed: ' ~ (allowed_unschedulable_nodes | default(0)) ~ ')') }}

- name: "Record node health result to health_summary tracking list"
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [node_health_item] }}"

- name: "Log node health evaluation outcome"
  debug:
    msg:
      - "Check        : {{ node_health_item.name }}"
      - "Status       : {{ node_health_item.status }}"
      - "Observed     : {{ node_health_item.observed }}"
      - "Gate Enforced: {{ node_enforce_gate | default(true) | bool }}"

# ----------------------------------------------------------------------------
# 4. Enforce HARD Gate
# Why: Halts execution immediately if unready nodes, pressured nodes, or excessive unschedulable nodes exist.
# ----------------------------------------------------------------------------
- name: "Enforce HARD gate for node health check"
  fail:
    msg: "HARD GATE FAILURE [node]: Node health check failed on cluster '{{ cluster_name }}'. Unready: {{ node_unready_list | to_json }}, Pressured: {{ node_pressured_list | to_json }}, Unschedulable: {{ node_unschedulable_list | to_json }} (threshold: {{ allowed_unschedulable_nodes }})."
  when:
    - not (node_check_valid | bool)
    - node_enforce_gate | default(true) | bool
