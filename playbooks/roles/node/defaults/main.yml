# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names work on both versions.
#                 | default('') guards are applied on all optional variables.
#
# Defaults for node role (Node Health and Readiness check)

---
# Kubeconfig path (derived from playbook_dir by default)
kubeconfig_path: "{{ playbook_dir }}/.kubeconfig"

# Cluster name for reporting and error messages
cluster_name: "{{ vault_cluster_name | default('UNKNOWN') }}"

# Prevalidation check metadata
node_id: "05"
node_name: "Node Health and Readiness"
node_gate: "HARD"

# Allow-list for unschedulable nodes (permitted cordoned / SchedulingDisabled nodes)
# Note: NotReady nodes are NEVER permitted, even if listed here.
# Default is empty list (all nodes must be Ready=True and schedulable)
allowed_unschedulable_nodes: []
