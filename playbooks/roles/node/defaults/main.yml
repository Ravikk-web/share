---
# ============================================================================
# Role Defaults: node (Node Health & Readiness)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Defines default input parameters for the node role, which evaluates
#          node Ready conditions, DiskPressure, MemoryPressure, PIDPressure,
#          and unschedulable node counts against configured thresholds.
# Role / Playbook Dependencies: vars/paths.yml, vars/upgrade.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by node tasks
# ============================================================================

# Target ARO cluster name (string, mandatory)
# Sourced from vars/upgrade.yml or overridden via CLI --cluster
cluster_name: ""

# Maximum number of unschedulable (cordoned) nodes permitted before triggering HARD gate (integer, default: 0)
# Sourced from vars/upgrade.yml
allowed_unschedulable_nodes: 0

# Master toggle for enforcing HARD gate failure on validation error (boolean, default: true)
# Sourced from role defaults or overridden by prevalidation scan during diagnostic sweeps
node_enforce_gate: true
