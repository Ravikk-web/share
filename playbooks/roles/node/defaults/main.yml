---
# ============================================================================
# Role Defaults: node (Node Health)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Simple scalar values.
#
# Purpose: Defines default input parameters for the node role, which validates
#          that all cluster nodes are in Ready=True status with no DiskPressure,
#          MemoryPressure, or PIDPressure conditions, and verifies schedulability.
# Dependencies: playbooks/vars/paths.yml, playbooks/vars/upgrade.yml
# Gate type: HARD
# ============================================================================

# Target cluster identifier (string, required)
cluster_name: ""

# Number of unschedulable (cordoned) nodes permitted without failing the gate.
# Default 0: in strict pre-upgrade health check, all nodes must be schedulable.
allowed_unschedulable_nodes: 0

# Master toggle for enforcing HARD gate failure on validation error
# Set to false by prevalidation aggregator during diagnostic sweeps before remediation
node_enforce_gate: true

# Transient retry parameters for oc CLI execution
oc_command_retries: 3
oc_command_retry_delay: 10
