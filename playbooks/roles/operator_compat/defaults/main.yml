---
# ============================================================================
# Role Defaults: operator_compat
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Default configuration parameters for the operator_compat role, which
#          scans installed OLM Subscriptions and PackageManifests across namespaces
#          to evaluate update channel compatibility with the target OpenShift version.
# Role / Playbook Dependencies: vars/upgrade.yml, vars/paths.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by operator_compat tasks
# ============================================================================

# Target OpenShift version to validate operator compatibility against (string, mandatory)
# Sourced from upgrade_path[-1] or vars/upgrade.yml
target_version: ""

# Master toggle for enforcing gate failure on operator compatibility issues (boolean, default: false)
# Sourced from role defaults (WARN advisory: reports findings without aborting closeout)
operator_compat_enforce_gate: false

# Maximum command retry attempts for transient API communication blips (integer, default: 3)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retries: 3

# Delay in seconds between command retry attempts (integer, default: 10)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retry_delay: 10
