---
# ============================================================================
# Task File: scan_subscription.yml (roles/operator_compat)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names and set_fact; fully compatible.
#
# Purpose: Inspects an individual OLM subscription, queries its PackageManifest,
#          evaluates available update channels for target OpenShift version
#          compatibility, and records the finding to operator_compat_plan.
# Dependencies: playbooks/roles/operator_compat/defaults/main.yml
# Gate type: Advisory / Information
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Query PackageManifest for Operator Package
# Why: Queries PackageManifest in source namespace first, falling back to
#      cluster-wide query to discover available channels and defaultChannel.
# ----------------------------------------------------------------------------
- name: "operator_compat: Query PackageManifest for {{ sub_item.name }}"
  shell: |
    set -o pipefail
    oc get packagemanifest "{{ sub_item.package }}" -n "{{ sub_item.source_namespace | default('openshift-marketplace') }}" -o json 2>/dev/null \
      || oc get packagemanifest "{{ sub_item.package }}" -o json 2>/dev/null \
      || echo '{"status":{"channels":[]}}'
  args:
    executable: /bin/bash
  register: sub_pkg_manifest_raw
  until: sub_pkg_manifest_raw.rc == 0
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  changed_when: false

# ----------------------------------------------------------------------------
# 2. Parse Available Channels with jq v1.5
# Why: Extracts channels list and defaultChannel with strict jq 1.5 syntax.
# ----------------------------------------------------------------------------
- name: "operator_compat: Parse channels for {{ sub_item.name }} with jq v1.5"
  shell: |
    set -o pipefail
    echo '{{ sub_pkg_manifest_raw.stdout | default("{}") }}' | jq -c '
      {
        default_channel: (.status.defaultChannel // ""),
        channels: [ .status.channels[]?.name // empty ]
      }
    '
  args:
    executable: /bin/bash
  register: sub_pkg_channels_parsed_raw
  changed_when: false

- name: "operator_compat: Normalize package manifest facts for {{ sub_item.name }}"
  set_fact:
    sub_pkg_info: "{{ sub_pkg_channels_parsed_raw.stdout | from_json }}"

# ----------------------------------------------------------------------------
# 3. Evaluate Channel Compatibility for Target OpenShift Version
# Why: Checks if a channel matching target OpenShift minor (e.g. stable-4.16)
#      exists in PackageManifest channels, and identifies if a switch is needed.
# ----------------------------------------------------------------------------
- name: "operator_compat: Determine matching target channel for {{ sub_item.name }}"
  set_fact:
    matching_target_channel: >-
      {{ (sub_pkg_info.channels | default([]) | select('search', 'stable-' ~ (target_ocp_minor | default(''))) | list | first)
         if (target_ocp_minor | default('') | length > 0 and (sub_pkg_info.channels | default([]) | select('search', 'stable-' ~ target_ocp_minor) | list | length > 0))
         else ((sub_pkg_info.channels | default([]) | select('search', 'fast-' ~ (target_ocp_minor | default(''))) | list | first)
               if (target_ocp_minor | default('') | length > 0 and (sub_pkg_info.channels | default([]) | select('search', 'fast-' ~ target_ocp_minor) | list | length > 0))
               else ((sub_pkg_info.channels | default([]) | select('search', '^' ~ (target_ocp_minor | default('')) ~ '$') | list | first)
                     if (target_ocp_minor | default('') | length > 0 and (sub_pkg_info.channels | default([]) | select('search', '^' ~ target_ocp_minor ~ '$') | list | length > 0))
                     else (sub_item.channel | default(sub_pkg_info.default_channel | default('stable'))))) }}

- name: "operator_compat: Evaluate channel switch requirement for {{ sub_item.name }}"
  set_fact:
    channel_switch_needed: >-
      {{ true
         if (matching_target_channel | length > 0 and (sub_item.channel | default('')) != matching_target_channel and (matching_target_channel in (sub_pkg_info.channels | default([]))))
         else false }}

- name: "operator_compat: Derive compatibility verdict for {{ sub_item.name }}"
  set_fact:
    sub_compat_status: >-
      {{ 'WARN'
         if (channel_switch_needed | bool)
         else ('PASS'
               if ((sub_item.channel in (sub_pkg_info.channels | default([]))) or ((sub_pkg_info.channels | default([]) | length) == 0))
               else 'WARN') }}
    sub_compat_details: >-
      {{ ('Target channel ' ~ matching_target_channel ~ ' available in PackageManifest (current: ' ~ (sub_item.channel | default('none')) ~ ')')
         if (channel_switch_needed | bool)
         else ('Channel ' ~ (sub_item.channel | default('default')) ~ ' is active and compatible') }}

# ----------------------------------------------------------------------------
# 4. Append Evaluation to Compatibility Plan Facts
# ----------------------------------------------------------------------------
- name: "operator_compat: Append evaluation record for {{ sub_item.name }}"
  set_fact:
    operator_compat_plan: >-
      {{ operator_compat_plan | default([]) + [{
           'subscription': sub_item.name,
           'namespace': sub_item.namespace,
           'package': sub_item.package,
           'current_channel': sub_item.channel,
           'target_channel': matching_target_channel,
           'channel_switch_recommended': channel_switch_needed | bool,
           'installed_csv': sub_item.installed_csv,
           'installplan_approval': sub_item.approval,
           'status': sub_compat_status,
           'details': sub_compat_details
         }] }}
    operator_compat_records: >-
      {{ operator_compat_records | default([]) + [{
           'name': 'Operator Compatibility: ' ~ sub_item.name,
           'gate': 'WARN',
           'status': sub_compat_status,
           'observed': sub_compat_details
         }] }}

- name: "operator_compat: Log subscription compatibility finding"
  debug:
    msg: "Subscription '{{ sub_item.name }}' in '{{ sub_item.namespace }}' -> Channel: {{ sub_item.channel }} (Target: {{ matching_target_channel }}) [{{ sub_compat_status }}]"
