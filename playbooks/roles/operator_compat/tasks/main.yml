# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names work on both versions.

---
- name: Query Subscriptions and CSVs
  shell: |
    set -euo pipefail
    TMP_SUBS=$(mktemp)
    TMP_CSVS=$(mktemp)
    oc get subscriptions --all-namespaces -o json --kubeconfig "{{ kubeconfig_path }}" > "$TMP_SUBS"
    oc get csv --all-namespaces -o json --kubeconfig "{{ kubeconfig_path }}" > "$TMP_CSVS"
    
    jq -s -r '
      .[0].items as $subs |
      .[1].items as $csvs |
      $subs | map(
        . as $sub |
        ($csvs | map(select(.metadata.namespace == $sub.metadata.namespace and .metadata.name == $sub.status.installedCSV))[0]) as $csv |
        {
          name: .metadata.name,
          namespace: .metadata.namespace,
          channel: (.spec.channel // "Unknown"),
          installedCSV: (.status.installedCSV // "Unknown"),
          currentCSV: (.status.currentCSV // "Unknown"),
          state: (.status.state // "Unknown"),
          installPlanApproval: (.spec.installPlanApproval // "Unknown"),
          csv_phase: ($csv.status.phase // "Unknown"),
          csv_version: ($csv.spec.version // "Unknown"),
          csv_minKubeVersion: ($csv.spec.minKubeVersion // "0.0.0")
        }
      )
    ' "$TMP_SUBS" "$TMP_CSVS"
    rm -f "$TMP_SUBS" "$TMP_CSVS"
  register: sub_csv_raw
  changed_when: false

- name: Parse Subscriptions
  set_fact:
    operator_subs: "{{ sub_csv_raw.stdout | from_json }}"

- name: Query Cluster Server Kube Version
  shell: |
    oc version -o json --kubeconfig "{{ kubeconfig_path }}" | jq -r '.serverVersion.gitVersion | split("+")[0]'
  register: raw_kube_version
  changed_when: false

- name: Set Cluster Kube Version Fact
  set_fact:
    cluster_kube_version: "{{ raw_kube_version.stdout | regex_replace('^v(.*)$', '\\1') }}"

- name: Initialize operator evaluation list
  set_fact:
    operator_evaluations: []
    operator_compat_failed: []
    operator_upgrade_needed: []

- name: Evaluate Operator Compatibility and Upgrade Needs
  set_fact:
    operator_evaluations: "{{ operator_evaluations + [eval_record] }}"
    operator_compat_failed: "{{ operator_compat_failed + ([eval_record] if status == 'FAIL' else []) }}"
    operator_upgrade_needed: "{{ operator_upgrade_needed + ([eval_record] if upgrade_flag and status != 'FAIL' else []) }}"
  vars:
    # HARD fail if phase is Failed or minKubeVersion > cluster server version
    is_failed: "{{ item.csv_phase == 'Failed' }}"
    is_incompat: "{{ item.csv_minKubeVersion != '0.0.0' and item.csv_minKubeVersion is version(cluster_kube_version, '>') }}"
    status: "{{ 'FAIL' if (is_failed or is_incompat) else 'PASS' }}"
    # WARN / Actionable upgrade needed if current != installed or pending state
    upgrade_flag: >-
      {{
        item.currentCSV != item.installedCSV or
        item.state == 'UpgradePending'
      }}
    eval_record: "{{ item | combine({'compat_status': status, 'needs_upgrade': upgrade_flag}) }}"
  loop: "{{ operator_subs }}"
  when: item.name not in (operator_allow_list | default([]))

- name: Enforce HARD gate on Operator Compatibility
  fail:
    msg: >-
      Operator Compatibility check FAILED on cluster '{{ cluster_name | default('UNKNOWN') }}'.
      Found {{ operator_compat_failed | length }} incompatible or failed operators:
      {% for op in operator_compat_failed %}
        - {{ op.namespace }}/{{ op.name }}: Phase={{ op.csv_phase }}, minKubeVersion={{ op.csv_minKubeVersion }}, ClusterKube={{ cluster_kube_version }}
      {% endfor %}
  when: (operator_compat_failed | length) > 0

- name: Display Upgrade Worklist
  debug:
    msg: >-
      Found {{ operator_upgrade_needed | length }} operator(s) needing upgrade.
