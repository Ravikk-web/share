---
# ============================================================================
# Role Tasks: report
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (set_fact, file, copy, debug).
#
# Purpose: Calculates health summary metrics, determines overall verdict badges,
#          renders the health-overview.j2 Jinja2 template into standalone HTML
#          documents, writes artifacts to output/, and exports report_file_path
#          for downstream notification attachment handling.
# Dependencies: playbooks/templates/health-overview.j2,
#               playbooks/vars/report_vars.yml, playbooks/vars/paths.yml
# Gate type: N/A (Client-Facing Presentation Artifact Generator)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Consolidate Input Check Records & Target Metadata
# ----------------------------------------------------------------------------
- name: "Consolidate health check items from facts"
  set_fact:
    checks: "{{ checks if (checks is defined and checks | length > 0) else (health_summary | default([])) }}"

- name: "Resolve report title and operator mode from report_type"
  set_fact:
    is_operator_report: "{{ true if (report_type | default('prevalidation') in ['operator', 'operators'] or (is_operator_report | default(false) | bool)) else false }}"
    report_title: >-
      {{ report_title
         if (report_title != 'Pre-Upgrade Validation Report' or report_type == 'prevalidation')
         else ('Post-Upgrade Validation Report'
               if (report_type == 'postvalidation')
               else ('OLM Operator Validation Report'
                     if (report_type in ['operator', 'operators'])
                     else (report_type | capitalize ~ ' Validation Report'))) }}

# ----------------------------------------------------------------------------
# 2. Calculate Summary Counters
# Why: Derive metric counts for total, passed, warnings, auto-fixed, and failed.
# ----------------------------------------------------------------------------
- name: "Calculate health validation summary counters"
  set_fact:
    total_checks: "{{ checks | length }}"
    passed_count: "{{ checks | selectattr('status', 'defined') | selectattr('status', 'equalto', 'PASS') | list | length }}"
    warning_count: "{{ checks | selectattr('status', 'defined') | selectattr('status', 'equalto', 'WARN') | list | length }}"
    autofixed_count: "{{ checks | selectattr('status', 'defined') | selectattr('status', 'equalto', 'AUTO-FIXED') | list | length }}"
    failed_count: "{{ (checks | selectattr('status', 'defined') | selectattr('status', 'equalto', 'FAIL') | list | length) + (checks | selectattr('status', 'defined') | selectattr('status', 'equalto', 'FIX-FAILED') | list | length) }}"
  when: not (is_operator_report | bool) or (checks | length > 0)

- name: "Calculate operator summary counters if operator validation report"
  set_fact:
    total_checks: "{{ operators | length }}"
    passed_count: "{{ operators | selectattr('status', 'defined') | selectattr('status', 'equalto', 'PASS') | list | length }}"
    warning_count: "{{ operators | selectattr('status', 'defined') | selectattr('status', 'equalto', 'WARN') | list | length }}"
    autofixed_count: "{{ operators | selectattr('status', 'defined') | selectattr('status', 'equalto', 'AUTO-FIXED') | list | length }}"
    failed_count: "{{ operators | selectattr('status', 'defined') | selectattr('status', 'equalto', 'FAIL') | list | length }}"
  when:
    - is_operator_report | bool
    - operators is defined
    - operators | length > 0
    - checks | length == 0

# ----------------------------------------------------------------------------
# 3. Determine Overall Verdict Badge
# Verdict rules:
#   - FAIL if any failed items exist.
#   - AUTO-FIXED if auto-fixed items exist and no failures.
#   - WARN if warnings exist and no failures.
#   - PASS if all passed cleanly.
# ----------------------------------------------------------------------------
- name: "Determine overall verdict badge"
  set_fact:
    overall_verdict: >-
      {{ 'FAIL'
         if ((failed_count | default(0) | int) > 0)
         else ('AUTO-FIXED'
               if ((autofixed_count | default(0) | int) > 0)
               else ('WARN'
                     if ((warning_count | default(0) | int) > 0)
                     else 'PASS')) }}
    overall_status: >-
      {{ 'FAIL'
         if ((failed_count | default(0) | int) > 0)
         else ('AUTO-FIXED'
               if ((autofixed_count | default(0) | int) > 0)
               else ('WARN'
                     if ((warning_count | default(0) | int) > 0)
                     else 'PASS')) }}

- name: "Extract autofix items from check items if not explicitly defined"
  set_fact:
    autofix_items: >-
      {{ autofix_items
         if (autofix_items is defined and autofix_items | length > 0)
         else (checks | selectattr('status', 'defined') | selectattr('status', 'equalto', 'AUTO-FIXED') | list) }}

# ----------------------------------------------------------------------------
# 4. Resolve Template & Render HTML Content
# ----------------------------------------------------------------------------
- name: "Resolve report template path"
  set_fact:
    resolved_report_template: >-
      {{ report_template
         if (report_template.startswith('/') or (report_template | length > 1 and report_template[1] == ':'))
         else (playbook_dir ~ '/templates/' ~ (report_template | regex_replace('^templates/', ''))) }}

- name: "Render health overview HTML report content"
  set_fact:
    report_html_content: "{{ lookup('template', resolved_report_template) }}"

# ----------------------------------------------------------------------------
# 5. Write Standalone HTML Artifact to output/ & Export Fact
# ----------------------------------------------------------------------------
- name: "Determine destination report file path"
  set_fact:
    report_file_path: >-
      {{ output_file
         if (output_file is defined and output_file | length > 0)
         else ((output_dir | default(playbook_dir ~ '/output')) ~ '/' ~ (cluster_name | default('cluster')) ~ '_' ~ (report_type | default('prevalidation')) ~ '_' ~ (run_timestamp | default('current')) ~ '.html') }}

- name: "Ensure report output directory exists"
  file:
    path: "{{ output_dir | default(playbook_dir ~ '/output') }}"
    state: directory
    mode: '0755'

- name: "Write standalone validation HTML report"
  copy:
    content: "{{ report_html_content }}"
    dest: "{{ report_file_path }}"
    mode: '0644'

- name: "Confirm HTML report artifact generation"
  debug:
    msg:
      - "Generated {{ report_title }} successfully."
      - "Destination : {{ report_file_path }}"
      - "Verdict     : {{ overall_verdict }} (Total: {{ total_checks | default(0) }}, Passed: {{ passed_count | default(0) }}, Warn: {{ warning_count | default(0) }}, Auto-Fixed: {{ autofixed_count | default(0) }}, Failed: {{ failed_count | default(0) }})"
