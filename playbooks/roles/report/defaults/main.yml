---
# ============================================================================
# Role Defaults: report
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Standard variable declarations.
#
# Purpose: Default configuration parameters for rendering and writing standalone
#          client-facing HTML validation reports to output/ using health-overview.j2.
# Dependencies: playbooks/vars/report_vars.yml, playbooks/vars/paths.yml,
#               playbooks/templates/health-overview.j2
# Gate type: N/A (Presentation & Reporting)
# ============================================================================

# Type of validation report: 'prevalidation', 'postvalidation', or 'operator'
report_type: "prevalidation"

# Display title rendered in the report header
report_title: "Pre-Upgrade Validation Report"

# Fallback overall status verdict badge ('PASS', 'WARN', 'FAIL', 'AUTO-FIXED', 'FIX-FAILED')
overall_status: "PASS"

# Target cluster identifier (string)
cluster_name: "cluster"

# Cluster environment tier (string, e.g. 'Production', 'Staging', 'Dev')
cluster_tier: ""

# Target OpenShift version or journey path string
target_cluster_version: ""

# Unique execution timestamp identifier for report file names
run_timestamp: "current"

# Directory where generated HTML reports are written
output_dir: "{{ playbook_dir }}/output"

# Jinja2 presentation template to render
report_template: "health-overview.j2"

# Specific flag indicating whether this is an OLM Operator validation report (Phase 06)
is_operator_report: false
