---
# ============================================================================
# Role Defaults: report
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Default configuration parameters for the report role, which renders
#          client-facing standalone HTML audit reports for Prevalidation,
#          Postvalidation, and Operator Validation phases.
# Role / Playbook Dependencies: vars/report_vars.yml, vars/paths.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by report tasks
# ============================================================================

# Type of validation report: 'prevalidation', 'postvalidation', or 'operators' (string, default: "prevalidation")
# Sourced from calling phase playbook
report_type: "prevalidation"

# Display title rendered in the report header band (string, default: "Pre-Upgrade Validation Report")
# Sourced from calling phase playbook
report_title: "Pre-Upgrade Validation Report"

# Fallback overall status verdict badge ('PASS', 'WARN', 'FAIL', 'AUTO-FIXED', 'FIX-FAILED') (string, default: "PASS")
# Sourced from calling phase playbook or derived from check evaluation
overall_status: "PASS"

# Target ARO cluster name (string, mandatory)
# Sourced from vars/upgrade.yml or overridden via CLI --cluster
cluster_name: "cluster"

# Cluster environment tier (string, e.g. 'Production', 'Staging', 'Dev')
# Sourced from vars/upgrade.yml or inventory map
cluster_tier: ""

# Target OpenShift version or journey path string (string, default: "")
# Sourced from vars/upgrade.yml or upgrade_path
target_cluster_version: ""

# Unique execution timestamp identifier for report file naming (string, default: "current")
# Sourced from master orchestrator or dynamically generated
run_timestamp: "current"

# Directory where generated HTML reports are persisted (string, default: path)
# Sourced from vars/paths.yml or derived from playbook_dir
output_dir: "{{ playbook_dir }}/output"

# Jinja2 presentation template to render (string, default: "health-overview.j2")
# Sourced from role defaults
report_template: "health-overview.j2"

# Specific flag indicating whether this is an OLM Operator validation report (Phase 06) (boolean, default: false)
# Sourced from calling phase playbook
is_operator_report: false
