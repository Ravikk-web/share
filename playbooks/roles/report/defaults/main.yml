# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (file, set_fact, template, stat, lineinfile, debug)
#                 work identically on both 2.7.17 and 2.14.18.
#                 | default('') guards are applied on all optional variables.
#                 No `warn:` parameter is used on any task.
#
# report role — Renders client-facing HTML validation reports and updates run logs.
#
# Defaults for report rendering parameters:

---
# --- Directory paths (derived from playbook_dir or overrides) ------------------
report_output_dir: "{{ output_dir | default(playbook_dir ~ '/output') }}"
report_log_dir: "{{ log_dir | default(playbook_dir ~ '/logs') }}"

# --- Cluster & Execution Metadata ---------------------------------------------
cluster_name: "{{ vault_cluster_name | default('UNKNOWN') }}"
report_phase: "prevalidation"
phase_name: "Pre-Upgrade Validation"
run_id: ""
timestamp: ""

# --- Branding & Titles (from vars/report_vars.yml or defaults) -----------------
report_title: "ARO Cluster Upgrade Report"
report_org: "Cloud Platform Engineering"
report_footer: "Generated by ARO Cluster Upgrade Automation"

# --- Output File Targets ------------------------------------------------------
# If output_html_file is empty, dynamic name is resolved in tasks/main.yml:
# {{ report_output_dir }}/{{ cluster_name }}_{{ report_phase }}_{{ timestamp }}.html
output_html_file: ""
log_file_txt: ""
log_file_csv: ""

# --- Data Sources -------------------------------------------------------------
health_summary: []
failed_validations: []

# --- Optional Overrides -------------------------------------------------------
report_verdict: ""
dry_run: false
target_version: ""
upgrade_path: []
