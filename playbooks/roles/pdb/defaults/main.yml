---
# ============================================================================
# Role Defaults: pdb (PodDisruptionBudgets)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Defines default parameters for the pdb role, which audits
#          PodDisruptionBudgets across all namespaces to detect zero-disruption
#          budgets (disruptionsAllowed == 0 with expectedPods > 0) that would
#          deadlock node draining during MachineConfigPool rollouts.
# Role / Playbook Dependencies: vars/paths.yml, vars/upgrade.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by pdb tasks
# ============================================================================

# Target ARO cluster name (string, mandatory)
# Sourced from vars/upgrade.yml or overridden via CLI --cluster
cluster_name: ""

# Enforce strict PodDisruptionBudget check (fail if any PDB allows 0 disruptions with active pods) (boolean, default: false)
# Sourced from vars/upgrade.yml (default: false — non-blocking WARN advisory per 14-check contract)
fail_on_zero_disruption_pdb: false

# Whether to exclude core OpenShift platform namespaces from zero-disruption deadlock audits (boolean, default: true)
# Sourced from vars/upgrade.yml or role defaults (prevents false positive halts on logging/monitoring singletons)
pdb_ignore_system_namespaces: true

# List of system namespace prefixes to ignore during zero-disruption deadlock audit (list of strings)
# Sourced from role defaults
pdb_system_namespaces:
  - "openshift-"
  - "kube-"

# Master toggle for enforcing gate failure on validation error (boolean, default: true)
# Sourced from role defaults or overridden by prevalidation scan during diagnostic sweeps
pdb_enforce_gate: true

# Maximum command retry attempts for transient API communication blips (integer, default: 3)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retries: 3

# Delay in seconds between command retry attempts (integer, default: 10)
# Sourced from vars/upgrade.yml or role defaults
oc_command_retry_delay: 10
