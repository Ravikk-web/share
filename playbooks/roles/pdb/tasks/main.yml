# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (shell, set_fact, fail, debug) work on both
#                 versions. Replace with FQCN only if adopting the
#                 ansible.builtin.* convention project-wide.
#                 | default('') guards are applied on all optional variables.
#
# pdb role — validates PodDisruptionBudget (PDB) configuration for node-drain blocking risks.
#
# Contract:
#   - Queries `oc get pdb --all-namespaces -o json` piped to `jq` (jq v1.5 compatible).
#   - Read-only operation; changed_when: false.
#   - Detects PDBs with maxUnavailable=0, minAvailable=replicas, or disruptionsAllowed=0 with active pods.
#   - Respects optional pdb_allow_list overrides (supports "namespace/name" or "name").
#   - Default behavior: WARN only (failed_when: false + recorded status; never auto-remediates).
#   - Governed by fail_on_zero_disruption_pdb: when true, escalates to a HARD gate fail; when false, records WARN.
#   - Exposes parsed facts (pdb_parsed_data, pdb_all_pdbs, pdb_offending_pdbs, pdb_status) for downstream consumption.
#   - Records a structured entry (PASS or WARN) into `health_summary` list via set_fact.

---
# Shell module chosen to pipe oc get pdb JSON output to jq (v1.5 compatible)
- name: Query PodDisruptionBudgets and evaluate drain disruption risk — oc get pdb
  shell: >-
    oc get pdb --all-namespaces -o json --kubeconfig "{{ kubeconfig_path }}" | jq -r '
      .items // [] | {
        "all": [
          .[] | {
            "namespace": .metadata.namespace,
            "name": .metadata.name,
            "minAvailable": (.spec.minAvailable // null),
            "maxUnavailable": (.spec.maxUnavailable // null),
            "currentHealthy": (.status.currentHealthy // 0),
            "desiredHealthy": (.status.desiredHealthy // 0),
            "disruptionsAllowed": (.status.disruptionsAllowed // 0),
            "expectedPods": (.status.expectedPods // 0)
          }
        ],
        "risky": [
          .[] | {
            "namespace": .metadata.namespace,
            "name": .metadata.name,
            "minAvailable": (.spec.minAvailable // null),
            "maxUnavailable": (.spec.maxUnavailable // null),
            "currentHealthy": (.status.currentHealthy // 0),
            "desiredHealthy": (.status.desiredHealthy // 0),
            "disruptionsAllowed": (.status.disruptionsAllowed // 0),
            "expectedPods": (.status.expectedPods // 0),
            "reason": (
              if (.spec.maxUnavailable == 0 or .spec.maxUnavailable == "0" or .spec.maxUnavailable == "0%") then
                "maxUnavailable is 0 (prevents node drain eviction)"
              elif (.status.expectedPods > 0 and .status.disruptionsAllowed == 0) then
                ("disruptionsAllowed is 0 (" + (.status.currentHealthy | tostring) + "/" + (.status.expectedPods | tostring) + " healthy pods)")
              elif (.spec.minAvailable != null and (.spec.minAvailable == .status.expectedPods or .spec.minAvailable == .status.currentHealthy or .spec.minAvailable == "100%") and (.status.expectedPods > 0 or .status.currentHealthy > 0)) then
                "minAvailable equals total replicas (disruptionsAllowed=0)"
              else
                "PDB configuration restricts pod evictions during drain"
              end
            )
          } | select(
            (.spec.maxUnavailable == 0 or .spec.maxUnavailable == "0" or .spec.maxUnavailable == "0%") or
            (.status.expectedPods > 0 and .status.disruptionsAllowed == 0) or
            (.spec.minAvailable != null and (.spec.minAvailable == .status.expectedPods or .spec.minAvailable == .status.currentHealthy or .spec.minAvailable == "100%") and (.status.expectedPods > 0 or .status.currentHealthy > 0))
          )
        ]
      }
    '
  register: pdb_raw_query
  changed_when: false
  failed_when: false

- name: Parse PodDisruptionBudgets JSON payload
  set_fact:
    pdb_parsed_data: "{{ pdb_raw_query.stdout | from_json }}"
  when: (pdb_raw_query.rc | default(1) == 0) and (pdb_raw_query.stdout | default('') | trim != '')

- name: Fallback PodDisruptionBudgets payload on query failure
  set_fact:
    pdb_parsed_data:
      all: []
      risky:
        - namespace: "all"
          name: "pdb-query-failure"
          minAvailable: null
          maxUnavailable: null
          currentHealthy: 0
          desiredHealthy: 0
          disruptionsAllowed: 0
          expectedPods: 0
          reason: "Failed to execute oc get pdb: {{ pdb_raw_query.stderr | default(pdb_raw_query.stdout | default('Unknown error')) | trim }}"
  when: (pdb_raw_query.rc | default(1) != 0) or (pdb_raw_query.stdout | default('') | trim == '')

- name: Extract all PodDisruptionBudgets list
  set_fact:
    pdb_all_pdbs: "{{ pdb_parsed_data.all | default([]) }}"

- name: Initialize offending PodDisruptionBudgets list
  set_fact:
    pdb_offending_pdbs: []

- name: Filter offending PodDisruptionBudgets against pdb_allow_list
  set_fact:
    pdb_offending_pdbs: "{{ pdb_offending_pdbs + [item] }}"
  loop: "{{ pdb_parsed_data.risky | default([]) }}"
  when: >-
    (item.name not in (pdb_allow_list | default([]))) and
    ((item.namespace + '/' + item.name) not in (pdb_allow_list | default([])))

- name: Determine PodDisruptionBudgets health verdict
  set_fact:
    pdb_status: "{{ 'WARN' if ((pdb_offending_pdbs | length) > 0) else 'PASS' }}"

- name: Display PodDisruptionBudgets inspection summary
  debug:
    msg: >-
      Cluster '{{ cluster_name | default('UNKNOWN') }}': Scanned {{ pdb_all_pdbs | length }} PodDisruptionBudget(s).
      Found {{ pdb_offending_pdbs | length }} blocking-drain risk PDB(s)
      (Allow-listed: {{ pdb_allow_list | default([]) | length }}).
      Status: {{ pdb_status }} (Escalation to HARD: {{ fail_on_zero_disruption_pdb | default(false) }}).

- name: Enforce HARD gate on zero-disruption PDBs when escalation is enabled
  fail:
    msg: >-
      PodDisruptionBudget check FAILED (HARD gate via fail_on_zero_disruption_pdb=true) on cluster '{{ cluster_name | default('UNKNOWN') }}'.
      Found {{ pdb_offending_pdbs | length }} PDB(s) with zero allowed disruptions that would block node draining during upgrade:
      {% for pdb in pdb_offending_pdbs %}
        - {{ pdb.namespace }}/{{ pdb.name }}: {{ pdb.reason }} (minAvailable={{ pdb.minAvailable | default('none') }}, maxUnavailable={{ pdb.maxUnavailable | default('none') }}, disruptionsAllowed={{ pdb.disruptionsAllowed }})
      {% endfor %}
      Resolve or adjust PDBs to allow at least 1 disruption before initiating upgrade operations.
  when: (fail_on_zero_disruption_pdb | default(false)) and ((pdb_offending_pdbs | length) > 0)

- name: Record PodDisruptionBudgets status in health_summary
  set_fact:
    health_summary: "{{ (health_summary | default([])) + [pdb_summary_entry] }}"
  vars:
    pdb_summary_entry:
      id: "{{ pdb_id | default('10') }}"
      name: "{{ pdb_name | default('Pod Disruption Budget (PDB) Risk') }}"
      gate: "{{ 'HARD' if (fail_on_zero_disruption_pdb | default(false)) else 'WARN' }}"
      status: "{{ pdb_status }}"
      observed: >-
        {% if pdb_status == 'PASS' %}
        All {{ pdb_all_pdbs | length }} PodDisruptionBudget(s) permit disruptions (no drain-blocking risks detected)
        {% else %}
        Found {{ pdb_offending_pdbs | length }} PodDisruptionBudget(s) with zero allowed disruptions (drain-blocking risk)
        {% endif %}
      details: >-
        {% if pdb_status == 'PASS' %}
        Verified {{ pdb_all_pdbs | length }} PodDisruptionBudgets across all namespaces on cluster {{ cluster_name | default('cluster') }}.
        {% else %}
        Risky PDBs: {% for p in pdb_offending_pdbs %}{{ p.namespace }}/{{ p.name }} ({{ p.reason }}){% if not loop.last %}, {% endif %}{% endfor %}.
        {% endif %}
      raw_output: "{{ pdb_offending_pdbs | to_json if pdb_status == 'WARN' else pdb_all_pdbs | to_json }}"

- name: Confirm PodDisruptionBudgets check evaluation
  debug:
    msg: >-
      {% if pdb_status == 'PASS' %}
      ✔ PASS [Check {{ pdb_id | default('10') }} - {{ pdb_name | default('Pod Disruption Budget (PDB) Risk') }}] —
      All {{ pdb_all_pdbs | length }} PDB(s) permit disruptions.
      {% else %}
      ! WARN [Check {{ pdb_id | default('10') }} - {{ pdb_name | default('Pod Disruption Budget (PDB) Risk') }}] —
      Found {{ pdb_offending_pdbs | length }} risky PDB(s). Non-blocking warning recorded.
      {% endif %}
