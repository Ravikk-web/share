---
# ============================================================================
# steps/common/login.yml - log in to the cluster and prove it is the right one
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Used by: main.yml (start of every run) and steps/05/poll.yml (expired token).
# Writes:  the run's own kubeconfig (kubeconfig_path), never ~/.kube/config.
# Why:     - the password goes to `oc login` on stdin, so it never appears in the
#            jump server's process list;
#          - rejected credentials are not retried (retries can lock the account);
#            only connection errors are;
#          - the session is checked against the configured API URL, the optional
#            cluster_id pin and desired_cluster_api_regex.
# ============================================================================

- name: "Login: Look up the API URL and account for {{ cluster_name }}"
  set_fact:
    cluster_api_url: "{{ clusters[cluster_name].api_url }}"
    cluster_username: "{{ clusters[cluster_name].username }}"
    cluster_password: "{{ clusters[cluster_name].password | default('') }}"
    cluster_expected_id: "{{ clusters[cluster_name].cluster_id | default('') }}"
  no_log: true

- name: "Login: Check that the credentials are configured"
  assert:
    that:
      - cluster_api_url | length > 0
      - cluster_username | length > 0
      - cluster_password | length > 0
    fail_msg: "api_url, username and password must be set for '{{ cluster_name }}' in vars/secrets.yml (password via its vault_* variable)."
  no_log: true

- name: "Login: Log in to {{ cluster_name }}"
  shell: |
    set -o pipefail
    IFS= read -r LOGIN_PW
    attempt=0
    while :; do
      attempt=$((attempt + 1))
      out="$(printf '%s\n' "$LOGIN_PW" | {{ oc_binary | default('oc') | quote }} login {{ cluster_api_url | quote }} \
        --username={{ cluster_username | quote }} \
        {{ '' if (login_password_via_stdin | default(true) | bool) else '--password="$LOGIN_PW"' }} \
        --kubeconfig={{ kubeconfig_path | quote }} \
        --insecure-skip-tls-verify={{ insecure_skip_tls_verify | default(true) | bool | lower }} 2>&1)"
      rc=$?
      if [ "$rc" -eq 0 ]; then result=ok; break; fi
      if printf '%s' "$out" | grep -qiE 'login failed|unauthorized|forbidden|invalid (username|password|credentials)'; then result=auth_failed; break; fi
      if [ "$attempt" -gt {{ oc_command_retries | default(3) | int }} ]; then result=unreachable; break; fi
      sleep {{ oc_command_retry_delay | default(10) | int }}
    done
    printf '%s\n' "$out" | tail -n 6
    echo "LOGIN_RESULT=${result} ATTEMPTS=${attempt}"
  args:
    executable: /bin/bash
    stdin: "{{ cluster_password }}"
  register: login_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: "Login: Stop if the login did not work"
  fail:
    msg: >-
      Login to '{{ cluster_name }}' at {{ cluster_api_url }} failed:
      {{ 'the credentials were rejected (not retried, to avoid locking the account)'
         if ('LOGIN_RESULT=auth_failed' in (login_raw.stdout | default('')))
         else 'the API server could not be reached after retries' }}.
      oc said: {{ (login_raw.stdout | default('') | regex_replace('LOGIN_RESULT=.*$', '') | trim
                   | replace(cluster_password, '******')) | truncate(700) }}
  when: "'LOGIN_RESULT=ok' not in (login_raw.stdout | default(''))"

# Why: `oc whoami --show-server` only echoes the local kubeconfig; `oc whoami` and the
#      clusterID need a real round trip, so together they prove which cluster answered.
- name: "Login: Read the session identity (API URL, user, cluster ID)"
  shell: |
    set -eo pipefail
    oc whoami --show-server
    oc whoami
    oc get clusterversion version -o jsonpath='{.spec.clusterID}'
    echo
  args:
    executable: /bin/bash
  register: login_identity_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: login_identity_raw.rc == 0

- name: "Login: Remember the session identity"
  set_fact:
    active_cluster_server: "{{ login_identity_raw.stdout_lines[0] | default('') | trim }}"
    active_cluster_user: "{{ login_identity_raw.stdout_lines[1] | default('') | trim }}"
    active_cluster_id: "{{ login_identity_raw.stdout_lines[2] | default('') | trim }}"
    cluster_session_active: true

- name: "Login: Stop if this is not the configured cluster"
  fail:
    msg: >-
      Connected to '{{ active_cluster_server }}' (cluster ID '{{ active_cluster_id }}') but expected
      '{{ cluster_api_url }}'{{ (" with cluster ID '" ~ cluster_expected_id ~ "'") if (cluster_expected_id | length > 0) else '' }}.
      Check api_url / cluster_id in vars/secrets.yml.
  when: >-
    ((active_cluster_server | lower | regex_replace('/+$', '')) != (cluster_api_url | lower | regex_replace('/+$', '')))
    or ((cluster_expected_id | length > 0) and (active_cluster_id != cluster_expected_id))
    or (not (active_cluster_server is match(desired_cluster_api_regex)))

- name: "Login: Logged in"
  debug:
    msg: "Logged in to {{ cluster_name }} as {{ active_cluster_user }} ({{ active_cluster_server }}, cluster ID {{ active_cluster_id }})."
