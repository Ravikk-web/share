---
# ============================================================================
# steps/common/logout.yml - end the session and delete the run's kubeconfig
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Used by: main.yml `always:` (every run, success or failure).
# Never fails: a logout problem must not hide the real result of the run.
# ============================================================================

- name: "Logout: Check whether a session kubeconfig exists"
  stat:
    path: "{{ kubeconfig_path }}"
  register: logout_kubeconfig_stat

- name: "Logout: Revoke the session token"
  command: "{{ oc_binary | default('oc') }} logout --kubeconfig={{ kubeconfig_path | quote }}"
  register: logout_result
  changed_when: logout_result.rc == 0
  failed_when: false
  no_log: true
  when: logout_kubeconfig_stat.stat.exists | default(false)

- name: "Logout: Delete the session kubeconfig"
  file:
    path: "{{ kubeconfig_path }}"
    state: absent
  failed_when: false

- name: "Logout: Session closed"
  set_fact:
    cluster_session_active: false
