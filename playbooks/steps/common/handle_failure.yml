---
# ============================================================================
# steps/common/handle_failure.yml - the run's only failure handler
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Used by: main.yml `rescue:` - any failed task in any phase lands here.
# Does:    1. works out what failed (error text, phase, exit code, RBAC hint)
#          2. records it in the phase results and the run log
#          3. writes logs/<cluster>_<ts>.status (00_Run.sh turns it into the exit code)
#          4. writes the run report
#          5. sends ONE alert mail
# Logout happens afterwards in main.yml `always:`.
# ============================================================================

# Why: stderr first (the real oc error), then the task's msg (fail / assert text).
- name: "Failure: Work out what failed"
  set_fact:
    run_failed: true
    resolved_error: >-
      {{ (ansible_failed_result.stderr | default('') | string | trim)
         or (ansible_failed_result.stderr_lines | default([]) | join('\n'))
         or (ansible_failed_result.msg | default('') | string | trim)
         or 'Unknown error - see the run log' }}
    # Why: the monitor sets failure_exit_code to 30 when a hop stops progressing or times out.
    failure_exit_code: "{{ failure_exit_code | default(phase_exit_codes[current_phase] | default(99), true) | int }}"
    failure_reason: >-
      {{ (current_hop_label ~ ' -> ' ~ current_hop_target ~ ' failed')
         if (current_phase == '03' and (current_hop_target | default('') | length > 0))
         else (phase_names[current_phase] | default(current_phase)) ~ ' failed' }}

# Why: Kubernetes denials read "... cannot <verb> resource "<resource>" in API group "<group>" ...".
- name: "Failure: Check whether it was a permission problem"
  set_fact:
    is_rbac_error: "{{ (resolved_error | lower) is search('forbidden|unauthorized|cannot (get|list|watch|create|update|patch|delete) resource') }}"
    rbac_missing_verb: "{{ (resolved_error | regex_search('cannot [a-z]+ resource') | default('', true)) | regex_replace('^cannot | resource$', '') }}"
    rbac_missing_resource: "{{ (resolved_error | regex_search('resource \"[^\"]+\"') | default('', true)) | regex_replace('^resource \"|\"$', '') }}"
    rbac_missing_group: "{{ (resolved_error | regex_search('API group \"[^\"]*\"') | default('', true)) | regex_replace('^API group \"|\"$', '') }}"

# Why: templates/error-report.j2 (the alert mail) reads these names.
- name: "Failure: Fill in the alert mail details"
  set_fact:
    current_step_no: "{{ 'Login' if current_phase == 'login' else ('Phase ' ~ current_phase) }}"
    failed_task_name: >-
      {{ (current_hop_label ~ ' -> ' ~ current_hop_target)
         if (current_phase == '03' and (current_hop_target | default('') | length > 0))
         else (phase_names[current_phase] | default(current_phase)) }}
    failed_gate_type: "HARD"
    rbac_check_command: >-
      oc auth can-i {{ rbac_missing_verb or '*' }} {{ (rbac_missing_resource or '*') ~ (('.' ~ rbac_missing_group) if (rbac_missing_group | length > 0) else '') }} --all-namespaces
    rbac_remediation_cmd: "oc adm policy add-cluster-role-to-user cluster-admin {{ cluster_username | default('<npid>', true) }}"

- name: "Failure: Record it in the phase and hop results"
  set_fact:
    run_phase_results: >-
      {{ run_phase_results + [{'phase': current_phase, 'name': phase_names[current_phase] | default(current_phase),
                               'status': 'FAIL', 'detail': resolved_error | regex_replace('[\r\n]+', ' ') | truncate(300)}] }}
    hop_results: >-
      {{ hop_results + ([{'hop_label': current_hop_label, 'target': current_hop_target, 'status': 'FAILED', 'duration': ''}]
                        if (current_phase == '03' and (current_hop_target | default('') | length > 0)) else []) }}

- name: "Failure: Log it"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "FAIL"
    event_task: "{{ failure_reason }}"
    event_reason: "exit code {{ failure_exit_code }}"
    event_observed: "{{ resolved_error }}"

# Why: plain key=value lines so 00_Run.sh can read them with grep (no Python needed).
- name: "Failure: Write the status file for 00_Run.sh"
  copy:
    content: |
      exit_code={{ failure_exit_code }}
      phase={{ current_phase }}
      reason={{ (failure_reason ~ ': ' ~ resolved_error) | regex_replace('[\r\n]+', ' ') | truncate(500) }}
    dest: "{{ status_file }}"
    mode: "0640"
  failed_when: false

# Why: a template problem must never stop the alert from going out.
- name: "Failure: Write the run report"
  block:
    - name: "Failure: Write the report"
      include_tasks: "{{ playbook_dir }}/steps/common/write_report.yml"
  rescue:
    - name: "Failure: The report could not be written (the alert is still sent)"
      debug:
        msg: "[WARN] Report not written: {{ ansible_failed_result.msg | default('unknown error') }}"

- name: "Failure: Send the alert"
  include_tasks: "{{ playbook_dir }}/steps/common/send_mail.yml"
  vars:
    mail_kind: "alert"
    mail_headline: "{{ failure_reason | truncate(110) }}"
    mail_attachments: ["{{ report_file }}", "{{ log_file }}"]
  when: send_email | default(true) | bool
