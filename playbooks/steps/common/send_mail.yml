---
# ============================================================================
# steps/common/send_mail.yml - send one mail
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: the `mail` module comes from the community.general collection.
#                 00_Run.sh sets send_email=false when it is missing.
#
# Inputs (include vars):
#   mail_kind         summary | alert | heartbeat | degradation
#   mail_headline     short ASCII text for the subject
#   mail_attachments  list of files (missing files are skipped)
#
# Who gets it:
#   summary, heartbeat   -> --mail-to if given, else mail_to
#   alert, degradation   -> alert_mail_to + (--mail-to if given, else mail_to)
#
# The four mails of a run: heartbeat every heartbeat_minutes while the cluster is
# updating, one degradation alert per new problem, then either ONE summary
# (success) or ONE alert (failure). Callers include this file only when
# send_email is true. An SMTP error is logged as WARN and never fails the run.
# ============================================================================

- name: "Mail: {{ mail_kind }}"
  when: _mail_to | length > 0
  vars:
    _mail_info_to: "{{ mail_to_cli if (mail_to_cli | default([]) | length > 0) else (mail_to | default([])) }}"
    _mail_to: >-
      {{ (((alert_mail_to | default([])) + _mail_info_to) if mail_kind in ['alert', 'degradation'] else _mail_info_to) | unique | list }}
    _mail_tag: "{{ {'summary': run_mode | upper, 'alert': 'ALERT', 'heartbeat': 'HEARTBEAT', 'degradation': 'DEGRADED'}[mail_kind] }}"
    _mail_template: "{{ {'summary': 'mail-summary.j2', 'alert': 'mail-alert.j2', 'heartbeat': 'mail-progress.j2', 'degradation': 'mail-progress.j2'}[mail_kind] }}"
    _mail_subject: "{{ mail_subject_prefix | default('[ARO Upgrade]') }}[{{ cluster_name }}][{{ _mail_tag }}] {{ mail_headline }} (run {{ run_timestamp }})"
  block:
    - name: "Mail: Send '{{ mail_headline }}'"
      mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_port | int }}"
        from: "{{ mail_from }}"
        to: "{{ _mail_to }}"
        subject: "{{ _mail_subject }}"
        body: "{{ lookup('template', playbook_dir ~ '/templates/' ~ _mail_template) }}"
        subtype: html
        charset: "utf-8"
        attach: "{{ mail_attachments | default([]) | select('exists') | list }}"
        # Why: stable headers let mail rules group every mail of one run.
        headers:
          - "X-ARO-Run-ID={{ run_timestamp }}"
          - "X-ARO-Cluster={{ cluster_name }}"
          - "X-ARO-Event={{ mail_kind }}"
        timeout: "{{ mail_timeout_seconds | default(30) | int }}"
        username: "{{ smtp_username if (smtp_username | default('') | length > 0) else omit }}"
        password: "{{ smtp_password if (smtp_password | default('') | length > 0) else omit }}"
        secure: "{{ smtp_secure if (smtp_secure | default('') | length > 0) else omit }}"

    - name: "Mail: Log the sent mail"
      include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
      vars:
        event_status: "INFO"
        event_task: "Mail ({{ mail_kind }})"
        event_reason: "Sent: {{ _mail_subject }}"
        event_observed: "to {{ _mail_to | join(';') }}"

  rescue:
    - name: "Mail: Could not send (the run continues)"
      debug:
        msg: "[WARN] The {{ mail_kind }} mail was not sent: {{ ansible_failed_result.msg | default('SMTP error') }}"

    - name: "Mail: Log the failed mail"
      include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
      vars:
        event_status: "WARN"
        event_task: "Mail ({{ mail_kind }})"
        event_reason: "Not sent: {{ _mail_subject }}"
        event_observed: "{{ ansible_failed_result.msg | default('SMTP error') }}"
