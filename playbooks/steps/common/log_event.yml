---
# ============================================================================
# steps/common/log_event.yml - append one event to the run log (.txt and .csv)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Inputs (include vars): event_status (PASS, FAIL, WARN, INFO, START, AUTO-FIX ...),
#                        event_task, event_reason, event_observed (optional)
# Why:     00_Run.sh tees the console into the same .txt file. `printf >>` appends to
#          the same file; lineinfile would replace it and cut off the console log.
# Never fails the run.
# ============================================================================

- name: "Log: {{ event_status | default('INFO') }} - {{ event_task | default('event') }}"
  shell: |
    mkdir -p {{ log_dir | quote }}
    ts="$(date +%Y-%m-%dT%H:%M:%S)"
    printf '[%s] %s\n' "$ts" {{ _line | quote }} >> {{ log_file | quote }}
    [ -s {{ csv_file | quote }} ] || printf '%s\n' 'timestamp,cluster,phase,task,status,reason,observed' >> {{ csv_file | quote }}
    printf '"%s",%s\n' "$ts" {{ _csv_row | quote }} >> {{ csv_file | quote }}
  args:
    executable: /bin/bash
  vars:
    # Why: newlines are collapsed so every event is exactly one line.
    _line: >-
      {{ ('[' ~ (event_status | default('INFO')) ~ '] [' ~ (current_phase | default('')) ~ '] '
          ~ (event_task | default('Event')) ~ ': ' ~ (event_reason | default(''))
          ~ ((' | ' ~ (event_observed | string)) if (event_observed | default('') | string | length > 0) else ''))
         | regex_replace('[\r\n]+', ' ') }}
    # Why: CSV quoting - embedded quotes doubled, one physical line per row.
    _csv_row: >-
      {%- set cols = [cluster_name, current_phase | default(''), event_task | default('Event'), event_status | default('INFO'),
                      event_reason | default(''), event_observed | default('')] -%}
      {%- set out = [] -%}
      {%- for c in cols -%}{%- set _ = out.append('"' ~ (c | string | replace('"', '""') | regex_replace('[\r\n]+', ' ')) ~ '"') -%}{%- endfor -%}
      {{ out | join(',') }}
  changed_when: false
  failed_when: false
