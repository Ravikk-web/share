---
# Precheck 06 - etcd (HARD)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: at least 3 etcd pods, all Running and Ready, and ClusterOperator etcd
#       Available=True, Degraded=False.

- name: "Check 06: Read the etcd pods and the etcd ClusterOperator"
  shell: |
    set -o pipefail
    oc get pods -n openshift-etcd -l app=etcd -o json | jq -c '{
      total: ((.items // []) | length),
      unready: [(.items // [])[] | select((.status.phase != "Running")
                 or ((((.status.conditions // []) | map(select(.type == "Ready")) | .[0].status) // "False" | tostring) != "True")) | .metadata.name]}'
    oc get clusteroperator etcd -o json | jq -c '{
      available: (((.status.conditions // []) | map(select(.type == "Available")) | .[0].status) // "False" | tostring),
      degraded: (((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "True" | tostring)}'
  args:
    executable: /bin/bash
  register: c06_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: c06_raw.rc == 0

- name: "Check 06: Record the result"
  set_fact:
    preval_checks: >-
      {{ preval_checks + [{'num': 6, 'name': 'etcd', 'gate': 'HARD',
           'status': 'PASS' if (_ok | bool) else 'FAIL',
           'observed': 'etcd pods: ' ~ _pods.total ~ ' (not ready: ' ~ (_pods.unready | join(', ') or 'none') ~ ', at least 3 healthy needed);'
                       ~ ' ClusterOperator etcd Available=' ~ _co.available ~ ', Degraded=' ~ _co.degraded}] }}
  vars:
    _pods: "{{ c06_raw.stdout_lines[0] | from_json }}"
    _co: "{{ c06_raw.stdout_lines[1] | from_json }}"
    _ok: >-
      {{ (_pods.total | int) >= 3 and (_pods.unready | length == 0)
         and (_co.available | string | lower == 'true') and (_co.degraded | string | lower != 'true') }}
