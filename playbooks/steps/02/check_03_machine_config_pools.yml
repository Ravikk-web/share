---
# Precheck 03 - MachineConfigPools (HARD, fixed by Phase 03 task 1)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: every pool Updated=True, not Degraded, not paused.
# Phase 03 task 1 (steps/03/task_1_unpause_pools.yml) unpauses paused pools that are on
# mcp_auto_unpause_list. With preval_defer_fixes, a failure made only of such pools
# (none Degraded) is recorded as WARN "Phase 03 will unpause ...".
# Sets: mcp_paused_pools.

- name: "Check 03: Read MachineConfigPools"
  shell: |
    set -o pipefail
    oc get mcp -o json | jq -c '
      def cstat(t; d): (((.status.conditions // []) | map(select(.type == t)) | .[0].status) // d | tostring);
      {
        total: (.items | length),
        paused: [.items[] | select((.spec.paused // false) == true) | .metadata.name],
        degraded: [.items[] | select(cstat("Degraded"; "True") == "True") | .metadata.name],
        not_updated: [.items[] | select(cstat("Updated"; "False") != "True") | .metadata.name]
      }'
  args:
    executable: /bin/bash
  register: c03_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: c03_raw.rc == 0

# Why: a paused pool usually also reads "not updated" (its new configuration is held
#      back); unpausing fixes both. A Degraded pool, or a pool that is not updated
#      for any other reason, is not something unpausing fixes.
- name: "Check 03: Record the result"
  set_fact:
    mcp_paused_pools: "{{ _p.paused }}"
    preval_deferred: "{{ preval_deferred + ([3] if (_defer | bool) else []) }}"
    preval_checks: >-
      {{ preval_checks + [{'num': 3, 'name': 'MachineConfigPools', 'gate': 'HARD',
           'status': 'PASS' if (_bad | length == 0) else ('WARN' if (_defer | bool) else 'FAIL'),
           'observed': ('All ' ~ _p.total ~ ' pools updated, not degraded, not paused') if (_bad | length == 0)
                       else ('Paused: ' ~ (_p.paused | join(', ') or 'none') ~ '; degraded: ' ~ (_p.degraded | join(', ') or 'none')
                             ~ '; not updated: ' ~ (_p.not_updated | join(', ') or 'none')
                             ~ (('; Phase 03 will unpause ' ~ (_fixable | join(', ')) ~ ' and watch the node rollout') if (_defer | bool) else ''))}] }}
  vars:
    _p: "{{ c03_raw.stdout | from_json }}"
    _bad: "{{ (_p.paused + _p.degraded + _p.not_updated) | unique }}"
    _fixable: "{{ _p.paused | intersect(mcp_auto_unpause_list | default([])) }}"
    _defer: >-
      {{ (preval_defer_fixes | default(false) | bool)
         and (auto_remediation_enabled | default(true) | bool) and (auto_unpause_mcp | default(true) | bool)
         and (_bad | length > 0) and (_p.degraded | length == 0)
         and (_bad | difference(_fixable) | length == 0) }}
