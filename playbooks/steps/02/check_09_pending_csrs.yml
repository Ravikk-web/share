---
# Precheck 09 - Pending CSRs (WARN)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: no CertificateSigningRequest is waiting for approval (a CSR with no conditions).

- name: "Check 09: Read pending CSRs"
  shell: |
    set -o pipefail
    oc get csr -o json | jq -c '[(.items // [])[] | select(((.status.conditions // []) | length) == 0) | .metadata.name]'
  args:
    executable: /bin/bash
  register: c09_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: c09_raw.rc == 0

- name: "Check 09: Record the result"
  set_fact:
    preval_checks: >-
      {{ preval_checks + [{'num': 9, 'name': 'Pending CSRs', 'gate': 'WARN',
           'status': 'PASS' if (_csrs | length == 0) else 'WARN',
           'observed': 'No pending CSRs' if (_csrs | length == 0) else ((_csrs | length) ~ ' pending: ' ~ (_csrs | join(', ') | truncate(300)))}] }}
  vars:
    _csrs: "{{ c09_raw.stdout | from_json }}"
