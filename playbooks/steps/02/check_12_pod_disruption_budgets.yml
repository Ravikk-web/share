---
# Precheck 12 - PodDisruptionBudgets (WARN, or HARD when fail_on_zero_disruption_pdb)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: no PodDisruptionBudget allows 0 disruptions while it covers running pods -
#       such a budget blocks the node drain during the update.
# When HARD, budgets in openshift-* and kube-* namespaces are ignored (platform
# components such as logging run with 0 allowed disruptions by design).

- name: "Check 12: Read PodDisruptionBudgets"
  shell: |
    set -o pipefail
    oc get pdb -A -o json | jq -c '{
      total: ((.items // []) | length),
      zero: [(.items // [])[] | select(((.status.disruptionsAllowed // 0) == 0) and ((.status.expectedPods // 0) > 0))
             | "\(.metadata.namespace)/\(.metadata.name)"]}'
  args:
    executable: /bin/bash
  register: c12_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: c12_raw.rc == 0

- name: "Check 12: Record the result"
  set_fact:
    preval_checks: >-
      {{ preval_checks + [{'num': 12, 'name': 'PodDisruptionBudgets', 'gate': _gate,
           'status': 'PASS' if (_counted | length == 0) else ('FAIL' if _gate == 'HARD' else 'WARN'),
           'observed': ('No budget blocks a node drain (' ~ _pdb.total ~ ' checked)') if (_pdb.zero | length == 0)
                       else ('Budgets allowing 0 disruptions: ' ~ (_pdb.zero | join(', ') | truncate(300))
                             ~ ((' (platform namespaces ignored for the gate)') if _gate == 'HARD' else ''))}] }}
  vars:
    _pdb: "{{ c12_raw.stdout | from_json }}"
    _gate: "{{ 'HARD' if (fail_on_zero_disruption_pdb | default(false) | bool) else 'WARN' }}"
    _counted: >-
      {%- set out = [] -%}
      {%- for name in _pdb.zero if (_gate == 'WARN') or not (name.startswith('openshift-') or name.startswith('kube-')) -%}
      {%- set _ = out.append(name) -%}
      {%- endfor -%}
      {{ out }}
