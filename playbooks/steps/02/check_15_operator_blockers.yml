---
# Precheck 15 - Operator upgrade blockers (HARD, fixed by Phase 03 task 3 when possible)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: no installed operator stops the cluster upgrade:
#         - its CSV declares olm.maxOpenShiftVersion below the highest hop, or
#         - OLM (ClusterOperator operator-lifecycle-manager) reports Upgradeable=False.
# Reads every installed operator with steps/02/read_operators.yml and keeps the rows
# in `installed_operators`, which Check 16 and the report use.
# Phase 03 task 3 approves pending operator upgrades. With preval_defer_fixes and
# approvals switched on, a failure where every blocking operator has an upgrade
# pending is recorded as WARN; Phase 03 stops the run if they still block afterwards.
# A blocking operator with nothing pending is a FAIL: change its channel or remove it.

- name: "Check 15: Read the installed operators"
  include_tasks: "{{ playbook_dir }}/steps/02/read_operators.yml"

- name: "Check 15: Record the result"
  set_fact:
    installed_operators: "{{ operators_scan }}"
    preval_deferred: "{{ preval_deferred + ([15] if (_defer | bool) else []) }}"
    preval_checks: >-
      {{ preval_checks + [{'num': 15, 'name': 'Operator upgrade blockers', 'gate': 'HARD',
           'status': 'PASS' if not (_problem | bool) else ('WARN' if (_defer | bool) else 'FAIL'),
           'observed': (operators_scan | length) ~ ' operator(s) checked against OpenShift ' ~ (target_max_version or '?') ~ '.'
                       ~ ((' Blocking (olm.maxOpenShiftVersion too low): ' ~ (_blocking | join(', ')) ~ '.') if (_blocking | length > 0) else ' None declares a lower maximum version.')
                       ~ ((' OLM reports Upgradeable=False (' ~ olm_upgradeable.reason ~ '): ' ~ olm_upgradeable.message) if (_olm_blocks | bool) else '')
                       ~ (' Each has an upgrade pending: Phase 03 approves it and stops the run if the operator still blocks.' if (_defer | bool)
                          else ((' No upgrade pending for: ' ~ (_stuck | join(', ')) ~ ' - change the subscription channel to one that supports the target, or remove the operator.') if (_stuck | length > 0)
                          else (' Upgrade or remove them first.' if (_blocking | length > 0) else '')))}] }}
  vars:
    _blocking_rows: >-
      {%- set out = [] -%}
      {%- for o in operators_scan if o.blocks_upgrade | bool -%}{%- set _ = out.append(o) -%}{%- endfor -%}
      {{ out }}
    _blocking: >-
      {%- set out = [] -%}
      {%- for o in _blocking_rows -%}{%- set _ = out.append(o.package ~ ' (max ' ~ o.max_ocp ~ ')') -%}{%- endfor -%}
      {{ out }}
    _stuck: >-
      {%- set out = [] -%}
      {%- for o in _blocking_rows if not (o.pending | bool) -%}{%- set _ = out.append(o.package) -%}{%- endfor -%}
      {{ out }}
    _olm_blocks: "{{ (olm_upgradeable.status | lower) == 'false' }}"
    _problem: "{{ (_blocking_rows | length > 0) or (_olm_blocks | bool) }}"
    _defer: >-
      {{ (_blocking_rows | length > 0) and (_stuck | length == 0)
         and (preval_defer_fixes | default(false) | bool)
         and (preupgrade_operator_upgrades | default(true) | bool) and not (skip_operator_upgrade | default(false) | bool) }}
