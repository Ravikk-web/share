---
# Precheck 14 - cgroup mode (HARD, fixed by Phase 03 task 2)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: OpenShift 4.19+ cannot run on cgroup v1, so when any hop of the path is 4.19
#       or later, nodes.config/cluster must be cgroupMode v2. An empty cgroupMode means
#       the historical default, which is v1 on clusters installed before 4.14.
# Phase 03 task 2 (steps/03/task_2_cgroup_v2.yml) sets v2; all nodes reboot before the
# first hop. With preval_defer_fixes and the fix switched on, v1 is recorded as WARN.
# skip_cgroup_check: true turns the check into a WARN (not recommended).

- name: "Check 14: Read the cluster cgroup mode"
  shell: |
    set -o pipefail
    oc get nodes.config/cluster -o json | jq -r '(.spec.cgroupMode // "") | tostring'
  args:
    executable: /bin/bash
  register: c14_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: c14_raw.rc == 0

# Why: versions are compared with split('.') - regex backreferences inside YAML-quoted
#      Jinja turn into control characters (the old check never required v2).
- name: "Check 14: Record the result"
  set_fact:
    preval_deferred: "{{ preval_deferred + ([14] if (_defer | bool) else []) }}"
    preval_checks: >-
      {{ preval_checks + [{'num': 14, 'name': 'cgroup mode', 'gate': 'HARD',
           'status': 'PASS' if not (_problem | bool) else ('WARN' if ((skip_cgroup_check | default(false) | bool) or (_defer | bool)) else 'FAIL'),
           'observed': 'Cluster cgroupMode is ' ~ _mode ~ ('' if (c14_raw.stdout | trim | length > 0) else ' (not set: historical default)')
                       ~ ('; the highest hop ' ~ target_max_version ~ (' needs v2' if (_needs_v2 | bool) else ' does not need v2'))
                       ~ ('; skip_cgroup_check is true' if ((skip_cgroup_check | default(false) | bool) and (_problem | bool)) else '')
                       ~ ('; Phase 03 will set cgroupMode v2 (every node reboots) and watch the node rollout' if (_defer | bool) else '')}] }}
  vars:
    _mode: "{{ (c14_raw.stdout | trim) if (c14_raw.stdout | trim | length > 0) else 'v1' }}"
    _p: "{{ (target_max_version | string).split('.') }}"
    _needs_v2: "{{ (_p | length >= 2) and (((_p[0] | int) > 4) or (((_p[0] | int) == 4) and ((_p[1] | int) >= 19))) }}"
    _problem: "{{ (_needs_v2 | bool) and _mode != 'v2' }}"
    _defer: >-
      {{ (_problem | bool) and not (skip_cgroup_check | default(false) | bool)
         and (preval_defer_fixes | default(false) | bool)
         and (auto_remediation_enabled | default(true) | bool) and (auto_fix_cgroup_v2 | default(true) | bool) }}
