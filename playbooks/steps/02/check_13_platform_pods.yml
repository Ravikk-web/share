---
# Precheck 13 - Platform pods (WARN)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: no pod in an openshift-* namespace is Failed or stuck in CrashLoopBackOff,
#       ImagePullBackOff, ErrImagePull, CreateContainerConfigError or Error.

- name: "Check 13: Read unhealthy platform pods"
  shell: |
    set -o pipefail
    oc get pods -A -o json | jq -c '
      [ (.items // [])[]
        | select((.metadata.namespace // "") | startswith("openshift-"))
        | select(((.status.containerStatuses // []) | any(
                   ((.state.waiting.reason // "") == "CrashLoopBackOff") or
                   ((.state.waiting.reason // "") == "ImagePullBackOff") or
                   ((.state.waiting.reason // "") == "ErrImagePull") or
                   ((.state.waiting.reason // "") == "CreateContainerConfigError") or
                   ((.state.waiting.reason // "") == "Error")))
                 or ((.status.phase // "") == "Failed"))
        | "\(.metadata.namespace)/\(.metadata.name)" ]'
  args:
    executable: /bin/bash
  register: c13_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: c13_raw.rc == 0

- name: "Check 13: Record the result"
  set_fact:
    preval_checks: >-
      {{ preval_checks + [{'num': 13, 'name': 'Platform pods', 'gate': 'WARN',
           'status': 'PASS' if (_pods | length == 0) else 'WARN',
           'observed': 'No failing pods in openshift-* namespaces' if (_pods | length == 0)
                       else ((_pods | length) ~ ' failing: ' ~ (_pods | join(', ') | truncate(300)))}] }}
  vars:
    _pods: "{{ c13_raw.stdout | from_json }}"
