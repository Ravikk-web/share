---
# Precheck 05 - API server readiness (HARD)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: GET /readyz returns "ok".

# Why: a short in-shell retry rides out an API server restart. It is not an Ansible
#      `until`, because a task whose retries run out is failed even with
#      failed_when: false - here the last answer must become the check result.
- name: "Check 05: Ask the API server /readyz"
  shell: |
    for attempt in 1 2 3 4; do
      answer="$(oc get --raw=/readyz 2>&1)"
      [ "$answer" = "ok" ] && break
      sleep {{ oc_command_retry_delay | default(10) | int }}
    done
    printf '%s\n' "$answer"
  args:
    executable: /bin/bash
  register: c05_raw
  changed_when: false
  failed_when: false

- name: "Check 05: Record the result"
  set_fact:
    preval_checks: >-
      {{ preval_checks + [{'num': 5, 'name': 'API server readiness', 'gate': 'HARD',
           'status': 'PASS' if (_answer == 'ok') else 'FAIL',
           'observed': '/readyz answered ok' if (_answer == 'ok') else ('/readyz answered: ' ~ (_answer | truncate(200) or 'nothing'))}] }}
  vars:
    _answer: "{{ c05_raw.stdout | default('') | trim }}"
