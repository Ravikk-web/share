---
# Precheck 11 - PersistentVolumeClaims (WARN)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: every PersistentVolumeClaim is Bound.

- name: "Check 11: Read PersistentVolumeClaims"
  shell: |
    set -o pipefail
    oc get pvc -A -o json | jq -c '{
      total: ((.items // []) | length),
      bad: [(.items // [])[] | select((.status.phase // "") != "Bound") | "\(.metadata.namespace)/\(.metadata.name) (\(.status.phase // "Unknown"))"]}'
  args:
    executable: /bin/bash
  register: c11_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: c11_raw.rc == 0

- name: "Check 11: Record the result"
  set_fact:
    preval_checks: >-
      {{ preval_checks + [{'num': 11, 'name': 'PersistentVolumeClaims', 'gate': 'WARN',
           'status': 'PASS' if (_pvc.bad | length == 0) else 'WARN',
           'observed': ('All ' ~ _pvc.total ~ ' PersistentVolumeClaims Bound') if (_pvc.bad | length == 0)
                       else ((_pvc.bad | length) ~ ' of ' ~ _pvc.total ~ ' not Bound: ' ~ (_pvc.bad | join(', ') | truncate(300)))}] }}
  vars:
    _pvc: "{{ c11_raw.stdout | from_json }}"
