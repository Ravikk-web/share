---
# Precheck 01 - ClusterOperators (HARD)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: every ClusterOperator outside co_allow_list is Available=True and Degraded=False.

- name: "Check 01: Read ClusterOperators"
  shell: |
    set -o pipefail
    oc get clusteroperators -o json | jq -c '{
      total: (.items | length),
      degraded: [.items[] | select((((.status.conditions // []) | map(select(.type == "Degraded")) | .[0].status) // "True" | tostring) == "True") | .metadata.name],
      unavailable: [.items[] | select((((.status.conditions // []) | map(select(.type == "Available")) | .[0].status) // "False" | tostring) != "True") | .metadata.name]
    }'
  args:
    executable: /bin/bash
  register: c01_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: c01_raw.rc == 0

- name: "Check 01: Record the result"
  set_fact:
    preval_checks: >-
      {{ preval_checks + [{'num': 1, 'name': 'ClusterOperators', 'gate': 'HARD',
           'status': 'PASS' if (_bad | length == 0) else 'FAIL',
           'observed': ('All ' ~ _co.total ~ ' ClusterOperators are Available and not Degraded') if (_bad | length == 0)
                       else ('Degraded: ' ~ (_degraded | join(', ') or 'none') ~ '; not Available: ' ~ (_unavailable | join(', ') or 'none'))}] }}
  vars:
    _co: "{{ c01_raw.stdout | from_json }}"
    _degraded: "{{ _co.degraded | difference(co_allow_list | default([])) }}"
    _unavailable: "{{ _co.unavailable | difference(co_allow_list | default([])) }}"
    _bad: "{{ (_degraded + _unavailable) | unique }}"
