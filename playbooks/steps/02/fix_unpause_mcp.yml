---
# ============================================================================
# steps/02/fix_unpause_mcp.yml - auto-fix for Check 03: unpause allow-listed pools
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Cluster write: MachineConfigPool spec.paused = false, only for paused pools that
#                are on mcp_auto_unpause_list. Other paused pools stay paused.
# Effect:        a pool with pending configuration starts rolling (node reboots);
#                Phase 02 waits for that rollout, then re-checks.
# Records:       remediation_attempted_nums (+3), remediation_rollout_needed,
#                preval_autofix_items.
# ============================================================================

- name: "Fix paused pools: Unpause {{ item }}"
  command: "oc patch mcp {{ item | quote }} --type=merge -p '{\"spec\":{\"paused\":false}}'"
  loop: "{{ mcp_paused_pools | intersect(mcp_auto_unpause_list | default([])) }}"
  register: fix_unpause
  changed_when: fix_unpause.rc == 0
  failed_when: false

- name: "Fix paused pools: Record the attempt"
  set_fact:
    remediation_attempted_nums: "{{ remediation_attempted_nums + [3] }}"
    remediation_rollout_needed: "{{ (remediation_rollout_needed | bool) or (_unpaused | length > 0) }}"
    preval_autofix_items: >-
      {{ preval_autofix_items + ([{'name': 'Unpaused MachineConfigPools (' ~ (_unpaused | join(', ')) ~ ')',
           'action': 'Set spec.paused=false on ' ~ (_unpaused | join(', ')) ~ ' and waited for the node rollout.',
           'reference': 'https://docs.openshift.com/container-platform/latest/post_installation_configuration/machine-configuration-tasks.html'}]
          if (_unpaused | length > 0) else []) }}
  vars:
    _unpaused: "{{ fix_unpause.results | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"

- name: "Fix paused pools: Log it"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "{{ 'AUTO-FIX' if (_unpaused | length > 0) else 'FIX-FAILED' }}"
    event_task: "Unpause MachineConfigPools (Check 03)"
    event_reason: "Unpaused: {{ _unpaused | join(', ') or 'none' }}; left paused (not on mcp_auto_unpause_list): {{ mcp_paused_pools | difference(mcp_auto_unpause_list | default([])) | join(', ') or 'none' }}"
    event_observed: "{{ fix_unpause.results | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | map(attribute='stderr') | join('; ') }}"
    _unpaused: "{{ fix_unpause.results | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
