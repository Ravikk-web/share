---
# Precheck 02 - Nodes (HARD)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: every node Ready=True, no Disk/Memory/PID pressure, and no more cordoned
#       (unschedulable) nodes than allowed_unschedulable_nodes.
# Why: a node that is not Ready or is cordoned counts as unavailable for the Machine
#      Config Operator. With a pool's maxUnavailable (default 1) used up, the MCO updates
#      no other node of that pool, so the node part of every hop would stall.
# When the check fails, steps/common/diagnose_nodes.yml says why and what to do
# (report only; nothing is changed).

- name: "Check 02: Read nodes"
  shell: |
    set -o pipefail
    oc get nodes -o json | jq -c '
      def cstat(t): (((.status.conditions // []) | map(select(.type == t)) | .[0].status) // "False" | tostring);
      {
        total: (.items | length),
        unready: [.items[] | select(cstat("Ready") != "True") | .metadata.name],
        pressured: [.items[] | select((cstat("DiskPressure") == "True") or (cstat("MemoryPressure") == "True") or (cstat("PIDPressure") == "True")) | .metadata.name],
        unschedulable: [.items[] | select((.spec.unschedulable // false) == true) | .metadata.name]
      }'
  args:
    executable: /bin/bash
  register: c02_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: c02_raw.rc == 0

- name: "Check 02: Judge the nodes"
  set_fact:
    c02_nodes: "{{ _n }}"
    c02_ok: >-
      {{ (_n.unready | length == 0) and (_n.pressured | length == 0)
         and ((_n.unschedulable | length) <= (allowed_unschedulable_nodes | default(0) | int)) }}
  vars:
    _n: "{{ c02_raw.stdout | from_json }}"

- name: "Check 02: Work out what is wrong with the nodes"
  include_tasks: "{{ playbook_dir }}/steps/common/diagnose_nodes.yml"
  when: not (c02_ok | bool)

- name: "Check 02: Record the result"
  set_fact:
    preval_checks: >-
      {{ preval_checks + [{'num': 2, 'name': 'Nodes', 'gate': 'HARD',
           'status': 'PASS' if (c02_ok | bool) else 'FAIL',
           'observed': ('All ' ~ c02_nodes.total ~ ' nodes Ready, no pressure, ' ~ (c02_nodes.unschedulable | length) ~ ' cordoned') if (c02_ok | bool)
                       else ('Not Ready: ' ~ (c02_nodes.unready | join(', ') or 'none') ~ '; under pressure: ' ~ (c02_nodes.pressured | join(', ') or 'none')
                             ~ '; cordoned: ' ~ (c02_nodes.unschedulable | join(', ') or 'none') ~ ' (allowed ' ~ (allowed_unschedulable_nodes | default(0)) ~ ')'
                             ~ (('. ' ~ node_problems_summary) if (node_problems_summary | default('') | length > 0) else '')
                             ~ (('. Node diagnosis failed: ' ~ node_problems_error) if (node_problems_error | default('') | length > 0) else ''))}] }}
