---
# Precheck 02 - Nodes (HARD)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: every node Ready=True, no Disk/Memory/PID pressure, and no more cordoned
#       (unschedulable) nodes than allowed_unschedulable_nodes.

- name: "Check 02: Read nodes"
  shell: |
    set -o pipefail
    oc get nodes -o json | jq -c '
      def cstat(t): (((.status.conditions // []) | map(select(.type == t)) | .[0].status) // "False" | tostring);
      {
        total: (.items | length),
        unready: [.items[] | select(cstat("Ready") != "True") | .metadata.name],
        pressured: [.items[] | select((cstat("DiskPressure") == "True") or (cstat("MemoryPressure") == "True") or (cstat("PIDPressure") == "True")) | .metadata.name],
        unschedulable: [.items[] | select((.spec.unschedulable // false) == true) | .metadata.name]
      }'
  args:
    executable: /bin/bash
  register: c02_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: c02_raw.rc == 0

- name: "Check 02: Record the result"
  set_fact:
    preval_checks: >-
      {{ preval_checks + [{'num': 2, 'name': 'Nodes', 'gate': 'HARD',
           'status': 'PASS' if (_ok | bool) else 'FAIL',
           'observed': ('All ' ~ _n.total ~ ' nodes Ready, no pressure, ' ~ (_n.unschedulable | length) ~ ' cordoned') if (_ok | bool)
                       else ('Not Ready: ' ~ (_n.unready | join(', ') or 'none') ~ '; under pressure: ' ~ (_n.pressured | join(', ') or 'none')
                             ~ '; cordoned: ' ~ (_n.unschedulable | join(', ') or 'none') ~ ' (allowed ' ~ (allowed_unschedulable_nodes | default(0)) ~ ')')}] }}
  vars:
    _n: "{{ c02_raw.stdout | from_json }}"
    _ok: >-
      {{ (_n.unready | length == 0) and (_n.pressured | length == 0)
         and ((_n.unschedulable | length) <= (allowed_unschedulable_nodes | default(0) | int)) }}
