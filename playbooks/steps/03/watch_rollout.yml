---
# ============================================================================
# steps/03/watch_rollout.yml - watch the node rollout a Phase 03 change started
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Used by: every Phase 03 task right after its change, before the next task starts.
# Inputs (include vars):
#   rollout_task      the task's name, e.g. "cgroup v2" (console, mails, run log)
#   rollout_expected  true  - the change always makes the Machine Config Operator roll
#                             new configuration to the nodes (cgroup v2): watch at once
#                     false - it may or may not (an unpaused pool, an operator upgrade
#                             that adds a MachineConfig, an admin-ack): look for up to
#                             rollout_detect_seconds and watch only if a pool starts
# A pool counts as rolling out when it is not paused and its rendered configuration
# differs from the one it runs (spec vs status), it reports Updating=True, or it
# has fewer updated machines than machines.
# Watching is 05_Live_monitoring_upgrade.yaml in rollout mode: the same heartbeat and
# degradation mails as during a hop, and the run fails if the rollout stops
# progressing or runs out of time (exit code of Phase 03).
# Output: rollout_result (text for the task's row)
# ============================================================================

- name: "Rollout ({{ rollout_task }}): Look for a MachineConfigPool that starts updating"
  shell: |
    set -o pipefail
    deadline=$((SECONDS + {{ rollout_detect_seconds | default(120) | int }}))
    while :; do
      pools="$(oc get mcp -o json --request-timeout=60s | jq -r '
        def cstat(t): ([(.status.conditions // [])[] | select(.type == t) | .status] | .[0]) // "Unknown";
        [ .items[] | select((.spec.paused // false) | not)
          | select(((.spec.configuration.name // "") != (.status.configuration.name // ""))
                   or (cstat("Updating") == "True")
                   or ((.status.updatedMachineCount // 0) < (.status.machineCount // 0)))
          | .metadata.name ] | join(",")')" || pools=""
      [ -n "$pools" ] && { echo "ROLLOUT $pools"; exit 0; }
      [ "$SECONDS" -ge "$deadline" ] && break
      sleep 15
    done
    echo "NONE"
  args:
    executable: /bin/bash
  register: rollout_detect_raw
  changed_when: false
  failed_when: false
  when: not (rollout_expected | bool)

- name: "Rollout ({{ rollout_task }}): Decide"
  set_fact:
    rollout_watch: "{{ (rollout_expected | bool) or ((rollout_detect_raw.stdout | default('')).startswith('ROLLOUT')) }}"
    rollout_pools: "{{ (rollout_detect_raw.stdout | default('')).split(' ')[1] | default('') if ((rollout_detect_raw.stdout | default('')).startswith('ROLLOUT')) else '' }}"

- name: "Rollout ({{ rollout_task }}): Watch it until every pool has settled (Phase 05)"
  include_tasks: "{{ playbook_dir }}/05_Live_monitoring_upgrade.yaml"
  vars:
    watch_mode: "rollout"
    watch_version: "{{ run_start_version | default('current', true) }}"
    watch_label: "Phase 03 {{ rollout_task }} node rollout"
  when: rollout_watch | bool

- name: "Rollout ({{ rollout_task }}): Result"
  set_fact:
    rollout_result: >-
      {{ ('node rollout' ~ ((' of ' ~ rollout_pools) if (rollout_pools | length > 0) else '') ~ ' watched until every pool settled ('
          ~ monitor_elapsed | default('?') ~ ')')
         if (rollout_watch | bool)
         else ('no MachineConfigPool started updating within ' ~ (rollout_detect_seconds | default(120)) ~ ' s') }}

- name: "Rollout ({{ rollout_task }}): Log it"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "INFO"
    event_task: "Phase 03 rollout check: {{ rollout_task }}"
    event_reason: "{{ rollout_result }}"
