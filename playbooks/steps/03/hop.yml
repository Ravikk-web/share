---
# ============================================================================
# steps/03/hop.yml - one upgrade hop (looped by 03_Initiate_upgrade.yaml)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Input: hop_target (X.Y.Z), hop_index (0-based)
#   1. Plan from the live cluster:
#        skip    - the cluster already completed this version (or a later one)
#        resume  - an update to exactly this version is already running
#        start   - the hop has to be started
#        (an update running to any other version stops the run)
#   2. start only: wait up to prehop_settle_wait_minutes for a stable cluster
#   3. start only: steps/03/start_hop.yml (channel, offer, admin-ack, trigger)
#   4. start / resume: 04_Live_monitoring_upgrade.yaml watches until it settles
# A failure goes straight to the failure handler in main.yml.
# ============================================================================

- name: "Hop {{ hop_index + 1 }}/{{ upgrade_path | length }}: Set the hop context"
  set_fact:
    current_hop_label: "Hop {{ hop_index + 1 }} of {{ upgrade_path | length }}"
    current_hop_target: "{{ hop_target }}"
    hop_start_epoch: "{{ lookup('pipe', 'date +%s') }}"

# ----------------------------------------------------------------------------
# 1. Plan (read-only)
# ----------------------------------------------------------------------------
- name: "{{ current_hop_label }} -> {{ hop_target }}: Read the cluster version"
  shell: |
    set -o pipefail
    oc get clusterversion version -o json | jq -c '{
      completed: ((((.status.history // []) | map(select(.state == "Completed")) | .[0].version) // "")),
      desired: (.status.desired.version // ""),
      progressing: (((((.status.conditions // []) | map(select(.type == "Progressing")) | .[0]) // {}).status // "False") | tostring),
      channel: (.spec.channel // "")}'
  args:
    executable: /bin/bash
  register: hop_cv_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: hop_cv_raw.rc == 0

# Why: versions are split with split('.') - regex backreferences inside YAML-quoted
#      Jinja turn into control characters.
- name: "{{ current_hop_label }} -> {{ hop_target }}: Plan the hop"
  set_fact:
    hop_cv: "{{ _cv }}"
    hop_action: >-
      {%- set running = _cv.progressing == 'True' and _cv.desired != _cv.completed -%}
      {%- if running and _cv.desired == hop_target -%}resume
      {%- elif running -%}blocked
      {%- elif (_cv.completed | length > 0) and (hop_target is version(_cv.completed, '<=')) -%}skip
      {%- else -%}start
      {%- endif -%}
    hop_is_minor: >-
      {%- set cur = (_cv.completed | string).split('.') -%}
      {%- set tgt = hop_target.split('.') -%}
      {{ (cur | length >= 2) and ((tgt[0] | int, tgt[1] | int) > (cur[0] | int, cur[1] | int)) }}
    hop_channel: >-
      {{ target_channel if (target_channel | default('') | length > 0)
         else ((target_channel_prefix | default('stable')) ~ '-' ~ (hop_target.split('.')[0:2] | join('.'))) }}
  vars:
    _cv: "{{ hop_cv_raw.stdout | from_json }}"

- name: "{{ current_hop_label }} -> {{ hop_target }}: Stop - another update is running"
  fail:
    msg: >-
      The cluster is updating to {{ hop_cv.desired }} (from {{ hop_cv.completed }}), not to {{ hop_target }}.
      Let it finish (or investigate), then run the same command again.
  when: hop_action == 'blocked'

- name: "{{ current_hop_label }} -> {{ hop_target }}: Plan"
  debug:
    msg: >-
      {{ {'skip': 'already done (cluster at ' ~ hop_cv.completed ~ '); nothing to do',
          'resume': 'update to ' ~ hop_target ~ ' is already running; watching it',
          'start': 'will be started from ' ~ hop_cv.completed ~ ' on channel ' ~ hop_channel ~ (' (minor hop)' if (hop_is_minor | bool) else ' (z-stream hop)')}[hop_action] }}

- name: "{{ current_hop_label }} -> {{ hop_target }}: Record a hop that is already done"
  set_fact:
    hop_results: "{{ hop_results + [{'hop_label': current_hop_label, 'target': hop_target, 'status': 'ALREADY DONE', 'duration': ''}] }}"
  when: hop_action == 'skip'

# ----------------------------------------------------------------------------
# 2. Wait for a stable cluster before starting
# ----------------------------------------------------------------------------
# Why: a hop must not start while pools are still rolling or operators are degraded
#      (for example right after the previous hop). One bounded in-shell wait.
- name: "{{ current_hop_label }} -> {{ hop_target }}: Wait for a stable cluster (up to {{ prehop_settle_wait_minutes | default(10) }} min)"
  shell: |
    set -o pipefail
    deadline=$((SECONDS + {{ (prehop_settle_wait_minutes | default(10) | int) * 60 }}))
    while :; do
      state="$(oc get clusterversion,clusteroperators,machineconfigpools -o json --request-timeout=60s | jq -c --argjson allow {{ co_allow_list | default([]) | to_json | quote }} '
        def cstat(t): ([(.status.conditions // [])[] | select(.type == t) | .status] | .[0]) // "Unknown";
        (.items // []) as $all
        | ([$all[] | select(.kind == "ClusterVersion")] | .[0] // {}) as $cv
        | {
            cv_progressing: ($cv | cstat("Progressing")),
            pools_busy: [$all[] | select(.kind == "MachineConfigPool") | select((.spec.paused // false) | not)
                         | select(cstat("Updating") == "True" or cstat("Degraded") == "True") | .metadata.name],
            operators_unhealthy: [$all[] | select(.kind == "ClusterOperator")
                         | select(.metadata.name as $n | ($allow | map(. == $n) | any) | not)
                         | select(cstat("Degraded") == "True" or cstat("Available") != "True") | .metadata.name]
          }
        | . + {stable: (.cv_progressing != "True" and (.pools_busy | length) == 0 and (.operators_unhealthy | length) == 0)}')" \
        || state='{"stable":false,"error":"cluster state query failed"}'
      case "$state" in *'"stable":true'*) break ;; esac
      [ "$SECONDS" -ge "$deadline" ] && break
      sleep 30
    done
    printf '%s\n' "$state"
  args:
    executable: /bin/bash
  register: hop_stable_raw
  changed_when: false
  failed_when: false
  when: hop_action == 'start'

- name: "{{ current_hop_label }} -> {{ hop_target }}: Stop - the cluster is not stable"
  fail:
    msg: >-
      {{ current_hop_label }} -> {{ hop_target }} was not started: the cluster was not stable after
      {{ prehop_settle_wait_minutes | default(10) }} minutes (update running: {{ _state.cv_progressing | default('unknown') }};
      pools updating/degraded: {{ _state.pools_busy | default([]) | join(', ') or 'none' }};
      operators degraded/unavailable: {{ _state.operators_unhealthy | default([]) | join(', ') or 'none' }}
      {{ ('; ' ~ _state.error) if (_state.error is defined) else '' }}).
  vars:
    _state: >-
      {{ (hop_stable_raw.stdout | from_json) if ((hop_stable_raw.stdout | default('') | trim).startswith('{'))
         else {'stable': false, 'error': (hop_stable_raw.stderr | default('no output') | truncate(300))} }}
  when:
    - hop_action == 'start'
    - not (_state.stable | default(false) | bool)

# ----------------------------------------------------------------------------
# 3. Start the hop
# ----------------------------------------------------------------------------
- name: "{{ current_hop_label }} -> {{ hop_target }}: Start the update"
  include_tasks: "{{ playbook_dir }}/steps/03/start_hop.yml"
  when: hop_action == 'start'

# ----------------------------------------------------------------------------
# 4. Watch it until the cluster settles (Phase 04)
# ----------------------------------------------------------------------------
- name: "{{ current_hop_label }} -> {{ hop_target }}: Watch until the cluster settles (Phase 04)"
  include_tasks: "{{ playbook_dir }}/04_Live_monitoring_upgrade.yaml"
  vars:
    watch_mode: "hop"
    watch_version: "{{ hop_target }}"
    watch_label: "{{ current_hop_label }}"
  when: hop_action in ['start', 'resume']

- name: "{{ current_hop_label }} -> {{ hop_target }}: Record the finished hop"
  set_fact:
    hop_results: >-
      {%- set s = (lookup('pipe', 'date +%s') | int) - (hop_start_epoch | int) -%}
      {{ hop_results + [{'hop_label': current_hop_label, 'target': hop_target,
           'status': 'COMPLETE (resumed)' if hop_action == 'resume' else 'COMPLETE',
           'duration': '%02d:%02d:%02d' | format(s // 3600, (s % 3600) // 60, s % 60)}] }}
  when: hop_action in ['start', 'resume']

- name: "{{ current_hop_label }} -> {{ hop_target }}: Log the finished hop"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "PASS"
    event_task: "{{ current_hop_label }} -> {{ hop_target }}"
    event_reason: "Cluster settled at {{ hop_target }} in {{ hop_results[-1].duration }}"
  when: hop_action in ['start', 'resume']
