---
# ============================================================================
# steps/03/task_2_cgroup_v2.yml - Phase 03 task 2: move every node to cgroup v2
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Check:   whether any hop reaches 4.19+ (OpenShift 4.19+ cannot run on cgroup v1),
#          nodes.config/cluster spec.cgroupMode, and every node (steps/03/cgroup_nodes.yml:
#          the MCO configuration it runs and/or its kernel, by cgroup_check_method).
#          The nodes decide: an empty cgroupMode is rendered as v2 by the MCO on
#          OpenShift 4.14+, so a cluster whose nodes all run v2 needs no change.
# Change:  spec.cgroupMode=v2 when the setting is not v2 (or is v1) and the nodes are
#          not all on v2 (auto_fix_cgroup_v2, auto_remediation_enabled, not
#          skip_cgroup_check, not in a dry run).
# Wait:    the Machine Config Operator renders a configuration with the v2 kernel
#          arguments for every pool (cgroup_render_wait_minutes), then rolls it to
#          every node, one node at a time per pool (drain, reboot).
# Watch:   the rollout, always to the end (steps/03/watch_rollout.yml). This is also
#          done, without a change, when the setting is already v2 but nodes have not
#          finished the rollout (an earlier change).
# Verify:  every node is on cgroup v2 (waits up to cgroup_node_check_wait_minutes for
#          the last node). AUTO-FIXED only then.
# Records: one row in preimpl_tasks (Precheck 14 is re-checked afterwards).
# Cluster write: nodes.config/cluster spec.cgroupMode=v2.
# Nothing here patches a node: the MCO applies the setting to the nodes itself.
# ============================================================================

- name: "Task 2: Start"
  set_fact:
    preimpl_current_task: {num: 2, name: "cgroup v2"}
    t2_applied: false
    t2_rendered: false
    t2_verified: false

- name: "Task 2: Read the cluster cgroup mode"
  shell: |
    set -o pipefail
    oc get nodes.config/cluster -o json | jq -r '(.spec.cgroupMode // "") | tostring'
  args:
    executable: /bin/bash
  register: t2_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: t2_raw.rc == 0

# Why: versions are compared with split('.'), never regex backreferences.
- name: "Task 2: Decide whether the path needs cgroup v2"
  set_fact:
    t2_mode: "{{ t2_raw.stdout | trim }}"
    t2_mode_text: "{{ (t2_raw.stdout | trim) if (t2_raw.stdout | trim | length > 0) else 'not set' }}"
    t2_needs_v2: "{{ (_p | length >= 2) and (((_p[0] | int) > 4) or (((_p[0] | int) == 4) and ((_p[1] | int) >= 19))) }}"
    t2_enabled: >-
      {{ (auto_remediation_enabled | default(true) | bool) and (auto_fix_cgroup_v2 | default(true) | bool)
         and not (skip_cgroup_check | default(false) | bool) }}
  vars:
    _p: "{{ (target_max_version | string).split('.') }}"

- name: "Task 2: Check every node (cgroup_check_method {{ cgroup_check_method | default('config') }})"
  include_tasks: "{{ playbook_dir }}/steps/03/cgroup_nodes.yml"
  vars:
    cgroup_wait_seconds: 0
  when:
    - t2_needs_v2 | bool
    - not (skip_cgroup_check | default(false) | bool)

#   none      nothing to do: the path does not need v2, or every node is on v2 and the
#             setting is not v1
#   skip      skip_cgroup_check is true (nothing is checked or changed)
#   unread    the nodes could not be checked
#   broken    a node the MCO finished runs an unreadable configuration, or a v2
#             configuration whose kernel is not on v2, or its kernel cannot be checked
#   watch     the setting is v2, but nodes still have to roll it out
#   disabled  the setting is not v2, nodes are not on v2, and the fix is switched off
#   patch     set v2, then wait, watch and verify
- name: "Task 2: Decide what to do"
  set_fact:
    t2_before: "{{ cgroup_nodes if (_checked | bool) else {} }}"
    t2_action: >-
      {%- if not (t2_needs_v2 | bool) -%}none
      {%- elif skip_cgroup_check | default(false) | bool -%}skip
      {%- elif not (cgroup_nodes.ok | bool) -%}unread
      {%- elif (cgroup_nodes.all_ok | bool) and t2_mode != 'v1' -%}none
      {%- elif cgroup_nodes.broken | length > 0 -%}broken
      {%- elif t2_mode == 'v2' -%}watch
      {%- elif not (t2_enabled | bool) -%}disabled
      {%- else -%}patch
      {%- endif -%}
  vars:
    _checked: "{{ (t2_needs_v2 | bool) and not (skip_cgroup_check | default(false) | bool) }}"

- name: "Task 2: Set spec.cgroupMode to v2 (the nodes still on v1 will reboot)"
  command: "oc patch nodes.config/cluster --type=merge -p '{\"spec\":{\"cgroupMode\":\"v2\"}}'"
  register: t2_patch
  changed_when: t2_patch.rc == 0
  failed_when: false
  when:
    - t2_action == 'patch'
    - not (dry_run | bool)

- name: "Task 2: Read the setting back"
  shell: |
    set -o pipefail
    oc get nodes.config/cluster -o json | jq -r '(.spec.cgroupMode // "") | tostring'
  args:
    executable: /bin/bash
  register: t2_verify
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: t2_verify.rc == 0
  when:
    - t2_action == 'patch'
    - not (dry_run | bool)

- name: "Task 2: Remember whether it was set"
  set_fact:
    t2_applied: "{{ t2_action == 'patch' and not (dry_run | bool) and ((t2_verify.stdout | default('') | trim) == 'v2') }}"

# Why: watching before the MCO has rendered the new configuration could see every pool
#      "settled" with nothing rolled out. Every pool's target configuration must carry
#      no cgroup v1 kernel argument first (the render normally takes seconds).
- name: "Task 2: Wait for the Machine Config Operator to render the cgroup v2 configuration (up to {{ cgroup_render_wait_minutes | default(5) }} min)"
  shell: |
    set -o pipefail
    tmpd="$(mktemp -d)"
    trap 'rm -rf "$tmpd"' EXIT
    deadline=$((SECONDS + {{ (cgroup_render_wait_minutes | default(5) | int) * 60 }}))
    while :; do
      state="UNKNOWN cluster state could not be read"
      if oc get mcp -o json --request-timeout=60s >"$tmpd/mcp.json" 2>"$tmpd/err"; then
        targets="$(jq -r '[(.items // [])[] | (.spec.configuration.name // empty)] | unique | .[]' "$tmpd/mcp.json")"
        if [ -n "$targets" ] && oc get mc $targets -o json --request-timeout=60s >"$tmpd/mc.json" 2>"$tmpd/err"; then
          state="$(jq -r --slurpfile mc "$tmpd/mc.json" '
            (($mc[0] // {}) | if (.kind // "") == "List" then (.items // []) elif (.metadata.name // "") != "" then [.] else (.items // []) end) as $mcs
            | ($mcs | map({key: .metadata.name, value: (((.spec.kernelArguments // []) | join(" ")) | split(" ") | map(. == "systemd.unified_cgroup_hierarchy=0") | any)}) | from_entries) as $v1
            | [(.items // [])[] | (.spec.configuration.name // "") as $t | select(if ($v1 | has($t)) then $v1[$t] else true end) | .metadata.name] as $todo
            | [(.items // [])[] | select(.spec.paused // false) | .metadata.name] as $paused
            | (if ($todo | length) == 0 then "RENDERED" else ("NOT_RENDERED pools still targeting a cgroup v1 configuration: " + ($todo | join(", "))) end)
              + (if ($paused | length) > 0 then (" (paused pools: " + ($paused | join(", ")) + ")") else "" end)' "$tmpd/mcp.json")"
        fi
      fi
      case "$state" in RENDERED*) break ;; esac
      [ "$SECONDS" -ge "$deadline" ] && break
      sleep 15
    done
    printf '%s\n' "$state"
  args:
    executable: /bin/bash
  register: t2_render_raw
  changed_when: false
  failed_when: false
  when:
    - (t2_applied | bool) or (t2_action == 'watch' and not (dry_run | bool))

- name: "Task 2: Rendered?"
  set_fact:
    t2_rendered: "{{ (t2_render_raw.stdout | default('')).startswith('RENDERED') }}"
    t2_render_note: "{{ t2_render_raw.stdout | default('') | trim }}"

- name: "Task 2: Watch the node rollout (every node reboots)"
  include_tasks: "{{ playbook_dir }}/steps/03/watch_rollout.yml"
  vars:
    rollout_task: "cgroup v2"
    rollout_expected: true
  when: t2_rendered | bool

- name: "Task 2: Check every node again (wait up to {{ cgroup_node_check_wait_minutes | default(10) }} min for the last one)"
  include_tasks: "{{ playbook_dir }}/steps/03/cgroup_nodes.yml"
  vars:
    cgroup_wait_seconds: "{{ (cgroup_node_check_wait_minutes | default(10) | int) * 60 }}"
  when: t2_rendered | bool

- name: "Task 2: Every node on cgroup v2?"
  set_fact:
    t2_verified: "{{ (t2_rendered | bool) and (cgroup_nodes.all_ok | bool) }}"

- name: "Task 2: Record the result"
  include_tasks: "{{ playbook_dir }}/steps/03/record_task.yml"
  vars:
    task_num: 2
    task_name: "cgroup v2"
    task_check_num: 14
    task_changed: "{{ t2_applied | bool }}"
    # Why: a rollout of an earlier change was watched to the end and nodes rebooted:
    #      the prechecks run again, but the task itself changed nothing.
    task_recheck: "{{ t2_action == 'watch' and (t2_rendered | bool) }}"
    task_status: >-
      {%- if t2_action == 'none' -%}PASS
      {%- elif t2_action == 'skip' -%}WARN
      {%- elif t2_action == 'disabled' -%}SKIPPED
      {%- elif t2_action in ['unread', 'broken'] -%}FAIL
      {%- elif dry_run | bool -%}WARN
      {%- elif t2_action == 'watch' -%}{{ 'PASS' if (t2_verified | bool) else 'FAIL' }}
      {%- elif t2_verified | bool -%}AUTO-FIXED
      {%- else -%}FIX-FAILED
      {%- endif -%}
    task_observed: >-
      {%- if not (t2_needs_v2 | bool) -%}
      cgroupMode is {{ t2_mode_text }}; the highest hop {{ target_max_version or '?' }} does not need v2.
      {%- elif t2_action == 'none' -%}
      Every node already runs cgroup v2 (cgroupMode {{ t2_mode_text }}, needed for {{ target_max_version }}); {{ t2_before.summary }}.
      {%- elif t2_action == 'skip' -%}
      {{ target_max_version }} needs cgroup v2, but skip_cgroup_check is true: the nodes were not checked and cgroupMode ({{ t2_mode_text }}) is left as it is.
      {%- elif t2_action == 'disabled' -%}
      cgroupMode is {{ t2_mode_text }} and {{ target_max_version }} needs v2 ({{ t2_before.summary }}); not changed because {{ 'auto_remediation_enabled' if not (auto_remediation_enabled | default(true) | bool) else 'auto_fix_cgroup_v2' }} is false.
      {%- elif t2_action == 'unread' -%}
      cgroupMode is {{ t2_mode_text }}, but the nodes could not be checked: {{ t2_before.summary }}.
      {%- elif t2_action == 'broken' -%}
      cgroupMode is {{ t2_mode_text }}, but {{ t2_before.summary }}. The run cannot fix this: look at those nodes ({{ 'oc debug node/<node> -- chroot /host stat -c %T -f /sys/fs/cgroup' }}, the machine-config-daemon log).
      {%- elif dry_run | bool -%}
      {{ ('Dry run: would set cgroupMode v2 (was ' ~ t2_mode_text ~ '; ' ~ target_max_version ~ ' needs it and ' ~ t2_before.summary ~ '); the nodes still on v1 would reboot, one at a time per pool, and every node would then be checked.')
         if t2_action == 'patch'
         else ('Dry run: cgroupMode is already v2 but ' ~ t2_before.summary ~ '; a live run watches the node rollout to the end and checks every node.') }}
      {%- elif t2_action == 'patch' and not (t2_applied | bool) -%}
      Could not set cgroupMode v2: {{ (t2_patch.stderr | default('') | trim | truncate(300)) or ('it reads ' ~ (t2_verify.stdout | default('unknown') | trim)) }}.
      {%- elif not (t2_rendered | bool) -%}
      {{ 'Set cgroupMode v2 (was ' ~ t2_mode_text ~ '), but' if t2_action == 'patch' else 'cgroupMode is v2, but' }} the Machine Config Operator did not render
      a cgroup v2 configuration within {{ cgroup_render_wait_minutes | default(5) }} min ({{ t2_render_note or 'no answer' }}). Check
      `oc get mc | grep generated-kubelet` and the machine-config-controller log.
      {%- elif t2_verified | bool -%}
      {{ ('Set cgroupMode v2 (was ' ~ t2_mode_text ~ ')') if t2_action == 'patch' else 'cgroupMode was already v2 (an earlier change)' }}; {{ rollout_result | default('') }}; {{ (cgroup_nodes | default({})).summary | default('') }}.
      {%- else -%}
      {{ ('Set cgroupMode v2 (was ' ~ t2_mode_text ~ ')') if t2_action == 'patch' else 'cgroupMode is v2' }}; {{ rollout_result | default('') }}; but {{ (cgroup_nodes | default({})).summary | default('the nodes could not be checked') }}.
      {%- endif -%}
    task_autofix:
      name: "cgroup v2"
      action: "Set nodes.config/cluster spec.cgroupMode to v2 (was {{ t2_mode_text }}); the nodes still on v1 rebooted with cgroup v2 before the first hop ({{ rollout_result | default('') }}); {{ (cgroup_nodes | default({})).summary | default('') }}."
      reference: "https://docs.openshift.com/container-platform/latest/nodes/clusters/nodes-cluster-cgroups-2.html"
