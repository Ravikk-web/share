---
# ============================================================================
# steps/03/task_3_operator_upgrades.yml - Phase 03 task 3: operator upgrades
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Check:   the installed operators (steps/02/read_operators.yml, the same read as
#          Precheck 15): which have an upgrade pending (UpgradePending), which block the
#          target version (olm.maxOpenShiftVersion below the highest hop), and whether
#          OLM reports Upgradeable=False.
# Change:  steps/07/approve_operators.yml, the approval step Phase 07 uses after the
#          cluster upgrade: approve the current InstallPlan of every UpgradePending
#          subscription, then wait for the new CSVs to reach Succeeded (one restart of a
#          Failed operator's Deployments with operator_upgrade_auto_recover).
#          Only with preupgrade_operator_upgrades and not skip_operator_upgrade; a dry
#          run only lists what it would approve.
# Watch:   an operator upgrade can add or change MachineConfigs, so
#          steps/03/watch_rollout.yml looks for a rollout and watches it.
# Verify:  read the operators again: every approved operator is on its new CSV and
#          Succeeded, no operator blocks the target version, OLM is not Upgradeable=False.
# A blocking operator with no upgrade pending cannot be fixed here: the run stops and
# says to change its channel or remove it. Subscription channels are never changed.
# Records: one row in preimpl_tasks (Precheck 15 is re-checked when something blocked).
# Cluster writes: InstallPlan spec.approved=true; at most one Deployment restart per
#                 Failed CSV.
# ============================================================================

- name: "Task 3: Start"
  set_fact:
    preimpl_current_task: {num: 3, name: "Operator upgrades"}
    t3_enabled: "{{ (preupgrade_operator_upgrades | default(true) | bool) and not (skip_operator_upgrade | default(false) | bool) }}"
    t3_planned: []
    t3_approved: []
    t3_restarted: []

- name: "Task 3: Read the installed operators"
  include_tasks: "{{ playbook_dir }}/steps/02/read_operators.yml"

- name: "Task 3: Remember the state before any approval"
  set_fact:
    t3_count: "{{ operators_scan | length }}"
    t3_pending_before: >-
      {%- set out = [] -%}
      {%- for o in operators_scan if o.pending | bool -%}{%- set _ = out.append(o.package) -%}{%- endfor -%}
      {{ out }}
    t3_blocking_before: >-
      {%- set out = [] -%}
      {%- for o in operators_scan if o.blocks_upgrade | bool -%}{%- set _ = out.append(o.package) -%}{%- endfor -%}
      {{ out }}

- name: "Task 3: Approve the pending operator upgrades (the same step as Phase 07)"
  include_tasks: "{{ playbook_dir }}/steps/07/approve_operators.yml"
  when: t3_enabled | bool

- name: "Task 3: Remember what was approved"
  set_fact:
    t3_planned: "{{ opu_to_approve | default([]) }}"
    t3_approved: "{{ approved_installplans | default([]) }}"
    t3_restarted: "{{ recovered_csvs | default([]) }}"
  when: t3_enabled | bool

- name: "Task 3: Watch any node rollout the operator upgrades started"
  include_tasks: "{{ playbook_dir }}/steps/03/watch_rollout.yml"
  vars:
    rollout_task: "Operator upgrades"
    rollout_expected: false
  when: t3_approved | length > 0

- name: "Task 3: Read the installed operators again"
  include_tasks: "{{ playbook_dir }}/steps/02/read_operators.yml"
  when: t3_approved | length > 0

# Why: an approved upgrade is finished when its subscription's installed CSV is one of
#      the plan's CSVs and that CSV is Succeeded (the rule Phase 07 also uses).
- name: "Task 3: Judge the result"
  set_fact:
    t3_unfinished: >-
      {%- set out = [] -%}
      {%- for p in t3_approved -%}
      {%- set row = operators_scan | selectattr('namespace', 'equalto', p.namespace) | selectattr('subscription', 'equalto', p.subscription) | list -%}
      {%- if (row | length == 0) or (row[0].csv not in p.csv_names) or (row[0].phase != 'Succeeded') -%}
      {%- set _ = out.append(p.package ~ ' (' ~ ((row[0].csv ~ ' is ' ~ row[0].phase) if (row | length > 0) else 'subscription not found') ~ '; wanted ' ~ (p.csv_names | join(', ')) ~ ')') -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
    t3_blocking: >-
      {%- set out = [] -%}
      {%- for o in operators_scan if o.blocks_upgrade | bool -%}
      {%- set _ = out.append(o.namespace ~ '/' ~ o.package ~ ' ' ~ (o.version or o.csv) ~ ' (max ' ~ o.max_ocp
            ~ ('; its next upgrade is pending: run the same command again' if (o.pending | bool) else '; no upgrade pending: change its channel or remove it') ~ ')') -%}
      {%- endfor -%}
      {{ out }}
    t3_olm_blocks: "{{ (olm_upgradeable.status | string | lower) == 'false' }}"
    t3_approved_text: >-
      {%- set out = [] -%}
      {%- for p in (t3_approved if (t3_approved | length > 0) else t3_planned) -%}
      {%- set _ = out.append(p.package ~ ' (' ~ (p.from_csv or 'none') ~ ' -> ' ~ (p.csv_names | join(', ')) ~ ')') -%}
      {%- endfor -%}
      {{ out | join(', ') }}

- name: "Task 3: Record the result"
  include_tasks: "{{ playbook_dir }}/steps/03/record_task.yml"
  vars:
    task_num: 3
    task_name: "Operator upgrades"
    task_check_num: "{{ 15 if (t3_blocking_before | length > 0) else 0 }}"
    task_changed: "{{ t3_approved | length > 0 }}"
    _t3_blocked: "{{ (t3_blocking | length > 0) or (t3_olm_blocks | bool) }}"
    task_status: >-
      {%- if not (t3_enabled | bool) -%}{{ 'FAIL' if (_t3_blocked | bool) else ('SKIPPED' if (t3_pending_before | length > 0) else 'PASS') }}
      {%- elif dry_run | bool -%}{{ 'WARN' if (t3_planned | length > 0) else ('FAIL' if (_t3_blocked | bool) else 'PASS') }}
      {%- elif t3_approved | length == 0 -%}{{ 'FAIL' if (_t3_blocked | bool) else 'PASS' }}
      {%- elif (t3_unfinished | length == 0) and not (_t3_blocked | bool) -%}AUTO-FIXED
      {%- else -%}FIX-FAILED
      {%- endif -%}
    task_observed: >-
      {%- if not (t3_enabled | bool) -%}
      {{ t3_count }} operator(s) installed, {{ t3_pending_before | length }} upgrade(s) pending{{ (' (' ~ (t3_pending_before | join(', ')) ~ ')') if (t3_pending_before | length > 0) else '' }};
      nothing approved because {{ 'skip_operator_upgrade is true' if (skip_operator_upgrade | default(false) | bool) else 'preupgrade_operator_upgrades is false' }}.
      {%- elif dry_run | bool -%}
      Dry run: would approve {{ t3_planned | length }} pending upgrade(s){{ (': ' ~ t3_approved_text) if (t3_planned | length > 0) else '' }} ({{ t3_count }} operator(s) installed).
      {%- elif t3_approved | length == 0 -%}
      {{ t3_count }} operator(s) installed, no upgrade pending.
      {%- else -%}
      Approved {{ t3_approved | length }} upgrade(s): {{ t3_approved_text }}.
      {{ 'All are on their new CSV and Succeeded.' if (t3_unfinished | length == 0) else ('Not finished: ' ~ (t3_unfinished | join('; ')) ~ '.') }}
      {{ ('Restarted once: ' ~ (t3_restarted | join(', ')) ~ '.') if (t3_restarted | length > 0) else '' }}
      {{ rollout_result | default('') }}.
      {%- endif %}
      {{ ('Blocking ' ~ (target_max_version or 'the target') ~ ': ' ~ (t3_blocking | join('; ')) ~ '.') if (t3_blocking | length > 0)
         else ('None blocks ' ~ (target_max_version or 'the target') ~ '.') }}
      {{ ('OLM reports Upgradeable=False (' ~ olm_upgradeable.reason ~ '): ' ~ olm_upgradeable.message ~ '.') if (t3_olm_blocks | bool) else '' }}
    task_autofix:
      name: "Operator upgrades before the cluster upgrade"
      action: "Approved {{ t3_approved_text }}; every one reached Succeeded."
      reference: "https://docs.openshift.com/container-platform/latest/operators/admin/olm-upgrading-operators.html"
