---
# ============================================================================
# steps/03/api_usage.yml - is any workload still calling an API the update removes?
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Used by: steps/03/admin_ack.yml (both modes).
# Input:   api_usage_releases (Kubernetes minors, e.g. ["1.29"]), api_usage_ignore_users
# Reads APIRequestCount: APIs whose status.removedInRelease is in scope and that a user
# not on api_usage_ignore_users called in the last 24 hours.
# Fails closed: if APIRequestCount cannot be read, usage counts as "in use".
# Outputs: api_usage_blocking (bool), api_usage_summary (text)
# ============================================================================

- name: "API usage: Start"
  set_fact:
    api_usage_blocking: false
    api_usage_summary: >-
      {{ 'Removed-API check disabled (api_usage_check_enabled: false)' if not (api_usage_check_enabled | default(true) | bool)
         else ('No API removals in scope' if (api_usage_releases | length == 0) else '') }}

# Why: jq 1.5-safe - explicit parentheses, `any` over a mapped list, sort_by + reverse.
#      Output: [{api, removed_in, users: [{username, user_agent, count}]}], ignored users removed.
- name: "API usage: Read APIRequestCount for APIs removed in {{ api_usage_releases | join(', ') }}"
  shell: |
    set -o pipefail
    oc get apirequestcounts -o json | jq -c \
      --argjson rels {{ api_usage_releases | to_json | quote }} \
      --argjson ignore {{ api_usage_ignore_users | default([]) | to_json | quote }} '
      [ .items[]?
        | select(((.status.removedInRelease // "") as $r | ($rels | map(. == $r) | any)))
        | { api: .metadata.name,
            removed_in: .status.removedInRelease,
            users: [ .status.last24h[]?.byNode[]?.byUser[]?
                     | select(((.username // "") as $u | (($ignore | map(. == $u) | any) | not)))
                     | { username: (.username // "unknown"), user_agent: (.userAgent // ""), count: (.requestCount // 0) } ] }
        | .users = (.users
                    | group_by(.username + "|" + .user_agent)
                    | map({ username: .[0].username, user_agent: .[0].user_agent, count: (map(.count) | add) })
                    | sort_by(.count) | reverse)
        | select((.users | length) > 0) ]'
  args:
    executable: /bin/bash
  register: api_usage_raw
  changed_when: false
  failed_when: false
  when:
    - api_usage_check_enabled | default(true) | bool
    - api_usage_releases | length > 0

- name: "API usage: Sum up"
  set_fact:
    api_usage_blocking: "{{ not (_ok | bool) or (_findings | length > 0) }}"
    api_usage_summary: >-
      {%- if not (_ok | bool) -%}
      Could not read APIRequestCount ({{ (api_usage_raw.stderr | default('') | trim | truncate(200)) or 'query failed' }}); removed-API usage is unverified
      {%- elif _findings | length == 0 -%}
      No workload called an API removed in Kubernetes {{ api_usage_releases | join(', ') }} in the last 24h
      {%- else -%}
      {%- set parts = [] -%}
      {%- for f in _findings -%}
      {%- set users = [] -%}
      {%- for u in f.users[:3] -%}{%- set _ = users.append(u.username ~ ' (' ~ (u.user_agent | truncate(40)) ~ ', ' ~ u.count ~ ' req)') -%}{%- endfor -%}
      {%- set _ = parts.append(f.api ~ ' [removed in ' ~ f.removed_in ~ '] used by ' ~ (users | join('; '))) -%}
      {%- endfor -%}
      Removed APIs still in use: {{ parts | join(' | ') }}
      {%- endif -%}
  vars:
    _ok: "{{ api_usage_raw.rc | default(1) == 0 }}"
    _findings: "{{ (api_usage_raw.stdout | from_json) if ((_ok | bool) and (api_usage_raw.stdout | default('') | trim | length > 0)) else [] }}"
  when:
    - api_usage_check_enabled | default(true) | bool
    - api_usage_releases | length > 0

- name: "API usage: Result"
  debug:
    msg: "Removed-API usage ({{ api_usage_releases | join(', ') or 'none in scope' }}): {{ api_usage_summary }}"
