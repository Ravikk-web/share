---
# ============================================================================
# steps/03/cgroup_nodes.yml - does every node really run cgroup v2?
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Used by: Precheck 14 and Phase 03 task 2. Read-only.
# Why:     nodes.config/cluster cgroupMode is only the setting. The Machine Config
#          Operator rolls it out node by node (drain, reboot), so a node is on v2 only
#          when it runs a configuration with the v2 kernel arguments AND its kernel
#          booted that way.
# Per node:
#   1. Configuration - the MCO is done with the node (currentConfig == desiredConfig,
#      state Done) and the rendered MachineConfig it runs does not carry the cgroup v1
#      argument systemd.unified_cgroup_hierarchy=0.
#   2. Kernel (cgroup_check_kernel, on by default) - `stat -c %T -f /sys/fs/cgroup` on
#      the node through its machine-config-daemon pod (`oc exec`, no new pod): cgroup2fs
#      is v2, tmpfs is v1. Same check as `oc debug node/<n> -- chroot /host stat ...`.
#      A node that cannot be checked (not Ready, no running machine-config-daemon pod,
#      exec refused or failing 3 times) counts as not on v2.
# Input (include vars):
#   cgroup_wait_seconds  0 = read once; otherwise wait (in-shell loop, every 30 s) up to
#                        this long until every node is on v2, and report the last read.
# Output: cgroup_nodes
#   ok        false when the nodes could not be read (error holds why)
#   all_ok    every node is on v2
#   total, kernel_checked
#   nodes     [{name, role, ready, state, current, desired, applied, config (v1/v2/unknown),
#               kernel (cgroup2fs / tmpfs / ERROR: ... / not checked), ok, problem}]
#   pending   nodes the MCO has not finished, or that still run a v1 configuration
#             (a rollout that is still running or has not started yet)
#   broken    nodes the MCO finished whose configuration is unknown, or whose kernel is
#             not on v2 / cannot be checked (waiting does not fix these)
#   summary   one line for the reports
# ============================================================================

- name: "cgroup nodes: Read every node's configuration and kernel"
  shell: |
    set -o pipefail
    tmpd="$(mktemp -d)"
    trap 'rm -rf "$tmpd"' EXIT
    check_kernel={{ 'yes' if (cgroup_check_kernel | default(true) | bool) else 'no' }}
    deadline=$((SECONDS + {{ cgroup_wait_seconds | default(0) | int }}))
    while :; do
      if ! oc get nodes -o json --request-timeout=60s >"$tmpd/nodes.json" 2>"$tmpd/err"; then
        result="$(jq -cn --arg e "$(head -c 300 "$tmpd/err")" '{ok: false, all_ok: false, error: ("nodes could not be read: " + $e)}')"
      else
        names="$(jq -r '[(.items // [])[] | ((.metadata.annotations // {})["machineconfiguration.openshift.io/currentConfig"] // empty)] | unique | .[]' "$tmpd/nodes.json")"
        echo '{"items":[]}' >"$tmpd/mc.json"
        mc_ok=yes
        if [ -n "$names" ]; then
          mc_ok=no
          for try in 1 2 3; do
            # Why: one name returns the object itself, several names return a List.
            if oc get mc $names -o json --request-timeout=60s >"$tmpd/mc.json" 2>"$tmpd/err"; then mc_ok=yes; break; fi
            sleep 5
          done
        fi
        if [ "$mc_ok" != yes ]; then
          result="$(jq -cn --arg e "$(head -c 300 "$tmpd/err")" '{ok: false, all_ok: false, error: ("MachineConfigs could not be read: " + $e)}')"
        else
          jq -c --slurpfile mc "$tmpd/mc.json" '
            def cstat(t): ((([(.status.conditions // [])[] | select(.type == t) | .status] | .[0]) // "Unknown") | tostring);
            def ann(k): ((.metadata.annotations // {})[k] // "");
            def role: ((.metadata.labels // {}) | keys
                       | map(select(startswith("node-role.kubernetes.io/")) | ltrimstr("node-role.kubernetes.io/"))) as $r
              | if ($r | map((. == "master") or (. == "control-plane")) | any) then "master"
                elif ($r | map(. == "infra") | any) then "infra" else "worker" end;
            (($mc[0] // {}) | if (.kind // "") == "List" then (.items // []) elif (.metadata.name // "") != "" then [.] else (.items // []) end) as $mcs
            | ($mcs | map({key: .metadata.name, value: (((.spec.kernelArguments // []) | join(" ")) | split(" "))}) | from_entries) as $kargs
            | [(.items // [])[]
               | ann("machineconfiguration.openshift.io/currentConfig") as $cur
               | ann("machineconfiguration.openshift.io/desiredConfig") as $des
               | ann("machineconfiguration.openshift.io/state") as $st
               | {name: .metadata.name, role: role, ready: cstat("Ready"), state: $st, current: $cur, desired: $des,
                  applied: (($cur != "") and ($cur == $des) and ($st == "Done")),
                  config: (if ($kargs | has($cur)) | not then "unknown"
                           elif ($kargs[$cur] | map(. == "systemd.unified_cgroup_hierarchy=0") | any) then "v1"
                           else "v2" end)}]' "$tmpd/nodes.json" >"$tmpd/config.json"
          : >"$tmpd/kernel.tsv"
          # Why: a failed list of the daemon pods is an unreadable cluster, not a kernel
          #      problem on every node.
          mcd_ok=yes
          if [ "$check_kernel" = yes ]; then
            mcd_ok=no
            for try in 1 2 3; do
              if oc get pods -n openshift-machine-config-operator -l k8s-app=machine-config-daemon -o json --request-timeout=60s >"$tmpd/mcd.json" 2>"$tmpd/err"; then
                mcd_ok=yes
                break
              fi
              sleep 5
            done
          fi
          if [ "$mcd_ok" != yes ]; then
            result="$(jq -cn --arg e "$(head -c 300 "$tmpd/err")" '{ok: false, all_ok: false, error: ("the machine-config-daemon pods could not be listed: " + $e)}')"
          else
            if [ "$check_kernel" = yes ]; then
              jq -r '(.items // [])[] | select(.status.phase == "Running") | "\(.spec.nodeName) \(.metadata.name)"' "$tmpd/mcd.json" >"$tmpd/mcd.txt"
              # Why: only a node the MCO finished with a v2 configuration is worth asking, and
              #      an exec to a node that is not Ready would only hang until its timeout.
              jq -r '.[] | select(.applied and (.config == "v2")) | "\(.name) \(.ready)"' "$tmpd/config.json" >"$tmpd/ask.txt"
              while read -r node ready; do
                pod="$(awk -v n="$node" '$1 == n {print $2; exit}' "$tmpd/mcd.txt")"
                if [ "$ready" != "True" ]; then
                  fs="ERROR: the node is not Ready"
                elif [ -z "$pod" ]; then
                  fs="ERROR: no running machine-config-daemon pod on the node"
                else
                  for try in 1 2 3; do
                    if fs="$(timeout 60 oc exec -n openshift-machine-config-operator "$pod" -c machine-config-daemon --request-timeout=50s \
                             -- chroot /rootfs stat -c %T -f /sys/fs/cgroup 2>"$tmpd/exec_err" </dev/null)"; then
                      break
                    fi
                    fs="ERROR: $(tr '\r\n' '  ' <"$tmpd/exec_err" | head -c 200)"
                    sleep 5
                  done
                fi
                printf '%s\t%s\n' "$node" "$(printf '%s' "$fs" | tr -d '\r\n')" >>"$tmpd/kernel.tsv"
              done <"$tmpd/ask.txt"
            fi
            jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {key: .[0], value: (.[1] // "")}) | from_entries' "$tmpd/kernel.tsv" >"$tmpd/kernel.json"
            result="$(jq -c --slurpfile kernel "$tmpd/kernel.json" --arg check "$check_kernel" '
              ($kernel[0] // {}) as $k
              | map(. + {kernel: (if $check != "yes" then "not checked" else ($k[.name] // "not checked") end)})
              | map(. + {ok: (.applied and (.config == "v2") and (($check != "yes") or (.kernel == "cgroup2fs")))})
              | map(. + {problem: (if .ok then ""
                  elif (.applied | not) then ("MCO update not finished (state " + (if .state == "" then "unknown" else .state end)
                                              + ", current " + (if .current == "" then "none" else .current end)
                                              + ", desired " + (if .desired == "" then "none" else .desired end) + ")")
                  elif .config == "v1" then ("still runs the cgroup v1 configuration " + .current)
                  elif .config == "unknown" then ("configuration " + .current + " could not be read")
                  elif (.kernel | startswith("ERROR")) then ("kernel could not be checked: " + (.kernel | ltrimstr("ERROR: ")))
                  elif .kernel == "tmpfs" then "kernel runs cgroup v1 (/sys/fs/cgroup is tmpfs) although its configuration is v2"
                  else ("kernel reports " + .kernel) end)})
              | {ok: true, nodes: ., total: length, kernel_checked: ($check == "yes"),
                 all_ok: ((map(select(.ok | not)) | length) == 0),
                 pending: [.[] | select((.applied | not) or (.config == "v1")) | .name],
                 broken: [.[] | select(.applied and (.config != "v1") and (.ok | not)) | .name]}' "$tmpd/config.json")"
          fi
        fi
      fi
      case "$result" in *'"all_ok":true'*) break ;; esac
      [ "$SECONDS" -ge "$deadline" ] && break
      sleep 30
    done
    printf '%s\n' "$result"
  args:
    executable: /bin/bash
  register: cgroup_nodes_raw
  changed_when: false
  failed_when: false

- name: "cgroup nodes: Sum it up"
  set_fact:
    cgroup_nodes: >-
      {{ _r | combine({'summary': (
           ('could not check the nodes: ' ~ (_r.error | default('no output'))) if not (_r.ok | bool)
           else (('all ' ~ _r.total ~ ' nodes run cgroup v2 (MCO configuration applied'
                  ~ ('; kernel: /sys/fs/cgroup is cgroup2fs' if (_r.kernel_checked | bool) else '; kernel not checked: cgroup_check_kernel is false') ~ ')')
                 if (_r.all_ok | bool)
                 else ((_bad | length) ~ ' of ' ~ _r.total ~ ' nodes not on cgroup v2: '
                       ~ (_bad | map(attribute='text') | join('; ') | truncate(600)))))}) }}
  vars:
    _r: >-
      {{ (cgroup_nodes_raw.stdout | from_json) if ((cgroup_nodes_raw.stdout | default('') | trim).startswith('{'))
         else {'ok': false, 'all_ok': false, 'error': (cgroup_nodes_raw.stderr | default('', true) | trim | truncate(300)) or 'no output'} }}
    _bad: >-
      {%- set out = [] -%}
      {%- for n in (_r.nodes | default([])) if not (n.ok | bool) -%}
      {%- set _ = out.append({'text': n.name ~ ' (' ~ n.problem ~ ')'}) -%}
      {%- endfor -%}
      {{ out }}

- name: "cgroup nodes: Result"
  debug:
    msg: "cgroup v2 on the nodes: {{ cgroup_nodes.summary }}"
