---
# ============================================================================
# steps/03/admin_ack.yml - admin-ack and removed-API check for minor hops
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Inputs (include vars):
#   admin_ack_mode      evaluate - read-only, for Precheck 07 (whole path)
#                       apply    - right before one minor hop (steps/03/start_hop.yml)
#   admin_ack_versions  the versions to look at (the path, or [hop target])
#
# How OpenShift gates a minor update: openshift-config-managed/admin-gates lists keys
# such as ack-4.15-kube-1.29-api-removals-in-4.16. While the cluster is on the minor
# in the key (4.15 here) ClusterVersion reports Upgradeable=False (AdminAckRequired)
# until openshift-config/admin-acks has that key set to "true".
#
# Apply mode stops the hop if a workload still calls an API the update removes, if
# auto_apply_admin_acks is false, or if Upgradeable stays False after the ack.
# Outputs: admin_ack_check_status / admin_ack_check_observed (evaluate),
#          admin_acks_applied (apply)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Read the cluster state
# ----------------------------------------------------------------------------
# Why: three JSON lines: ClusterVersion summary, admin-gates keys, admin-acks data.
#      A missing ConfigMap reads as [] / {}.
- name: "Admin-ack: Read ClusterVersion, admin-gates and admin-acks"
  shell: |
    set -o pipefail
    oc get clusterversion version -o json | jq -c '{
      current_version: ((((.status.history // []) | map(select(.state == "Completed")) | .[0].version) // .status.desired.version) // ""),
      upgradeable: ((((.status.conditions // []) | map(select(.type == "Upgradeable")) | .[0]) // {})
                    | {status: ((.status // "True") | tostring), reason: (.reason // ""), message: (.message // "")})
    }'
    (oc get configmap admin-gates -n openshift-config-managed -o json 2>/dev/null || echo '{}') | jq -c '(.data // {}) | keys'
    (oc get configmap admin-acks -n openshift-config -o json 2>/dev/null || echo '{}') | jq -c '(.data // {})'
  args:
    executable: /bin/bash
  register: admin_ack_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: admin_ack_raw.rc == 0

# Why: versions are parsed with split('.'), never regex backreferences.
- name: "Admin-ack: Work out the minor hops ahead and the keys they need"
  set_fact:
    admin_ack_current_minor: "{{ (_cv.current_version | string).split('.')[0:2] | join('.') }}"
    admin_ack_upgradeable: "{{ _cv.upgradeable }}"
    admin_ack_minor_hop: "{{ _bump_minors | length > 0 }}"
    admin_ack_first_hop_is_minor: >-
      {%- set cur = (_cv.current_version | string).split('.') -%}
      {%- set ahead = [] -%}
      {%- for v in admin_ack_versions -%}
      {%- set p = (v | string).split('.') -%}
      {%- if (p | length) >= 3 and (cur | length) >= 3 and ((p[0] | int, p[1] | int, p[2] | int) > (cur[0] | int, cur[1] | int, cur[2] | int)) -%}
      {%- set _ = ahead.append((p[1] | int) > (cur[1] | int)) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ (ahead | length > 0) and ahead[0] }}
    admin_ack_required_keys: >-
      {%- set prefix = 'ack-' ~ ((_cv.current_version | string).split('.')[0:2] | join('.')) ~ '-' -%}
      {%- set out = [] -%}
      {%- if _bump_minors | length > 0 -%}
      {%- for k in _gate_keys if (k | string).startswith(prefix) and ((_acks[k] | default('') | string | lower) != 'true') -%}
      {%- set _ = out.append(k) -%}
      {%- endfor -%}
      {%- endif -%}
      {{ out }}
    # Why: OpenShift 4.Y ships Kubernetes 1.(Y+13); API removals are keyed by Kubernetes release.
    api_usage_releases: >-
      {%- set out = [] -%}
      {%- for m in _bump_minors -%}{%- set _ = out.append('1.' ~ (m + 13)) -%}{%- endfor -%}
      {{ out }}
  vars:
    _cv: "{{ admin_ack_raw.stdout_lines[0] | from_json }}"
    _gate_keys: "{{ admin_ack_raw.stdout_lines[1] | default('[]') | from_json }}"
    _acks: "{{ admin_ack_raw.stdout_lines[2] | default('{}') | from_json }}"
    _bump_minors: >-
      {%- set cur = (_cv.current_version | string).split('.') -%}
      {%- set out = [] -%}
      {%- for v in admin_ack_versions -%}
      {%- set p = (v | string).split('.') -%}
      {%- if (p | length) >= 2 and (cur | length) >= 2 and (p[0] | int) == (cur[0] | int) and (p[1] | int) > (cur[1] | int) and (p[1] | int) not in out -%}
      {%- set _ = out.append(p[1] | int) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out | sort }}

# ----------------------------------------------------------------------------
# 2. Removed-API usage (read-only)
# ----------------------------------------------------------------------------
- name: "Admin-ack: Check for workloads still calling APIs that the update removes"
  include_tasks: "{{ playbook_dir }}/steps/03/api_usage.yml"

# ----------------------------------------------------------------------------
# 3. Evaluate mode (Precheck 07)
# ----------------------------------------------------------------------------
# Why: Upgradeable=False only for the admin-ack is fine (it is applied before the hop);
#      any other reason blocks a minor first hop.
- name: "Admin-ack: Build the Precheck 07 verdict"
  set_fact:
    admin_ack_check_status: >-
      {{ 'FAIL' if (api_usage_blocking | bool)
         else ('FAIL' if ((admin_ack_required_keys | length > 0) and not (auto_apply_admin_acks | default(true) | bool))
         else ('PASS' if (_ack_only | bool)
         else ('FAIL' if (admin_ack_first_hop_is_minor | bool) else 'WARN'))) }}
    admin_ack_check_observed: >-
      {{ api_usage_summary }}.
      {{ ('Admin-ack needed before the ' ~ admin_ack_current_minor ~ ' minor hop: ' ~ (admin_ack_required_keys | join(', '))
          ~ (' - applied automatically before that hop.' if (auto_apply_admin_acks | default(true) | bool) else ' - auto_apply_admin_acks is false; acknowledge it by hand.'))
         if (admin_ack_required_keys | length > 0)
         else ('No admin-ack pending for the current minor ' ~ admin_ack_current_minor ~ '.' if (admin_ack_minor_hop | bool)
               else 'No minor-version hop in the path; no admin-ack needed.') }}
      {{ ('Upgradeable=False (' ~ admin_ack_upgradeable.reason ~ '): ' ~ (admin_ack_upgradeable.message | truncate(300))
          ~ (' - must clear before the minor hop.' if not (admin_ack_first_hop_is_minor | bool) else ''))
         if not (_ack_only | bool) else '' }}
  vars:
    _ack_only: >-
      {{ (admin_ack_upgradeable.status | string | lower) != 'false'
         or (admin_ack_upgradeable.reason == 'AdminAckRequired')
         or ((admin_ack_required_keys | length > 0) and (admin_ack_upgradeable.reason == 'MultipleReasons')) }}
  when: admin_ack_mode == 'evaluate'

# ----------------------------------------------------------------------------
# 4. Apply mode (right before a minor hop)
# ----------------------------------------------------------------------------
- name: "Admin-ack: Stop - removed APIs are still in use"
  fail:
    msg: >-
      {{ current_hop_label | default('Hop') }}: {{ api_usage_summary }}.
      The admin-ack for {{ admin_ack_current_minor }} was NOT applied. Move these clients to the newer APIs
      (or add verified system users to api_usage_ignore_users) and run the same command again.
  when:
    - admin_ack_mode == 'apply'
    - admin_ack_minor_hop | bool
    - api_usage_blocking | bool

- name: "Admin-ack: Stop - an admin-ack is needed but auto_apply_admin_acks is false"
  fail:
    msg: >-
      {{ current_hop_label | default('Hop') }} needs admin-ack key(s) {{ admin_ack_required_keys | join(', ') }} and
      auto_apply_admin_acks is false. Apply them with
      oc -n openshift-config patch cm admin-acks --type=merge -p '{"data":{"<key>":"true"}}' and run the same command again.
  when:
    - admin_ack_mode == 'apply'
    - admin_ack_required_keys | length > 0
    - not (auto_apply_admin_acks | default(true) | bool)

- name: "Admin-ack: Set the key(s) in openshift-config/admin-acks"
  shell: |
    set -o pipefail
    oc -n openshift-config get configmap admin-acks >/dev/null 2>&1 || oc -n openshift-config create configmap admin-acks
    oc -n openshift-config patch configmap admin-acks --type=merge -p {{ _patch | to_json | quote }}
  args:
    executable: /bin/bash
  vars:
    _patch: >-
      {%- set data = {} -%}
      {%- for k in admin_ack_required_keys -%}{%- set _ = data.update({k: 'true'}) -%}{%- endfor -%}
      {{ {'data': data} }}
  register: admin_ack_patch
  changed_when: true
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: admin_ack_patch.rc == 0
  when:
    - admin_ack_mode == 'apply'
    - admin_ack_required_keys | length > 0

- name: "Admin-ack: Remember the applied key(s)"
  set_fact:
    admin_acks_applied: >-
      {%- set out = [] -%}
      {%- for k in admin_ack_required_keys -%}{%- set _ = out.append({'key': k, 'hop': current_hop_label | default('hop')}) -%}{%- endfor -%}
      {{ admin_acks_applied + out }}
  when:
    - admin_ack_mode == 'apply'
    - admin_ack_required_keys | length > 0

- name: "Admin-ack: Log the applied key(s)"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "AUTO-FIX"
    event_task: "Admin-ack before {{ current_hop_label | default('hop') }}"
    event_reason: "Set {{ admin_ack_required_keys | join(', ') }} in openshift-config/admin-acks"
    event_observed: "{{ api_usage_summary }}"
  when:
    - admin_ack_mode == 'apply'
    - admin_ack_required_keys | length > 0

# Why: the cluster refuses a minor update while Upgradeable=False. Wait (bounded) for it
#      to re-evaluate after the ack; any other reason stops the hop now instead of
#      leaving the update rejected until the hop timeout.
- name: "Admin-ack: Wait for ClusterVersion Upgradeable=True"
  shell: |
    set -o pipefail
    deadline=$((SECONDS + {{ (admin_ack_clear_timeout_seconds | default(300) | int) if (admin_ack_required_keys | length > 0) else 0 }}))
    while :; do
      state="$(oc get clusterversion version -o json | jq -r '(((.status.conditions // []) | map(select(.type == "Upgradeable")) | .[0]) // {}) | "\((.status // "True") | tostring)|\(.reason // "")|\(.message // "")"')" || state="Unknown||query failed"
      case "$state" in True*) break ;; esac
      [ "$SECONDS" -ge "$deadline" ] && break
      sleep 15
    done
    printf '%s\n' "$state"
  args:
    executable: /bin/bash
  register: admin_ack_wait_raw
  changed_when: false
  failed_when: false
  when:
    - admin_ack_mode == 'apply'
    - admin_ack_minor_hop | bool

- name: "Admin-ack: Stop - ClusterVersion is not Upgradeable"
  fail:
    msg: >-
      {{ current_hop_label | default('Hop') }}: ClusterVersion reports Upgradeable=False
      ({{ admin_ack_wait_raw.stdout.split('|')[1] | default('') }}): {{ admin_ack_wait_raw.stdout.split('|')[2:] | join('|') | truncate(500) }}.
      A minor-version update cannot start until this clears.
  when:
    - admin_ack_mode == 'apply'
    - admin_ack_minor_hop | bool
    - not ((admin_ack_wait_raw.stdout | default('True')).startswith('True'))
