---
# ============================================================================
# steps/03/start_hop.yml - start one hop
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Input: hop_target, hop_cv, hop_channel, hop_is_minor, current_hop_label (from hop.yml)
#   1. Set the hop's channel on ClusterVersion when it differs.
#   2. Wait (bounded) until the cluster offers hop_target. A conditional update whose
#      risks apply is refused unless allow_conditional_updates is true.
#   3. Minor hop: removed-API check, admin-ack, wait for Upgradeable=True
#      (steps/03/admin_ack.yml in apply mode).
#   4. `oc adm upgrade --to=<hop_target>` and confirm ClusterVersion accepted it.
# Cluster writes: spec.channel, openshift-config/admin-acks (minor hops), the update.
# ============================================================================

- name: "Start hop: Stop - this is a dry run"
  fail:
    msg: "start_hop.yml was reached in a dry run; no hop may be started in a dry run."
  when: dry_run | bool

# ----------------------------------------------------------------------------
# 1. Channel
# ----------------------------------------------------------------------------
- name: "Start hop: Set the channel to {{ hop_channel }}"
  command: "oc patch clusterversion version --type merge -p {{ {'spec': {'channel': hop_channel}} | to_json | quote }}"
  register: start_channel
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: start_channel.rc == 0
  when: hop_cv.channel != hop_channel

- name: "Start hop: Log the channel change"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "INFO"
    event_task: "{{ current_hop_label }} channel"
    event_reason: "Channel changed from {{ hop_cv.channel or 'none' }} to {{ hop_channel }}"
  when: hop_cv.channel != hop_channel

# ----------------------------------------------------------------------------
# 2. Wait for the cluster to offer the target
# ----------------------------------------------------------------------------
# Why: after a channel change the cluster needs to fetch the new graph (usually under
#      a minute). The loop prints one JSON line: RECOMMENDED, CONDITIONAL (with the
#      risks) or NOT_OFFERED (with the RetrievedUpdates message).
- name: "Start hop: Wait until the cluster offers {{ hop_target }}"
  shell: |
    set -o pipefail
    deadline=$((SECONDS + {{ upgrade_edge_wait_seconds | default(300) | int }}))
    while :; do
      state="$(oc get clusterversion version -o json | jq -c --arg t {{ hop_target | quote }} '
        def cond(t): (((.status.conditions // []) | map(select(.type == t)) | .[0]) // {});
        ([(.status.conditionalUpdates // [])[] | select((.release.version // "") == $t)] | .[0]) as $c
        | if ([(.status.availableUpdates // [])[] | (.version // "")] | map(. == $t) | any) then {edge: "RECOMMENDED"}
          elif $c != null then {edge: "CONDITIONAL",
                                recommended: ((((($c.conditions // []) | map(select(.type == "Recommended")) | .[0].status) // "Unknown")) | tostring),
                                risks: [($c.risks // [])[] | {name: (.name // ""), message: ((.message // "") | .[0:300]), url: (.url // "")}]}
          else {edge: "NOT_OFFERED", retrieved: ((cond("RetrievedUpdates").status // "Unknown") | tostring),
                message: ((cond("RetrievedUpdates").message // "") | .[0:300])} end')" \
        || state='{"edge":"QUERY_FAILED"}'
      case "$state" in *'"RECOMMENDED"'*|*'"CONDITIONAL"'*) break ;; esac
      [ "$SECONDS" -ge "$deadline" ] && break
      sleep 15
    done
    printf '%s\n' "$state"
  args:
    executable: /bin/bash
  register: start_offer_raw
  changed_when: false
  failed_when: false

- name: "Start hop: Read the offer"
  set_fact:
    hop_offer: >-
      {{ (start_offer_raw.stdout | from_json) if ((start_offer_raw.stdout | default('') | trim).startswith('{'))
         else {'edge': 'QUERY_FAILED', 'message': (start_offer_raw.stderr | default('') | truncate(300))} }}

- name: "Start hop: Stop - the cluster does not offer {{ hop_target }}"
  fail:
    msg: >-
      The cluster does not offer {{ hop_target }} in channel {{ hop_channel }} after {{ upgrade_edge_wait_seconds | default(300) }} s
      (from {{ hop_cv.completed }}; RetrievedUpdates={{ hop_offer.retrieved | default('unknown') }} {{ hop_offer.message | default('') }}).
      Check the version, the channel and the cluster's access to the update service.
  when: hop_offer.edge not in ['RECOMMENDED', 'CONDITIONAL']

- name: "Start hop: Stop - conditional update risks apply to this cluster"
  fail:
    msg: >-
      {{ hop_target }} is a conditional update for this cluster (Recommended={{ hop_offer.recommended }}). Known risks:
      {% for r in hop_offer.risks %}{{ r.name }}: {{ r.message }} ({{ r.url }}){% if not loop.last %}; {% endif %}{% endfor %}.
      Review them; to accept them set allow_conditional_updates: true and run the same command again.
  when:
    - hop_offer.edge == 'CONDITIONAL'
    - hop_offer.recommended != 'True'
    - not (allow_conditional_updates | default(false) | bool)

- name: "Start hop: Note accepted conditional-update risks"
  set_fact:
    hop_accepted_risks: >-
      {{ hop_offer.risks | default([]) if (hop_offer.edge == 'CONDITIONAL' and hop_offer.recommended != 'True') else [] }}

- name: "Start hop: Log accepted conditional-update risks"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "WARN"
    event_task: "{{ current_hop_label }} conditional update"
    event_reason: "allow_conditional_updates is true; accepting risks: {{ hop_accepted_risks | map(attribute='name') | join(', ') }}"
    event_observed: "{{ hop_accepted_risks | map(attribute='url') | join(' ') }}"
  when: hop_accepted_risks | length > 0

# ----------------------------------------------------------------------------
# 3. Admin-ack (minor hops only; removed-API check first)
# ----------------------------------------------------------------------------
- name: "Start hop: Check removed-API usage and apply the admin-ack"
  include_tasks: "{{ playbook_dir }}/steps/03/admin_ack.yml"
  vars:
    admin_ack_mode: "apply"
    admin_ack_versions: ["{{ hop_target }}"]
  when: hop_is_minor | bool

# ----------------------------------------------------------------------------
# 4. Start and confirm
# ----------------------------------------------------------------------------
- name: "Start hop: oc adm upgrade --to={{ hop_target }}"
  command: >-
    oc adm upgrade --to={{ hop_target | quote }}
    {{ '--allow-not-recommended' if (hop_accepted_risks | length > 0) else '' }}
  register: start_trigger
  changed_when: true

# Why: rc 0 only means the request was written; the hop really starts when
#      ClusterVersion's desired version becomes the target.
- name: "Start hop: Confirm the cluster accepted the update"
  shell: |
    set -o pipefail
    deadline=$((SECONDS + 180))
    while :; do
      desired="$(oc get clusterversion version -o jsonpath='{.status.desired.version}' 2>/dev/null || true)"
      [ "$desired" = {{ hop_target | quote }} ] && { echo "ACCEPTED"; exit 0; }
      [ "$SECONDS" -ge "$deadline" ] && break
      sleep 10
    done
    msg="$(oc get clusterversion version -o json 2>/dev/null | jq -r '[(.status.conditions // [])[] | select(.type == "ReleaseAccepted" or .type == "Failing") | "\(.type)=\(.status): \(.message // "")"] | join(" | ")' || true)"
    echo "NOT_ACCEPTED desired=${desired:-unknown} ${msg}"
  args:
    executable: /bin/bash
  register: start_accept_raw
  changed_when: false
  failed_when: false

- name: "Start hop: Stop - the update request was not accepted"
  fail:
    msg: "ClusterVersion did not accept the update to {{ hop_target }} within 3 minutes: {{ start_accept_raw.stdout | default('') | truncate(600) }}"
  when: not ((start_accept_raw.stdout | default('')).startswith('ACCEPTED'))

- name: "Start hop: Log the start"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "START"
    event_task: "{{ current_hop_label }} update"
    event_reason: "Update to {{ hop_target }} started from {{ hop_cv.completed }} (channel {{ hop_channel }}{{ ', conditional risks accepted' if (hop_accepted_risks | length > 0) else '' }})"
    event_observed: "{{ start_trigger.stdout | default('') | truncate(300) }}"
