---
# Postcheck 01 - ClusterVersion (HARD)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: the cluster is at the expected version, Available=True, not Progressing,
#       not Failing/Degraded. Sets run_final_version (used by Check 04 and the report).

- name: "Check 01: Read ClusterVersion"
  shell: |
    set -o pipefail
    oc get clusterversion version -o json | jq -c '{
      current: (((.status.history // []) | map(select(.state == "Completed")) | .[0].version) // (.status.desired.version // "")),
      desired: (.status.desired.version // ""),
      available: (((.status.conditions // []) | map(select(.type == "Available")) | .[0].status) // "False" | tostring),
      progressing: (((.status.conditions // []) | map(select(.type == "Progressing")) | .[0].status) // "False" | tostring),
      failing: (((.status.conditions // []) | map(select(.type == "Degraded" or .type == "Failing")) | .[0].status) // "False" | tostring)}'
  args:
    executable: /bin/bash
  register: p01_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: p01_raw.rc == 0

- name: "Check 01: Record the result"
  set_fact:
    run_final_version: "{{ _cv.current }}"
    postval_expected_version: "{{ _expected }}"
    postval_checks: >-
      {{ postval_checks + [{'num': 1, 'name': 'ClusterVersion', 'gate': 'HARD',
           'status': 'PASS' if (_ok | bool) else 'FAIL',
           'observed': 'At ' ~ _cv.current ~ ' (expected ' ~ _expected ~ '), Available=' ~ _cv.available
                       ~ ', Progressing=' ~ _cv.progressing ~ ', Failing=' ~ _cv.failing}] }}
  vars:
    _cv: "{{ p01_raw.stdout | from_json }}"
    _expected: "{{ _cv.current if (postval_expected_version | string | trim) in ['', 'current'] else (postval_expected_version | string | trim) }}"
    _ok: >-
      {{ (_cv.current == _expected or _cv.desired == _expected)
         and (_cv.available | lower == 'true') and (_cv.progressing | lower != 'true') and (_cv.failing | lower != 'true') }}
