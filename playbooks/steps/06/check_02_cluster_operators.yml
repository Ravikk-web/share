---
# Postcheck 02 - ClusterOperators (HARD)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: every ClusterOperator outside co_allow_list is Available, not Degraded and not
#       Progressing. Operators often finish settling a few minutes after the last hop,
#       so this waits up to postval_co_settle_seconds (in-shell loop) and judges the
#       last state it saw.

- name: "Check 02: Wait for ClusterOperators to settle and read them"
  shell: |
    set -o pipefail
    deadline=$((SECONDS + {{ postval_co_settle_seconds | default(300) | int }}))
    while :; do
      state="$(oc get clusteroperators -o json --request-timeout=60s | jq -c --argjson allow {{ co_allow_list | default([]) | to_json | quote }} '
        def cstat(t): ((((.status.conditions // []) | map(select(.type == t)) | .[0].status) // "Unknown") | tostring);
        [.items[]? | select(.metadata.name as $n | ($allow | map(. == $n) | any) | not)] as $cos
        | {total: ((.items // []) | length),
           degraded: [$cos[] | select(cstat("Degraded") == "True") | .metadata.name],
           unavailable: [$cos[] | select(cstat("Available") != "True") | .metadata.name],
           progressing: [$cos[] | select(cstat("Progressing") == "True") | .metadata.name]}
        | . + {settled: (((.degraded + .unavailable + .progressing) | length) == 0)}')" || state=""
      case "$state" in *'"settled":true'*) break ;; esac
      [ "$SECONDS" -ge "$deadline" ] && break
      sleep 20
    done
    [ -n "$state" ] || { echo "could not read ClusterOperators" >&2; exit 1; }
    printf '%s\n' "$state"
  args:
    executable: /bin/bash
  register: p02_raw
  changed_when: false

- name: "Check 02: Record the result"
  set_fact:
    postval_checks: >-
      {{ postval_checks + [{'num': 2, 'name': 'ClusterOperators', 'gate': 'HARD',
           'status': 'PASS' if (_co.settled | bool) else 'FAIL',
           'observed': ('All ' ~ _co.total ~ ' ClusterOperators Available, not Degraded, not Progressing') if (_co.settled | bool)
                       else ('Degraded: ' ~ (_co.degraded | join(', ') or 'none') ~ '; not Available: ' ~ (_co.unavailable | join(', ') or 'none')
                             ~ '; Progressing: ' ~ (_co.progressing | join(', ') or 'none'))}] }}
  vars:
    _co: "{{ p02_raw.stdout | from_json }}"
