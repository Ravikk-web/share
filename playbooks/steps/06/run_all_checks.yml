---
# ============================================================================
# steps/06/run_all_checks.yml - run the 10 postchecks in order
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Every check appends one record {num, name, gate, status, observed} to postval_checks.
#   01 ClusterVersion            HARD     06 etcd                      HARD
#   02 ClusterOperators          HARD     07 PersistentVolumes         WARN
#   03 MachineConfigPools        HARD     08 Platform pods             WARN
#   04 Nodes and kubelet version HARD     09 Critical alerts           WARN
#   05 Node pressure             HARD     10 Baseline diff             WARN
# ============================================================================

- name: "Postchecks: Start a fresh list"
  set_fact:
    postval_checks: []

- name: "Postcheck 01 - ClusterVersion"
  include_tasks: "{{ playbook_dir }}/steps/06/check_01_cluster_version.yml"
- name: "Postcheck 02 - ClusterOperators"
  include_tasks: "{{ playbook_dir }}/steps/06/check_02_cluster_operators.yml"
- name: "Postcheck 03 - MachineConfigPools"
  include_tasks: "{{ playbook_dir }}/steps/06/check_03_machine_config_pools.yml"
- name: "Postcheck 04 - Nodes and kubelet version"
  include_tasks: "{{ playbook_dir }}/steps/06/check_04_nodes.yml"
- name: "Postcheck 05 - Node pressure"
  include_tasks: "{{ playbook_dir }}/steps/06/check_05_node_pressure.yml"
- name: "Postcheck 06 - etcd"
  include_tasks: "{{ playbook_dir }}/steps/06/check_06_etcd.yml"
- name: "Postcheck 07 - PersistentVolumes"
  include_tasks: "{{ playbook_dir }}/steps/06/check_07_persistent_volumes.yml"
- name: "Postcheck 08 - Platform pods"
  include_tasks: "{{ playbook_dir }}/steps/06/check_08_platform_pods.yml"
- name: "Postcheck 09 - Critical alerts"
  include_tasks: "{{ playbook_dir }}/steps/06/check_09_critical_alerts.yml"
- name: "Postcheck 10 - Baseline diff"
  include_tasks: "{{ playbook_dir }}/steps/06/check_10_baseline_diff.yml"

- name: "Postchecks: Results"
  debug:
    msg: >-
      {%- set out = [] -%}
      {%- for c in postval_checks -%}
      {%- set _ = out.append('%02d %-4s %-4s %s - %s' | format(c.num, c.gate, c.status, c.name, c.observed | truncate(160))) -%}
      {%- endfor -%}
      {{ out }}
