---
# Postcheck 09 - Critical alerts (WARN)
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# Rule: no alert with severity=critical is firing.
# Asks the thanos-querier route with the session token first, then the Prometheus pod
# itself. If neither answers, the check is WARN "not checked" - never PASS.

- name: "Check 09: Read firing critical alerts"
  shell: |
    set -o pipefail
    out=""
    token="$(oc whoami -t 2>/dev/null || true)"
    host="$(oc get route thanos-querier -n openshift-monitoring -o jsonpath='{.spec.host}' 2>/dev/null || true)"
    if [ -n "$host" ] && [ -n "$token" ]; then
      out="$(curl -sS -k --max-time {{ alerts_query_timeout_seconds | default(20) | int }} -H "Authorization: Bearer ${token}" "https://${host}/api/v1/alerts" 2>/dev/null || true)"
    fi
    if ! printf '%s' "$out" | jq -e '.status == "success"' >/dev/null 2>&1; then
      out="$(timeout {{ (alerts_query_timeout_seconds | default(20) | int) + 15 }} oc exec -n openshift-monitoring prometheus-k8s-0 -c prometheus -- curl -s --max-time {{ alerts_query_timeout_seconds | default(20) | int }} http://localhost:9090/api/v1/alerts 2>/dev/null || true)"
    fi
    if printf '%s' "$out" | jq -e '.status == "success"' >/dev/null 2>&1; then
      printf '%s' "$out" | jq -c '{ok: true, alerts: [((.data.alerts // [])[]?
        | select(.state == "firing" and (((.labels.severity // "") | tostring) == "critical"))
        | (.labels.alertname // "Unknown"))] | unique}'
    else
      echo '{"ok": false, "alerts": []}'
    fi
  args:
    executable: /bin/bash
  register: p09_raw
  changed_when: false
  failed_when: false

- name: "Check 09: Record the result"
  set_fact:
    postval_checks: >-
      {{ postval_checks + [{'num': 9, 'name': 'Critical alerts', 'gate': 'WARN',
           'status': 'PASS' if ((_a.ok | bool) and (_a.alerts | length == 0)) else 'WARN',
           'observed': ('Not checked: the alerts API could not be reached' if not (_a.ok | bool)
                        else ('No critical alerts firing' if (_a.alerts | length == 0)
                        else ('Firing: ' ~ (_a.alerts | join(', ')))))}] }}
  vars:
    _a: "{{ (p09_raw.stdout | from_json) if ((p09_raw.stdout | default('') | trim).startswith('{')) else {'ok': false, 'alerts': []} }}"
