---
# ============================================================================
# steps/01/validate_path.yml - validate the whole upgrade path (read-only)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# 1. Reads ClusterVersion: completed / desired version, channel, offered updates.
# 2. Splits upgrade_path into hops already reached (skipped - this is what makes a
#    re-run resume safely), an update already in progress (watched, not restarted)
#    and the hops still to run.
# 3. Checks the path shape: X.Y.Z, ascending, same major, no skipped minor version.
# 4. Checks each remaining edge against the OpenShift Update Service graph of the
#    channel that hop uses (<target_channel_prefix>-<major.minor>), and the first
#    edge also against what the cluster itself offers.
#
# Verdict per edge:
#   PASS  recommended edge (cluster offer or graph)
#   WARN  conditional edge the cluster evaluates at hop time, or the graph could not
#         be reached (each hop is verified on the cluster again before it starts)
#   FAIL  no such edge, version not in the channel, conditional risks that apply to
#         this cluster (unless allow_conditional_updates), or a foreign update running
#
# Outputs: path_validation (rows), path_validation_status, path_validation_problems,
#          path_current_version, path_reached_hops, path_remaining_hops,
#          path_in_progress_hop, path_live_cv
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Live ClusterVersion state
# ----------------------------------------------------------------------------
- name: "Path: Read the ClusterVersion update state"
  shell: |
    set -o pipefail
    oc get clusterversion version -o json | jq -c '
      def cond(t): (((.status.conditions // []) | map(select(.type == t)) | .[0]) // {});
      {
        completed: ((((.status.history // []) | map(select(.state == "Completed")) | .[0].version) // "")),
        desired: (.status.desired.version // ""),
        progressing: ((cond("Progressing").status // "False") | tostring),
        channel: (.spec.channel // ""),
        retrieved: (cond("RetrievedUpdates") | {status: ((.status // "Unknown") | tostring), message: ((.message // "") | .[0:300])}),
        available: [(.status.availableUpdates // [])[] | (.version // empty)],
        conditional: [(.status.conditionalUpdates // [])[] | {
          version: (.release.version // ""),
          recommended: ((((.conditions // []) | map(select(.type == "Recommended")) | .[0].status) // "Unknown") | tostring),
          risks: [(.risks // [])[] | {name: (.name // ""), message: ((.message // "") | .[0:300]), url: (.url // "")}]
        }]
      }'
  args:
    executable: /bin/bash
  register: _vp_cv_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: _vp_cv_raw.rc == 0

- name: "Path: Work out the current version"
  set_fact:
    path_live_cv: "{{ _vp_cv_raw.stdout | from_json }}"
    path_current_version: "{{ (_vp_cv_raw.stdout | from_json).completed or (_vp_cv_raw.stdout | from_json).desired }}"

- name: "Path: Stop if the cluster version could not be read"
  fail:
    msg: "Could not read the current cluster version from ClusterVersion (got '{{ path_current_version }}')."
  when: not (path_current_version is match('^[0-9]+[.][0-9]+[.][0-9]+$'))

# ----------------------------------------------------------------------------
# 2. Reached / in-progress / remaining hops
# ----------------------------------------------------------------------------
- name: "Path: Split the path into reached and remaining hops"
  set_fact:
    _vp_updating: "{{ path_live_cv.progressing == 'True' and path_live_cv.desired != path_live_cv.completed }}"
    _vp_bad_format: "{{ upgrade_path | reject('match', '^[0-9]+[.][0-9]+[.][0-9]+$') | list }}"
    path_reached_hops: >-
      {%- set out = [] -%}
      {%- for h in upgrade_path if h is match('^[0-9]+[.][0-9]+[.][0-9]+$') and h is version(path_current_version, '<=') -%}
      {%- set _ = out.append(h) -%}
      {%- endfor -%}
      {{ out }}
    path_remaining_hops: >-
      {%- set out = [] -%}
      {%- for h in upgrade_path if h is match('^[0-9]+[.][0-9]+[.][0-9]+$') and h is version(path_current_version, '>') -%}
      {%- set _ = out.append(h) -%}
      {%- endfor -%}
      {{ out }}

# Why: an update already running to the next hop is watched instead of restarted;
#      one running to any other version is never taken over.
- name: "Path: Detect an update already in progress"
  set_fact:
    path_in_progress_hop: >-
      {{ path_live_cv.desired
         if ((_vp_updating | bool) and (path_remaining_hops | length > 0) and path_live_cv.desired == path_remaining_hops[0])
         else '' }}
    _vp_foreign_update: >-
      {{ (_vp_updating | bool) and not ((path_remaining_hops | length > 0) and path_live_cv.desired == path_remaining_hops[0]) }}

# Why: versions are compared with split('.') - regex backreferences inside YAML-quoted
#      Jinja turn into control characters.
- name: "Path: Check the shape of the path (ascending, same major, no skipped minor)"
  set_fact:
    _vp_shape_problems: >-
      {%- set hops = [path_current_version] + path_remaining_hops -%}
      {%- set out = [] -%}
      {%- for i in range(1, hops | length) -%}
      {%- set a = hops[i - 1].split('.') -%}
      {%- set b = hops[i].split('.') -%}
      {%- if (a[0] | int) != (b[0] | int) -%}
      {%- set _ = out.append(hops[i - 1] ~ ' -> ' ~ hops[i] ~ ' changes the major version (not supported)') -%}
      {%- elif ((b[1] | int) - (a[1] | int)) > 1 -%}
      {%- set _ = out.append(hops[i - 1] ~ ' -> ' ~ hops[i] ~ ' skips minor version ' ~ a[0] ~ '.' ~ ((a[1] | int) + 1) ~ '; add a hop for it') -%}
      {%- elif i > 1 and not (hops[i] is version(hops[i - 1], '>')) -%}
      {%- set _ = out.append(hops[i - 1] ~ ' -> ' ~ hops[i] ~ ' is not in ascending order') -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: "Path: List the edges still to be taken"
  set_fact:
    _vp_edges: >-
      {%- set out = [] -%}
      {%- set prev = [path_in_progress_hop if (path_in_progress_hop | length > 0) else path_current_version] -%}
      {%- for h in path_remaining_hops -%}
      {%- if h != path_in_progress_hop -%}
      {%- set p = h.split('.') -%}
      {%- set _ = out.append({'from': prev[-1], 'to': h,
            'channel': (target_channel if (target_channel | default('') | length > 0)
                        else ((target_channel_prefix | default('stable')) ~ '-' ~ p[0] ~ '.' ~ p[1]))}) -%}
      {%- endif -%}
      {%- set _ = prev.append(h) -%}
      {%- endfor -%}
      {{ out }}

# ----------------------------------------------------------------------------
# 3. OpenShift Update Service graph (one download per channel)
# ----------------------------------------------------------------------------
# Why: the same service the cluster uses. An unreachable graph never fails the run by
#      itself; those edges become WARN and are verified on the cluster before each hop.
- name: "Path: Check each edge against the OpenShift update graph"
  shell: |
    set -o pipefail
    tmpd="$(mktemp -d)"
    trap 'rm -rf "$tmpd"' EXIT
    edges={{ _vp_edges | to_json | quote }}
    n="$(printf '%s' "$edges" | jq 'length')"
    results='[]'
    i=0
    while [ "$i" -lt "$n" ]; do
      from="$(printf '%s' "$edges" | jq -r ".[$i].from")"
      to="$(printf '%s' "$edges" | jq -r ".[$i].to")"
      ch="$(printf '%s' "$edges" | jq -r ".[$i].channel")"
      gf="$tmpd/graph-$ch.json"
      if [ ! -s "$gf" ] && [ ! -f "$gf.failed" ]; then
        if ! curl -sS --fail --max-time {{ upgrade_graph_timeout_seconds | default(30) | int }} \
             {{ '-k' if (insecure_skip_tls_verify | default(true) | bool) else '' }} \
             {{ ('--proxy ' ~ (upgrade_graph_proxy | quote)) if (upgrade_graph_proxy | default('') | length > 0) else '' }} \
             -H 'Accept: application/json' \
             "{{ upgrade_graph_url | default('https://api.openshift.com/api/upgrades_info/v1/graph') }}?channel=${ch}&arch={{ upgrade_graph_arch | default('amd64') }}" \
             -o "$gf" 2>"$tmpd/err-$ch"; then
          rm -f "$gf"
          head -c 300 "$tmpd/err-$ch" > "$gf.failed"
        fi
      fi
      if [ -f "$gf.failed" ]; then
        r="$(jq -cn --arg f "$from" --arg t "$to" --arg c "$ch" --arg e "$(cat "$gf.failed")" \
             '{from: $f, to: $t, channel: $c, status: "UNKNOWN", detail: ("update graph not reachable: " + $e), risks: []}')"
      else
        r="$(jq -c --arg f "$from" --arg t "$to" --arg c "$ch" '
              ((.nodes // []) | map(.version)) as $v
              | (($v | indices($f)) | .[0]) as $fi
              | (($v | indices($t)) | .[0]) as $ti
              | [(.conditionalEdges // [])[]
                 | select((.edges // []) | map(.from == $f and .to == $t) | any)
                 | (.risks // [])[]
                 | {name: (.name // ""), message: ((.message // "") | .[0:300]), url: (.url // "")}] as $risks
              | (if $ti == null then {status: "NOT_IN_CHANNEL", detail: ($t + " is not in channel " + $c)}
                 elif $fi == null then {status: "NOT_IN_CHANNEL", detail: ($f + " has no update path into channel " + $c + " (update to a newer " + $f + " z-stream first)")}
                 elif ((.edges // []) | map(.[0] == $fi and .[1] == $ti) | any) then {status: "RECOMMENDED", detail: ("recommended update in " + $c)}
                 elif ($risks | length) > 0 then {status: "CONDITIONAL", detail: ("conditional update in " + $c + " with " + (($risks | length) | tostring) + " known risk(s)")}
                 else {status: "NO_EDGE", detail: ("no update edge " + $f + " -> " + $t + " in " + $c)} end)
              + {from: $f, to: $t, channel: $c, risks: $risks}' "$gf" 2>/dev/null)" \
          || r="$(jq -cn --arg f "$from" --arg t "$to" --arg c "$ch" \
                  '{from: $f, to: $t, channel: $c, status: "UNKNOWN", detail: "update graph response could not be read", risks: []}')"
      fi
      results="$(printf '%s' "$results" | jq -c --argjson r "$r" '. + [$r]')"
      i=$((i + 1))
    done
    printf '%s\n' "$results"
  args:
    executable: /bin/bash
  register: _vp_graph_raw
  changed_when: false
  failed_when: false
  when:
    - upgrade_graph_validation_enabled | default(true) | bool
    - _vp_edges | length > 0

- name: "Path: Read the graph results"
  set_fact:
    _vp_graph: >-
      {{ (_vp_graph_raw.stdout | from_json) if ((_vp_graph_raw.stdout | default('') | trim).startswith('[')) else [] }}
    _vp_graph_note: >-
      {{ 'update graph check disabled (upgrade_graph_validation_enabled: false)'
         if not (upgrade_graph_validation_enabled | default(true) | bool)
         else ('update graph check did not run: ' ~ (_vp_graph_raw.stderr | default('no output') | truncate(200))) }}

# ----------------------------------------------------------------------------
# 4. Verdict per edge
# ----------------------------------------------------------------------------
- name: "Path: Decide each edge"
  set_fact:
    path_validation: >-
      {%- set rows = [] -%}
      {%- for h in path_reached_hops -%}
      {%- set _ = rows.append({'from': '', 'to': h, 'channel': '', 'status': 'PASS', 'source': 'cluster',
            'detail': 'already reached (cluster at ' ~ path_current_version ~ '); hop skipped', 'risks': []}) -%}
      {%- endfor -%}
      {%- if path_in_progress_hop | length > 0 -%}
      {%- set _ = rows.append({'from': path_live_cv.completed, 'to': path_in_progress_hop, 'channel': path_live_cv.channel, 'status': 'PASS',
            'source': 'cluster', 'detail': 'update already in progress; it is watched to completion, not started again', 'risks': []}) -%}
      {%- endif -%}
      {%- for e in _vp_edges -%}
      {%- set gm = _vp_graph | selectattr('to', 'equalto', e.to) | selectattr('from', 'equalto', e['from']) | list -%}
      {%- set g0 = gm[0] if (gm | length > 0) else {'status': 'UNKNOWN', 'detail': _vp_graph_note, 'risks': []} -%}
      {%- set first = loop.first and (path_in_progress_hop | length == 0) -%}
      {%- set live_cond = (path_live_cv.conditional | selectattr('version', 'equalto', e.to) | list) if first else [] -%}
      {%- if first and (e.to in path_live_cv.available) -%}
      {%- set r = {'status': 'PASS', 'source': 'cluster', 'detail': 'offered by the cluster' ~ (('; graph: ' ~ g0.detail) if g0.status != 'UNKNOWN' else '')} -%}
      {%- elif live_cond | length > 0 -%}
      {%- set lc = live_cond[0] -%}
      {%- if lc.recommended == 'True' -%}
      {%- set r = {'status': 'PASS', 'source': 'cluster', 'detail': 'conditional update; the cluster found its risks do not apply'} -%}
      {%- elif allow_conditional_updates | default(false) | bool -%}
      {%- set r = {'status': 'WARN', 'source': 'cluster', 'detail': 'conditional update accepted by allow_conditional_updates; risks: ' ~ (lc.risks | map(attribute='name') | join(', '))} -%}
      {%- else -%}
      {%- set r = {'status': 'FAIL', 'source': 'cluster', 'detail': 'conditional update whose risks apply to this cluster: ' ~ (lc.risks | map(attribute='name') | join(', ')) ~ '. Review the risks; choose another version or set allow_conditional_updates: true.'} -%}
      {%- endif -%}
      {%- elif g0.status == 'RECOMMENDED' -%}
      {%- set r = {'status': 'PASS', 'source': 'graph', 'detail': g0.detail} -%}
      {%- elif g0.status == 'CONDITIONAL' -%}
      {%- set r = {'status': 'WARN', 'source': 'graph', 'detail': g0.detail ~ ' (' ~ (g0.risks | map(attribute='name') | join(', ')) ~ '). The cluster evaluates these risks when it reaches this hop; the hop stops if they apply' ~ ('' if (allow_conditional_updates | default(false) | bool) else ' (allow_conditional_updates is false)') ~ '.'} -%}
      {%- elif g0.status in ['NOT_IN_CHANNEL', 'NO_EDGE'] -%}
      {%- set r = {'status': 'FAIL', 'source': 'graph', 'detail': g0.detail} -%}
      {%- elif first and path_live_cv.channel == e.channel and path_live_cv.retrieved.status == 'True' -%}
      {%- set r = {'status': 'FAIL', 'source': 'cluster', 'detail': 'the cluster does not offer ' ~ e.to ~ ' in channel ' ~ e.channel ~ ' (' ~ g0.detail ~ ')'} -%}
      {%- else -%}
      {%- set r = {'status': 'WARN', 'source': 'none', 'detail': 'not verified in advance (' ~ g0.detail ~ '); verified on the cluster before this hop starts'} -%}
      {%- endif -%}
      {%- set _ = rows.append({'from': e['from'], 'to': e.to, 'channel': e.channel, 'status': r.status, 'source': r.source,
            'detail': r.detail, 'risks': (g0.risks | default([]))}) -%}
      {%- endfor -%}
      {{ rows }}

- name: "Path: Sum up the verdict"
  set_fact:
    path_validation_problems: >-
      {{ (['invalid version format: ' ~ (_vp_bad_format | join(', '))] if (_vp_bad_format | length > 0) else [])
         + _vp_shape_problems
         + (['an update to ' ~ path_live_cv.desired ~ ' is in progress and it is not the next hop of this path'] if (_vp_foreign_update | bool) else []) }}

- name: "Path: Set the path status"
  set_fact:
    path_validation_status: >-
      {{ 'FAIL' if ((path_validation_problems | length > 0) or (path_validation | selectattr('status', 'equalto', 'FAIL') | list | length > 0))
         else ('WARN' if (path_validation | selectattr('status', 'equalto', 'WARN') | list | length > 0) else 'PASS') }}

- name: "Path: Show the verdict"
  debug:
    msg: >-
      Path {{ path_current_version }} -> {{ upgrade_path | join(' -> ') }}: {{ path_validation_status }}.
      {% for r in path_validation %}[{{ r.status }}] {{ (r['from'] ~ ' -> ') if (r['from'] | length > 0) else '' }}{{ r.to }}{{ (' (' ~ r.channel ~ ')') if (r.channel | length > 0) else '' }}: {{ r.detail }}{% if not loop.last %} | {% endif %}{% endfor %}
      {{ ('Problems: ' ~ (path_validation_problems | join('; '))) if (path_validation_problems | length > 0) else '' }}
