---
# ============================================================================
# steps/01/snapshot.yml - save the baseline snapshot
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Writes snapshots/<cluster>_<ts>_baseline.json: version, channel, cluster ID,
# nodes, ClusterOperators and routes. Phase 05 Check 10 compares the cluster
# against it. This file is the only state kept between phases.
# ============================================================================

# Why: one oc call per resource; jq keeps only the fields the diff needs.
- name: "Snapshot: Read version, operators, nodes and routes"
  shell: |
    set -o pipefail
    oc get clusterversion version -o json | jq -c '{
      current_version: (((.status.history // []) | map(select(.state == "Completed")) | .[0].version) // (.status.desired.version // "unknown")),
      channel: (.spec.channel // "unknown"),
      cluster_id: (.spec.clusterID // "unknown")}'
    oc get clusteroperators -o json | jq -c '[.items[]? | {
      name: .metadata.name,
      version: ((((.status.versions // []) | map(select(.name == "operator")) | .[0].version)) // "unknown"),
      available: (([.status.conditions[]? | select(.type == "Available") | .status] | first) // "Unknown"),
      degraded: (([.status.conditions[]? | select(.type == "Degraded") | .status] | first) // "Unknown")}] | sort_by(.name)'
    oc get nodes -o json | jq -c '[.items[]? | {
      name: .metadata.name,
      roles: ([(.metadata.labels // {}) | to_entries[]? | select(.key | startswith("node-role.kubernetes.io/")) | .key | split("/")[1]] | sort),
      kubelet_version: (.status.nodeInfo.kubeletVersion // "unknown"),
      ready: (([.status.conditions[]? | select(.type == "Ready") | .status] | first) // "Unknown")}] | sort_by(.name)'
    oc get routes -A -o json | jq -c '[.items[]? | {name: .metadata.name, namespace: .metadata.namespace, host: (.spec.host // "")}] | sort_by(.namespace, .name)'
  args:
    executable: /bin/bash
  register: snapshot_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: snapshot_raw.rc == 0

- name: "Snapshot: Build the baseline"
  set_fact:
    baseline_snapshot_file_path: "{{ snapshot_dir }}/{{ cluster_name }}_{{ run_timestamp }}_baseline.json"
    baseline:
      cluster_metadata: "{{ (snapshot_raw.stdout_lines[0] | from_json) | combine({'name': cluster_name, 'api_url': active_cluster_server | default(''), 'captured_at': run_timestamp}) }}"
      cluster_operators: "{{ snapshot_raw.stdout_lines[1] | from_json }}"
      nodes: "{{ snapshot_raw.stdout_lines[2] | from_json }}"
      routes: "{{ snapshot_raw.stdout_lines[3] | from_json }}"

- name: "Snapshot: Make sure the snapshots folder exists"
  file:
    path: "{{ snapshot_dir }}"
    state: directory
    mode: "0755"

- name: "Snapshot: Write {{ baseline_snapshot_file_path | basename }}"
  copy:
    content: "{{ baseline | to_nice_json }}"
    dest: "{{ baseline_snapshot_file_path }}"
    mode: "0644"

- name: "Snapshot: Saved"
  debug:
    msg: >-
      Baseline saved: {{ baseline.cluster_metadata.current_version }} on {{ baseline.cluster_metadata.channel }},
      {{ baseline.nodes | length }} nodes, {{ baseline.cluster_operators | length }} operators, {{ baseline.routes | length }} routes.
