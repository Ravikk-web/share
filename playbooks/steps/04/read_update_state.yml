---
# ============================================================================
# steps/04/read_update_state.yml - is a cluster update or a node rollout running?
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Used by: steps/01/snapshot.yml, steps/04/finish_running_update.yml, steps/04/hop.yml
#          and Phase 06. Read-only.
# Output:  update_state
#            completed      the last Completed version in the ClusterVersion history
#            desired        the ClusterVersion desired version
#            progressing    the ClusterVersion Progressing status ("True" / "False")
#            channel        the ClusterVersion channel
#            pools_rolling  unpaused MachineConfigPools with machines not yet on their
#                           target configuration (updatedMachineCount < machineCount)
#            cp_running     true while the control plane updates: Progressing=True and
#                           desired != completed
#            running        cp_running, or a pool still rolling
#            target         the version being reached: desired while the control plane
#                           updates, otherwise the completed version
# Why: ClusterVersion reports Completed once the control plane is done; the nodes of
#      that hop keep updating afterwards, pool by pool.
#      Only the machine count says a rollout is still open. The MCO also reports
#      Updating=True (and keeps the old status configuration name) when every machine
#      already runs the target but one node is unavailable (NotReady or cordoned): that
#      is a node problem for Precheck 02 and its diagnosis, not a rollout to watch.
# ============================================================================

- name: "Update state: Read ClusterVersion and MachineConfigPools"
  shell: |
    set -o pipefail
    oc get clusterversion,machineconfigpools -o json | jq -c '
      def cstat(t): ((([(.status.conditions // [])[] | select(.type == t) | .status] | .[0]) // "False") | tostring);
      (.items // []) as $all
      | ([$all[] | select(.kind == "ClusterVersion")] | .[0] // {}) as $cv
      | {
          completed: ((($cv.status.history // []) | map(select(.state == "Completed")) | .[0].version) // ""),
          desired: ($cv.status.desired.version // ""),
          progressing: ($cv | cstat("Progressing")),
          channel: ($cv.spec.channel // ""),
          pools_rolling: [$all[] | select(.kind == "MachineConfigPool") | select((.spec.paused // false) | not)
            | select((.status.updatedMachineCount // 0) < (.status.machineCount // 0))
            | .metadata.name]
        }'
  args:
    executable: /bin/bash
  register: update_state_raw
  changed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: update_state_raw.rc == 0

- name: "Update state: Work it out"
  set_fact:
    update_state: >-
      {{ _s | combine({'cp_running': (_cp | bool), 'running': ((_cp | bool) or (_s.pools_rolling | length > 0)),
                       'target': (_s.desired if (_cp | bool) else _s.completed)}) }}
  vars:
    _s: "{{ update_state_raw.stdout | from_json }}"
    _cp: "{{ _s.progressing == 'True' and _s.desired != _s.completed }}"
