---
# ============================================================================
# steps/04/poll.yml - one poll of the live cluster (Phase 04)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
#   1. Read ClusterVersion, ClusterOperators, MachineConfigPools and Nodes in one call
#      (never fails the task: {"ok": false, "error": ...} when the API is unreadable).
#   2. Tolerate API outages up to monitor_api_outage_minutes; log in again on 401.
#   3. Work out progress, what still blocks the settle gate, and the settle streak.
#   4. Fail fast: release not accepted, ClusterVersion Failing too long, no progress.
#   5. One degradation mail per new problem after its grace period; otherwise a
#      heartbeat mail every heartbeat_minutes.
#   6. Print one status line, then wait poll_interval_minutes.
# Why: time is read with `date +%s` on every poll (ansible_date_time is frozen when
#      facts are gathered, so every timer computed from it would read 0).
# ============================================================================

- name: "Poll: Read the clock"
  set_fact:
    poll_now: "{{ lookup('pipe', 'date +%s') | int }}"

- name: "Poll: Elapsed time"
  set_fact:
    poll_elapsed: >-
      {%- set s = (poll_now | int) - (monitor_start_epoch | int) -%}
      {{ '%02d:%02d:%02d' | format(s // 3600, (s % 3600) // 60, s % 60) }}

# ----------------------------------------------------------------------------
# 1. Read the cluster (one call)
# ----------------------------------------------------------------------------
- name: "Poll: Read ClusterVersion, ClusterOperators, MachineConfigPools and Nodes"
  shell: |
    set -o pipefail
    tmpd="$(mktemp -d)"
    trap 'rm -rf "$tmpd"' EXIT
    emit_error() { jq -cn --arg e "$1" '{ok: false, error: $e}'; exit 0; }
    oc get clusterversion,clusteroperators,machineconfigpools,nodes -o json --request-timeout=60s \
      >"$tmpd/state.json" 2>"$tmpd/err" || emit_error "$(head -c 600 "$tmpd/err")"
    jq -c --argjson allow {{ co_allow_list | default([]) | to_json | quote }} '
      def cstat(t): ([(.status.conditions // [])[] | select(.type == t) | .status] | .[0]) // "Unknown";
      def cmsg(t): ([(.status.conditions // [])[] | select(.type == t) | (.message // "")] | .[0]) // "";
      def ann(k): ((.metadata.annotations // {})[k] // "");
      def role: ((.metadata.labels // {}) | keys
                 | map(select(startswith("node-role.kubernetes.io/")) | ltrimstr("node-role.kubernetes.io/"))) as $r
        | if ($r | map(. == "master" or . == "control-plane") | any) then "master"
          elif ($r | map(. == "infra") | any) then "infra"
          else "worker" end;
      def updating: (ann("machineconfiguration.openshift.io/state") == "Working")
        or (ann("machineconfiguration.openshift.io/currentConfig") != ann("machineconfiguration.openshift.io/desiredConfig"));
      def unsettled: (cstat("Ready") != "True") or updating
        or (ann("machineconfiguration.openshift.io/state") == "Degraded");
      (.items // []) as $all
      | ([$all[] | select(.kind == "ClusterVersion")] | .[0] // {}) as $cv
      | ($cv.status.desired.version // "") as $desired
      | [$all[] | select(.kind == "ClusterOperator")] as $allcos
      | [$allcos[] | select(.metadata.name as $n | ($allow | map(. == $n) | any) | not)] as $cos
      | [$all[] | select(.kind == "MachineConfigPool")] as $mcps
      | [$all[] | select(.kind == "Node")] as $nodes
      | {
          ok: true,
          cv: {
            desired: $desired,
            latest: ((($cv.status.history // []) | .[0].version) // ""),
            latest_state: ((($cv.status.history // []) | .[0].state) // ""),
            available: ($cv | cstat("Available")),
            progressing: ($cv | cstat("Progressing")),
            failing: ($cv | cstat("Failing")),
            failing_msg: ($cv | cmsg("Failing") | .[0:300]),
            release_accepted: ($cv | cstat("ReleaseAccepted")),
            release_msg: ($cv | cmsg("ReleaseAccepted") | .[0:300]),
            message: ($cv | cmsg("Progressing") | .[0:300])
          },
          co: {
            total: ($allcos | length),
            at_desired: ([$allcos[] | select((((.status.versions // []) | map(select(.name == "operator")) | .[0].version) // "") == $desired)] | length),
            degraded: [$cos[] | select(cstat("Degraded") == "True") | .metadata.name],
            progressing: [$cos[] | select(cstat("Progressing") == "True") | .metadata.name],
            unavailable: [$cos[] | select(cstat("Available") != "True") | .metadata.name]
          },
          mcp: [$mcps[] | {
            name: .metadata.name,
            total_count: (.status.machineCount // 0),
            ready_count: (.status.readyMachineCount // 0),
            updated_count: (.status.updatedMachineCount // 0),
            updated: cstat("Updated"),
            updating: cstat("Updating"),
            degraded: cstat("Degraded"),
            paused: (.spec.paused // false)
          }],
          unsettled_nodes: [$nodes[] | select(unsettled) | .metadata.name],
          active_nodes: [$nodes[] | select(unsettled or (.spec.unschedulable // false)) | {
            name: .metadata.name,
            role: role,
            action: (if cstat("Ready") != "True" then "Rebooting / NotReady"
                     elif ann("machineconfiguration.openshift.io/state") == "Degraded" then "Machine-config daemon Degraded"
                     elif updating and (.spec.unschedulable // false) then "Draining / updating"
                     elif updating then "Applying configuration"
                     else "Cordoned" end)
          }],
          problem_nodes: [$nodes[] | . as $n
            | ([ (if ($n | cstat("Ready")) != "True" then {c: "NotReady", m: ($n | cmsg("Ready"))} else empty end),
                 ((.status.conditions // [])[]
                   | select((.type == "DiskPressure" or .type == "MemoryPressure" or .type == "PIDPressure") and .status == "True")
                   | {c: .type, m: (.message // "")}),
                 (if ($n | ann("machineconfiguration.openshift.io/state")) == "Degraded"
                  then {c: "MachineConfigDaemonDegraded", m: ($n | ann("machineconfiguration.openshift.io/reason"))} else empty end) ]) as $p
            | select(($p | length) > 0)
            | {name: .metadata.name, role: role, condition: ($p | map(.c) | join(", ")), message: (($p[0].m // "") | .[0:200])}],
          conditions: (
            [ $nodes[] | select(cstat("Ready") != "True")
              | {key: ("node-notready:" + .metadata.name),
                 title: ("Node " + .metadata.name + " not Ready"),
                 detail: ((if (.spec.unschedulable // false) then "cordoned by the update; " else "NOT cordoned; " end) + (cmsg("Ready") | .[0:200])),
                 grace: (if (.spec.unschedulable // false) then "node_notready" else "uncordoned_notready" end)} ]
            + [ $nodes[] | .metadata.name as $nn | (.status.conditions // [])[]
              | select((.type == "DiskPressure" or .type == "MemoryPressure" or .type == "PIDPressure") and .status == "True")
              | {key: ("node-pressure:" + $nn + ":" + .type), title: ("Node " + $nn + " " + .type),
                 detail: ((.message // "") | .[0:200]), grace: "pressure"} ]
            + [ $nodes[] | select(updating and (cstat("Ready") == "True"))
              | {key: ("node-stalled:" + .metadata.name), title: ("Node " + .metadata.name + " still updating"),
                 detail: ("machine-config daemon state " + (ann("machineconfiguration.openshift.io/state") | if . == "" then "unknown" else . end)
                          + (if (.spec.unschedulable // false) then "; node cordoned (a PodDisruptionBudget may be blocking the drain)" else "" end)),
                 grace: "node_stall"} ]
            + [ $nodes[] | select(ann("machineconfiguration.openshift.io/state") == "Degraded")
              | {key: ("node-mcd-degraded:" + .metadata.name), title: ("Node " + .metadata.name + " machine-config daemon Degraded"),
                 detail: (ann("machineconfiguration.openshift.io/reason") | .[0:200]), grace: "co"} ]
            + [ $cos[] | select(cstat("Degraded") == "True")
              | {key: ("co-degraded:" + .metadata.name), title: ("ClusterOperator " + .metadata.name + " Degraded"),
                 detail: (cmsg("Degraded") | .[0:200]), grace: "co"} ]
            + [ $cos[] | select(cstat("Available") != "True")
              | {key: ("co-unavailable:" + .metadata.name), title: ("ClusterOperator " + .metadata.name + " not Available"),
                 detail: (cmsg("Available") | .[0:200]), grace: "co"} ]
            + [ $mcps[] | select(cstat("Degraded") == "True")
              | {key: ("mcp-degraded:" + .metadata.name), title: ("MachineConfigPool " + .metadata.name + " Degraded"),
                 detail: (cmsg("Degraded") | .[0:200]), grace: "co"} ]
            + (if ($cv | cstat("Failing")) == "True"
               then [{key: "cv-failing", title: "ClusterVersion reports Failing", detail: ($cv | cmsg("Failing") | .[0:200]), grace: "cv_failing"}]
               else [] end)
          )
        }
    ' "$tmpd/state.json" >"$tmpd/out.json" 2>"$tmpd/err" || emit_error "unreadable cluster state: $(head -c 300 "$tmpd/err")"
    cat "$tmpd/out.json"
  args:
    executable: /bin/bash
  register: poll_raw
  changed_when: false
  failed_when: false

- name: "Poll: Parse the cluster state"
  set_fact:
    poll_data: >-
      {{ (poll_raw.stdout | from_json) if ((poll_raw.stdout | default('') | trim) is match('[{]'))
         else {'ok': false, 'error': (poll_raw.stderr | default('', true) | trim | truncate(600)) or 'the state query printed nothing'} }}

# ----------------------------------------------------------------------------
# 2. API outages (the API server restarts during a control-plane update)
# ----------------------------------------------------------------------------
- name: "Poll: Track how long the API has been unreadable"
  set_fact:
    monitor_api_fail_since: >-
      {{ 0 if (poll_data.ok | bool)
         else ((monitor_api_fail_since | int) if ((monitor_api_fail_since | int) > 0) else (poll_now | int)) }}

# Why: login tokens expire (24 h by default); a long run logs in again instead of
#      treating an expired token as an outage.
- name: "Poll: Log in again - the session token was rejected"
  include_tasks: "{{ playbook_dir }}/steps/common/login.yml"
  when:
    - not (poll_data.ok | bool)
    - poll_data.error | default('') is search('(?i)unauthorized|must be logged in')

- name: "Poll: API not readable"
  debug:
    msg: >-
      [POLL {{ '%03d' | format(poll_number | int) }}] {{ poll_elapsed }} | API not readable for
      {{ ((poll_now | int) - (monitor_api_fail_since | int)) // 60 }} min (allowed {{ monitor_api_outage_minutes | default(10) }}):
      {{ poll_data.error | default('unknown') | truncate(300) }}
  when: not (poll_data.ok | bool)

- name: "Poll: Abort - the API has been unreadable too long"
  set_fact:
    monitor_abort: true
    monitor_abort_code: 30
    monitor_abort_reason: >-
      the cluster API could not be read for {{ ((poll_now | int) - (monitor_api_fail_since | int)) // 60 }} minutes
      (last error: {{ poll_data.error | default('unknown') | truncate(300) }})
  when:
    - not (poll_data.ok | bool)
    - ((poll_now | int) - (monitor_api_fail_since | int)) >= ((monitor_api_outage_minutes | default(10) | int) * 60)

# ----------------------------------------------------------------------------
# 3-6. Work with a successful read
# ----------------------------------------------------------------------------
- name: "Poll: Use the cluster state"
  when: poll_data.ok | bool
  block:
    - name: "Poll: Version and pool facts"
      set_fact:
        poll_cv: "{{ poll_data.cv }}"
        poll_unpaused_pools: "{{ poll_data.mcp | selectattr('paused', 'equalto', false) | list }}"
        poll_cv_settled: >-
          {{ ((poll_data.cv.latest == monitor_target and poll_data.cv.latest_state == 'Completed') or monitor_mode != 'hop')
             and poll_data.cv.available == 'True' and poll_data.cv.progressing != 'True' and poll_data.cv.failing != 'True' }}
        poll_cv_percent: >-
          {{ 100 if (poll_data.cv.latest == monitor_target and poll_data.cv.latest_state == 'Completed')
             else ((poll_data.cv.message | regex_search('[0-9]+% complete') or '0') | regex_replace('[^0-9]', '') | int) }}

    # Why: in rollout mode the Machine Config Operator needs a moment to render the new
    #      configuration; the rollout is "seen" once a pool updates or has machines left.
    - name: "Poll: Rollout progress and what still blocks the settle gate"
      set_fact:
        monitor_rollout_seen: >-
          {{ (monitor_rollout_seen | bool)
             or ((poll_unpaused_pools | selectattr('updating', 'equalto', 'True') | list | length) > 0)
             or ((poll_unpaused_pools | map(attribute='updated_count') | sum) < (poll_unpaused_pools | map(attribute='total_count') | sum)) }}
        poll_pools_unsettled: >-
          {{ (poll_unpaused_pools | map(attribute='name') | list)
             | difference(poll_unpaused_pools | selectattr('updated', 'equalto', 'True')
                          | rejectattr('updating', 'equalto', 'True') | rejectattr('degraded', 'equalto', 'True')
                          | map(attribute='name') | list) }}

    - name: "Poll: List the blockers and the progress"
      set_fact:
        poll_blockers: >-
          {{ ((['ClusterVersion at ' ~ (poll_data.cv.latest or 'unknown') ~ ' (' ~ (poll_data.cv.latest_state or 'unknown')
                ~ ', Progressing=' ~ poll_data.cv.progressing ~ ', Failing=' ~ poll_data.cv.failing ~ ')']) if not (poll_cv_settled | bool) else [])
             + ((['operators degraded: ' ~ (poll_data.co.degraded | join(', '))]) if (poll_data.co.degraded | length > 0) else [])
             + ((['operators progressing: ' ~ (poll_data.co.progressing | join(', '))]) if (poll_data.co.progressing | length > 0) else [])
             + ((['operators unavailable: ' ~ (poll_data.co.unavailable | join(', '))]) if (poll_data.co.unavailable | length > 0) else [])
             + ((['pools not updated: ' ~ (poll_pools_unsettled | join(', '))]) if (poll_pools_unsettled | length > 0) else [])
             + ((['nodes updating / not ready: ' ~ (poll_data.unsettled_nodes | join(', ') | truncate(200))]) if (poll_data.unsettled_nodes | length > 0) else []) }}
        progress_percent: >-
          {%- set mcp_total = poll_unpaused_pools | map(attribute='total_count') | sum -%}
          {%- set mcp_upd = poll_unpaused_pools | map(attribute='updated_count') | sum -%}
          {%- set mcp_pct = ((mcp_upd * 100) // mcp_total) if ((monitor_rollout_seen | bool) and mcp_total > 0) else 0 -%}
          {%- if monitor_mode == 'rollout' -%}{{ [mcp_pct, 99] | min }}
          {%- else -%}{{ [((poll_cv_percent | int) * 60 + mcp_pct * 40) // 100, 99] | min }}
          {%- endif -%}
        # Why: a change in any of these means the update is still moving.
        poll_signature: >-
          {{ poll_data.cv.latest }}|{{ poll_data.cv.latest_state }}|{{ poll_cv_percent }}|{{ poll_data.cv.message | regex_search('[0-9]+ of [0-9]+ done') | default('', true) }}|{{ poll_data.co.at_desired }}|{{ poll_data.mcp | map(attribute='updated_count') | join(',') }}|{{ poll_data.mcp | map(attribute='ready_count') | join(',') }}|{{ poll_data.active_nodes | map(attribute='name') | join(',') }}|{{ poll_data.active_nodes | map(attribute='action') | join(',') }}

    # Why: in rollout mode an unchanged cluster only counts as settled once the rollout
    #      was seen, or after three poll intervals (a pool that had nothing pending).
    - name: "Poll: Settle streak and fail-fast timers"
      set_fact:
        monitor_settled_streak: >-
          {{ ((monitor_settled_streak | int) + 1)
             if ((poll_blockers | length == 0)
                 and (monitor_mode == 'hop' or (monitor_rollout_seen | bool)
                      or ((poll_now | int) - (monitor_start_epoch | int)) >= (3 * (monitor_poll_seconds | int))))
             else 0 }}
        monitor_last_progress_epoch: "{{ (poll_now | int) if (poll_signature != monitor_progress_signature) else (monitor_last_progress_epoch | int) }}"
        monitor_progress_signature: "{{ poll_signature }}"
        monitor_release_rejected_since: >-
          {{ (((monitor_release_rejected_since | int) if ((monitor_release_rejected_since | int) > 0) else (poll_now | int)))
             if (monitor_mode == 'hop' and (poll_data.cv.release_accepted == 'False' or poll_data.cv.desired != monitor_target))
             else 0 }}
        monitor_cv_failing_since: >-
          {{ (((monitor_cv_failing_since | int) if ((monitor_cv_failing_since | int) > 0) else (poll_now | int)))
             if (poll_data.cv.failing == 'True') else 0 }}

    - name: "Poll: Settled?"
      set_fact:
        monitor_settled: "{{ (monitor_settled_streak | int) >= (settle_consecutive_polls | default(2) | int) }}"

    - name: "Poll: 100% once settled"
      set_fact:
        progress_percent: 100
      when: monitor_settled | bool

    # ------------------------------------------------------------------------
    # 4. Fail fast
    # ------------------------------------------------------------------------
    - name: "Poll: Abort - release not accepted, or the target was changed"
      set_fact:
        monitor_abort: true
        monitor_abort_code: 20
        monitor_abort_reason: >-
          {{ ('ClusterVersion desired version is ' ~ (poll_data.cv.desired or 'unset') ~ ', not the hop target (changed outside this automation?)')
             if (poll_data.cv.desired != monitor_target)
             else ('the release was not accepted for ' ~ (release_not_accepted_fail_minutes | default(10)) ~ ' minutes: ' ~ (poll_data.cv.release_msg or 'no message')) }}
      when:
        - not (monitor_settled | bool)
        - (monitor_release_rejected_since | int) > 0
        - ((poll_now | int) - (monitor_release_rejected_since | int)) >= ((release_not_accepted_fail_minutes | default(10) | int) * 60)

    - name: "Poll: Abort - ClusterVersion Failing too long"
      set_fact:
        monitor_abort: true
        monitor_abort_code: 20
        monitor_abort_reason: >-
          ClusterVersion has reported Failing for {{ ((poll_now | int) - (monitor_cv_failing_since | int)) // 60 }} minutes:
          {{ poll_data.cv.failing_msg or 'no message' }}
      when:
        - not (monitor_settled | bool)
        - not (monitor_abort | bool)
        - (monitor_cv_failing_since | int) > 0
        - ((poll_now | int) - (monitor_cv_failing_since | int)) >= ((cv_failing_fail_minutes | default(30) | int) * 60)

    - name: "Poll: Abort - no progress"
      set_fact:
        monitor_abort: true
        monitor_abort_code: 30
        monitor_abort_reason: >-
          no progress for {{ ((poll_now | int) - (monitor_last_progress_epoch | int)) // 60 }} minutes
          (limit {{ hop_timeout_minutes | default(90) }}). Still open: {{ poll_blockers | join('; ') or 'nothing reported' }}
      when:
        - not (monitor_settled | bool)
        - not (monitor_abort | bool)
        - ((poll_now | int) - (monitor_last_progress_epoch | int)) >= ((hop_timeout_minutes | default(90) | int) * 60)

    # ------------------------------------------------------------------------
    # 5. Mails: one degradation alert per new problem, otherwise the heartbeat
    # ------------------------------------------------------------------------
    - name: "Poll: Remember when each open problem was first seen"
      set_fact:
        degradation_first_seen: >-
          {%- set out = {} -%}
          {%- for c in poll_data.conditions -%}
          {%- set _ = out.update({c.key: ((degradation_first_seen[c.key] | int) if (c.key in degradation_first_seen) else (poll_now | int))}) -%}
          {%- endfor -%}
          {{ out }}

    - name: "Poll: Problems open longer than their grace period"
      set_fact:
        progress_open_issues: >-
          {%- set out = [] -%}
          {%- for c in poll_data.conditions -%}
          {%- set mins = ((poll_now | int) - (degradation_first_seen[c.key] | int)) // 60 -%}
          {%- if mins >= (_grace[c.grace] | default(10) | int) -%}
          {%- set _ = out.append({'key': c.key, 'title': c.title, 'detail': c.detail, 'minutes': mins}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}
      vars:
        _grace:
          node_notready: "{{ degradation_node_notready_minutes | default(15) }}"
          uncordoned_notready: "{{ degradation_uncordoned_notready_minutes | default(5) }}"
          pressure: "{{ degradation_pressure_minutes | default(5) }}"
          node_stall: "{{ node_stall_threshold_minutes | default(30) }}"
          co: "{{ degradation_co_minutes | default(10) }}"
          cv_failing: "{{ degradation_cv_failing_minutes | default(10) }}"

    - name: "Poll: New problems (not alerted yet)"
      set_fact:
        degradation_new_items: >-
          {%- set out = [] -%}
          {%- for c in progress_open_issues if c.key not in degradation_alerted -%}{%- set _ = out.append(c) -%}{%- endfor -%}
          {{ out }}
        progress_label: "{{ monitor_label }}"
        progress_target_version: "{{ monitor_target }}"
        progress_hop_elapsed: "{{ poll_elapsed }}"
        progress_cv_version: "{{ poll_data.cv.latest }}{{ (' (' ~ poll_data.cv.latest_state ~ ')') if (poll_data.cv.latest_state | length > 0) else '' }}"
        progress_cv_message: "{{ poll_data.cv.failing_msg if (poll_data.cv.failing == 'True') else poll_data.cv.message }}"
        progress_mcp_list: "{{ poll_data.mcp }}"
        progress_active_nodes: "{{ poll_data.active_nodes }}"
        progress_degraded_nodes: "{{ poll_data.problem_nodes }}"

    - name: "Poll: Log new problems"
      include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
      vars:
        event_status: "WARN"
        event_task: "Degradation ({{ monitor_label }})"
        event_reason: "{{ degradation_new_items | map(attribute='title') | join('; ') }}"
        event_observed: "{{ degradation_new_items | map(attribute='detail') | join(' | ') | truncate(500) }}"
      when: degradation_new_items | length > 0

    - name: "Poll: Send the degradation alert"
      include_tasks: "{{ playbook_dir }}/steps/common/send_mail.yml"
      vars:
        mail_kind: "degradation"
        mail_headline: >-
          {{ monitor_label }}: {{ degradation_new_items[0].title }}{{ (' (+' ~ ((degradation_new_items | length) - 1) ~ ' more)') if (degradation_new_items | length > 1) else '' }}
      when:
        - degradation_new_items | length > 0
        - not (monitor_abort | bool)
        - send_email | default(true) | bool

    # Why: a degradation alert carries the full progress picture, so it also resets
    #      the heartbeat timer; each problem is alerted once per watch.
    - name: "Poll: Remember the alerted problems"
      set_fact:
        degradation_alerted: "{{ degradation_alerted + (degradation_new_items | map(attribute='key') | list) }}"
        last_heartbeat_epoch: "{{ poll_now | int }}"
      when: degradation_new_items | length > 0

    - name: "Poll: Send the heartbeat"
      include_tasks: "{{ playbook_dir }}/steps/common/send_mail.yml"
      vars:
        mail_kind: "heartbeat"
        mail_headline: "{{ monitor_label }}{{ (' to ' ~ monitor_target) if monitor_mode == 'hop' else '' }}: {{ progress_percent }}% after {{ poll_elapsed }}"
      when:
        - ((poll_now | int) - (last_heartbeat_epoch | int)) >= ((heartbeat_minutes | default(20) | int) * 60)
        - not (monitor_settled | bool)
        - not (monitor_abort | bool)
        - send_email | default(true) | bool

    - name: "Poll: Restart the heartbeat timer"
      set_fact:
        last_heartbeat_epoch: "{{ poll_now | int }}"
      when: ((poll_now | int) - (last_heartbeat_epoch | int)) >= ((heartbeat_minutes | default(20) | int) * 60)

    # ------------------------------------------------------------------------
    # 6. Status line
    # ------------------------------------------------------------------------
    - name: "Poll: Status"
      debug:
        msg: >-
          [POLL {{ '%03d' | format(poll_number | int) }}] {{ poll_elapsed }} | {{ progress_percent }}% |
          CV {{ poll_data.cv.latest or '?' }} {{ poll_data.cv.latest_state }} (desired {{ poll_data.cv.desired or '?' }}) |
          COs at target {{ poll_data.co.at_desired }}/{{ poll_data.co.total }} |
          MCP {% for p in poll_data.mcp %}{{ p.name }} {{ p.updated_count }}/{{ p.total_count }}{{ ' paused' if p.paused else '' }}{% if not loop.last %}, {% endif %}{% endfor %} |
          updating: {{ poll_data.active_nodes | map(attribute='name') | join(', ') | truncate(120) or 'none' }} |
          issues: {{ progress_open_issues | map(attribute='title') | join('; ') | truncate(160) or 'none' }} |
          settled {{ monitor_settled_streak }}/{{ settle_consecutive_polls | default(2) }}

# ----------------------------------------------------------------------------
# Hard limit, then wait for the next poll
# ----------------------------------------------------------------------------
- name: "Poll: Abort - hard time limit reached"
  set_fact:
    monitor_abort: true
    monitor_abort_code: 30
    monitor_abort_reason: >-
      not settled after {{ hop_max_minutes | default(480) }} minutes (hard limit). Still open: {{ poll_blockers | join('; ') or 'unknown' }}
  when:
    - not (monitor_settled | bool)
    - not (monitor_abort | bool)
    - ((poll_now | int) - (monitor_start_epoch | int)) >= ((hop_max_minutes | default(480) | int) * 60)

# Why: wait_for instead of pause - pause touches the terminal and can stop a
#      backgrounded run.
- name: "Poll: Wait {{ poll_interval_minutes | default(2) }} min"
  wait_for:
    timeout: "{{ monitor_poll_seconds | int }}"
  when:
    - not (monitor_settled | bool)
    - not (monitor_abort | bool)
