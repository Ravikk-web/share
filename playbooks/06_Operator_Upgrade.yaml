---
# ============================================================================
# Phase 06 - Operators and developer console
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Steps (a dry run only reports, nothing is approved or changed):
#   1. Approve the current InstallPlan of each subscription with a pending upgrade and
#      wait for those operators (skipped when skip_operator_upgrade is true).
#   2. Judge operator health: approved upgrades and regressions are HARD, operators
#      that were already unhealthy and plans left unapproved are WARN.
#   3. Enable the web console Developer perspective when it is Disabled (never fails
#      the run - the cluster upgrade is already done).
#   4. GATE: stop if an approved operator did not reach Succeeded or one regressed.
# A failure here never rolls back the cluster upgrade.
# ============================================================================

- name: "Phase 06: Start"
  set_fact:
    current_phase: "06"
    approved_installplans: []
    skipped_installplans: []
    operator_csv_baseline: []
    recovered_csvs: []

- name: "Phase 06: Approve pending operator upgrades"
  include_tasks: "{{ playbook_dir }}/steps/06/approve_operators.yml"
  when: not (skip_operator_upgrade | default(false) | bool)

- name: "Phase 06: Judge operator health"
  include_tasks: "{{ playbook_dir }}/steps/06/validate_operators.yml"

# Why: the Developer perspective is a convenience; a problem here is a WARN only.
- name: "Phase 06: Developer perspective"
  block:
    - name: "Phase 06: Enable the Developer perspective if it is Disabled"
      include_tasks: "{{ playbook_dir }}/steps/06/developer_console.yml"
  rescue:
    - name: "Phase 06: The Developer perspective step could not run"
      set_fact:
        developer_perspective_state: "WARN"
        developer_perspective_status: "Not checked: {{ ansible_failed_result.msg | default('console query failed') | truncate(200) }}"

- name: "Phase 06: Record the result"
  set_fact:
    operator_checks: >-
      {{ operator_checks + [{'num': 5, 'name': 'Web console Developer perspective', 'gate': 'WARN',
                             'status': developer_perspective_state, 'observed': developer_perspective_status}] }}
    run_phase_results: >-
      {{ run_phase_results + [{
           'phase': '06', 'name': phase_names['06'] ~ (' (plan only)' if (dry_run | bool) else ''),
           'status': ('FAIL' if (operator_validate_status == 'FAIL' and not (dry_run | bool))
                      else ('WARN' if (operator_validate_status != 'PASS' or developer_perspective_state == 'WARN')
                      else ('AUTO-FIXED' if developer_perspective_state == 'AUTO-FIXED' else 'PASS'))),
           'detail': operator_summary_text ~ '; Developer perspective: ' ~ developer_perspective_status
         }] }}

- name: "Phase 06: Log the result"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "{{ run_phase_results[-1].status }}"
    event_task: "Operators and developer console"
    event_reason: "{{ run_phase_results[-1].detail }}"

- name: "Phase 06: GATE - approved operators healthy, no regressions"
  fail:
    msg: >-
      {% for c in operator_checks | selectattr('status', 'equalto', 'FAIL') | list %}{{ c.name }}: {{ c.observed }}{% if not loop.last %} | {% endif %}{% endfor %}.
      The cluster upgrade itself is complete; only the operator step needs attention.
  when:
    - not (dry_run | bool)
    - operator_validate_status == 'FAIL'
