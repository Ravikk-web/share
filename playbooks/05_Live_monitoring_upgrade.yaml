---
# ============================================================================
# Phase 05 - Watch the cluster until it settles
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Never runs on its own. Included by steps/04/hop.yml (each hop) and by
# steps/03/watch_rollout.yml (a node rollout started by a Phase 03 change).
# Inputs (include vars):
#   watch_mode     hop     - the cluster must reach watch_version
#                  rollout - only pools and operators must settle
#   watch_version  target version (hop mode)
#   watch_label    text for the console and the mails, e.g. "Hop 1 of 2"
#
# Every poll_interval_minutes it reads ClusterVersion, ClusterOperators,
# MachineConfigPools and Nodes in one call (steps/04/poll.yml), then:
#   - mails a heartbeat every heartbeat_minutes,
#   - mails a degradation alert once per new problem (after its grace period),
#   - logs in again if the session token expired,
#   - counts the cluster as settled after settle_consecutive_polls settled polls.
# It fails when nothing progresses for hop_timeout_minutes, after hop_max_minutes in
# total, when the API is unreachable for monitor_api_outage_minutes, when the release
# is not accepted for release_not_accepted_fail_minutes, or when ClusterVersion
# reports Failing for cv_failing_fail_minutes.
# ============================================================================

- name: "Phase 05: Start watching {{ watch_label }}"
  set_fact:
    monitor_mode: "{{ watch_mode }}"
    monitor_target: "{{ watch_version }}"
    monitor_label: "{{ watch_label }}"
    monitor_start_epoch: "{{ lookup('pipe', 'date +%s') | int }}"
    monitor_poll_seconds: "{{ (poll_interval_minutes | default(2) | int) * 60 }}"
    monitor_max_polls: "{{ ((hop_max_minutes | default(480) | int) // (poll_interval_minutes | default(2) | int)) + 2 }}"
    monitor_settled: false
    monitor_abort: false
    monitor_abort_reason: ""
    monitor_abort_code: 20
    monitor_settled_streak: 0
    monitor_rollout_seen: false
    monitor_last_progress_epoch: "{{ lookup('pipe', 'date +%s') | int }}"
    monitor_progress_signature: ""
    monitor_api_fail_since: 0
    monitor_release_rejected_since: 0
    monitor_cv_failing_since: 0
    degradation_first_seen: {}
    degradation_alerted: []
    degradation_new_items: []
    progress_open_issues: []
    progress_percent: 0
    poll_blockers: []
    # Why: keep the heartbeat rhythm across back-to-back hops, but start a fresh
    #      interval when the last heartbeat is older than one interval.
    last_heartbeat_epoch: >-
      {{ (last_heartbeat_epoch | int)
         if ((last_heartbeat_epoch | default(0) | int) > 0
             and ((lookup('pipe', 'date +%s') | int) - (last_heartbeat_epoch | int)) < ((heartbeat_minutes | default(20) | int) * 60))
         else (lookup('pipe', 'date +%s') | int) }}

- name: "Phase 05: Watching {{ watch_label }}"
  debug:
    msg: >-
      Watching {{ monitor_label }}{{ (' -> ' ~ monitor_target) if monitor_mode == 'hop' else '' }}: poll every
      {{ poll_interval_minutes | default(2) }} min, heartbeat every {{ heartbeat_minutes | default(20) }} min,
      fail after {{ hop_timeout_minutes | default(90) }} min without progress or {{ hop_max_minutes | default(480) }} min in total.

# Why: Ansible cannot break out of a loop, so each iteration file runs the poll only
#      while the cluster is not settled and nothing has aborted. After the cluster
#      settles, the remaining iterations are one skipped task each.
- name: "Phase 05: Poll until settled"
  include_tasks: "{{ playbook_dir }}/steps/05/poll_if_needed.yml"
  loop: "{{ range(1, (monitor_max_polls | int) + 1) | list }}"
  loop_control:
    loop_var: poll_number

- name: "Phase 05: How long it took"
  set_fact:
    monitor_elapsed: >-
      {%- set s = (lookup('pipe', 'date +%s') | int) - (monitor_start_epoch | int) -%}
      {{ '%02d:%02d:%02d' | format(s // 3600, (s % 3600) // 60, s % 60) }}

# Why: a hop that stops progressing or times out exits with 30, any other hop
#      failure with 20 (a Phase 03 rollout that fails keeps Phase 03's code, 15).
- name: "Phase 05: Set the exit code for a failed hop"
  set_fact:
    failure_exit_code: "{{ (monitor_abort_code | int) if (monitor_abort | bool) else 30 }}"
  when:
    - (monitor_abort | bool) or not (monitor_settled | bool)
    - monitor_mode == 'hop'

- name: "Phase 05: Stop - {{ watch_label }} did not settle"
  fail:
    msg: >-
      {{ monitor_label }}{{ (' -> ' ~ monitor_target) if monitor_mode == 'hop' else '' }} on '{{ cluster_name }}':
      {{ monitor_abort_reason if (monitor_abort_reason | length > 0) else ('did not settle within ' ~ (hop_max_minutes | default(480)) ~ ' minutes') }}
      (after {{ monitor_elapsed }}; cluster at {{ (poll_cv | default({})).latest | default('unknown') }}).
  when: (monitor_abort | bool) or not (monitor_settled | bool)

- name: "Phase 05: Settled"
  debug:
    msg: >-
      SETTLED: {{ monitor_label }}{{ (' at ' ~ monitor_target) if monitor_mode == 'hop' else '' }} after {{ monitor_elapsed }}
      - ClusterVersion Available and not Progressing, operators settled, every unpaused pool updated.

- name: "Phase 05: Log it"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "PASS"
    event_task: "Watch {{ monitor_label }}"
    event_reason: "Settled{{ (' at ' ~ monitor_target) if monitor_mode == 'hop' else '' }} after {{ monitor_elapsed }}"
