# Targets Ansible 2.7.17.
# MIGRATION 2.14: JSON quoting in oc patch might require slight adjustments under Python 3 if issues arise, though standard valid JSON strings should work across both.

---
- name: Phase 08 — Operator Compatibility, Upgrade & Validation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    phase_name: "Phase 08 - Operator Upgrade"

  pre_tasks:
    - name: Verify active session context
      include_role:
        name: login
      when: not dry_run | default(false) | bool

  tasks:
    - block:
        - name: Run Operator Compatibility Check
          include_role:
            name: operator_compat
          
        - name: Run Operator Upgrade
          include_role:
            name: operator_upgrade

        - name: Run Operator Final Validation
          include_role:
            name: operator_validate

        - name: Render Phase 08 Operator HTML Report
          include_role:
            name: report
          vars:
            report_phase: "operator_upgrade"
            report_title: "Operator Upgrade Validation Report"

      rescue:
        - name: Handle Phase 08 Failure
          include_role:
            name: error_handle
          vars:
            failed_phase: "{{ phase_name }}"

      always:
        - name: Teardown session unconditionally
          include_role:
            name: logout
          when: not dry_run | default(false) | bool
