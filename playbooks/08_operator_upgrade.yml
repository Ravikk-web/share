# Targets Ansible 2.7.17.
# MIGRATION 2.14: JSON quoting in oc patch might require slight adjustments under Python 3 if issues arise, though standard valid JSON strings should work across both.

---
- name: Phase 08 — Operator Compatibility, Upgrade & Validation
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - vars/upgrade.yml
    - vars/paths.yml
    - vars/secrets.yml
    - vars/smtp.yml
    - vars/report_vars.yml
    - vars/api_regex.yml

  vars:
    phase_name: "Phase 08 - Operator Upgrade"

  pre_tasks:
    - name: Check existing kubeconfig session
      stat:
        path: "{{ kubeconfig_path }}"
      register: post_kubeconfig_stat

    - name: Test cluster session reachability
      command: oc whoami --show-server --kubeconfig "{{ kubeconfig_path }}"
      register: post_whoami_test
      changed_when: false
      failed_when: false
      when:
        - not (dry_run | default(false) | bool)
        - post_kubeconfig_stat.stat.exists | default(false)

    - name: Resolve target cluster credentials if re-authentication needed
      set_fact:
        target_cluster_entry: "{{ (clusters | default([]) | selectattr('name', 'equalto', cluster_name) | list | first) | default({}) }}"
      no_log: true
      when:
        - not (dry_run | default(false) | bool)
        - not (post_kubeconfig_stat.stat.exists | default(false)) or (post_whoami_test.rc | default(1) != 0)

    - name: Set login parameters for cluster {{ cluster_name | default('UNKNOWN') }}
      set_fact:
        login_api_url: "{{ target_cluster_entry.api_url | default(login_api_url | default('')) }}"
        login_username: "{{ target_cluster_entry.username | default(login_username | default('')) }}"
        login_password: "{{ target_cluster_entry.password | default(login_password | default('')) }}"
      no_log: true
      when:
        - not (dry_run | default(false) | bool)
        - not (post_kubeconfig_stat.stat.exists | default(false)) or (post_whoami_test.rc | default(1) != 0)

    - name: Authenticate to cluster {{ cluster_name | default('UNKNOWN') }} (if not already logged in)
      include_role:
        name: login
      when:
        - not (dry_run | default(false) | bool)
        - not (post_kubeconfig_stat.stat.exists | default(false)) or (post_whoami_test.rc | default(1) != 0)

  tasks:
    - block:
        - name: Run Operator Compatibility Check
          include_role:
            name: operator_compat
          
        - name: Run Operator Upgrade
          include_role:
            name: operator_upgrade

        - name: Run Operator Final Validation
          include_role:
            name: operator_validate

        - name: Render Phase 08 Operator HTML Report
          include_role:
            name: report
          vars:
            report_phase: "operator_upgrade"
            report_title: "Operator Upgrade Validation Report"

        - name: Export operator report path
          set_fact:
            operator_report_html_path: "{{ report_html_path | default('') }}"

        # ==================================================================
        # UPGRADE COMPLETE EMAIL — all phases successful
        # ==================================================================
        - name: Find latest .txt log file
          shell: ls -t "{{ log_dir | default(playbook_dir ~ '/logs') }}"/*.txt 2>/dev/null | head -n 1 || echo ""
          register: latest_txt_log
          changed_when: false
          failed_when: false

        - name: Find latest .csv log file
          shell: ls -t "{{ log_dir | default(playbook_dir ~ '/logs') }}"/*.csv 2>/dev/null | head -n 1 || echo ""
          register: latest_csv_log
          changed_when: false
          failed_when: false

        - name: Build attachment list for upgrade-complete email
          set_fact:
            upgrade_complete_attachments: >-
              {{
                ([postvalidation_report_html_path] if (postvalidation_report_html_path | default('') | length > 0) else [])
                + ([operator_report_html_path] if (operator_report_html_path | default('') | length > 0) else [])
                + ([latest_txt_log.stdout | trim] if (latest_txt_log.stdout | default('') | trim | length > 0) else [])
                + ([latest_csv_log.stdout | trim] if (latest_csv_log.stdout | default('') | trim | length > 0) else [])
              }}

        - name: Send Upgrade Complete notification email
          include_role:
            name: sendmail
          vars:
            mail_subject: "{{ heartbeat_subject_prefix | default('[ARO Upgrade]') }} — UPGRADE COMPLETE ✔ — {{ cluster_name | default('UNKNOWN') }} → {{ (upgrade_path | default([]) | last) | default('target') }}"
            mail_template: "progress-mail.j2"
            mail_attach: "{{ upgrade_complete_attachments | default([]) }}"
            current_hop: "{{ upgrade_path | default([]) | length }}"
            total_hops: "{{ upgrade_path | default([]) | length }}"
            target_version: "{{ (upgrade_path | default([]) | last) | default('') }}"
            percent_complete: "100%"
            elapsed_time: "Full run"
            mcp_list: []
            mcp_access_error: ""
            current_working_node: {}
            degraded_nodes: []
            degraded_operators: []
            cluster_version_status: "Upgrade Complete — {{ (upgrade_path | default([]) | last) | default('target') }} ✔"
            status_pill_text: "UPGRADE COMPLETE ✔"
            status_pill_color: "#1a7f37"
            status_pill_bg: "#e6f4ea"
            status_pill_border: "#b7eb8f"
            next_update_note: "All upgrade phases completed successfully. Postvalidation report, operator upgrade report, and run logs are attached."
            run_id: "{{ ansible_date_time.iso8601 | default('N/A') }}"
            timestamp: "{{ ansible_date_time.iso8601 | default('N/A') }}"
            log_path: "{{ log_dir | default(playbook_dir ~ '/logs/') }}"

      rescue:
        - name: Handle Phase 08 Failure
          include_role:
            name: error_handle
          vars:
            failed_phase: "{{ phase_name }}"

      always:
        - name: Teardown session unconditionally
          include_role:
            name: logout

      when: not (dry_run | default(false) | bool)
