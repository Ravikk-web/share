# Targets Ansible 2.7.17.
# MIGRATION 2.14: No changes required — pure variable definitions.
#
# Colour tokens, report metadata, and status glyphs used by
# health-overview.j2, error-report.j2, and progress-mail.j2.
#
# All colour values are sourced from context/ui-context.md.
# Templates render these values — they never compute status colours.

---
# --- Colour tokens (from ui-context.md) --------------------------------------
# Each status has a text colour and a background colour.

report_colors:
  green_text: "#1a7f37"
  green_bg: "#e6f4ea"
  amber_text: "#9a6700"
  amber_bg: "#fff8e1"
  red_text: "#b42318"
  red_bg: "#fdecea"
  neutral_text: "#344054"
  neutral_bg: "#f2f4f7"
  surface: "#ffffff"
  page_bg: "#f8f9fb"
  border: "#e4e7ec"
  heading: "#101828"

# --- Status glyphs -----------------------------------------------------------
# Paired with colour for accessibility and print-to-grayscale safety.
# Never encode status by colour alone.

status_glyphs:
  pass: "✔"
  warn: "!"
  fail: "✖"

# --- Report metadata ---------------------------------------------------------

report_title: "ARO Cluster Upgrade Report"
report_org: "Cloud Platform Engineering"
report_footer: "Generated by ARO Cluster Upgrade Automation"

# --- Font stack (inline CSS in templates) -------------------------------------
# Reference only — used by templates, not consumed as an Ansible variable.
# font_stack: '-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
# mono_stack:  '"SFMono-Regular", Consolas, "Liberation Mono", monospace'
