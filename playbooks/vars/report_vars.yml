# ============================================================================
# UI Design Tokens, Color Hex Codes, and Badge Labels
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Display constants for Jinja2 templates.
#
# Purpose: Centralizes all UI color tokens, background tints, and status badge
#          strings matching context/ui-context.md. Ensures uniform presentation
#          across HTML audit reports and email notifications.
# Dependencies: None
# Gate type: N/A
# ============================================================================

