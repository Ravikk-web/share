# Text Colors (WCAG AA Compliant on respective background tints)
# ----------------------------------------------------------------------------
color_pass: "#1a7f37"
color_warn: "#9a6700"
color_fail: "#b42318"
color_autofix: "#1d4ed8"
color_fixfailed: "#c2410c"
color_info: "#344054"

# ----------------------------------------------------------------------------
# Background Pill & Callout Tints
# ----------------------------------------------------------------------------
bg_pass: "#e6f4ea"
bg_warn: "#fff8e1"
bg_fail: "#fdecea"
bg_autofix: "#eff6ff"
bg_fixfailed: "#ffedd5"
bg_info: "#f2f4f7"

# ----------------------------------------------------------------------------
# Surface, Page, and Structural Colors
# ----------------------------------------------------------------------------
color_surface: "#ffffff"
color_page_bg: "#f8f9fb"
color_border: "#e4e7ec"
