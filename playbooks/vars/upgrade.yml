# ============================================================================
# vars/upgrade.yml - upgrade settings (paths, checks, timeouts, auto-fixes)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# The cluster, run mode and path of a run come from 00_Run.sh; everything else is here.
# ============================================================================

# ----------------------------------------------------------------------------
# Upgrade paths offered by 00_Run.sh for each cluster (override with --path)
# ----------------------------------------------------------------------------
# Never skip a minor version: 4.14 -> 4.15 -> 4.16, one hop each.
cluster_upgrade_paths:
  cluster_d01: ["4.14.40", "4.15.35", "4.16.18"]
  cluster_s01: ["4.14.40", "4.15.35", "4.16.18"]
  cluster_p01: ["4.14.40", "4.15.35"]

# Skip TLS verification for the cluster API and the update graph (kept true for ARO).
insecure_skip_tls_verify: true

# Password for `oc login` goes on stdin (not visible in the process list).
# Set false only if the identity provider does not accept that.
login_password_via_stdin: true

# ----------------------------------------------------------------------------
# Phase 01 - upgrade path validation (read-only)
# ----------------------------------------------------------------------------
# Every hop is checked against the OpenShift Update Service graph before anything
# changes. If the graph cannot be reached, those edges become WARN and each hop is
# verified on the cluster right before it starts.
upgrade_graph_validation_enabled: true
upgrade_graph_url: "https://api.openshift.com/api/upgrades_info/v1/graph"
upgrade_graph_arch: "amd64"
upgrade_graph_timeout_seconds: 30
upgrade_graph_proxy: ""            # optional HTTPS proxy for the graph query

# Channel used for each hop: <prefix>-<major.minor>, e.g. stable-4.16
target_channel_prefix: "stable"

# Conditional updates (known risks that apply to this cluster) are refused unless true.
allow_conditional_updates: false

# ----------------------------------------------------------------------------
# Phase 02 - prechecks (read-only)
# ----------------------------------------------------------------------------
max_cpu_percent: 90                # Check 08: requested CPU vs allocatable
max_memory_percent: 90             # Check 08: requested memory vs allocatable
allowed_unschedulable_nodes: 0     # Checks 02 / 05: cordoned nodes allowed
fail_on_zero_disruption_pdb: false # Check 12: true makes blocking PDBs a HARD stop
co_allow_list: []                  # ClusterOperators ignored by every check, e.g. ["insights"]

# Check 14: true turns a cgroup v1 blocker into a warning and Phase 03 leaves cgroups
# alone (not recommended: OpenShift 4.19+ cannot run on cgroup v1).
skip_cgroup_check: false

# ----------------------------------------------------------------------------
# Phase 03 - pre-upgrade implementation (never in a dry run)
# ----------------------------------------------------------------------------
# Every change is followed by a look for a MachineConfigPool rollout; a rollout is
# watched to the end (Phase 05, with heartbeat and degradation mails) before the next
# task. How long to look for a pool that starts updating after a change that may or
# may not roll out (cgroup v2 always does and is watched at once):
rollout_detect_seconds: 120

auto_remediation_enabled: true     # master switch for tasks 1 and 2 below

# Task 1 (Check 03): unpause paused pools that are on this list.
auto_unpause_mcp: true
mcp_auto_unpause_list: ["worker", "master"]

# Task 2 (Check 14): set cgroupMode v2 when a hop reaches 4.19+ (every node reboots,
# watched to the end before the next task).
auto_fix_cgroup_v2: true

# Task 3 (Check 15): approve every pending operator upgrade (the current InstallPlan of
# each UpgradePending subscription) before the first hop and wait for Succeeded; the run
# stops if an operator still blocks the target version. skip_operator_upgrade (Phase 07
# section) turns this off too. Timeouts and the one-time restart are shared with Phase 07.
preupgrade_operator_upgrades: true

# Task 4 (Check 07): check APIRequestCount for APIs the path removes, then set the
# admin-ack the next minor hop needs. A later minor hop's ack only appears once the
# cluster is on that minor, so Phase 04 does the same right before each minor hop.
# Any non-ignored caller in the last 24 h stops the run.
auto_apply_admin_acks: true
api_usage_check_enabled: true
admin_ack_clear_timeout_seconds: 300
# Users Red Hat documents as safe to ignore (they walk every API).
api_usage_ignore_users:
  - "system:serviceaccount:kube-system:generic-garbage-collector"
  - "system:serviceaccount:kube-system:namespace-controller"
  - "system:kube-controller-manager"
  - "system:cluster-policy-controller"

# ----------------------------------------------------------------------------
# Phase 04 - hops
# ----------------------------------------------------------------------------
prehop_settle_wait_minutes: 10     # wait for a stable cluster before starting a hop
upgrade_edge_wait_seconds: 300     # wait for the cluster to offer the hop target

# ----------------------------------------------------------------------------
# Phase 05 - watching a hop or a Phase 03 node rollout
# ----------------------------------------------------------------------------
poll_interval_minutes: 2
heartbeat_minutes: 20              # heartbeat mail cadence
settle_consecutive_polls: 2        # settled polls in a row needed
hop_timeout_minutes: 90            # fail when nothing progresses this long
hop_max_minutes: 480               # fail when a hop takes longer than this in total
monitor_api_outage_minutes: 10     # API unreadable this long = fail
release_not_accepted_fail_minutes: 10
cv_failing_fail_minutes: 30

# Degradation mail grace periods (minutes a problem must last before it is mailed)
degradation_node_notready_minutes: 15          # node NotReady while cordoned (normal reboot)
degradation_uncordoned_notready_minutes: 5     # node NotReady while NOT cordoned
degradation_pressure_minutes: 5                # Disk/Memory/PID pressure
degradation_co_minutes: 10                     # ClusterOperator / pool Degraded
degradation_cv_failing_minutes: 10             # ClusterVersion Failing
node_stall_threshold_minutes: 30               # node stuck in its update (often a PDB)

# ----------------------------------------------------------------------------
# Phase 06 - postchecks
# ----------------------------------------------------------------------------
postval_co_settle_seconds: 300     # wait for operators to settle before judging them
alerts_query_timeout_seconds: 20

# ----------------------------------------------------------------------------
# Phase 07 - operators and console (the approval settings apply to Phase 03 too)
# ----------------------------------------------------------------------------
skip_operator_upgrade: false             # true = report only, approve nothing (Phase 03 and 07)
operator_upgrade_timeout_seconds: 600
operator_upgrade_poll_interval_seconds: 15
operator_upgrade_auto_recover: true      # one restart of a Failed CSV's Deployments
enable_developer_perspective: true       # disabled by default from OpenShift 4.19
console_settle_timeout_minutes: 10

# ----------------------------------------------------------------------------
# oc retries for transient API errors
# ----------------------------------------------------------------------------
oc_command_retries: 3
oc_command_retry_delay: 10
