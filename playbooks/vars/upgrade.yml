# Targets Ansible 2.7.17.
# MIGRATION 2.14: No changes required — pure variable definitions.
#
# =============================================================================
# Upgrade Target Cluster & Version Sequence Configuration
# =============================================================================
# Manually enter your target cluster name and ordered sequence of target
# OpenShift / ARO cluster versions below. All automation actions dynamically
# refer to the cluster name and versions configured here.
#
# Supports:
#   - Dynamic target cluster selection (credentials resolved from vars/secrets.yml)
#   - Y-stream (minor) sequential hops (e.g. 4.14.40 -> 4.15.35 -> 4.16.20)
#   - Z-stream (patch) updates (e.g. 4.14.38 -> 4.14.40)
# =============================================================================

---
# --- Target Cluster Name -----------------------------------------------------
# Enter the target cluster identifier below (must match an entry in vars/secrets.yml).
# All upgrade lifecycle actions (login, snapshot, prevalidation, monitoring,
# reporting, and logs) will dynamically target this cluster.
#
# Examples: "cluster-d01", "cluster-s01", "cluster-p01", "aro-prod-01"
cluster_name: "cluster-d01"

# --- Upgrade Path (Enter target cluster versions here) ------------------------
# Ordered list of target OpenShift versions to upgrade through sequentially.
# Each version is validated against available update edges prior to upgrading.
#
# Example Y-stream hops:
#   upgrade_path:
#     - "4.14.40"
#     - "4.15.35"
#
# Example Z-stream patch:
#   upgrade_path:
#     - "4.14.40"
upgrade_path:
  - "4.14.40"
  - "4.15.35"

# --- Optional: Per-Cluster Version Overrides ---------------------------------
# If you manage multiple clusters and want distinct version sequences per
# cluster, define them below. If defined for a cluster, it takes precedence
# over the global upgrade_path.
cluster_upgrade_paths: {}
#   cluster-d01:
#     - "4.14.40"
#     - "4.15.35"
#   cluster-p01:
#     - "4.15.35"

# --- Capacity Thresholds (Requests-based) ------------------------------------
# Prevalidation HARD gate: node and cluster capacity requests must remain
# strictly below these percentages before an upgrade can begin.
max_cpu_percent: 90
max_memory_percent: 90

# Prevalidation WARN threshold: projected remaining capacity during 1-node drain
max_drain_headroom_percent: 95

# --- Monitoring Cadences -----------------------------------------------------
# poll_interval_minutes: how often to poll oc get clusterversion/mcp/nodes (Phase 04)
# hop_timeout_minutes:   maximum allowed time for a single hop MCP to complete
# heartbeat_minutes:     interval between HTML heartbeat emails (Phase 04)
poll_interval_minutes: 2
hop_timeout_minutes: 90
heartbeat_minutes: 20

# --- Pod Disruption Budget (PDB) Gate ----------------------------------------
# If true, a PodDisruptionBudget with maxUnavailable=0 (or minAvailable=replicas)
# is treated as a HARD failure in prevalidation. If false, treated as WARN.
fail_on_zero_disruption_pdb: false

# --- Allowed Unschedulable Nodes ---------------------------------------------
# Nodes listed here are permitted to be SchedulingDisabled / cordoned
# during prevalidation without triggering a HARD failure.
# Note: NotReady nodes are NEVER permitted, even if listed here.
allowed_unschedulable_nodes: []
