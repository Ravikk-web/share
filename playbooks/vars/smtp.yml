# ============================================================================
# vars/smtp.yml - mail settings
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: the `mail` module comes from the community.general collection;
#                 00_Run.sh turns mails off (with a warning) when it is missing.
#
# Mails of a run:
#   heartbeat    every heartbeat_minutes while the cluster is updating   -> mail_to
#   degradation  once per new problem during an update                   -> alert_mail_to + mail_to
#   summary      once, at the end of a successful run (report attached)  -> mail_to
#   alert        once, when a run fails (report attached)                -> alert_mail_to + mail_to
# `00_Run.sh --mail-to` replaces mail_to for one run (alert_mail_to still gets alerts).
# A mail that cannot be sent is logged as WARN; it never stops the run.
# ============================================================================

send_email: true

smtp_host: "smtp.example.com"
smtp_port: 25                      # 25 internal relay, 587 STARTTLS
smtp_secure: "never"               # never | starttls | ssl
smtp_username: "{{ vault_smtp_username | default('') }}"
smtp_password: "{{ vault_smtp_password | default('') }}"
mail_timeout_seconds: 30

mail_from: "aro-upgrades@example.com"
mail_to:
  - "platform-team@example.com"
alert_mail_to:
  - "platform-team@example.com"
  - "oncall-platform@example.com"

# Subject: <prefix>[<cluster>][<KIND>] <headline> (run <timestamp>)
mail_subject_prefix: "[ARO Upgrade]"
