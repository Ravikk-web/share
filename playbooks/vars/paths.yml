# ============================================================================
# vars/paths.yml - where the run keeps its files (all under the playbooks folder)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
# ============================================================================

log_dir: "{{ playbook_dir }}/logs"             # <cluster>_<ts>.txt / .csv / .status
output_dir: "{{ playbook_dir }}/output"        # <cluster>_<ts>_report.html
snapshot_dir: "{{ playbook_dir }}/snapshots"   # <cluster>_<ts>_baseline.json

# The run's own kubeconfig (deleted at logout; ~/.kube/config is never used)
kubeconfig_path: "{{ playbook_dir }}/.kubeconfig-{{ cluster_name }}"

oc_binary: "oc"
