# Targets Ansible 2.7.17.
# MIGRATION 2.14: No changes required — Jinja2 expressions resolve identically.
#
# Dynamic path anchors derived from playbook_dir at runtime.
# All paths are Jinja2 expressions resolved in-play — nothing is
# hardcoded to a specific machine. 00_Run.sh creates these directories
# if they are missing before invoking main.yml.
#
# NOTE: | default('') is documented here for optional path overrides.
# If a caller needs to override any path, pass the variable at runtime;
# otherwise the playbook_dir-based default is used.

---
# --- Output directories (created by 00_Run.sh if missing) --------------------
log_dir: "{{ playbook_dir }}/logs"
output_dir: "{{ playbook_dir }}/output"
snapshot_dir: "{{ playbook_dir }}/snapshots"

# --- Kubeconfig (written by oc login in Phase 01) ----------------------------
# Stored under playbook_dir so it is cleaned up on logout and never
# collides with the operator's personal kubeconfig.
kubeconfig_path: "{{ playbook_dir }}/.kubeconfig"
