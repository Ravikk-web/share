# ============================================================================
# Centralized Directory & Runtime Paths
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Standard playbook_dir path derivations.
#
# Purpose: Anchors all directories and file locations dynamically to playbook_dir
#          to ensure full portability across jump servers with zero hardcoding.
# Dependencies: cluster_name (optional, falls back to 'default')
# Gate type: N/A
# ============================================================================

# Directory for dual .txt and .csv run logs
log_dir: "{{ playbook_dir }}/logs"

# Directory for client-facing HTML pre/post/operator validation reports
output_dir: "{{ playbook_dir }}/output"

# Directory for immutable baseline JSON snapshots captured in Phase 01
snapshot_dir: "{{ playbook_dir }}/snapshots"

# Scoped kubeconfig path unique to the current cluster target and session
kubeconfig_path: "{{ playbook_dir }}/.kubeconfig-{{ cluster_name | default('default') }}"

# Script directory containing CLI helper libraries
script_dir: "{{ playbook_dir }}/scripts"

# Templates directory for Jinja2 reports and emails
template_dir: "{{ playbook_dir }}/templates"
