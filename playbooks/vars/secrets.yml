# ============================================================================
# Cluster API Endpoints and Credential References
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Variable references only.
#
# Purpose: Holds cluster API endpoints, service account usernames, and Conjur
#          Vault-ready credential variable references. Never commit plaintext
#          passwords or live tokens into this file.
# Dependencies: None (vault variables supplied out-of-band or via vault file)
# Gate type: N/A
# ============================================================================

# ----------------------------------------------------------------------------
# SECURITY NOTICE:
# Credentials are referenced strictly as {{ vault_* }} variables.
# This architecture ensures full compatibility with future Conjur Vault integration
# and prevents accidental exposure of credentials in logs, console, or Git.
# ----------------------------------------------------------------------------

# Development Cluster: cluster_d01 (ARO-D01)
cluster_d01_api_url: "https://api.aro-d01.example.com:6443"
cluster_d01_username: "svc-aro-upgrade"
cluster_d01_password: "{{ vault_cluster_d01_password | default('') }}"

# Staging Cluster: cluster_s01 (ARO-S01)
cluster_s01_api_url: "https://api.aro-s01.example.com:6443"
cluster_s01_username: "svc-aro-upgrade"
cluster_s01_password: "{{ vault_cluster_s01_password | default('') }}"

# Production Cluster: cluster_p01 (ARO-P01)
cluster_p01_api_url: "https://api.aro-p01.example.com:6443"
cluster_p01_username: "svc-aro-upgrade"
cluster_p01_password: "{{ vault_cluster_p01_password | default('') }}"

# ----------------------------------------------------------------------------
# Structured Cluster Metadata Map (Consumed by CLI Menu & Playbooks)
# ----------------------------------------------------------------------------
clusters:
  cluster_d01:
    name: "cluster_d01"
    display_name: "ARO-D01 (Development)"
    api_url: "{{ cluster_d01_api_url }}"
    username: "{{ cluster_d01_username }}"
    password: "{{ cluster_d01_password }}"
    tier: "DEV"
  cluster_s01:
    name: "cluster_s01"
    display_name: "ARO-S01 (Staging)"
    api_url: "{{ cluster_s01_api_url }}"
    username: "{{ cluster_s01_username }}"
    password: "{{ cluster_s01_password }}"
    tier: "STAGE"
  cluster_p01:
    name: "cluster_p01"
    display_name: "ARO-P01 (Production)"
    api_url: "{{ cluster_p01_api_url }}"
    username: "{{ cluster_p01_username }}"
    password: "{{ cluster_p01_password }}"
    tier: "PROD"
