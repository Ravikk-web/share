# Targets Ansible 2.7.17.
# MIGRATION 2.14: No changes required — pure variable definitions.
#
# ┌────────────────────────────────────────────────────────────────┐
# │  SECRETS — Cluster credentials as variable references only.   │
# │                                                               │
# │  NEVER commit real credentials to this file.                  │
# │  Passwords use {{ vault_* }} references so the later swap     │
# │  from a vars file to Conjur Vault is a source-only change,    │
# │  not a code rewrite.                                          │
# │                                                               │
# │  At the task level, every task that handles these values       │
# │  MUST set  no_log: true  to prevent credentials from          │
# │  leaking into logs, reports, or terminal output.              │
# └────────────────────────────────────────────────────────────────┘
#
# CONJUR VAULT SWAP:
#   When migrating to Conjur, replace this file's variable
#   definitions with Conjur lookup calls in a vars plugin or
#   a pre-task include. The {{ vault_* }} reference names stay
#   the same — only the source changes.

---
clusters:
  - name: "cluster-d01"
    api_url: "https://api.cluster-d01.example.com:6443"
    username: "svc-aro-upgrade"
    password: "{{ vault_cluster_d01_password }}"

  - name: "cluster-d02"
    api_url: "https://api.cluster-d02.example.com:6443"
    username: "svc-aro-upgrade"
    password: "{{ vault_cluster_d02_password }}"

  - name: "cluster-s01"
    api_url: "https://api.cluster-s01.example.com:6443"
    username: "svc-aro-upgrade"
    password: "{{ vault_cluster_s01_password }}"

  - name: "cluster-p01"
    api_url: "https://api.cluster-p01.example.com:6443"
    username: "svc-aro-upgrade"
    password: "{{ vault_cluster_p01_password }}"
