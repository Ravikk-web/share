# ============================================================================
# API Validation Patterns and Regular Expressions
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Regular expression string constants.
#
# Purpose: Defines regex patterns for validating OpenShift cluster API endpoints,
#          cluster names, and version strings to prevent malformed inputs.
# Role / Playbook Dependencies: None
# Gate Type: N/A
# Outputs: Validation regular expression string variables for cluster URLs and version strings
# ============================================================================

# Regex for validating strict OpenShift cluster API endpoint URLs
# Matches both standard ARO endpoints (api.aro-d01...) and custom enterprise domains (api.arod01...)
desired_cluster_api_regex: '^https://api\.[a-zA-Z0-9.-]+:6443/?$'
