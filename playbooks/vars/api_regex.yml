# ============================================================================
# API Validation Patterns and Regular Expressions
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Regular expression string constants.
#
# Purpose: Defines regex patterns for validating OpenShift cluster API endpoints,
#          cluster names, and version strings to prevent malformed inputs.
# Dependencies: None
# Gate type: N/A
# ============================================================================

# Regex for validating strict OpenShift cluster API endpoint URLs
# Example match: https://api.aro-d01.eastus.aroapp.io:6443
desired_cluster_api_regex: '^https://api\.aro-[a-zA-Z0-9-]+\.[a-zA-Z0-9.-]+:6443/?$'

# Regex for validating standard OpenShift semantic version strings
# Matches versions like 4.14.12, 4.15.35, 4.16.18, 4.19.0-0.okd etc.
ocp_version_regex: '^4\.[0-9]+\.[0-9]+(-[a-zA-Z0-9.-]+)?$'

# Regex for validating alphanumeric cluster identifiers
cluster_name_regex: '^[a-zA-Z0-9_-]+$'
