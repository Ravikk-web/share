# Targets Ansible 2.7.17.
# MIGRATION 2.14: No changes required — pure variable definitions.
#
# Regular expressions for validating and parsing cluster API URLs.
# Used by Phase 01 (01_Policy_Check.yaml) to confirm the cluster
# API endpoint format and extract the cluster name.

---
# --- Cluster API URL validation regex ----------------------------------------
# Matches the expected ARO API URL pattern:
#   https://api.<cluster-name>.<domain>:<port>
# Example: https://api.cluster-d01.example.com:6443
desired_cluster_api_regex: "^https://api\\.[a-zA-Z0-9-]+\\.[a-zA-Z0-9.-]+:[0-9]+$"

# --- Cluster name extraction regex -------------------------------------------
# Extracts the cluster name from the API URL.
# Captures the segment between 'api.' and the next dot.
# Example: https://api.cluster-d01.example.com:6443 → cluster-d01
cluster_name_regex: "^https://api\\.([a-zA-Z0-9-]+)\\."
