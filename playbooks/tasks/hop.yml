---
# ============================================================================
# Task Workflow: hop.yml — Sequential Upgrade Hop Execution
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses standard block/rescue, set_fact, include_role, include_tasks;
#                 compatible across Ansible 2.7 and 2.14 without modification.
#
# Purpose: Orchestrates the sequential lifecycle of a single minor-version upgrade hop:
#          1. Computes hop iteration metadata (hop_number, hop_total, hop_label).
#          2. Logs hop initiation banner to console, text run log, and CSV audit log.
#          3. Evaluates pre-hop settle state (validates cluster is stable & unblocked).
#          4. Invokes roles/upgrade to update channel, verify edge, and trigger upgrade.
#          5. Hands off to live monitoring via 04_Live_monitoring_upgrade.yaml.
#          6. Enforces settle-gate verification (cv at target, COs available/settled, MCPs updated).
#          7. Dispatches hop-complete email notification with Prevalidation HTML report attached.
#          Enclosed in a robust block/rescue with error extraction, alert dispatch, and fail-safe logout.
# Dependencies: playbooks/vars/upgrade.yml, playbooks/vars/smtp.yml,
#               roles/upgrade, roles/sendmail, roles/error_handle, roles/logout
# Gate type: HARD (strictly gates on pre-hop stability, upgrade trigger, and settle state)
# ============================================================================

- name: "Phase 03: Execute Upgrade Hop {{ (hop_index | default(0) | int) + 1 }}/{{ upgrade_path | length }} ({{ hop_item }})"
  block:
    # ------------------------------------------------------------------------
    # 1. Hop Metadata Computation
    # ------------------------------------------------------------------------
    - name: "Compute hop iteration metadata"
      set_fact:
        hop_number: "{{ (hop_index | default(0) | int) + 1 }}"
        hop_total: "{{ upgrade_path | length }}"
        hop_label: "{{ (hop_index | default(0) | int) + 1 }}/{{ upgrade_path | length }}"
        current_hop_target: "{{ hop_item }}"
        current_step_no: "03"
        current_task_name: "Phase 03 Upgrade Hop {{ (hop_index | default(0) | int) + 1 }}/{{ upgrade_path | length }} ({{ hop_item }})"
        current_gate_type: "HARD"

    # ------------------------------------------------------------------------
    # 2. Log Hop Initiation Banner
    # ------------------------------------------------------------------------
    - name: "Display Phase 03 Hop initiation banner"
      debug:
        msg:
          - "============================================================================"
          - "PHASE 03: UPGRADE HOP {{ hop_label }} INITIATED (Target: {{ hop_item }})"
          - "============================================================================"
          - "Target Cluster       : {{ cluster_name }}"
          - "Hop Sequence         : {{ hop_number }} of {{ hop_total }}"
          - "Target Version       : {{ hop_item }}"
          - "Timestamp            : {{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}"
          - "============================================================================"

    - name: "Log hop start to human-readable text run log"
      lineinfile:
        path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
        line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [INFO] [HARD] Phase 03: Initiating Upgrade Hop {{ hop_label }} to version '{{ hop_item }}' on cluster '{{ cluster_name }}'."
        create: true
      when: not (dry_run | default(false) | bool)

    - name: "Check if CSV run log exists"
      stat:
        path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
      register: p03_csv_stat
      when: not (dry_run | default(false) | bool)

    - name: "Initialize CSV run log header if new"
      lineinfile:
        path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
        line: "timestamp,cluster,task_name,gate_type,status,reason,observed"
        create: true
      when:
        - not (dry_run | default(false) | bool)
        - not (p03_csv_stat.stat.exists | default(false))

    - name: "Log hop start to CSV audit log"
      lineinfile:
        path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
        line: '"{{ lookup(''pipe'', ''date +%Y-%m-%dT%H:%M:%S'') }}","{{ cluster_name }}","Phase 03 Upgrade Hop {{ hop_label }}","HARD","START","Target: {{ hop_item }}","Hop {{ hop_number }} of {{ hop_total }}"'
        create: true
      when: not (dry_run | default(false) | bool)

    # ------------------------------------------------------------------------
    # 3. Pre-Hop Settle Assertion
    # Why: Confirm cluster is in a stable, unblocked state before triggering mutation.
    #      Verifies that no previous upgrade is actively progressing, no MCP is degraded,
    #      and no ClusterOperator is degraded.
    # ------------------------------------------------------------------------
    - name: "Pre-Hop Settle: Query ClusterVersion progressing status"
      shell: |
        set -o pipefail
        oc get clusterversion version -o json | jq -r '
          {
            progressing: ([.status.conditions[]? | select(.type=="Progressing") | .status // "False"] | first // "False"),
            current_version: (.status.history[0]?.version // "")
          } | tojson
        '
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: prehop_cv_raw
      changed_when: false
      retries: "{{ oc_command_retries | default(3) }}"
      delay: "{{ oc_command_retry_delay | default(10) }}"
      until: prehop_cv_raw.rc == 0
      when: not (dry_run | default(false) | bool)

    - name: "Pre-Hop Settle: Query MachineConfigPool conditions"
      shell: |
        set -o pipefail
        oc get mcp -o json | jq -r '
          {
            degraded: ([.items[]? | select((.status.conditions[]? | select(.type=="Degraded") | .status // "False") == "True") | .metadata.name]),
            updating: ([.items[]? | select((.status.conditions[]? | select(.type=="Updating") | .status // "False") == "True") | .metadata.name])
          } | tojson
        '
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: prehop_mcp_raw
      changed_when: false
      retries: "{{ oc_command_retries | default(3) }}"
      delay: "{{ oc_command_retry_delay | default(10) }}"
      until: prehop_mcp_raw.rc == 0
      when: not (dry_run | default(false) | bool)

    - name: "Pre-Hop Settle: Query ClusterOperator degraded conditions"
      shell: |
        set -o pipefail
        oc get clusteroperators -o json | jq -r --argjson allow '{{ co_allow_list | default([]) | to_json }}' '
          [.items[]? | select((.status.conditions[]? | select(.type=="Degraded") | .status // "False") == "True") | .metadata.name] - $allow
        '
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: prehop_co_raw
      changed_when: false
      retries: "{{ oc_command_retries | default(3) }}"
      delay: "{{ oc_command_retry_delay | default(10) }}"
      until: prehop_co_raw.rc == 0
      when: not (dry_run | default(false) | bool)

    - name: "Pre-Hop Settle: Parse pre-hop stability facts"
      set_fact:
        prehop_cv_progressing: "{{ (prehop_cv_raw.stdout | from_json).progressing | string | trim }}"
        prehop_cv_version: "{{ (prehop_cv_raw.stdout | from_json).current_version | string | trim }}"
        prehop_mcp_degraded: "{{ (prehop_mcp_raw.stdout | from_json).degraded | default([]) }}"
        prehop_mcp_updating: "{{ (prehop_mcp_raw.stdout | from_json).updating | default([]) }}"
        prehop_co_degraded: "{{ prehop_co_raw.stdout | from_json | default([]) }}"
      when: not (dry_run | default(false) | bool)

    - name: "Pre-Hop Settle: Mock pre-hop stability facts for dry-run mode"
      set_fact:
        prehop_cv_progressing: "False"
        prehop_cv_version: "4.14.30"
        prehop_mcp_degraded: []
        prehop_mcp_updating: []
        prehop_co_degraded: []
      when: dry_run | default(false) | bool

    - name: "HARD Gate: Enforce cluster is in a stable, settled state prior to triggering hop"
      fail:
        msg: >-
          [HARD GATE FAILURE] Cluster '{{ cluster_name }}' is NOT in a stable, settled state
          prior to triggering Hop {{ hop_label }} (Target: {{ hop_item }}).
          {% if (prehop_cv_progressing | bool) and (prehop_cv_version != hop_item) %}
          - ClusterVersion is actively Progressing upgrade for version '{{ prehop_cv_version }}'.
          {% endif %}
          {% if prehop_mcp_degraded | length > 0 %}
          - MachineConfigPools in Degraded state: {{ prehop_mcp_degraded | join(', ') }}.
          {% endif %}
          {% if prehop_mcp_updating | length > 0 %}
          - MachineConfigPools actively Updating: {{ prehop_mcp_updating | join(', ') }}.
          {% endif %}
          {% if prehop_co_degraded | length > 0 %}
          - ClusterOperators in Degraded state: {{ prehop_co_degraded | join(', ') }}.
          {% endif %}
          Cannot initiate upgrade mutation while cluster components are unstable.
      when: >-
        ((prehop_cv_progressing | bool) and (prehop_cv_version != hop_item)) or
        ((prehop_mcp_degraded | length) > 0) or
        ((prehop_mcp_updating | length) > 0) or
        ((prehop_co_degraded | length) > 0)

    # ------------------------------------------------------------------------
    # 4. Invoke roles/upgrade
    # Why: Pre-computes target_version fact to avoid Jinja2 variable recursion,
    #      then includes the upgrade role to drive the version mutation.
    # ------------------------------------------------------------------------
    - name: "Set target version fact for upgrade role"
      set_fact:
        target_version: "{{ hop_item }}"

    - name: "Invoke upgrade role to initiate version transition to {{ hop_item }}"
      include_role:
        name: upgrade

    # ------------------------------------------------------------------------
    # 5. Hand off to Live Monitoring
    # Why: Hands off to Phase 04 tasks to track ClusterVersion rollout, MCP node
    #      updates, polling cadences, and periodic heartbeat notifications.
    # ------------------------------------------------------------------------
    - name: "Hand off Hop {{ hop_label }} to live monitoring (Phase 04)"
      include_tasks: "{{ playbook_dir }}/04_Live_monitoring_upgrade.yaml"

    # ------------------------------------------------------------------------
    # 6. Settle-Gate Verification
    # Why: Strictly asserts that the cluster has fully settled at target_version:
    #      - ClusterVersion current version matches target version.
    #      - ClusterVersion is Available=True and Progressing=False.
    #      - All ClusterOperators are Available=True, Progressing=False, Degraded=False.
    #      - All MachineConfigPools are Updated=True, Updating=False, Degraded=False.
    # ------------------------------------------------------------------------
    - name: "Settle-Gate: Query ClusterVersion condition states"
      shell: |
        set -o pipefail
        oc get clusterversion version -o json | jq -r '
          {
            current_version: (.status.history[0]?.version // ""),
            available: ([.status.conditions[]? | select(.type=="Available") | .status // "False"] | first // "False"),
            progressing: ([.status.conditions[]? | select(.type=="Progressing") | .status // "False"] | first // "False"),
            degraded: ([.status.conditions[]? | select((.type=="Failing") or (.type=="Degraded")) | .status // "False"] | first // "False")
          } | tojson
        '
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: settle_cv_raw
      changed_when: false
      retries: "{{ oc_command_retries | default(3) }}"
      delay: "{{ oc_command_retry_delay | default(10) }}"
      until: settle_cv_raw.rc == 0
      when: not (dry_run | default(false) | bool)

    - name: "Settle-Gate: Query ClusterOperators settle states"
      shell: |
        set -o pipefail
        oc get clusteroperators -o json | jq -r --argjson allow '{{ co_allow_list | default([]) | to_json }}' '
          {
            degraded: ([.items[]? | select((.status.conditions[]? | select(.type=="Degraded") | .status // "False") == "True") | .metadata.name] - $allow),
            progressing: ([.items[]? | select((.status.conditions[]? | select(.type=="Progressing") | .status // "False") == "True") | .metadata.name] - $allow),
            unavailable: ([.items[]? | select((.status.conditions[]? | select(.type=="Available") | .status // "False") != "True") | .metadata.name] - $allow)
          } | tojson
        '
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: settle_co_raw
      changed_when: false
      retries: "{{ oc_command_retries | default(3) }}"
      delay: "{{ oc_command_retry_delay | default(10) }}"
      until: settle_co_raw.rc == 0
      when: not (dry_run | default(false) | bool)

    - name: "Settle-Gate: Query MachineConfigPools settle states"
      shell: |
        set -o pipefail
        oc get mcp -o json | jq -r '
          {
            degraded: ([.items[]? | select((.status.conditions[]? | select(.type=="Degraded") | .status // "False") == "True") | .metadata.name]),
            updating: ([.items[]? | select((.status.conditions[]? | select(.type=="Updating") | .status // "False") == "True") | .metadata.name]),
            not_updated: ([.items[]? | select((.status.conditions[]? | select(.type=="Updated") | .status // "False") != "True") | .metadata.name]),
            summary_list: [.items[]? | {
              name: .metadata.name,
              machineCount: (.status.machineCount // 0),
              readyMachineCount: (.status.readyMachineCount // 0),
              updatedMachineCount: (.status.updatedMachineCount // 0),
              updatingMachineCount: (.status.updatingMachineCount // 0),
              degradedMachineCount: (.status.degradedMachineCount // 0)
            }]
          } | tojson
        '
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
      register: settle_mcp_raw
      changed_when: false
      retries: "{{ oc_command_retries | default(3) }}"
      delay: "{{ oc_command_retry_delay | default(10) }}"
      until: settle_mcp_raw.rc == 0
      when: not (dry_run | default(false) | bool)

    - name: "Settle-Gate: Parse live settle state facts"
      set_fact:
        settle_cv_version: "{{ (settle_cv_raw.stdout | from_json).current_version | string | trim }}"
        settle_cv_available: "{{ (settle_cv_raw.stdout | from_json).available | string | trim }}"
        settle_cv_progressing: "{{ (settle_cv_raw.stdout | from_json).progressing | string | trim }}"
        settle_cv_degraded: "{{ (settle_cv_raw.stdout | from_json).degraded | string | trim }}"
        settle_co_degraded: "{{ (settle_co_raw.stdout | from_json).degraded | default([]) }}"
        settle_co_progressing: "{{ (settle_co_raw.stdout | from_json).progressing | default([]) }}"
        settle_co_unavailable: "{{ (settle_co_raw.stdout | from_json).unavailable | default([]) }}"
        settle_mcp_degraded: "{{ (settle_mcp_raw.stdout | from_json).degraded | default([]) }}"
        settle_mcp_updating: "{{ (settle_mcp_raw.stdout | from_json).updating | default([]) }}"
        settle_mcp_not_updated: "{{ (settle_mcp_raw.stdout | from_json).not_updated | default([]) }}"
        settle_mcp_status_list: "{{ (settle_mcp_raw.stdout | from_json).summary_list | default([]) }}"
      when: not (dry_run | default(false) | bool)

    - name: "Settle-Gate: Mock settle state facts for dry-run mode"
      set_fact:
        settle_cv_version: "{{ hop_item }}"
        settle_cv_available: "True"
        settle_cv_progressing: "False"
        settle_cv_degraded: "False"
        settle_co_degraded: []
        settle_co_progressing: []
        settle_co_unavailable: []
        settle_mcp_degraded: []
        settle_mcp_updating: []
        settle_mcp_not_updated: []
        settle_mcp_status_list:
          - name: "master"
            machineCount: 3
            readyMachineCount: 3
            updatedMachineCount: 3
            updatingMachineCount: 0
            degradedMachineCount: 0
          - name: "worker"
            machineCount: 6
            readyMachineCount: 6
            updatedMachineCount: 6
            updatingMachineCount: 0
            degradedMachineCount: 0
      when: dry_run | default(false) | bool

    - name: "HARD Gate: Enforce cluster settle-gate contract"
      fail:
        msg: >-
          [HARD GATE FAILURE] Cluster '{{ cluster_name }}' failed to settle after Hop {{ hop_label }} (Target: {{ hop_item }}).
          {% if settle_cv_version != hop_item %}
          - ClusterVersion version '{{ settle_cv_version }}' does not match target '{{ hop_item }}'.
          {% endif %}
          {% if not (settle_cv_available | bool) %}
          - ClusterVersion Available condition is False.
          {% endif %}
          {% if settle_cv_progressing | bool %}
          - ClusterVersion Progressing condition is still True.
          {% endif %}
          {% if settle_co_degraded | length > 0 %}
          - ClusterOperators degraded: {{ settle_co_degraded | join(', ') }}.
          {% endif %}
          {% if settle_co_progressing | length > 0 %}
          - ClusterOperators progressing: {{ settle_co_progressing | join(', ') }}.
          {% endif %}
          {% if settle_co_unavailable | length > 0 %}
          - ClusterOperators unavailable: {{ settle_co_unavailable | join(', ') }}.
          {% endif %}
          {% if settle_mcp_degraded | length > 0 %}
          - MachineConfigPools degraded: {{ settle_mcp_degraded | join(', ') }}.
          {% endif %}
          {% if settle_mcp_updating | length > 0 %}
          - MachineConfigPools still updating: {{ settle_mcp_updating | join(', ') }}.
          {% endif %}
          {% if settle_mcp_not_updated | length > 0 %}
          - MachineConfigPools not fully updated: {{ settle_mcp_not_updated | join(', ') }}.
          {% endif %}
          Execution halted before proceeding to subsequent hops.
      when: >-
        (settle_cv_version != hop_item) or
        (not (settle_cv_available | bool)) or
        (settle_cv_progressing | bool) or
        ((settle_co_degraded | length) > 0) or
        ((settle_co_progressing | length) > 0) or
        ((settle_co_unavailable | length) > 0) or
        ((settle_mcp_degraded | length) > 0) or
        ((settle_mcp_updating | length) > 0) or
        ((settle_mcp_not_updated | length) > 0)

    # ------------------------------------------------------------------------
    # 7. Dispatch Hop-Complete Notification via sendmail Role
    # Why: Dispatches progress-mail.j2 formatted as a hop completion card
    #      with the Prevalidation HTML audit report attached.
    # ------------------------------------------------------------------------
    - name: "Locate Prevalidation HTML report for email attachment"
      set_fact:
        resolved_report_attachment: >-
          {{ report_file_path
             if (report_file_path is defined and report_file_path | length > 0)
             else (preval_report_path
                   if (preval_report_path is defined and preval_report_path | length > 0)
                   else '') }}

    - name: "Configure hop-complete notification parameters"
      set_fact:
        mail_template: "progress-mail.j2"
        mail_subject: "{{ heartbeat_subject_prefix | default('[ARO Upgrade]') }} {{ cluster_name }} Hop {{ hop_label }} Complete: {{ hop_item }}"
        mail_to: "{{ mail_to | default(['platform-team@example.com']) }}"
        is_hop_complete: true
        current_hop: "{{ hop_number }}"
        total_hops: "{{ hop_total }}"
        target_version: "{{ hop_item }}"
        progress_percent: 100
        percent_complete: 100
        elapsed_time: "{{ hop_elapsed_duration | default('Completed') }}"
        elapsed_duration: "{{ hop_elapsed_duration | default('Completed') }}"
        attachment_note: "Prevalidation HTML audit report attached for historical compliance."
        mcp_status_list: "{{ settle_mcp_status_list | default([]) }}"
        updating_nodes: []
        degraded_nodes: []
        mail_attachments: "{{ [resolved_report_attachment] if (resolved_report_attachment | length > 0) else [] }}"

    - name: "Dispatch hop-complete notification email via sendmail role"
      include_role:
        name: sendmail
      when:
        - not (dry_run | default(false) | bool)
        - (mail_to | default([]) | length) > 0

    - name: "Log hop completion confirmation to human-readable text run log"
      lineinfile:
        path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.txt"
        line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [PASS] [HARD] Phase 03: Upgrade Hop {{ hop_label }} to '{{ hop_item }}' completed successfully. Settle-gate verified."
        create: true
      when: not (dry_run | default(false) | bool)

    - name: "Log hop completion confirmation to CSV audit log"
      lineinfile:
        path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name }}_{{ run_timestamp }}.csv"
        line: '"{{ lookup(''pipe'', ''date +%Y-%m-%dT%H:%M:%S'') }}","{{ cluster_name }}","Phase 03 Upgrade Hop {{ hop_label }}","HARD","PASS","Hop completed to {{ hop_item }}","Settle-gate passed; completion notification dispatched"'
        create: true
      when: not (dry_run | default(false) | bool)

    - name: "Display Phase 03 Hop completion banner"
      debug:
        msg:
          - "============================================================================"
          - "PHASE 03: UPGRADE HOP {{ hop_label }} COMPLETED SUCCESSFULLY"
          - "============================================================================"
          - "Target Cluster       : {{ cluster_name }}"
          - "Achieved Version     : {{ hop_item }}"
          - "Settle-Gate Status   : VERIFIED (All COs Available, MCPs Updated)"
          - "Notification         : Dispatched to {{ mail_to | default(['platform-team@example.com']) | join(', ') }}"
          - "============================================================================"

  # --------------------------------------------------------------------------
  # Rescue Block: Error Extraction, Alert Dispatch & Clean Session Logout
  # Why: Catches any failure in pre-hop checks, upgrade trigger, monitoring handoff,
  #      or settle-gate. Extracts errors hierarchically, detects RBAC errors,
  #      dispatches alert email, and performs fail-safe session teardown.
  # --------------------------------------------------------------------------
  rescue:
    - name: "Extract sanitized error message from failure result in Phase 03 hop"
      set_fact:
        resolved_error: >-
          {{ ansible_failed_result.stderr | default('')
             if (ansible_failed_result.stderr | default('') | length > 0)
             else (ansible_failed_result.stderr_lines | default([]) | join('\n'))
             if (ansible_failed_result.stderr_lines | default([]) | length > 0)
             else ansible_failed_result.msg | default('Unknown error — inspect logs') }}

    - name: "Evaluate whether failure is an RBAC / authorization error in Phase 03 hop"
      set_fact:
        is_rbac_error: >-
          {{ (resolved_error | lower is search('forbidden'))
             or (resolved_error | lower is search('cannot patch'))
             or (resolved_error | lower is search('unauthorized'))
             or (resolved_error | lower is search('cannot get'))
             or (resolved_error | lower is search('cannot list'))
             or (resolved_error | lower is search('cannot create')) }}

    - name: "Configure Phase 03 hop error context facts"
      set_fact:
        current_step_no: "Phase 03 Hop {{ hop_label | default('N/A') }}"
        current_task_name: "Phase 03 Upgrade Hop {{ hop_label | default('N/A') }} ({{ hop_item | default('unknown') }})"
        current_gate_type: "HARD"
        failure_reason: "Upgrade hop {{ hop_label | default('N/A') }} failed transitioning to {{ hop_item | default('target') }}"
        failure_observed: "{{ resolved_error }}"
        phase_03_failed: true

    - name: "Record Phase 03 failure and dispatch alert via error_handle role"
      include_role:
        name: error_handle

    - name: "Execute session logout on Phase 03 failure"
      include_role:
        name: logout
      failed_when: false

    - name: "Halt execution on Phase 03 failure"
      fail:
        msg: "Phase 03 Upgrade Hop {{ hop_label | default('N/A') }} failed for cluster '{{ cluster_name }}': {{ resolved_error }}"
