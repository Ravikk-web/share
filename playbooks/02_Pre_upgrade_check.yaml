---
# ============================================================================
# Phase 02 - Prechecks (read-only)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed.
#
# Steps:
#   1. Run the 17 prechecks (steps/02/check_*.yml). Each one only records a result;
#      nothing on the cluster is changed in this phase.
#   2. GATE: stop if any HARD check is FAIL.
#
# Problems Phase 03 fixes do not stop the run here when Phase 03 is part of this
# run and the fix is switched on. They are recorded as WARN ("Phase 03 will ..."):
#   Check 03  paused pools on mcp_auto_unpause_list    -> Phase 03 unpauses them
#   Check 14  nodes not on cgroup v2 on a 4.19+ path   -> Phase 03 sets cgroupMode v2
#             (or, when it is already v2, watches the
#             node rollout) and checks every node
#   Check 15  blocking operators with a pending upgrade -> Phase 03 approves the upgrade
# Phase 03 makes the change, watches any node rollout, re-runs these 17 checks and
# stops the run if one is still failing. The admin-ack (Check 07) is applied in
# Phase 03 as well.
# ============================================================================

# Why: a fixable problem may only be waved through when Phase 03 runs after this phase.
- name: "Phase 02: Start"
  set_fact:
    current_phase: "02"
    preval_defer_fixes: "{{ 3 in run_phases }}"

- name: "Phase 02: Run the 17 prechecks"
  include_tasks: "{{ playbook_dir }}/steps/02/run_all_checks.yml"

- name: "Phase 02: Record the result"
  set_fact:
    preval_blockers: "{{ _blockers }}"
    run_phase_results: >-
      {{ run_phase_results + [{
           'phase': '02', 'name': phase_names['02'],
           'status': ('FAIL' if (_blockers | length > 0)
                      else ('WARN' if (preval_checks | selectattr('status', 'equalto', 'WARN') | list | length > 0) else 'PASS')),
           'detail': (preval_checks | length) ~ ' checks: '
                     ~ (preval_checks | selectattr('status', 'equalto', 'PASS') | list | length) ~ ' pass, '
                     ~ (preval_checks | selectattr('status', 'equalto', 'WARN') | list | length) ~ ' warn, '
                     ~ (_blockers | length) ~ ' blocking'
                     ~ ((' (left to Phase 03: checks ' ~ (preval_deferred | map('string') | join(', ')) ~ ')') if (preval_deferred | length > 0) else '')
         }] }}
  vars:
    _blockers: "{{ preval_checks | selectattr('gate', 'equalto', 'HARD') | selectattr('status', 'equalto', 'FAIL') | list }}"

- name: "Phase 02: Log the result"
  include_tasks: "{{ playbook_dir }}/steps/common/log_event.yml"
  vars:
    event_status: "{{ run_phase_results[-1].status }}"
    event_task: "Prechecks"
    event_reason: "{{ run_phase_results[-1].detail }}"

- name: "Phase 02: GATE - no HARD precheck may fail"
  fail:
    msg: >-
      {{ preval_blockers | length }} blocking precheck(s) on '{{ cluster_name }}':
      {% for c in preval_blockers %}Check {{ '%02d' | format(c.num) }} {{ c.name }}: {{ c.observed | truncate(300) }}{% if not loop.last %} | {% endif %}{% endfor %}.
      Nothing on the cluster was changed and no upgrade was started.
  when: preval_blockers | length > 0
