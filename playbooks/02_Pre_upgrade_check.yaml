# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (set_fact, fail, include_role, command, debug, stat)
#                 work on both versions.
#                 | default('') guards are applied on all optional variables.
#
# Phase 02 — Pre-Upgrade Checks & 13-Check Hard Gate (02_Pre_upgrade_check.yaml)
#
# Responsibilities:
#   1. Reuses authenticated session from Phase 01 (or logs in if run standalone).
#   2. Executes prevalidation aggregator role running all 13 checks (7 HARD, 6 WARN).
#   3. Renders client-facing HTML prevalidation report to output/ via report role.
#   4. Enforces HARD gate: any HARD failure aborts execution and tears down session.
#   5. WARN checks surface non-blocking findings in report and logs.
#   6. Wrapped in block/rescue/always: rescue logs errors, dispatches alert email, and logs out.

---
- name: Phase 02 — Pre-Upgrade Validation Hard Gate
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - vars/upgrade.yml
    - vars/paths.yml
    - vars/secrets.yml
    - vars/smtp.yml
    - vars/report_vars.yml
    - vars/api_regex.yml

  pre_tasks:
    - name: Check existing kubeconfig session
      stat:
        path: "{{ kubeconfig_path }}"
      register: pre_kubeconfig_stat

    - name: Test cluster session reachability
      command: oc whoami --show-server --kubeconfig "{{ kubeconfig_path }}"
      register: pre_whoami_test
      changed_when: false
      failed_when: false
      when: pre_kubeconfig_stat.stat.exists | default(false)

    - name: Resolve target cluster credentials if re-authentication needed
      set_fact:
        target_cluster_entry: "{{ (clusters | default([]) | selectattr('name', 'equalto', cluster_name) | list | first) | default({}) }}"
      no_log: true
      when: not (pre_kubeconfig_stat.stat.exists | default(false)) or (pre_whoami_test.rc | default(1) != 0)

    - name: Set login parameters for cluster {{ cluster_name | default('UNKNOWN') }}
      set_fact:
        login_api_url: "{{ target_cluster_entry.api_url | default(login_api_url | default('')) }}"
        login_username: "{{ target_cluster_entry.username | default(login_username | default('')) }}"
        login_password: "{{ target_cluster_entry.password | default(login_password | default('')) }}"
      no_log: true
      when: not (pre_kubeconfig_stat.stat.exists | default(false)) or (pre_whoami_test.rc | default(1) != 0)

    - name: Authenticate to cluster {{ cluster_name | default('UNKNOWN') }} (if not already logged in)
      include_role:
        name: login
      when: not (pre_kubeconfig_stat.stat.exists | default(false)) or (pre_whoami_test.rc | default(1) != 0)

  tasks:
    - name: Phase 02 Execution Block
      block:
        - name: Set Phase 02 Step 1 Context — 13-Check Prevalidation
          set_fact:
            failed_phase: "02_Pre_upgrade_check"
            current_step_no: 1
            current_task_name: "Pre-Upgrade 13-Check Prevalidation"
            current_gate_type: "HARD"
            phase02_failed: false

        - name: Run 13-Check Prevalidation Aggregator
          include_role:
            name: prevalidation

        - name: Set Phase 02 Step 2 Context — Render Prevalidation HTML Report
          set_fact:
            current_step_no: 2
            current_task_name: "Render Prevalidation HTML Report"
            current_gate_type: "HARD"

        - name: Render Prevalidation HTML Validation Report
          include_role:
            name: report
          vars:
            report_phase: "prevalidation"
            phase_name: "Pre-Upgrade Validation (Phase 02)"

        - name: Detect any HARD gate failures in health_summary
          set_fact:
            preval_hard_failures: "{{ health_summary | default([]) | selectattr('gate', 'equalto', 'HARD') | selectattr('status', 'equalto', 'FAIL') | list }}"

        - name: Enforce HARD gate halt on prevalidation failures
          fail:
            msg: >-
              HARD GATE FAILURE in Phase 02: One or more critical prevalidation checks failed on cluster '{{ cluster_name }}'.
              Found {{ preval_hard_failures | length }} failed HARD check(s).
              Prevalidation report written to: {{ report_html_path | default('output/') }}.
              Upgrade cannot proceed until all HARD checks pass.
          when: (preval_hard_failures | length > 0) or (failed_validations | default([]) | length > 0)

        - name: Confirm Phase 02 Pre-Upgrade Validation Success
          debug:
            msg: >-
              ✔ Phase 02 Pre-Upgrade Validation completed successfully on cluster '{{ cluster_name }}'.
              All 7 HARD checks passed.
              Report generated: {{ report_html_path | default('N/A') }}.
              Overall verdict: {{ report_last_verdict | default('PASS') }}.

      rescue:
        - name: Record failure details for Phase 02
          set_fact:
            phase02_failed: true
            failed_phase: "02_Pre_upgrade_check"
            failure_reason: >-
              {{
                (((ansible_failed_result | default({})).stderr | default('')) | trim) if (((ansible_failed_result | default({})).stderr | default('')) | trim != '')
                else (
                  (((ansible_failed_result | default({})).stderr_lines | default([])) | join(' ') | trim) if ((((ansible_failed_result | default({})).stderr_lines | default([])) | length) > 0)
                  else (
                    (((ansible_failed_result | default({})).msg | default('')) | trim) if (((ansible_failed_result | default({})).msg | default('')) | trim != '' and ((ansible_failed_result | default({})).msg | default('')) != 'non-zero return code')
                    else (
                      (((ansible_failed_result | default({})).message | default('')) | trim) if (((ansible_failed_result | default({})).message | default('')) | trim != '')
                      else 'Prevalidation checks failed.'
                    )
                  )
                )
              }}
            failure_observed: "FAILED at Step {{ current_step_no | default(1) }}: {{ current_task_name | default('Pre-Upgrade Validation') }}"

        - name: Trigger standardized error handling and alert
          include_role:
            name: error_handle

        - name: Tear down cluster session on failure
          include_role:
            name: logout

        - name: Halt execution due to Phase 02 failure
          fail:
            msg: "Phase 02 (02_Pre_upgrade_check) failed for cluster '{{ cluster_name }}'. Session torn down."

      always:
        - name: Ensure session logout on failure or dry run
          include_role:
            name: logout
          when: (phase02_failed | default(false)) or (dry_run | default(false) | bool)
