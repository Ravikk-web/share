---
# ============================================================================
# Role Tasks: operator_compat
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names, set_fact, and include_tasks.
#
# Purpose: Scans all installed OLM Subscription resources in the cluster and
#          verifies that available PackageManifest update channels support
#          the newly upgraded OpenShift version.
# Dependencies: playbooks/roles/operator_compat/defaults/main.yml,
#               playbooks/vars/upgrade.yml, playbooks/vars/paths.yml
# Gate type: WARN / Advisory (Exposes operator_compat_plan)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Initialize State Facts & Resolve Target Version
# ----------------------------------------------------------------------------
- name: "operator_compat: Initialize compatibility fact containers"
  set_fact:
    operator_compat_plan: []
    operator_compat_records: []

- name: "operator_compat: Resolve target OpenShift minor version prefix"
  set_fact:
    target_ocp_minor: >-
      {{ target_version | regex_search('^[0-9]+\\.[0-9]+')
         if (target_version is defined and target_version | length > 0)
         else (upgrade_path[-1] | regex_search('^[0-9]+\\.[0-9]+')
               if (upgrade_path is defined and upgrade_path | length > 0)
               else '') }}

- name: "operator_compat: Display compatibility scan banner"
  debug:
    msg:
      - "============================================================================"
      - "OLM OPERATOR COMPATIBILITY SCAN"
      - "============================================================================"
      - "Target Cluster       : {{ cluster_name | default('unknown') }}"
      - "Target OCP Minor     : {{ target_ocp_minor | default('N/A') }}"
      - "Gate Enforcement    : {{ operator_compat_enforce_gate | default(false) }}"
      - "============================================================================"

# ----------------------------------------------------------------------------
# 2. Resiliently Query Live Subscriptions with jq v1.5
# Why: Absorbs transient 503 or API blips. Extracts all OLM Subscriptions.
# ----------------------------------------------------------------------------
- name: "operator_compat: Query and parse live OLM subscriptions with jq v1.5"
  shell: |
    set -o pipefail
    oc get subscriptions.operators.coreos.com -A -o json 2>/dev/null | jq -c '
      [ .items[]? | {
          name: (.metadata.name // "unknown"),
          namespace: (.metadata.namespace // "unknown"),
          package: (.spec.name // .metadata.name // "unknown"),
          channel: (.spec.channel // ""),
          source: (.spec.source // ""),
          source_namespace: (.spec.sourceNamespace // "openshift-marketplace"),
          approval: (.spec.installPlanApproval // "Automatic"),
          installed_csv: (.status.installedCSV // .status.currentCSV // "None"),
          state: (.status.state // "AtLatestKnown")
        }
      ]
    ' || echo '[]'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: op_subscriptions_parsed_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: op_subscriptions_parsed_raw.rc == 0

- name: "operator_compat: Set parsed subscriptions fact"
  set_fact:
    parsed_subscriptions: >-
      {{ ((op_subscriptions_parsed_raw.stdout | default('[]') | trim).split('\n') | first | from_json)
         if (op_subscriptions_parsed_raw.stdout | default('') | trim | length > 0)
         else [] }}

# ----------------------------------------------------------------------------
# 3. Handle Empty Subscriptions Case Cleanly
# ----------------------------------------------------------------------------
- name: "operator_compat: Handle empty cluster subscriptions"
  set_fact:
    operator_compat_plan: []
    operator_compat_records:
      - name: "Operator Compatibility Scan"
        gate: "WARN"
        status: "PASS"
        observed: "No OLM subscriptions installed on cluster"
  when: parsed_subscriptions | length == 0

- name: "operator_compat: Display confirmation when no subscriptions found"
  debug:
    msg: "No OLM subscriptions found on cluster. All operator compatibility checks passed."
  when: parsed_subscriptions | length == 0

# ----------------------------------------------------------------------------
# 4. Scan Subscriptions for Channel Compatibility
# Why: Sequentially scans PackageManifest for each installed subscription.
# ----------------------------------------------------------------------------
- name: "operator_compat: Scan individual subscriptions for version compatibility"
  include_tasks: scan_subscription.yml
  loop: "{{ parsed_subscriptions }}"
  loop_control:
    loop_var: sub_item
  when: parsed_subscriptions | length > 0

# ----------------------------------------------------------------------------
# 5. Summary & Gate Enforcement
# ----------------------------------------------------------------------------
- name: "operator_compat: Display compatibility plan summary"
  debug:
    msg:
      - "----------------------------------------------------------------------------"
      - "OPERATOR COMPATIBILITY SCAN COMPLETE (Total: {{ operator_compat_plan | length }})"
      - "----------------------------------------------------------------------------"
      - "Plan items: {{ operator_compat_plan }}"
      - "----------------------------------------------------------------------------"

- name: "operator_compat: Enforce compatibility gate if enabled"
  fail:
    msg: "[HARD GATE FAILURE] One or more operators have incompatible update channels: {{ operator_compat_plan | selectattr('status', 'equalto', 'FAIL') | map(attribute='subscription') | join(', ') }}"
  when:
    - operator_compat_enforce_gate | default(false) | bool
    - (operator_compat_plan | selectattr('status', 'equalto', 'FAIL') | list | length) > 0
