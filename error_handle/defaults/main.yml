---
# ============================================================================
# Role Defaults: error_handle
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Standard variable declarations.
#
# Purpose: Default configuration parameters for unified rescue handling,
#          hierarchical error extraction, dual audit logging (.txt and .csv),
#          RBAC permission failure detection, and alert email dispatch.
# Dependencies: playbooks/vars/smtp.yml, playbooks/vars/paths.yml,
#               playbooks/vars/report_vars.yml
# Gate type: N/A (Error handling & recovery)
# ============================================================================

# Step number of the currently executing phase/sub-playbook (integer)
current_step_no: 0

# Human-readable descriptive name of the failed task (string)
# Why: Pre-set by calling task to avoid referencing internal failed task objects
current_task_name: ""

# Gate severity type: 'HARD' (immediate abort) or 'WARN' (advisory)
current_gate_type: "HARD"

# High-level failure reason description (string)
failure_reason: ""

# Raw or observed failure output string (string)
failure_observed: ""

# Resolved/sanitized error string extracted via priority hierarchy (string)
resolved_error: ""

# Boolean flag indicating whether the failure was caused by RBAC authorization
is_rbac_error: false

# Target cluster identifier (string)
cluster_name: "cluster"

# Unique execution timestamp identifier for run log file names
run_timestamp: "current"

# Directory for writing dual .txt and .csv run logs
log_dir: "{{ playbook_dir }}/logs"

# Template used for failure alert emails
mail_template: "error-report.j2"

# Specific RBAC error details and remediation defaults
rbac_missing_verb: "patch / get / update"
rbac_missing_resource: "ClusterVersion / MachineConfigPool / Node"
rbac_remediation_cmd: ""
