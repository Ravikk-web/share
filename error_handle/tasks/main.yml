---
# ============================================================================
# Role Tasks: error_handle
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names (set_fact, lineinfile, stat, file, include_role).
#
# Purpose: Standardized rescue block handler. Implements hierarchical error
#          extraction (stderr -> stderr_lines -> msg), RBAC permission failure
#          detection, dual-format run logging (.txt and .csv), structured
#          health summary tracking, and failure alert email dispatch.
# Dependencies: playbooks/roles/sendmail, playbooks/vars/smtp.yml,
#               playbooks/vars/paths.yml, playbooks/templates/error-report.j2
# Gate type: HARD / WARN (Captures and records failure context)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Hierarchical Error Extraction
# Why: Extract root-cause error text in priority order without referencing
#      internal task objects (which crash Ansible during templating).
# ----------------------------------------------------------------------------
- name: "Extract error details from failed task via priority hierarchy"
  set_fact:
    resolved_error: >-
      {{ resolved_error
         if (resolved_error | default('') | length > 0)
         else (ansible_failed_result.stderr | default('')
               if (ansible_failed_result is defined and ansible_failed_result.stderr is defined and ansible_failed_result.stderr | length > 0)
               else (ansible_failed_result.stderr_lines | default([]) | join('\n'))
               if (ansible_failed_result is defined and ansible_failed_result.stderr_lines is defined and ansible_failed_result.stderr_lines | length > 0)
               else (ansible_failed_result.msg | default('Unknown error — inspect run logs'))
               if (ansible_failed_result is defined and ansible_failed_result.msg is defined)
               else (failure_observed
                     if (failure_observed | default('') | length > 0)
                     else (failure_reason
                           if (failure_reason | default('') | length > 0)
                           else 'Unknown error — inspect run logs at ' ~ (log_dir | default('logs'))))) }}

- name: "Ensure failure reason description is populated"
  set_fact:
    failure_reason: >-
      {{ failure_reason
         if (failure_reason | default('') | length > 0)
         else (failure_observed
               if (failure_observed | default('') | length > 0)
               else resolved_error) }}

- name: "Normalize error reporting metadata"
  set_fact:
    failed_task_name: "{{ current_task_name | default('Validation Failure') }}"
    failed_gate_type: "{{ current_gate_type | default('HARD') }}"

# ----------------------------------------------------------------------------
# 2. RBAC & Permission Failure Detection
# Why: Detect authorization failures (forbidden, cannot patch, unauthorized)
#      to surface actionable remediation commands in alert emails.
# ----------------------------------------------------------------------------
- name: "Detect RBAC or permission authorization failure"
  set_fact:
    is_rbac_error: >-
      {{ ((resolved_error | default('') | lower is search('forbidden'))
          or (resolved_error | default('') | lower is search('cannot patch'))
          or (resolved_error | default('') | lower is search('unauthorized'))
          or (resolved_error | default('') | lower is search('cannot get'))
          or (resolved_error | default('') | lower is search('cannot list'))
          or (resolved_error | default('') | lower is search('cannot create'))
          or (failure_reason | default('') | lower is search('forbidden'))
          or (failure_reason | default('') | lower is search('cannot patch'))
          or (failure_reason | default('') | lower is search('unauthorized'))
          or (failure_reason | default('') | lower is search('cannot get'))
          or (failure_reason | default('') | lower is search('cannot list'))
          or (failure_reason | default('') | lower is search('cannot create'))) }}

- name: "Set RBAC remediation command recommendation"
  set_fact:
    rbac_remediation_cmd: >-
      {{ rbac_remediation_cmd
         if (rbac_remediation_cmd | default('') | length > 0)
         else ('oc adm policy add-cluster-role-to-user cluster-admin ' ~ (cluster_username | default('system:serviceaccount:default:aro-upgrade-sa'))) }}
  when: is_rbac_error | bool

# ----------------------------------------------------------------------------
# 3. Structured Failure Item Recording
# Why: Record structured dictionary into failed_checks and health_summary
#      so subsequent report generation accurately reflects the failure.
# ----------------------------------------------------------------------------
- name: "Construct structured failure item"
  set_fact:
    current_failure_item:
      num: "{{ (health_summary | default([]) | length) + 1 }}"
      name: "{{ current_task_name | default('Validation Failure') }}"
      gate: "{{ current_gate_type | default('HARD') }}"
      status: "FAIL"
      observed: "{{ resolved_error }}"

- name: "Record structured failure item to tracking lists"
  set_fact:
    failed_checks: "{{ (failed_checks | default([])) + [current_failure_item] }}"
    health_summary: "{{ (health_summary | default([])) + [current_failure_item] }}"

# ----------------------------------------------------------------------------
# 4. Dual Audit Logging: Human-Readable Run Log (.txt)
# ----------------------------------------------------------------------------
- name: "Ensure log directory exists"
  file:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}"
    state: directory
    mode: '0755'

- name: "Append failure entry to run log (.txt)"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.txt"
    line: "[{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S') }}] [FAIL] [{{ current_gate_type | default('HARD') }}] Task '{{ current_task_name | default('Unknown Task') }}': {{ failure_reason }} | Observed: {{ resolved_error }}"
    create: true

# ----------------------------------------------------------------------------
# 5. Dual Audit Logging: Machine-Parseable CSV Log (.csv)
# Why: Initialize CSV header on first write, then append quoted CSV record.
# ----------------------------------------------------------------------------
- name: "Check if CSV run log exists"
  stat:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.csv"
  register: csv_log_stat

- name: "Initialize CSV run log header if new"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.csv"
    line: "timestamp,cluster,task_name,gate_type,status,reason,observed"
    create: true
  when: not (csv_log_stat.stat.exists | default(false))

- name: "Append failure row to CSV run log"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.csv"
    line: '"{{ lookup(''pipe'', ''date +%Y-%m-%dT%H:%M:%S'') }}","{{ cluster_name | default(''cluster'') }}","{{ current_task_name | default(''Unknown Task'') }}","{{ current_gate_type | default(''HARD'') }}","FAIL","{{ failure_reason | regex_replace(''"'', ''""'') }}","{{ resolved_error | regex_replace(''"'', ''""'') | regex_replace(''\r?\n'', '' '') }}"'
    create: true

# ----------------------------------------------------------------------------
# 6. Immediate Failure Alert Email Dispatch
# Why: Pre-set facts before calling sendmail to prevent Jinja2 self-referencing
#      anti-patterns (Anti-Pattern #1 and #2).
# ----------------------------------------------------------------------------
- name: "Prepare failure alert email notification parameters"
  set_fact:
    mail_template: "error-report.j2"
    mail_to: >-
      {{ resolved_alert_recipients
         if (resolved_alert_recipients is defined and resolved_alert_recipients | length > 0)
         else (((alert_mail_to | default([])) + (mail_to | default([]))) | unique
               if (((alert_mail_to | default([])) + (mail_to | default([]))) | length > 0)
               else ['platform-team@example.com']) }}
    mail_subject: >-
      {{ mail_subject
         if (mail_subject is defined and mail_subject | length > 0 and mail_subject != (alert_subject_prefix | default('[ARO Upgrade ALERT]')) ~ ' ' ~ (cluster_name | default('Cluster')) ~ ' Upgrade Halted')
         else ((alert_subject_prefix | default('[ARO Upgrade ALERT]')) ~ ' ' ~ (cluster_name | default('Cluster')) ~ ' Upgrade Halted') }}
    failed_task_name: "{{ current_task_name | default('Unknown Task') }}"
    failed_gate_type: "{{ current_gate_type | default('HARD') }}"
    log_file_path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.txt"
    mail_attachments: "{{ mail_attachments | default([]) }}"

- name: "Dispatch failure alert email via sendmail role"
  block:
    - name: "Dispatch failure alert email via sendmail role"
      include_role:
        name: sendmail
  rescue:
    - name: "Log warning if failure alert email dispatch encountered SMTP error"
      debug:
        msg: "[WARN] Alert email dispatch encountered SMTP error: {{ ansible_failed_result.msg | default('SMTP error') }}"

