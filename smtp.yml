# ============================================================================
# SMTP Notification & Email Configuration
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Native mail module configuration parameters.
#
# Purpose: Defines direct SMTP host, port, authentication parameters, sender,
#          recipient lists, and subject line tags for notification emails.
# Dependencies: None
# Gate type: N/A
# ============================================================================

# SMTP server hostname or IP address reachable from the jump server
smtp_host: "smtp.example.com"

# SMTP service port (25 for unauthenticated internal relays, 587 for STARTTLS)
smtp_port: 25

# Sender email address appearing in the 'From' header
mail_from: "aro-upgrades@example.com"

# Default distribution list for progress, heartbeat, and completion notices
mail_to:
  - "platform-team@example.com"

# Distribution list for critical failure alerts and gate aborts
alert_mail_to:
  - "platform-team@example.com"
  - "oncall-platform@example.com"

# Distribution list for prevalidation health reports (defaults to mail_to if unset or empty)
preval_mail_to:
  - "platform-team@example.com"

# Distribution list for post-upgrade validation & success reports (defaults to mail_to if unset or empty)
postval_mail_to:
  - "platform-team@example.com"

# Subject line prefix for monitoring heartbeats and progress notifications
heartbeat_subject_prefix: "[ARO Upgrade]"

# Subject line prefix for prevalidation reports
prevalidation_subject_prefix: "[ARO Upgrade PREVALIDATION]"

# Subject line prefix for postvalidation reports
postvalidation_subject_prefix: "[ARO Upgrade POSTVALIDATION]"

# Subject line prefix for critical failure alerts and gate aborts
alert_subject_prefix: "[ARO Upgrade ALERT]"

# Subject line prefix for final completion digests
completion_subject_prefix: "[ARO Upgrade COMPLETE]"

# Master toggle to send prevalidation HTML report via email (default: true)
send_prevalidation_email: true

# Master toggle to send postvalidation / upgrade success HTML report via email (default: true)
send_postvalidation_email: true
send_upgrade_success_email: true

# Optional SMTP authentication credentials (empty by default for internal relay)
smtp_username: "{{ vault_smtp_username | default('') }}"
smtp_password: "{{ vault_smtp_password | default('') }}"

# SMTP security mode ('never', 'starttls', or 'ssl')
smtp_secure: "never"
