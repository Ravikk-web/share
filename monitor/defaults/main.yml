# Targets Ansible 2.7.17.
# MIGRATION 2.14: No changes required — pure variable definitions.
#
# monitor role defaults — live upgrade monitoring during each hop.
#
# This role polls CV/MCP/nodes at a fixed cadence during each upgrade hop,
# enforces a timeout guard, sends heartbeat and state-change emails, and
# asserts the settle-gate before the next hop can proceed.
#
# Required variables (supplied by caller — hop.yml):
#   - hop_target_version    — the version being upgraded to in this hop
#   - hop_number            — current hop number (1-based)
#   - hop_total             — total number of hops in upgrade_path
#   - hop_label             — display label "x/y"
#   - cluster_name          — target cluster identifier
#   - kubeconfig_path       — path to the active kubeconfig
#
# Cadence variables (inherited from vars/upgrade.yml):
#   - poll_interval_minutes — how often to poll (default: 2)
#   - hop_timeout_minutes   — max time for a single hop MCP to complete (default: 90)
#   - heartbeat_minutes     — interval between heartbeat emails (default: 20)

---
# --- Cadence defaults (sourced from vars/upgrade.yml) -------------------------
poll_interval_minutes: 2
hop_timeout_minutes: 90
heartbeat_minutes: 20

# --- Hop context (supplied by caller) ----------------------------------------
hop_target_version: ""
hop_number: "1"
hop_total: "1"
hop_label: "1/1"

# --- Cluster context (inherited from vars) ------------------------------------
# cluster_name: "" — inherited from vars/upgrade.yml
# kubeconfig_path: "" — inherited from vars/paths.yml

# --- Computed: max poll iterations (bounded loop guard) -----------------------
# Calculated at runtime in tasks/main.yml as:
#   hop_timeout_minutes / poll_interval_minutes
# Default: 90 / 2 = 45 iterations
# This is a fallback default; the actual value is computed dynamically.
max_poll_iterations: 45

# --- Email subject prefixes (inherited from vars/smtp.yml) --------------------
# heartbeat_subject_prefix: "[ARO Upgrade] Heartbeat" — inherited
# alert_subject_prefix: "[ARO Upgrade] ALERT" — inherited
