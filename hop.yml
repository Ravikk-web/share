# Targets Ansible 2.7.17.
# MIGRATION 2.14: Short module names (set_fact, fail, debug, include_role)
#                 work on both versions.
#                 | default('') guards are applied on all optional variables.
#                 No `warn:` parameter is used on any task.
#
# tasks/hop.yml — Per-hop upgrade sequence.
#
# Called from 03_Initiate_upgrade.yaml via `include_tasks: tasks/hop.yml`
# with `loop:` over `upgrade_path` and `loop_var: hop_item`.
#
# Why include_tasks + loop (not import_playbook):
#   import_playbook cannot loop on Ansible 2.7.17. Per-hop iteration must use
#   a play with `include_tasks:` + `loop:` per the hybrid chaining architecture.
#
# Per-hop sequence:
#   1. Pre-hop settle assertion (entry condition — CO, MCP, CV checks)
#   2. Call upgrade role (set channel → edge verify → admin-ack → oc adm upgrade --to)
#   3. Hand off to monitor (Phase 04 — live monitoring, settle-gate)
#
# rescue: → error_handle (alert) → logout → stop
#
# Dependencies:
#   - Unit 07 (edge validation), Unit 03 (login/logout), Unit 06 (error_handle)
#   - Unit 18 provides the monitor called inside the hop
#   - oc, jq

---
# ==============================================================================
# COMPUTE HOP CONTEXT
# ==============================================================================
- name: Compute hop {{ hop_index | default(0) + 1 }}/{{ upgrade_path | default([]) | length }} context
  set_fact:
    hop_target_version: "{{ hop_item }}"
    hop_number: "{{ hop_index | default(0) + 1 }}"
    hop_total: "{{ upgrade_path | default([]) | length }}"
    hop_label: "{{ hop_index | default(0) + 1 }}/{{ upgrade_path | default([]) | length }}"
    hop_failed: false

- name: Display hop {{ hop_label | default('?/?') }} banner — target {{ hop_target_version | default('') }}
  debug:
    msg: >-
      ═══════════════════════════════════════════════════════════
      Upgrade Hop {{ hop_label }} — Target: {{ hop_target_version }}
      Cluster: {{ cluster_name | default('UNKNOWN') }}
      ═══════════════════════════════════════════════════════════

# ==============================================================================
# PER-HOP BLOCK: settle → upgrade → monitor
# ==============================================================================
- name: Hop {{ hop_label | default('?/?') }} Execution Block
  block:
    # ========================================================================
    # PRE-HOP SETTLE ASSERTION (Entry Condition)
    # ========================================================================
    # Before starting this hop, assert that the cluster is in a settled state:
    #   - ClusterVersion is at the expected version (previous hop or starting)
    #   - ClusterOperators are Available=True and not Progressing
    #   - MachineConfigPools are Updated=True and not Degraded

    - name: "Hop {{ hop_label }} — Pre-hop settle: query ClusterVersion"
      command: oc get clusterversion version -o json --kubeconfig {{ kubeconfig_path }}
      register: hop_settle_cv_raw
      changed_when: false
      failed_when: hop_settle_cv_raw.rc != 0

    - name: "Hop {{ hop_label }} — Pre-hop settle: parse ClusterVersion"
      set_fact:
        hop_settle_cv_version: "{{ (hop_settle_cv_raw.stdout | from_json).status.desired.version | default('unknown') }}"
        hop_settle_cv_progressing: "{{ ((hop_settle_cv_raw.stdout | from_json).status.conditions | default([]) | selectattr('type', 'equalto', 'Progressing') | map(attribute='status') | list | first) | default('False') }}"

    - name: "Hop {{ hop_label }} — Pre-hop settle: query ClusterOperators"
      shell: >-
        oc get clusteroperators -o json --kubeconfig "{{ kubeconfig_path }}" | jq -r '
          [.items[]? | {
            "name": .metadata.name,
            "available": ([.status.conditions[]? | select(.type=="Available") | .status][0] // "Unknown"),
            "progressing": ([.status.conditions[]? | select(.type=="Progressing") | .status][0] // "Unknown"),
            "degraded": ([.status.conditions[]? | select(.type=="Degraded") | .status][0] // "Unknown")
          }] | {
            "total": length,
            "not_available": [.[] | select(.available != "True")] | length,
            "progressing": [.[] | select(.progressing == "True")] | length,
            "degraded": [.[] | select(.degraded == "True")] | length
          }
        '
      register: hop_settle_co_raw
      changed_when: false
      failed_when: false

    - name: "Hop {{ hop_label }} — Pre-hop settle: parse CO status"
      set_fact:
        hop_settle_co_data: "{{ hop_settle_co_raw.stdout | default('{}') | from_json }}"
      when: (hop_settle_co_raw.rc | default(1) == 0) and (hop_settle_co_raw.stdout | default('') | trim != '')

    - name: "Hop {{ hop_label }} — Pre-hop settle: fallback CO status"
      set_fact:
        hop_settle_co_data:
          total: 0
          not_available: 0
          progressing: 0
          degraded: 0
      when: (hop_settle_co_raw.rc | default(1) != 0) or (hop_settle_co_raw.stdout | default('') | trim == '')

    - name: "Hop {{ hop_label }} — Pre-hop settle: query MachineConfigPools"
      shell: >-
        oc get mcp -o json --kubeconfig "{{ kubeconfig_path }}" | jq -r '
          [.items[]? | {
            "name": .metadata.name,
            "updated": ([.status.conditions[]? | select(.type=="Updated") | .status][0] // "Unknown"),
            "updating": ([.status.conditions[]? | select(.type=="Updating") | .status][0] // "Unknown"),
            "degraded": ([.status.conditions[]? | select(.type=="Degraded") | .status][0] // "Unknown")
          }] | {
            "total": length,
            "not_updated": [.[] | select(.updated != "True")] | length,
            "updating": [.[] | select(.updating == "True")] | length,
            "degraded": [.[] | select(.degraded == "True")] | length
          }
        '
      register: hop_settle_mcp_raw
      changed_when: false
      failed_when: false

    - name: "Hop {{ hop_label }} — Pre-hop settle: parse MCP status"
      set_fact:
        hop_settle_mcp_data: "{{ hop_settle_mcp_raw.stdout | default('{}') | from_json }}"
      when: (hop_settle_mcp_raw.rc | default(1) == 0) and (hop_settle_mcp_raw.stdout | default('') | trim != '')

    - name: "Hop {{ hop_label }} — Pre-hop settle: fallback MCP status"
      set_fact:
        hop_settle_mcp_data:
          total: 0
          not_updated: 0
          updating: 0
          degraded: 0
      when: (hop_settle_mcp_raw.rc | default(1) != 0) or (hop_settle_mcp_raw.stdout | default('') | trim == '')

    - name: "Hop {{ hop_label }} — Pre-hop settle: display cluster state"
      debug:
        msg:
          - "Pre-hop Settle Check for Hop {{ hop_label }} → {{ hop_target_version }}"
          - "CV Version:        {{ hop_settle_cv_version }}"
          - "CV Progressing:    {{ hop_settle_cv_progressing }}"
          - "CO Not Available:  {{ hop_settle_co_data.not_available | default(0) }}"
          - "CO Progressing:    {{ hop_settle_co_data.progressing | default(0) }}"
          - "CO Degraded:       {{ hop_settle_co_data.degraded | default(0) }}"
          - "MCP Not Updated:   {{ hop_settle_mcp_data.not_updated | default(0) }}"
          - "MCP Updating:      {{ hop_settle_mcp_data.updating | default(0) }}"
          - "MCP Degraded:      {{ hop_settle_mcp_data.degraded | default(0) }}"

    - name: "Hop {{ hop_label }} — Enforce pre-hop settle gate"
      fail:
        msg: >-
          PRE-HOP SETTLE GATE FAILURE for Hop {{ hop_label }} → {{ hop_target_version }}
          on cluster '{{ cluster_name | default('UNKNOWN') }}'.
          The cluster is not in a settled state — cannot proceed with this hop.
          CV Progressing: {{ hop_settle_cv_progressing }};
          CO not available: {{ hop_settle_co_data.not_available | default(0) }},
          progressing: {{ hop_settle_co_data.progressing | default(0) }},
          degraded: {{ hop_settle_co_data.degraded | default(0) }};
          MCP not updated: {{ hop_settle_mcp_data.not_updated | default(0) }},
          updating: {{ hop_settle_mcp_data.updating | default(0) }},
          degraded: {{ hop_settle_mcp_data.degraded | default(0) }}.
      when: >-
        (hop_settle_cv_progressing | default('False') == 'True') or
        (hop_settle_co_data.not_available | default(0) | int > 0) or
        (hop_settle_co_data.progressing | default(0) | int > 0) or
        (hop_settle_co_data.degraded | default(0) | int > 0) or
        (hop_settle_mcp_data.not_updated | default(0) | int > 0) or
        (hop_settle_mcp_data.updating | default(0) | int > 0) or
        (hop_settle_mcp_data.degraded | default(0) | int > 0)

    - name: "Hop {{ hop_label }} — Pre-hop settle gate passed"
      debug:
        msg: "✔ Pre-hop settle assertion passed — cluster is settled and ready for hop {{ hop_label }}."

    # ========================================================================
    # EXECUTE UPGRADE ROLE
    # ========================================================================
    - name: "Hop {{ hop_label }} — Execute upgrade role (channel → edge → admin-ack → trigger)"
      include_role:
        name: upgrade

    - name: "Hop {{ hop_label }} — Upgrade trigger confirmed"
      debug:
        msg: >-
          ✔ Upgrade triggered for hop {{ hop_label }} → {{ hop_target_version }}
          on cluster '{{ cluster_name | default('UNKNOWN') }}'.
          Handing off to monitor phase.

    # ========================================================================
    # HAND OFF TO MONITOR (Phase 04 — Live Monitoring)
    # ========================================================================
    # Polls CV/MCP/nodes every 2 minutes, sends heartbeat emails every 20 min,
    # sends immediate emails on state change, enforces a 90-min timeout guard,
    # and asserts the settle-gate (CV at target, COs healthy, MCPs updated)
    # before the next hop can proceed. All cadences from vars/upgrade.yml.
    - name: "Hop {{ hop_label }} — Execute live monitoring (Phase 04)"
      include_tasks: 04_Live_monitoring_upgrade.yaml

  rescue:
    - name: "Hop {{ hop_label }} — Resolve failure context object"
      set_fact:
        hop_failed: true
        failed_phase: "03_Initiate_upgrade"
        current_step_no: "{{ hop_number | default(1) }}"
        current_task_name: "Upgrade Hop {{ hop_label }} → {{ hop_target_version }}"
        current_gate_type: "HARD"
        hop_failure_obj: >-
          {{
            upgrade_trigger_result
            if (upgrade_trigger_result is defined and (upgrade_trigger_result.rc | default(0) != 0 or upgrade_trigger_result.failed | default(false)))
            else (
              force_upgrade_result
              if (force_upgrade_result is defined and (force_upgrade_result.rc | default(0) != 0 or force_upgrade_result.failed | default(false)))
              else (
                upgrade_ack_apply_result
                if (upgrade_ack_apply_result is defined and (upgrade_ack_apply_result.rc | default(0) != 0 or upgrade_ack_apply_result.failed | default(false)))
                else (
                  channel_set_result
                  if (channel_set_result is defined and (channel_set_result.rc | default(0) != 0 or channel_set_result.failed | default(false)))
                  else (
                    upgrade_cv_raw
                    if (upgrade_cv_raw is defined and (upgrade_cv_raw.rc | default(0) != 0 or upgrade_cv_raw.failed | default(false)))
                    else (ansible_failed_result | default({}))
                  )
                )
              )
            )
          }}

    - name: "Hop {{ hop_label }} — Record failure details"
      set_fact:
        failure_reason: >-
          {{
            ((hop_failure_obj | default({})).stderr | default('') | trim)
            if (((hop_failure_obj | default({})).stderr | default('') | trim) != '')
            else (
              (((hop_failure_obj | default({})).stderr_lines | default([])) | join(' ') | trim)
              if ((((hop_failure_obj | default({})).stderr_lines | default([])) | length) > 0)
              else (
                ((hop_failure_obj | default({})).msg | default('') | trim)
                if (((hop_failure_obj | default({})).msg | default('') | trim) != '' and ((hop_failure_obj | default({})).msg | default('') | trim) != 'non-zero return code')
                else (
                  ((hop_failure_obj | default({})).message | default('') | trim)
                  if (((hop_failure_obj | default({})).message | default('') | trim) != '')
                  else 'Hop upgrade sequence failed.'
                )
              )
            )
          }}
        failure_observed: >-
          {{
            'RBAC Permission Denied (Forbidden) during Hop ' ~ (hop_label | default('1/1')) ~ ' trigger'
            if (('forbidden' in ((hop_failure_obj | default({})).stderr | default('') | lower)) or
                ('cannot patch' in ((hop_failure_obj | default({})).stderr | default('') | lower)) or
                ('cannot get' in ((hop_failure_obj | default({})).stderr | default('') | lower)) or
                ('unauthorized' in ((hop_failure_obj | default({})).stderr | default('') | lower)) or
                ('forbidden' in ((hop_failure_obj | default({})).msg | default('') | lower)))
            else ('FAILED at Hop ' ~ (hop_label | default('1/1')) ~ ': ' ~ (hop_target_version | default('target')) ~ ' — Upgrade sequence failure')
          }}

    - name: "Hop {{ hop_label }} — Trigger error handling and alert"
      include_role:
        name: error_handle

    - name: "Hop {{ hop_label }} — Tear down cluster session on failure"
      include_role:
        name: logout

    - name: "Hop {{ hop_label }} — Halt execution due to hop failure"
      fail:
        msg: >-
          Upgrade hop {{ hop_label }} ({{ hop_target_version }}) FAILED on cluster
          '{{ cluster_name | default('UNKNOWN') }}'. Alert dispatched. Session torn down.
