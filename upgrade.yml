# ============================================================================
# Global Upgrade Configuration & Auto-Remediation Controls
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Simple scalar, list, and dictionary values.
#
# Purpose: Defines the target cluster name, target sequential upgrade path,
#          per-cluster pre-configured paths, health check & capacity thresholds,
#          monitoring polling cadences, timeout limits, and feature toggles
#          for the one-touch automated remediation engine.
# Dependencies: None (base input configuration)
# Gate type: N/A
# ============================================================================

# Target cluster identifier (string, required).
# Can be set here, passed via CLI flag (--cluster <name>), or selected interactively.
cluster_name: ""

# Target sequential upgrade path (list of strings, e.g. ["4.14.40", "4.15.35"]).
# Must adhere to strict minor version sequential hops (never skip Y-stream versions).
upgrade_path: []

# Whether to bypass TLS certificate verification during cluster CLI login.
# Default is true because ARO and internal OpenShift API endpoints use internal/cluster CAs.
insecure_skip_tls_verify: true

# Pre-configured upgrade paths per cluster.
# Consumed by the CLI interactive menu to suggest default or recommended hop journeys.
cluster_upgrade_paths:
  cluster_d01:
    - "4.14.40"
    - "4.15.35"
    - "4.16.18"
  cluster_s01:
    - "4.14.40"
    - "4.15.35"
    - "4.16.18"
  cluster_p01:
    - "4.14.40"
    - "4.15.35"

# ----------------------------------------------------------------------------
# Health Check & Capacity Thresholds
# ----------------------------------------------------------------------------
# Maximum node CPU utilization percentage allowed before flagging a warning
max_cpu_percent: 90

# Maximum node memory utilization percentage allowed before flagging a warning
max_memory_percent: 90

# PodDisruptionBudget Health Check Policy (Check 12):
# Default: WARN advisory (audits zero-disruption PDBs for visibility without blocking).
# Strict: Set to true if zero-disruption PDBs should halt upgrades.
fail_on_zero_disruption_pdb: false

# Storage Volumes (PV/PVC) Health Check Policy:
# Enforced strictly as non-blocking WARN advisories (never a HARD gate).
pv_enforce_gate: false
pvc_enforce_gate: false


# ----------------------------------------------------------------------------
# Monitoring Cadences & Timeout Protection (Phase 04)
# ----------------------------------------------------------------------------
# Polling interval in minutes between clusterversion/MCP/node health queries
poll_interval_minutes: 2

# Maximum duration in minutes to wait for a single hop to reach settle-gate
hop_timeout_minutes: 90

# Cadence in minutes for dispatching progress heartbeat status emails
heartbeat_minutes: 20

# ----------------------------------------------------------------------------
# Auto-Remediation Engine Controls (One-Touch Automation)
# ----------------------------------------------------------------------------
# Master toggle: enables automated blocker detection and remediation
auto_remediation_enabled: true

# Tier 1 Auto-Fix: Automatically patch nodes.config/cluster to spec.cgroupMode: "v2"
# when upgrading to OpenShift 4.19 or higher if currently on cgroup v1.
auto_fix_cgroup_v2: true

# Tier 1 Auto-Fix: Dynamically extract pending admin acknowledgements from
# ClusterVersion conditions and apply them to openshift-config/admin-acks ConfigMap.
auto_apply_admin_acks: true

# Tier 1 Auto-Fix: Automatically unpause MachineConfigPools present in the allow-list.
auto_unpause_mcp: true

# Allow-list of MachineConfigPool names permitted for automated unpausing.
mcp_auto_unpause_list:
  - "worker"
  - "master"

# Tier 2 Guided: Attempt restart of degraded ClusterOperator pods during prevalidation
# (Default false; requires explicit cluster-level opt-in).
auto_restart_degraded_operators: false

# Tier 2 Guided: Force MachineConfigDaemon progress on stalled nodes via force file
# (Default false; requires explicit cluster-level opt-in).
auto_force_stalled_node: false

# Threshold in minutes a node can remain in updating state before being marked stalled
node_stall_threshold_minutes: 30

# Maximum retry attempts for failed OLM ClusterServiceVersion rollouts in Phase 06
operator_upgrade_retry_count: 1

# ----------------------------------------------------------------------------
# Transient Fault Tolerance & Command Retries
# ----------------------------------------------------------------------------
# Maximum retries for oc CLI queries to absorb transient network / API server hiccups
oc_command_retries: 3

# Delay in seconds between oc CLI retry attempts
oc_command_retry_delay: 10
