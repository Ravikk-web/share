---
# ============================================================================
# Task File: poll_csv_iteration.yml (roles/operator_upgrade)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: Uses short module names and set_fact; fully compatible.
#
# Purpose: Single polling iteration monitoring ClusterServiceVersion (CSV)
#          rollout progress. Evaluates phase, executes one-shot recovery on
#          failure, and sleeps before the next poll iteration.
# Dependencies: playbooks/roles/operator_upgrade/defaults/main.yml
# Gate type: HARD / Auto-Remediation
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Skip Guard & Dry-Run Bypass
# ----------------------------------------------------------------------------
- name: "operator_upgrade: Dry-run simulation bypass"
  set_fact:
    all_csvs_succeeded: true
  when:
    - not (all_csvs_succeeded | default(false) | bool)
    - dry_run | default(false) | bool

# ----------------------------------------------------------------------------
# 2. Query Live Cluster CSVs with jq v1.5
# ----------------------------------------------------------------------------
- name: "operator_upgrade: Query and parse live ClusterServiceVersions (Iteration {{ csv_poll_iteration }})"
  shell: |
    set -o pipefail
    oc get csv -A -o json 2>/dev/null | jq -c '
      [ .items[]? | {
          name: (.metadata.name // "unknown"),
          namespace: (.metadata.namespace // "unknown"),
          phase: (.status.phase // "Unknown"),
          reason: (.status.reason // ""),
          message: (.status.message // "")
        }
      ]
    ' || echo '[]'
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  register: live_csvs_parsed_raw
  changed_when: false
  failed_when: false
  retries: "{{ oc_command_retries | default(3) }}"
  delay: "{{ oc_command_retry_delay | default(10) }}"
  until: live_csvs_parsed_raw.rc == 0
  when: not (all_csvs_succeeded | default(false) | bool)

- name: "operator_upgrade: Normalize CSV status lists"
  set_fact:
    current_cluster_csvs: >-
      {{ ((live_csvs_parsed_raw.stdout | default('[]') | trim).split('\n') | first | from_json)
         if (live_csvs_parsed_raw.stdout | default('') | trim | length > 0)
         else [] }}
  when: not (all_csvs_succeeded | default(false) | bool)

- name: "operator_upgrade: Filter pending and failed CSVs"
  set_fact:
    non_succeeded_csvs: "{{ current_cluster_csvs | default([]) | rejectattr('phase', 'equalto', 'Succeeded') | list }}"
    failed_csvs: >-
      {{ current_cluster_csvs | default([]) | selectattr('phase', 'search', '(?i)fail') | list
         + (current_cluster_csvs | default([]) | selectattr('reason', 'equalto', 'InstallCheckFailed') | list) }}
  when: not (all_csvs_succeeded | default(false) | bool)

# ----------------------------------------------------------------------------
# 3. Check for Settle Completion
# ----------------------------------------------------------------------------
- name: "operator_upgrade: Mark all CSVs succeeded when zero pending CSVs"
  set_fact:
    all_csvs_succeeded: true
  when:
    - not (all_csvs_succeeded | default(false) | bool)
    - (non_succeeded_csvs | default([]) | length) == 0

- name: "operator_upgrade: Display settlement success confirmation"
  debug:
    msg: "All {{ current_cluster_csvs | default([]) | length }} ClusterServiceVersion(s) report phase 'Succeeded'."
  when:
    - all_csvs_succeeded | default(false) | bool
    - not (dry_run | default(false) | bool)

# ----------------------------------------------------------------------------
# 4. Tier 2 One-Shot Automated Recovery (Delete Failed CSV Once)
# Why: If a CSV fails or stalls with InstallCheckFailed, deleting the CSV
#      allows OLM Subscription controller to re-reconcile and re-deploy.
# ----------------------------------------------------------------------------
- name: "operator_upgrade: Identify recoverable failed CSVs"
  set_fact:
    csvs_to_recover: >-
      {{ failed_csvs | default([]) | rejectattr('name', 'in', (recovered_csvs | default([]))) | list }}
  when:
    - not (all_csvs_succeeded | default(false) | bool)
    - operator_auto_recover_csv | default(true) | bool
    - (failed_csvs | default([]) | length) > 0

- name: "operator_upgrade: Execute one-shot recovery deletion on stalled CSVs"
  shell: |
    set -o pipefail
    oc delete csv "{{ item.name }}" -n "{{ item.namespace }}" --wait=false 2>/dev/null || true
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ cluster_kubeconfig | default(playbook_dir ~ '/.kubeconfig-' ~ (cluster_name | default('default'))) }}"
  loop: "{{ csvs_to_recover | default([]) }}"
  register: csv_recovery_result
  changed_when: true
  when:
    - not (all_csvs_succeeded | default(false) | bool)
    - operator_auto_recover_csv | default(true) | bool
    - (csvs_to_recover | default([]) | length) > 0

- name: "operator_upgrade: Record recovered CSV names to prevent repeat deletions"
  set_fact:
    recovered_csvs: "{{ recovered_csvs | default([]) + (csvs_to_recover | default([]) | map(attribute='name') | list) }}"
    autofix_items: >-
      {{ autofix_items | default([]) + (csvs_to_recover | default([]) | map('regex_replace', '^.*$', '') | list) + [{
           'name': 'OLM CSV Rollout Recovery',
           'action': 'Deleted stalled CSV (' ~ (csvs_to_recover | default([]) | map(attribute='name') | join(', ')) ~ ') to trigger OLM re-reconciliation',
           'status': 'AUTO-FIXED',
           'reference': 'https://docs.openshift.com/container-platform/latest/operators/understanding/olm/olm-understanding-olm.html'
         }] }}
  when:
    - not (all_csvs_succeeded | default(false) | bool)
    - operator_auto_recover_csv | default(true) | bool
    - (csvs_to_recover | default([]) | length) > 0

- name: "operator_upgrade: Log one-shot recovery action to run log"
  lineinfile:
    path: "{{ log_dir | default(playbook_dir ~ '/logs') }}/{{ cluster_name | default('cluster') }}_{{ run_timestamp | default('current') }}.txt"
    line: "[{{ lookup('pipe', 'date +%Y-%m-%d\\ %H:%M:%S') }}] [AUTO-FIX] One-shot CSV recovery: Deleted failed CSV(s) [{{ csvs_to_recover | map(attribute='name') | join(', ') }}] to allow OLM subscription reconciliation."
    create: true
  failed_when: false
  when:
    - not (all_csvs_succeeded | default(false) | bool)
    - operator_auto_recover_csv | default(true) | bool
    - (csvs_to_recover | default([]) | length) > 0

# ----------------------------------------------------------------------------
# 5. Iteration Progress Notice & Sleep
# ----------------------------------------------------------------------------
- name: "operator_upgrade: Display iteration progress notice"
  debug:
    msg: "CSV Poll Iteration {{ csv_poll_iteration }}/{{ max_csv_poll_iterations }}: {{ non_succeeded_csvs | length }} CSV(s) pending ({{ non_succeeded_csvs | map(attribute='name') | join(', ') }}). Sleeping {{ operator_upgrade_poll_interval_seconds }}s..."
  when:
    - not (all_csvs_succeeded | default(false) | bool)
    - (csv_poll_iteration | int) < (max_csv_poll_iterations | int)

- name: "operator_upgrade: Sleep before next poll iteration"
  command: "sleep {{ operator_upgrade_poll_interval_seconds | default(15) }}"
  changed_when: false
  when:
    - not (all_csvs_succeeded | default(false) | bool)
    - (csv_poll_iteration | int) < (max_csv_poll_iterations | int)
