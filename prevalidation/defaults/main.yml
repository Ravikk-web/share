---
# ============================================================================
# Role Defaults: prevalidation (14-Check Contract Aggregator)
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No changes needed. Standard scalar and boolean defaults.
#
# Purpose: Defines configuration defaults, target version resolution, gate
#          enforcement switches, and evaluation thresholds for the 14-check
#          pre-upgrade validation contract.
# Dependencies: playbooks/vars/upgrade.yml, playbooks/vars/paths.yml
# Gate type: N/A (Role configuration defaults)
# ============================================================================

# Target cluster identifier (string, required)
# Passed via extra-vars, inventory, or vars/upgrade.yml
cluster_name: ""

# Target version for the upcoming upgrade hop (string, e.g. "4.15.35")
# Sourced from upgrade_path[0] if left empty
preval_target_version: ""

# Gate enforcement control for the aggregator role
# Set to false during initial 14-check scan so all checks execute and record
# their status in health_summary before gate evaluation and auto-remediation.
preval_enforce_gate: false

# Enable advisory warning evaluation for pending Certificate Signing Requests
preval_warn_on_pending_csrs: true

# Enable advisory warning evaluation for CrashLoopBackOff pods in core namespaces
preval_warn_on_pod_crashloops: true

# Transient fault tolerance query retry count for oc CLI commands
oc_command_retries: 3

# Transient fault tolerance query retry delay in seconds between attempts
oc_command_retry_delay: 10

# Namespace pattern list for critical platform pod health check (Check 13)
critical_namespace_prefix: "openshift-"
