---
# =============================================================================
# ARO Cluster Capacity Check - Main Playbook
# =============================================================================
# Compatible with: Ansible 2.7.17 | jq 1.5 | oc CLI
# Usage: ansible-playbook capacity_check.yml
# =============================================================================

# PLAY 1: Initialize
- name: "Initialize - Load variables and prepare environment"
  hosts: localhost
  connection: local
  gather_facts: yes

  tasks:
    - name: "Set global configuration facts"
      set_fact:
        report_dir: "./reports"
        warn_threshold: 85
        fail_threshold: 95
        alert_window: "6h"

    - name: "Load cluster inventory"
      include_vars:
        file: clusters.yml

    - name: "Load excluded namespaces"
      include_vars:
        file: exclude_namespaces.yml

    - name: "Set timestamp for report filenames"
      set_fact:
        report_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
        report_date: "{{ ansible_date_time.date }}"
        report_time: "{{ ansible_date_time.time }}"

    - name: "Initialize master results list"
      set_fact:
        master_results: []

    - name: "Create reports directory"
      file:
        path: "{{ report_dir }}"
        state: directory
        mode: '0755'

    - name: "Display execution info"
      debug:
        msg: |
          ===================================================
          ARO Cluster Capacity Check
          Time: {{ report_date }} {{ report_time }}
          Clusters: {{ clusters | length }}
          Alert Window: {{ alert_window }}
          Thresholds: WARN > {{ warn_threshold }}% | FAIL > {{ fail_threshold }}%
          ===================================================

# PLAY 2: Loop through clusters
- name: "Run capacity checks on all clusters"
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: "Run checks for each cluster"
      include_tasks: cluster_checks.yml
      with_items: "{{ clusters }}"
      loop_control:
        loop_var: cluster

# PLAY 3: Generate Reports
- name: "Generate capacity check reports"
  hosts: localhost
  connection: local
  gather_facts: no

  vars_files:
    - ./email_vars.yml

  tasks:
    - name: "Generate HTML report"
      copy:
        dest: "{{ report_dir }}/capacity_report_{{ report_timestamp }}.html"
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>ARO Cluster Capacity Report</title>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
          <style>
          :root{--primary:#0f172a;--accent:#0ea5e9;--pass:#10b981;--pass-bg:#ecfdf5;--warn:#f59e0b;--warn-bg:#fffbeb;--fail:#ef4444;--fail-bg:#fef2f2;--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--text-sec:#64748b}
          *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
          body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}
          .hdr{background:var(--primary);color:#fff;padding:28px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
          .hdr-l h1{font-size:22px;font-weight:700;letter-spacing:-.3px}.hdr-l p{font-size:13px;color:#94a3b8;margin-top:2px}
          .hdr-r{text-align:right;font-size:12px;color:#94a3b8;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
          .hdr-r .bdg{background:rgba(14,165,233,.15);color:var(--accent);border:1px solid rgba(14,165,233,.3);padding:3px 12px;border-radius:12px;font-size:11px;font-weight:600}
          .ctr{max-width:1200px;margin:0 auto;padding:24px 20px 40px}
          .exec{display:flex;gap:24px;margin-bottom:28px;flex-wrap:wrap;align-items:center}
          .stats{display:flex;gap:12px;flex:1;min-width:300px;flex-wrap:wrap}
          .sc{flex:1;min-width:120px;background:var(--card);border-radius:10px;padding:16px 18px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);border-top:3px solid var(--primary)}
          .sc.cp{border-top-color:var(--pass)}.sc.cw{border-top-color:var(--warn)}.sc.cf{border-top-color:var(--fail)}
          .sc .n{font-size:32px;font-weight:700;color:var(--primary)}.sc.cp .n{color:var(--pass)}.sc.cw .n{color:var(--warn)}.sc.cf .n{color:var(--fail)}
          .sc .l{font-size:10px;color:var(--text-sec);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
          .dnt{display:flex;align-items:center;justify-content:center}
          .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
          .dot-pass{background:var(--pass)}.dot-warn{background:var(--warn)}.dot-fail{background:var(--fail)}
          .cc{background:var(--card);border-radius:12px;margin-bottom:24px;box-shadow:0 1px 6px rgba(0,0,0,.06);overflow:hidden;border:1px solid var(--border)}
          .cc-h{background:var(--primary);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
          .cc-h h2{font-size:17px;font-weight:600}
          .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:16px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
          .pill-p{background:rgba(16,185,129,.15);color:#6ee7b7}.pill-w{background:rgba(245,158,11,.15);color:#fcd34d}.pill-f{background:rgba(239,68,68,.15);color:#fca5a5}
          .cc-m{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:#f1f5f9;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;font-size:12px;color:var(--text-sec)}
          .cc-m strong{color:var(--text)}.mc{display:flex;gap:14px;font-weight:600;font-size:12px}
          .mc-p{color:var(--pass)}.mc-w{color:var(--warn)}.mc-f{color:var(--fail)}
          .tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px 24px}
          .tl{background:#f8fafc;border-radius:8px;padding:10px 14px;border-left:3px solid var(--border);display:flex;align-items:center;gap:8px}
          .tl-p{border-left-color:var(--pass)}.tl-w{border-left-color:var(--warn)}.tl-f{border-left-color:var(--fail)}
          .tl-lb{font-size:11px;color:var(--text-sec);flex:1}.tl-st{font-size:11px;font-weight:700}
          .ts-p{color:var(--pass)}.ts-w{color:var(--warn)}.ts-f{color:var(--fail)}
          .cc-b{padding:8px 24px 20px}
          .sec{margin-bottom:10px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
          .sec summary{display:flex;align-items:center;cursor:pointer;padding:12px 16px;font-size:13px;font-weight:600;color:var(--text);background:#fafbfc;list-style:none;user-select:none}
          .sec summary::-webkit-details-marker{display:none}
          .sec summary .tg-i{width:18px;height:18px;margin-right:10px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-sec);transition:transform .2s}
          .sec[open] summary .tg-i{transform:rotate(90deg)}
          .sec summary .st{flex:1}.sec summary .sb{font-size:10px;padding:2px 10px;border-radius:10px;font-weight:700;letter-spacing:.3px}
          .sb-p{background:var(--pass-bg);color:#065f46}.sb-w{background:var(--warn-bg);color:#92400e}.sb-f{background:var(--fail-bg);color:#991b1b}
          table{width:100%;border-collapse:collapse;font-size:12.5px}
          thead th{background:var(--primary);color:#fff;padding:9px 14px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
          thead th:first-child{width:36px;text-align:center}
          tbody td{padding:9px 14px;border-bottom:1px solid #f1f5f9;vertical-align:top}
          tbody tr:hover{background:#f8fafc}tbody td:first-child{text-align:center;color:#94a3b8;font-weight:600}
          .st-pass{color:var(--pass);font-weight:700}.st-warn{color:var(--warn);font-weight:700}.st-fail{color:var(--fail);font-weight:700}
          .dt{color:var(--text-sec);font-size:12px;word-break:break-word}
          .ar-c{background:var(--fail-bg)}.ar-c:hover{background:#fee2e2}.ar-w{background:var(--warn-bg)}.ar-w:hover{background:#fef3c7}
          .sv{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
          .sv-c{background:#fee2e2;color:#991b1b}.sv-w{background:#fef3c7;color:#92400e}
          .as td{padding:0;height:2px;background:linear-gradient(90deg,var(--fail) 0%,var(--warn) 100%)}
          .na{padding:20px;text-align:center;color:var(--pass);font-weight:600;font-size:13px}
          /* Graph toggle */
          .gtg{display:flex;align-items:center;gap:8px;padding:10px 16px;margin:8px 0;cursor:pointer;background:#f1f5f9;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;color:var(--text-sec);transition:all .2s;user-select:none}
          .gtg:hover{background:#e2e8f0;color:var(--text)}
          .gtg .chv{transition:transform .3s;font-size:10px;display:inline-block}
          .gtg.open .chv{transform:rotate(180deg)}
          .gw{display:none;flex-wrap:wrap;gap:16px;padding:12px 0}
          .gw.vis{display:flex}
          .gi{text-align:center}.gi .gl{font-size:10px;color:var(--text-sec);margin-top:4px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          /* Sub-tables */
          .sub-sec{margin:12px 0;border-left:3px solid var(--accent);padding-left:12px}
          .sub-sec h4{font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px}
          .sub-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}
          .sub-tbl thead th{background:#f1f5f9;color:var(--text);padding:7px 10px;font-size:10px;border-bottom:2px solid var(--border)}
          .sub-tbl tbody td{padding:6px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
          .sub-tbl .nw-row{background:var(--warn-bg)}.sub-tbl .nf-row{background:var(--fail-bg)}
          .sub-tbl .node-nm{font-family:'SF Mono',Consolas,monospace;font-size:11px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          /* Pct bar */
          .pbar{display:flex;align-items:center;gap:8px;min-width:120px}
          .pbar-bg{flex:1;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;min-width:60px}
          .pbar-fill{height:100%;border-radius:3px;transition:width .3s}
          .pbar-txt{font-size:11px;font-weight:700;min-width:36px;text-align:right}
          /* Status badge */
          .st-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.3px}
          .st-badge-ok{background:var(--pass-bg);color:#065f46}.st-badge-warn{background:var(--warn-bg);color:#92400e}.st-badge-fail{background:var(--fail-bg);color:#991b1b}
          /* Copy button */
          .cp-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;transition:all .15s;flex-shrink:0}
          .cp-btn:hover{background:var(--accent);border-color:var(--accent)}.cp-btn:hover svg{stroke:#fff}
          .cp-btn svg{width:13px;height:13px;stroke:var(--text-sec);stroke-width:2;fill:none}
          .cp-btn.ok{background:var(--pass);border-color:var(--pass)}.cp-btn.ok svg{stroke:#fff}
          /* Issues summary */
          .issues-hdr{font-size:12px;font-weight:700;color:var(--fail);margin:12px 0 6px;padding:8px 12px;background:var(--fail-bg);border-radius:6px;display:flex;align-items:center;gap:6px}
          /* Pod sub-table */
          .pod-wrap{margin-top:8px}
          .ft{background:var(--primary);color:#94a3b8;text-align:center;padding:18px;font-size:11px;border-radius:10px;margin-top:8px;line-height:1.8}.ft strong{color:#e2e8f0}
          @media(max-width:768px){.tg{grid-template-columns:repeat(2,1fr)}.exec{flex-direction:column}.hdr{flex-direction:column;text-align:center}.hdr-r{align-items:center}}
          @media print{body{background:#fff;font-size:11px}.hdr{padding:16px 20px}.cc{break-inside:avoid;box-shadow:none}.sec{break-inside:avoid}.sc,.cc{box-shadow:none;border:1px solid #ddd}.gw{display:flex!important}}
          </style>
          </head>
          <body>

          <div class="hdr">
            <div class="hdr-l">
              <h1>ARO Cluster Capacity Report</h1>
              <p>Infrastructure Health &amp; Capacity Assessment</p>
            </div>
            <div class="hdr-r">
              <span>{{ report_date }} {{ report_time }}</span>
              <span>Prepared by: <strong style="color:#e2e8f0">MSP_Openshift</strong></span>
              <span class="bdg">Alert Window: {{ alert_window }}</span>
            </div>
          </div>

          <div class="ctr">

          {% set total_cl = master_results | length %}
          {% set pass_cl = master_results | selectattr('overall_status','equalto','PASS') | list | length %}
          {% set warn_cl = master_results | selectattr('overall_status','equalto','WARN') | list | length %}
          {% set fail_cl = master_results | selectattr('overall_status','equalto','FAIL') | list | length %}

          <div class="exec">
            <div class="stats">
              <div class="sc"><div class="n">{{ total_cl }}</div><div class="l">Total Clusters</div></div>
              <div class="sc cp"><div class="n">{{ pass_cl }}</div><div class="l">Passed</div></div>
              <div class="sc cw"><div class="n">{{ warn_cl }}</div><div class="l">Warnings</div></div>
              <div class="sc cf"><div class="n">{{ fail_cl }}</div><div class="l">Failed</div></div>
            </div>
            <div class="dnt">
              {% if total_cl > 0 %}
              {% set circ = 238.76 %}
              {% set p_a = (pass_cl * circ / total_cl) | round(2) %}
              {% set w_a = (warn_cl * circ / total_cl) | round(2) %}
              {% set f_a = (fail_cl * circ / total_cl) | round(2) %}
              <svg viewBox="0 0 100 100" width="140" height="140">
                <circle cx="50" cy="50" r="38" fill="none" stroke="#e2e8f0" stroke-width="12"/>
                {% if pass_cl > 0 %}<circle cx="50" cy="50" r="38" fill="none" stroke="var(--pass)" stroke-width="12" stroke-dasharray="{{ p_a }} {{ circ }}" stroke-dashoffset="0" transform="rotate(-90 50 50)" stroke-linecap="round"/>{% endif %}
                {% if warn_cl > 0 %}<circle cx="50" cy="50" r="38" fill="none" stroke="var(--warn)" stroke-width="12" stroke-dasharray="{{ w_a }} {{ circ }}" stroke-dashoffset="-{{ p_a }}" transform="rotate(-90 50 50)" stroke-linecap="round"/>{% endif %}
                {% if fail_cl > 0 %}<circle cx="50" cy="50" r="38" fill="none" stroke="var(--fail)" stroke-width="12" stroke-dasharray="{{ f_a }} {{ circ }}" stroke-dashoffset="-{{ p_a + w_a }}" transform="rotate(-90 50 50)" stroke-linecap="round"/>{% endif %}
                <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="var(--primary)" font-family="Inter,sans-serif">{{ total_cl }}</text>
              </svg>
              {% endif %}
            </div>
          </div>

          {% for cl in master_results %}
          {% set checks = cl.checks %}
          {% set pc = [] %}{% set wc = [] %}{% set fc = [] %}
          {% for c in checks %}{% if c.weight == 'PASS' %}{% if pc.append(1) %}{% endif %}{% elif c.weight == 'WARN' %}{% if wc.append(1) %}{% endif %}{% else %}{% if fc.append(1) %}{% endif %}{% endif %}{% endfor %}

          <div class="cc">
            <div class="cc-h">
              <h2>{{ cl.cluster_name }}</h2>
              <span class="pill {% if cl.overall_status == 'PASS' %}pill-p{% elif cl.overall_status == 'WARN' %}pill-w{% else %}pill-f{% endif %}">
                <span class="dot {% if cl.overall_status == 'PASS' %}dot-pass{% elif cl.overall_status == 'WARN' %}dot-warn{% else %}dot-fail{% endif %}"></span>{{ cl.overall_status }}
              </span>
            </div>

            <div class="cc-m">
              <div><strong>API:</strong> {{ cl.api_url }} &middot; <strong>OCP:</strong> {{ cl.ocp_version }}</div>
              <div class="mc">
                <span class="mc-p"><span class="dot dot-pass"></span>{{ pc | length }} Pass</span>
                <span class="mc-w"><span class="dot dot-warn"></span>{{ wc | length }} Warn</span>
                <span class="mc-f"><span class="dot dot-fail"></span>{{ fc | length }} Fail</span>
              </div>
            </div>

            {% set _s1 = [checks[0].status, checks[1].status] %}{% set _r1 = 'FAIL' if 'FAIL' in _s1 else ('WARN' if 'WARN' in _s1 else 'PASS') %}
            {% set _r2 = checks[2].status %}
            {% set _r3 = checks[3].status %}
            {% set _r4 = checks[4].status %}
            {% set _s5 = [checks[5].status, checks[6].status] %}{% set _r5 = 'FAIL' if 'FAIL' in _s5 else ('WARN' if 'WARN' in _s5 else 'PASS') %}
            {% set _s6 = [checks[7].status, checks[8].status, checks[9].status, checks[10].status] %}{% set _r6 = 'FAIL' if 'FAIL' in _s6 else ('WARN' if 'WARN' in _s6 else 'PASS') %}
            {% set _s7 = [checks[11].status, checks[12].status] %}{% set _r7 = 'FAIL' if 'FAIL' in _s7 else ('WARN' if 'WARN' in _s7 else 'PASS') %}
            {% set _s8 = [checks[13].status, checks[14].status] %}{% set _r8 = 'FAIL' if 'FAIL' in _s8 else ('WARN' if 'WARN' in _s8 else 'PASS') %}

            <div class="tg">
              {% for tile in [('Cluster', _r1), ('Control Plane', _r2), ('Operators', _r3), ('Alerts', _r4), ('Nodes', _r5), ('Resources', _r6), ('Workloads', _r7), ('Storage', _r8)] %}
              <div class="tl tl-{{ tile[1] | lower }}">
                <span class="dot dot-{{ tile[1] | lower }}"></span>
                <span class="tl-lb">{{ tile[0] }}</span>
                <span class="tl-st ts-{{ tile[1] | lower }}">{{ tile[1] }}</span>
              </div>
              {% endfor %}
            </div>

            <div class="cc-b">

              <!-- Section 1: Cluster Health - OPEN by default -->
              {% set sa = [checks[0], checks[1], checks[2], checks[3]] %}
              {% set sa_st = sa | map(attribute='status') | list %}
              {% set sa_s = 'FAIL' if 'FAIL' in sa_st else ('WARN' if 'WARN' in sa_st else 'PASS') %}
              <details class="sec" open>
                <summary><span class="tg-i">&#9654;</span><span class="st">Cluster Health</span><span class="sb sb-{{ sa_s | lower }}">{{ sa_s }}</span></summary>
                <table><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Details</th></tr></thead><tbody>
                {% for c in sa %}
                <tr><td>{{ loop.index }}</td><td>{{ c.check_name }}</td><td class="st-{{ c.status | lower }}"><span class="dot dot-{{ c.status | lower }}"></span>{{ c.status }}</td><td><span class="dt">{{ c.details }}</span></td></tr>
                {% endfor %}
                </tbody></table>
              </details>

              <!-- Section 2: Alerts - COLLAPSED -->
              {% set alerts = cl.alerts | default([]) %}
              {% set ca = [] %}{% set wa = [] %}
              {% for a in alerts %}{% if a.severity == 'critical' %}{% if ca.append(a) %}{% endif %}{% elif a.severity == 'warning' %}{% if wa.append(a) %}{% endif %}{% endif %}{% endfor %}
              {% set al_s = 'FAIL' if ca | length > 0 else ('WARN' if wa | length > 0 else 'PASS') %}
              <details class="sec">
                <summary><span class="tg-i">&#9654;</span><span class="st">Alerts ({{ ca | length }} Critical, {{ wa | length }} Warning)</span><span class="sb sb-{{ al_s | lower }}">{{ al_s }}</span></summary>
                {% if alerts | length == 0 %}
                <div class="na"><span class="dot dot-pass"></span> No active critical or warning alerts</div>
                {% else %}
                <table><thead><tr><th>#</th><th>Alert Name</th><th>Severity</th><th>Namespace</th><th>Description</th></tr></thead><tbody>
                {% set ri = [0] %}
                {% for a in ca %}{% if ri.append(ri.pop() + 1) %}{% endif %}
                <tr class="ar-c"><td>{{ ri[0] }}</td><td><strong>{{ a.alertname }}</strong></td><td style="text-align:center"><span class="sv sv-c"><span class="dot dot-fail"></span>CRITICAL</span></td><td><span class="dt">{{ a.namespace }}</span></td><td><span class="dt">{{ a.description }}</span></td></tr>
                {% endfor %}
                {% if ca | length > 0 and wa | length > 0 %}<tr class="as"><td colspan="5"></td></tr>{% endif %}
                {% for a in wa %}{% if ri.append(ri.pop() + 1) %}{% endif %}
                <tr class="ar-w"><td>{{ ri[0] }}</td><td><strong>{{ a.alertname }}</strong></td><td style="text-align:center"><span class="sv sv-w"><span class="dot dot-warn"></span>WARNING</span></td><td><span class="dt">{{ a.namespace }}</span></td><td><span class="dt">{{ a.description }}</span></td></tr>
                {% endfor %}
                </tbody></table>
                {% endif %}
              </details>

              <!-- Section 3: Node Health - COLLAPSED -->
              {% set sb = [checks[5], checks[6]] %}
              {% set sb_st = sb | map(attribute='status') | list %}
              {% set sb_s = 'FAIL' if 'FAIL' in sb_st else ('WARN' if 'WARN' in sb_st else 'PASS') %}
              <details class="sec">
                <summary><span class="tg-i">&#9654;</span><span class="st">Node Health</span><span class="sb sb-{{ sb_s | lower }}">{{ sb_s }}</span></summary>
                <table><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Details</th></tr></thead><tbody>
                {% for c in sb %}
                <tr><td>{{ loop.index + 5 }}</td><td>{{ c.check_name }}</td><td class="st-{{ c.status | lower }}"><span class="dot dot-{{ c.status | lower }}"></span>{{ c.status }}</td><td><span class="dt">{{ c.details }}</span></td></tr>
                {% endfor %}
                </tbody></table>
              </details>

              <!-- Section 4: Resource Utilization - COLLAPSED, with gauge toggle + sub-tables -->
              {% set sc = [checks[7], checks[8], checks[9], checks[10]] %}
              {% set sc_st = sc | map(attribute='status') | list %}
              {% set sc_s = 'FAIL' if 'FAIL' in sc_st else ('WARN' if 'WARN' in sc_st else 'PASS') %}
              <details class="sec">
                <summary><span class="tg-i">&#9654;</span><span class="st">Resource Utilization</span><span class="sb sb-{{ sc_s | lower }}">{{ sc_s }}</span></summary>
                <div class="res-wrap"
                  data-c8="{{ checks[7].details }}" data-c8n="{{ checks[7].check_name }}" data-c8s="{{ checks[7].status }}"
                  data-c9="{{ checks[8].details }}" data-c9n="{{ checks[8].check_name }}" data-c9s="{{ checks[8].status }}"
                  data-c10="{{ checks[9].details }}" data-c10n="{{ checks[9].check_name }}" data-c10s="{{ checks[9].status }}"
                  data-c11="{{ checks[10].details }}" data-c11n="{{ checks[10].check_name }}" data-c11s="{{ checks[10].status }}">
                  <table><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Summary</th></tr></thead><tbody>
                  {% for c in sc %}
                  <tr><td>{{ loop.index + 7 }}</td><td>{{ c.check_name }}</td><td class="st-{{ c.status | lower }}"><span class="dot dot-{{ c.status | lower }}"></span>{{ c.status }}</td><td><span class="dt res-summary" data-raw="{{ c.details }}">{{ c.status }}</span></td></tr>
                  {% endfor %}
                  </tbody></table>
                  <div class="gtg" onclick="toggleGraphs(this)"><span class="chv">&#9660;</span> Show Gauges</div>
                  <div class="gw"></div>
                  <div class="res-subtables"></div>
                  <div class="res-issues"></div>
                </div>
              </details>

              <!-- Section 5: Workload Health - COLLAPSED, with pod sub-table -->
              {% set sd = [checks[11], checks[12]] %}
              {% set sd_st = sd | map(attribute='status') | list %}
              {% set sd_s = 'FAIL' if 'FAIL' in sd_st else ('WARN' if 'WARN' in sd_st else 'PASS') %}
              <details class="sec">
                <summary><span class="tg-i">&#9654;</span><span class="st">Workload Health</span><span class="sb sb-{{ sd_s | lower }}">{{ sd_s }}</span></summary>
                <table><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Details</th></tr></thead><tbody>
                {% for c in sd %}
                <tr><td>{{ loop.index + 11 }}</td><td>{{ c.check_name }}</td><td class="st-{{ c.status | lower }}"><span class="dot dot-{{ c.status | lower }}"></span>{{ c.status }}</td><td><span class="dt">{{ c.details }}</span></td></tr>
                {% endfor %}
                </tbody></table>
                {% if checks[11].status == 'FAIL' %}
                <div class="pod-wrap" data-pods="{{ checks[11].details }}"></div>
                {% endif %}
                {% if checks[12].status != 'PASS' %}
                <div class="pod-wrap" data-pods="{{ checks[12].details }}"></div>
                {% endif %}
              </details>

              <!-- Section 6: Storage - OPEN by default -->
              {% set se = [checks[13], checks[14]] %}
              {% set se_st = se | map(attribute='status') | list %}
              {% set se_s = 'FAIL' if 'FAIL' in se_st else ('WARN' if 'WARN' in se_st else 'PASS') %}
              <details class="sec" open>
                <summary><span class="tg-i">&#9654;</span><span class="st">Storage</span><span class="sb sb-{{ se_s | lower }}">{{ se_s }}</span></summary>
                <table><thead><tr><th>#</th><th>Check</th><th>Status</th><th>Details</th></tr></thead><tbody>
                {% for c in se %}
                <tr><td>{{ loop.index + 13 }}</td><td>{{ c.check_name }}</td><td class="st-{{ c.status | lower }}"><span class="dot dot-{{ c.status | lower }}"></span>{{ c.status }}</td><td><span class="dt">{{ c.details }}</span></td></tr>
                {% endfor %}
                </tbody></table>
              </details>

            </div>
          </div>
          {% endfor %}

          <div class="ft">
            Generated by <strong>ARO Capacity Check Automation</strong><br>
            Thresholds: <strong>WARN &gt; {{ warn_threshold }}%</strong> | <strong>FAIL &gt; {{ fail_threshold }}%</strong> | Alert Window: <strong>{{ alert_window }}</strong><br>
            Prepared by: <strong>MSP_Openshift</strong>
          </div>

          </div>

          <script>
          var cpIco='<svg viewBox="0 0 24 24"><rect x="9" y="2" width="11" height="15" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9"/></svg>';
          var okIco='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

          function copyName(btn,txt){
            if(navigator.clipboard){navigator.clipboard.writeText(txt)}else{var t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t)}
            btn.classList.add('ok');btn.innerHTML=okIco;setTimeout(function(){btn.classList.remove('ok');btn.innerHTML=cpIco},1500);
          }

          function toggleGraphs(btn){
            var gw=btn.parentElement.querySelector('.gw');
            if(gw.classList.contains('vis')){gw.classList.remove('vis');btn.classList.remove('open');btn.innerHTML='<span class="chv">&#9660;</span> Show Gauges'}
            else{gw.classList.add('vis');btn.classList.add('open');btn.innerHTML='<span class="chv">&#9660;</span> Hide Gauges'}
          }

          function parseNodes(raw){
            var nodes=[],re=/([^:;]+):\s*(\d+)%\s*\[(\w+)\]/g,m;
            while((m=re.exec(raw))!==null){
              var nm=m[1].replace(/^(CPU|Memory)\s+(Requests|Actual)\s*-\s*/i,'').trim();
              nodes.push({name:nm,pct:parseInt(m[2],10),status:m[3]});
            }
            nodes.sort(function(a,b){var o={FAIL:0,WARN:1,OK:2};return(o[a.status]||2)-(o[b.status]||2)});
            return nodes;
          }

          function pctColor(p){return p>95?'var(--fail)':(p>85?'var(--warn)':'var(--pass)')}
          function stClass(s){return s==='FAIL'?'st-badge-fail':(s==='WARN'?'st-badge-warn':'st-badge-ok')}
          function rowClass(s){return s==='FAIL'?'nf-row':(s==='WARN'?'nw-row':'')}

          function buildSubTable(title,status,nodes){
            if(!nodes.length)return '';
            var h='<div class="sub-sec"><h4><span class="dot dot-'+status.toLowerCase()+'"></span>'+title+'</h4>';
            h+='<table class="sub-tbl"><thead><tr><th style="width:40px">#</th><th>Node Name</th><th style="width:160px">Usage</th><th style="width:60px">Status</th><th style="width:40px"></th></tr></thead><tbody>';
            for(var i=0;i<nodes.length;i++){
              var n=nodes[i],clr=pctColor(n.pct),pw=Math.min(n.pct,100);
              h+='<tr class="'+rowClass(n.status)+'"><td style="text-align:center;color:#94a3b8">'+(i+1)+'</td>';
              h+='<td class="node-nm" title="'+n.name+'">'+n.name+'</td>';
              h+='<td><div class="pbar"><div class="pbar-bg"><div class="pbar-fill" style="width:'+pw+'%;background:'+clr+'"></div></div><span class="pbar-txt" style="color:'+clr+'">'+n.pct+'%</span></div></td>';
              h+='<td><span class="st-badge '+stClass(n.status)+'">'+n.status+'</span></td>';
              h+='<td><button class="cp-btn" onclick="copyName(this,\''+n.name.replace(/'/g,"\\'")+'\')">'+cpIco+'</button></td></tr>';
            }
            h+='</tbody></table></div>';
            return h;
          }

          function buildGauges(allNodes){
            var h='';
            for(var i=0;i<allNodes.length;i++){
              var n=allNodes[i],clr=pctColor(n.pct),ci=2*Math.PI*22,arc=(Math.min(n.pct,100)/100)*ci;
              h+='<div class="gi"><svg viewBox="0 0 56 56" width="56" height="56">';
              h+='<circle cx="28" cy="28" r="22" fill="none" stroke="#e2e8f0" stroke-width="6"/>';
              h+='<circle cx="28" cy="28" r="22" fill="none" stroke="'+clr+'" stroke-width="6" stroke-dasharray="'+arc.toFixed(1)+' '+ci.toFixed(1)+'" transform="rotate(-90 28 28)" stroke-linecap="round"/>';
              h+='<text x="28" y="28" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="'+clr+'" font-family="Inter,sans-serif">'+n.pct+'%</text>';
              h+='</svg><div class="gl" title="'+n.name+'">'+n.name+'</div></div>';
            }
            return h;
          }

          document.addEventListener('DOMContentLoaded',function(){
            // Resource Utilization
            var rws=document.querySelectorAll('.res-wrap');
            for(var r=0;r<rws.length;r++){
              var el=rws[r];
              var checkData=[
                {key:'c8',details:el.getAttribute('data-c8'),name:el.getAttribute('data-c8n'),status:el.getAttribute('data-c8s')},
                {key:'c9',details:el.getAttribute('data-c9'),name:el.getAttribute('data-c9n'),status:el.getAttribute('data-c9s')},
                {key:'c10',details:el.getAttribute('data-c10'),name:el.getAttribute('data-c10n'),status:el.getAttribute('data-c10s')},
                {key:'c11',details:el.getAttribute('data-c11'),name:el.getAttribute('data-c11n'),status:el.getAttribute('data-c11s')}
              ];
              var allGaugeNodes=[],subH='',issueNodes=[];
              // Summary cells
              var sums=el.querySelectorAll('.res-summary');
              for(var s=0;s<checkData.length;s++){
                var nodes=parseNodes(checkData[s].details||'');
                var fC=0,wC=0,oC=0;
                for(var n=0;n<nodes.length;n++){
                  if(nodes[n].status==='FAIL')fC++;else if(nodes[n].status==='WARN')wC++;else oC++;
                  allGaugeNodes.push(nodes[n]);
                  if(nodes[n].status==='FAIL'||nodes[n].status==='WARN'){issueNodes.push({node:nodes[n].name,check:checkData[s].name,pct:nodes[n].pct,status:nodes[n].status})}
                }
                var sumTxt='';
                if(fC>0)sumTxt+=fC+' FAIL ';if(wC>0)sumTxt+=wC+' WARN ';sumTxt+=oC+' OK';
                if(sums[s])sums[s].textContent=sumTxt;
                subH+=buildSubTable(checkData[s].name,checkData[s].status,nodes);
              }
              // Gauges
              var gw=el.querySelector('.gw');if(gw)gw.innerHTML=buildGauges(allGaugeNodes);
              // Sub-tables
              var stEl=el.querySelector('.res-subtables');if(stEl)stEl.innerHTML=subH;
              // Consolidated issues
              if(issueNodes.length>0){
                var iH='<div class="issues-hdr"><span class="dot dot-fail"></span> '+issueNodes.length+' Node(s) with WARN/FAIL across all resource checks</div>';
                iH+='<table class="sub-tbl"><thead><tr><th style="width:40px">#</th><th>Node</th><th>Check</th><th style="width:100px">Usage</th><th style="width:60px">Status</th><th style="width:40px"></th></tr></thead><tbody>';
                for(var i=0;i<issueNodes.length;i++){
                  var ni=issueNodes[i],clr=pctColor(ni.pct),pw=Math.min(ni.pct,100);
                  iH+='<tr class="'+rowClass(ni.status)+'"><td style="text-align:center;color:#94a3b8">'+(i+1)+'</td>';
                  iH+='<td class="node-nm" title="'+ni.node+'">'+ni.node+'</td><td>'+ni.check+'</td>';
                  iH+='<td><div class="pbar"><div class="pbar-bg"><div class="pbar-fill" style="width:'+pw+'%;background:'+clr+'"></div></div><span class="pbar-txt" style="color:'+clr+'">'+ni.pct+'%</span></div></td>';
                  iH+='<td><span class="st-badge '+stClass(ni.status)+'">'+ni.status+'</span></td>';
                  iH+='<td><button class="cp-btn" onclick="copyName(this,\''+ni.node.replace(/'/g,"\\'")+'\')">'+cpIco+'</button></td></tr>';
                }
                iH+='</tbody></table>';
                var isEl=el.querySelector('.res-issues');if(isEl)isEl.innerHTML=iH;
              }
            }

            // Pod Health sub-tables
            var pws=document.querySelectorAll('.pod-wrap[data-pods]');
            for(var p=0;p<pws.length;p++){
              var raw=pws[p].getAttribute('data-pods')||'';
              var pods=[],re2=/([^\s;]+\/[^\s;(]+)\s*\(([^)]+)\)/g,m2;
              while((m2=re2.exec(raw))!==null){pods.push({name:m2[1].trim(),status:m2[2].trim()})}
              if(!pods.length)continue;
              var h='<div class="sub-sec" style="margin:12px 16px"><h4><span class="dot dot-fail"></span> Problematic Pods ('+pods.length+')</h4>';
              h+='<table class="sub-tbl"><thead><tr><th style="width:40px">#</th><th>Namespace / Pod</th><th style="width:120px">Status</th><th style="width:40px"></th></tr></thead><tbody>';
              for(var i=0;i<pods.length;i++){
                h+='<tr class="nf-row"><td style="text-align:center;color:#94a3b8">'+(i+1)+'</td>';
                h+='<td class="node-nm" title="'+pods[i].name+'">'+pods[i].name+'</td>';
                h+='<td><span class="st-badge st-badge-fail">'+pods[i].status+'</span></td>';
                h+='<td><button class="cp-btn" onclick="copyName(this,\''+pods[i].name.replace(/'/g,"\\'")+'\')">'+cpIco+'</button></td></tr>';
              }
              h+='</tbody></table></div>';
              pws[p].innerHTML=h;
            }
          });
          </script>

          </body>
          </html>

    # =========================================================================
    # CSV Report
    # =========================================================================
    - name: "Generate CSV report"
      copy:
        dest: "{{ report_dir }}/capacity_report_{{ report_timestamp }}.csv"
        content: |
          Cluster Name,API URL,OCP Version,Overall Status,Check Name,Check Status,Details
          {% for cluster in master_results %}{% for check in cluster.checks %}
          "{{ cluster.cluster_name }}","{{ cluster.api_url }}","{{ cluster.ocp_version }}","{{ cluster.overall_status }}","{{ check.check_name }}","{{ check.status }}","{{ check.details | replace('"', '""') }}"
          {% endfor %}{% endfor %}

    # =========================================================================
    # Final Summary
    # =========================================================================
    - name: "Display report locations"
      debug:
        msg: |
          ===================================================
          Reports Generated Successfully!
          HTML: {{ report_dir }}/capacity_report_{{ report_timestamp }}.html
          CSV:  {{ report_dir }}/capacity_report_{{ report_timestamp }}.csv
          ===================================================

    - name: "Display cluster summary"
      debug:
        msg: >-
          {{ item.cluster_name }} ({{ item.api_url }}) - OCP {{ item.ocp_version }} - Overall: {{ item.overall_status }}
      with_items: "{{ master_results }}"

    # =========================================================================
    # Send Email and delete Logs
    # =========================================================================
    - name: "Send Email"
      include_role: 
         name: sendmail

    - name: "Delete the Logs"
      file:
        path: "{{ report_dir }}"
        state: absent
