---
# =============================================================================
# Per-Cluster Health Check Tasks (15 Checks)
# Compatible with: Ansible 2.7.17 | jq 1.5 | oc CLI
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# STEP 1: Login to cluster
# ─────────────────────────────────────────────────────────────────────────────
- name: "{{ cluster.name }} | Login to cluster"
  shell: |
    /usr/local/bin/oc login \
      --username="{{ cluster.username }}" \
      --password="{{ cluster.password }}" \
      "{{ cluster.api_url }}" \
      --insecure-skip-tls-verify=true 2>&1
  args:
    executable: /bin/bash
  register: login_result
  ignore_errors: false    # make it true if you would like to ignore login failure
  no_log: yes
  changed_when: "'Login successful' in login_result.stdout"


- name: "{{ cluster.name }} | Record login failure"
  set_fact:
    master_results: >-
      {{ master_results + [{
        'cluster_name': cluster.name,
        'api_url': cluster.api_url,
        'ocp_version': 'N/A',
        'overall_status': 'FAIL',
        'alerts': [],
        'checks': [{
          'check_name': 'Cluster Login',
          'status': 'FAIL',
          'details': 'Unable to login. Verify credentials and API URL.'
        }]
      }] }}
  when: login_result.rc is defined and login_result.rc != 0

- block:

    - name: "{{ cluster.name }} | Get cluster version"
      shell: |
        timeout 30s oc get clusterversion version -o json 2>/dev/null \
          | jq -r '.status.desired.version // "unknown"' 2>/dev/null || echo "unknown"
      args:
        executable: /bin/bash
      register: cluster_version_raw
      ignore_errors: yes

    - name: "{{ cluster.name }} | Set cluster version fact"
      set_fact:
        cluster_version: "{{ cluster_version_raw.stdout | default('unknown') | trim }}"

    - name: "{{ cluster.name }} | Initialize cluster checks and alerts"
      set_fact:
        cluster_checks: []
        cluster_alerts: []

    # CHECK 1: ClusterVersion Status
    - name: "{{ cluster.name }} | Check 1 - ClusterVersion Status"
      shell: |
        CV_JSON=$(timeout 30s oc get clusterversion version -o json 2>/dev/null)
        if [ $? -ne 0 ] || [ -z "$CV_JSON" ]; then
          echo "FAIL:::Unable to retrieve ClusterVersion"; exit 0
        fi
        AVAILABLE=$(echo "$CV_JSON" | jq -r '[.status.conditions[] | select(.type=="Available")][0].status // "Unknown"' 2>/dev/null || echo "Unknown")
        DEGRADED=$(echo "$CV_JSON" | jq -r '[.status.conditions[] | select(.type=="Degraded")][0].status // "Unknown"' 2>/dev/null || echo "Unknown")
        PROGRESSING=$(echo "$CV_JSON" | jq -r '[.status.conditions[] | select(.type=="Progressing")][0].status // "Unknown"' 2>/dev/null || echo "Unknown")
        VERSION=$(echo "$CV_JSON" | jq -r '.status.desired.version // "unknown"' 2>/dev/null || echo "unknown")
        DETAILS="Version: ${VERSION} | Available: ${AVAILABLE} | Degraded: ${DEGRADED} | Progressing: ${PROGRESSING}"
        if [ "$AVAILABLE" = "True" ] && [ "$DEGRADED" != "True" ]; then echo "PASS:::${DETAILS}"; else echo "FAIL:::${DETAILS}"; fi
      args:
        executable: /bin/bash
      register: check1_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 1"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'ClusterVersion Status', 'status': (check1_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check1_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 2: Insights Operator
    - name: "{{ cluster.name }} | Check 2 - Insights Operator"
      shell: |
        CO_JSON=$(timeout 30s oc get co insights -o json 2>/dev/null)
        if [ $? -ne 0 ] || [ -z "$CO_JSON" ]; then echo "FAIL:::Unable to retrieve insights operator"; exit 0; fi
        DEGRADED=$(echo "$CO_JSON" | jq -r '[.status.conditions[] | select(.type=="Degraded")][0].status // "False"' 2>/dev/null || echo "False")
        AVAILABLE=$(echo "$CO_JSON" | jq -r '[.status.conditions[] | select(.type=="Available")][0].status // "Unknown"' 2>/dev/null || echo "Unknown")
        DETAILS="Available: ${AVAILABLE} | Degraded: ${DEGRADED}"
        if [ "$DEGRADED" != "True" ]; then echo "PASS:::${DETAILS}"; else
          DEG_MSG=$(echo "$CO_JSON" | jq -r '[.status.conditions[] | select(.type=="Degraded")][0].message // "No message"' 2>/dev/null || echo "No message")
          echo "FAIL:::${DETAILS} | Message: ${DEG_MSG}"; fi
      args:
        executable: /bin/bash
      register: check2_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 2"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'Insights Operator', 'status': (check2_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check2_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 3: Control Plane Health
    - name: "{{ cluster.name }} | Check 3 - Control Plane Health"
      shell: |
        CP_OPS="etcd kube-apiserver kube-controller-manager kube-scheduler"
        TOTAL=0; HEALTHY=0; ISSUES=""
        for OP in $CP_OPS; do
          TOTAL=$((TOTAL+1))
          OP_JSON=$(timeout 30s oc get co "$OP" -o json 2>/dev/null)
          if [ $? -ne 0 ] || [ -z "$OP_JSON" ]; then ISSUES="${ISSUES}${OP}: unreachable; "; continue; fi
          AVAIL=$(echo "$OP_JSON" | jq -r '[.status.conditions[] | select(.type=="Available")][0].status // "Unknown"' 2>/dev/null || echo "Unknown")
          DEG=$(echo "$OP_JSON" | jq -r '[.status.conditions[] | select(.type=="Degraded")][0].status // "Unknown"' 2>/dev/null || echo "Unknown")
          if [ "$AVAIL" = "True" ] && [ "$DEG" != "True" ]; then HEALTHY=$((HEALTHY+1)); else ISSUES="${ISSUES}${OP}: Available=${AVAIL} Degraded=${DEG}; "; fi
        done
        if [ "$HEALTHY" -eq "$TOTAL" ]; then echo "PASS:::${HEALTHY}/${TOTAL} control plane operators healthy"; else echo "FAIL:::${HEALTHY}/${TOTAL} healthy | Issues: ${ISSUES}"; fi
      args:
        executable: /bin/bash
      register: check3_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 3"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'Control Plane Health', 'status': (check3_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check3_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 4: Cluster Operators
    - name: "{{ cluster.name }} | Check 4 - Cluster Operators"
      shell: |
        CLUSTER_VER="{{ cluster_version }}"
        CO_JSON=$(timeout 30s oc get co -o json 2>/dev/null)
        if [ $? -ne 0 ] || [ -z "$CO_JSON" ]; then echo "FAIL:::Unable to retrieve cluster operators"; exit 0; fi
        TOTAL=$(echo "$CO_JSON" | jq -r '.items | length' 2>/dev/null || echo "0")
        OK=0; ISSUES=""
        for i in $(seq 0 $((TOTAL-1))); do
          OP=$(echo "$CO_JSON" | jq -r ".items[$i].metadata.name" 2>/dev/null)
          AVAIL=$(echo "$CO_JSON" | jq -r "[.items[$i].status.conditions[] | select(.type==\"Available\")][0].status // \"Unknown\"" 2>/dev/null || echo "Unknown")
          DEG=$(echo "$CO_JSON" | jq -r "[.items[$i].status.conditions[] | select(.type==\"Degraded\")][0].status // \"Unknown\"" 2>/dev/null || echo "Unknown")
          DEG_MSG=$(echo "$CO_JSON" | jq -r "[.items[$i].status.conditions[] | select(.type==\"Degraded\")][0].message // \"\"" 2>/dev/null || echo "")
          OP_VER=$(echo "$CO_JSON" | jq -r ".items[$i].status.versions[0].version // \"unknown\"" 2>/dev/null || echo "unknown")
          if [ "$OP" = "operator-lifecycle-manager" ]; then
            case "$DEG_MSG" in *"cannot-update"*|*"Cannot-update"*|*"Cannot update"*) OK=$((OK+1)); continue;; esac
          fi
          if [ "$AVAIL" != "True" ] || [ "$DEG" = "True" ]; then ISSUES="${ISSUES}${OP}: Available=${AVAIL} Degraded=${DEG}; "; continue; fi
          if [ "$OP" != "aro" ]; then
            if [ "$OP_VER" != "$CLUSTER_VER" ] && [ "$OP_VER" != "unknown" ]; then ISSUES="${ISSUES}${OP}: ver ${OP_VER} != ${CLUSTER_VER}; "; continue; fi
          fi
          OK=$((OK+1))
        done
        if [ -z "$ISSUES" ]; then echo "PASS:::${OK}/${TOTAL} operators available and version matched"; else echo "FAIL:::${OK}/${TOTAL} OK | Issues: ${ISSUES}"; fi
      args:
        executable: /bin/bash
      register: check4_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 4"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'Cluster Operators', 'status': (check4_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check4_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 5: Cluster Alerts (multi-source, dynamic window)
    - name: "{{ cluster.name }} | Check 5 - Cluster Alerts"
      shell: |
        TOKEN=$(timeout 30s oc whoami -t 2>/dev/null)
        WINDOW="{{ alert_window }}"
        TMPDIR=$(mktemp -d); trap "rm -rf $TMPDIR" EXIT

        query_prom() {
          local HOST="$1" TK="$2" WIN="$3" RESULT=""
          RESP=$(timeout 30s curl -sk -H "Authorization: Bearer ${TK}" \
            "https://${HOST}/api/v1/alerts" \
            --data-urlencode "query=max_over_time(ALERTS{alertstate=\"firing\"}[${WIN}])" 2>/dev/null)
          if echo "$RESP" | jq -e '.data.result' >/dev/null 2>&1; then
            RESULT=$(echo "$RESP" | jq -c '[.data.result[] | select(.metric.alertname != "Watchdog") | select(.metric.alertname != "InfoInhibitor") | select(.metric.alertname != "AlertmanagerReceiversNotConfigured") | {alertname:.metric.alertname, severity:(.metric.severity // "unknown"), namespace:(.metric.namespace // "cluster-scoped"), description:""}]' 2>/dev/null)
            if [ -n "$RESULT" ] && [ "$RESULT" != "null" ] && [ "$RESULT" != "[]" ]; then echo "$RESULT"; return 0; fi
          fi
          RESP=$(timeout 30s curl -sk -H "Authorization: Bearer ${TK}" "https://${HOST}/api/v1/alerts" 2>/dev/null)
          if echo "$RESP" | jq -e '.data.alerts' >/dev/null 2>&1; then
            RESULT=$(echo "$RESP" | jq -c '[.data.alerts[] | select(.state=="firing") | select(.labels.alertname != "Watchdog") | select(.labels.alertname != "InfoInhibitor") | select(.labels.alertname != "AlertmanagerReceiversNotConfigured") | {alertname:.labels.alertname, severity:(.labels.severity // "unknown"), namespace:(.labels.namespace // "cluster-scoped"), description:((.annotations.description // .annotations.summary // .annotations.message // "")[0:200])}]' 2>/dev/null)
            if [ -n "$RESULT" ] && [ "$RESULT" != "null" ]; then echo "$RESULT"; return 0; fi
          fi
          echo "[]"; return 1
        }

        PROM_HOST=$(timeout 30s oc get route prometheus-k8s -n openshift-monitoring -o jsonpath='{.spec.host}' 2>/dev/null)
        if [ -z "$PROM_HOST" ]; then PROM_HOST=$(timeout 30s oc get route thanos-querier -n openshift-monitoring -o jsonpath='{.spec.host}' 2>/dev/null); fi
        if [ -n "$PROM_HOST" ] && [ -n "$TOKEN" ]; then query_prom "$PROM_HOST" "$TOKEN" "$WINDOW" > "$TMPDIR/s1.json"; else echo "[]" > "$TMPDIR/s1.json"; fi

        LOG_HOST=$(timeout 30s oc get routes -n openshift-logging -o jsonpath='{.items[0].spec.host}' 2>/dev/null)
        if [ -n "$LOG_HOST" ] && [ -n "$TOKEN" ]; then query_prom "$LOG_HOST" "$TOKEN" "$WINDOW" > "$TMPDIR/s2.json"; else echo "[]" > "$TMPDIR/s2.json"; fi

        UWM_HOST=$(timeout 30s oc get routes -n openshift-user-workload-monitoring -o jsonpath='{.items[0].spec.host}' 2>/dev/null)
        if [ -n "$UWM_HOST" ] && [ -n "$TOKEN" ]; then query_prom "$UWM_HOST" "$TOKEN" "$WINDOW" > "$TMPDIR/s3.json"; else echo "[]" > "$TMPDIR/s3.json"; fi

        MERGED=$(jq -sc '.[0] + .[1] + .[2]' "$TMPDIR/s1.json" "$TMPDIR/s2.json" "$TMPDIR/s3.json" 2>/dev/null)
        if [ -z "$MERGED" ] || [ "$MERGED" = "null" ]; then MERGED="[]"; fi

        if [ -n "$PROM_HOST" ] && [ -n "$TOKEN" ]; then
          timeout 30s curl -sk -H "Authorization: Bearer ${TOKEN}" "https://${PROM_HOST}/api/v1/rules?type=alert" 2>/dev/null | jq -c '[.data.groups[].rules[] | select(.type=="alerting") | {alertname:.name, rule_desc:((.annotations.description // .annotations.summary // .annotations.message // "")[0:200])}]' > "$TMPDIR/rules.json" 2>/dev/null
          if [ ! -s "$TMPDIR/rules.json" ]; then echo "[]" > "$TMPDIR/rules.json"; fi
          MERGED=$(echo "$MERGED" | jq --slurpfile rules "$TMPDIR/rules.json" -c '[.[] | . as $a | if ($a.description=="" or $a.description==null) then ([$rules[0][] | select(.alertname==$a.alertname)][0].rule_desc // "") as $d | . + {description:$d} else . end]' 2>/dev/null)
          if [ -z "$MERGED" ] || [ "$MERGED" = "null" ]; then MERGED="[]"; fi
        fi

        NORM=$(echo "$MERGED" | sed -e 's/"severity":"Critical"/"severity":"critical"/g' -e 's/"severity":"CRITICAL"/"severity":"critical"/g' -e 's/"severity":"Warning"/"severity":"warning"/g' -e 's/"severity":"WARNING"/"severity":"warning"/g' -e 's/"severity":"Info"/"severity":"info"/g' -e 's/"severity":"INFO"/"severity":"info"/g')
        ALERTS_JSON=$(echo "$NORM" | jq -c '[.[] | select(.severity=="critical" or .severity=="warning")] | sort_by(if .severity=="critical" then "0" else "1" end) | unique_by(.alertname + "_" + .namespace) | .[0:50]' 2>/dev/null)
        if [ -z "$ALERTS_JSON" ] || [ "$ALERTS_JSON" = "null" ]; then ALERTS_JSON="[]"; fi

        CC=$(echo "$ALERTS_JSON" | jq '[.[] | select(.severity=="critical")] | length' 2>/dev/null || echo "0")
        WC=$(echo "$ALERTS_JSON" | jq '[.[] | select(.severity=="warning")] | length' 2>/dev/null || echo "0")
        TC=$(echo "$ALERTS_JSON" | jq 'length' 2>/dev/null || echo "0")
        if [ "$CC" -gt 0 ] 2>/dev/null; then echo "FAIL:::${CC} critical, ${WC} warning alerts in last ${WINDOW} (${TC} total)"
        elif [ "$WC" -gt 0 ] 2>/dev/null; then echo "WARN:::${WC} warning alerts in last ${WINDOW} (${TC} total)"
        else echo "PASS:::No critical or warning alerts in last ${WINDOW}"; fi
        echo "$ALERTS_JSON"
      args:
        executable: /bin/bash
      register: check5_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store cluster alerts data"
      set_fact:
        cluster_alerts: "{{ (check5_result.stdout_lines | default(['[]']) | last | default('[]')) | from_json | default([]) }}"

    - name: "{{ cluster.name }} | Store Check 5"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'Cluster Alerts', 'status': ((check5_result.stdout_lines | default(['WARN:::No data'])) | first | default('WARN:::No data')).split(':::')[0], 'details': ((check5_result.stdout_lines | default(['WARN:::No data'])) | first | default('WARN:::No data')).split(':::')[1] | default('No details')}] }}

    # CHECK 6: Node Status
    - name: "{{ cluster.name }} | Check 6 - Node Status"
      shell: |
        NODE_JSON=$(timeout 30s oc get nodes -o json 2>/dev/null)
        if [ $? -ne 0 ] || [ -z "$NODE_JSON" ]; then echo "FAIL:::Unable to retrieve nodes"; exit 0; fi
        TOTAL=$(echo "$NODE_JSON" | jq -r '.items | length' 2>/dev/null || echo "0"); RC=0; ISSUES=""
        for i in $(seq 0 $((TOTAL-1))); do
          NN=$(echo "$NODE_JSON" | jq -r ".items[$i].metadata.name" 2>/dev/null)
          RDY=$(echo "$NODE_JSON" | jq -r "[.items[$i].status.conditions[] | select(.type==\"Ready\")][0].status // \"Unknown\"" 2>/dev/null || echo "Unknown")
          US=$(echo "$NODE_JSON" | jq -r ".items[$i].spec.unschedulable // false" 2>/dev/null || echo "false")
          if [ "$RDY" = "True" ] && [ "$US" != "true" ]; then RC=$((RC+1)); else ISSUES="${ISSUES}${NN}: Ready=${RDY} Unsched=${US}; "; fi
        done
        if [ "$RC" -eq "$TOTAL" ]; then echo "PASS:::${RC}/${TOTAL} nodes Ready"; else echo "FAIL:::${RC}/${TOTAL} Ready | Issues: ${ISSUES}"; fi
      args:
        executable: /bin/bash
      register: check6_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 6"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'Node Status', 'status': (check6_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check6_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 7: Node Resource Pressure
    - name: "{{ cluster.name }} | Check 7 - Node Resource Pressure"
      shell: |
        NODE_JSON=$(timeout 30s oc get nodes -o json 2>/dev/null)
        if [ $? -ne 0 ] || [ -z "$NODE_JSON" ]; then echo "FAIL:::Unable to retrieve nodes"; exit 0; fi
        TOTAL=$(echo "$NODE_JSON" | jq -r '.items | length' 2>/dev/null || echo "0"); OK=0; ISSUES=""
        for i in $(seq 0 $((TOTAL-1))); do
          NN=$(echo "$NODE_JSON" | jq -r ".items[$i].metadata.name" 2>/dev/null)
          MP=$(echo "$NODE_JSON" | jq -r "[.items[$i].status.conditions[] | select(.type==\"MemoryPressure\")][0].status // \"False\"" 2>/dev/null || echo "False")
          DP=$(echo "$NODE_JSON" | jq -r "[.items[$i].status.conditions[] | select(.type==\"DiskPressure\")][0].status // \"False\"" 2>/dev/null || echo "False")
          PP=$(echo "$NODE_JSON" | jq -r "[.items[$i].status.conditions[] | select(.type==\"PIDPressure\")][0].status // \"False\"" 2>/dev/null || echo "False")
          if [ "$MP" = "False" ] && [ "$DP" = "False" ] && [ "$PP" = "False" ]; then OK=$((OK+1)); else ISSUES="${ISSUES}${NN}: Mem=${MP} Disk=${DP} PID=${PP}; "; fi
        done
        if [ "$OK" -eq "$TOTAL" ]; then echo "PASS:::${OK}/${TOTAL} nodes no resource pressure"; else echo "FAIL:::${OK}/${TOTAL} OK | Issues: ${ISSUES}"; fi
      args:
        executable: /bin/bash
      register: check7_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 7"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'Node Resource Pressure', 'status': (check7_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check7_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 8: CPU Overcommit (Requests)
    - name: "{{ cluster.name }} | Check 8 - Node CPU Overcommit (Requests)"
      shell: |
        WT={{ warn_threshold }}; FT={{ fail_threshold }}
        NODES=$(timeout 30s oc get nodes --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null)
        if [ $? -ne 0 ] || [ -z "$NODES" ]; then echo "FAIL:::Unable to retrieve nodes"; exit 0; fi
        STATUS="PASS"; DETAILS=""
        while IFS= read -r NODE; do
          D=$(timeout 30s oc describe node "$NODE" 2>/dev/null)
          P=$(echo "$D" | awk '/Allocated resources/,/Events/' | grep -i "cpu" | head -1 | grep -oP '\(\K[0-9]+(?=%\))' | tail -1)
          if [ -z "$P" ]; then P=$(echo "$D" | awk '/Allocated resources/,/Events/' | grep -i "cpu" | head -1 | sed -n 's/.*(\([0-9]*\)%).*/\1/p'); fi
          if [ -z "$P" ]; then DETAILS="${DETAILS}${NODE}: N/A; "; continue; fi
          if [ "$P" -gt "$FT" ]; then DETAILS="${DETAILS}${NODE}: ${P}% [FAIL]; "; STATUS="FAIL"
          elif [ "$P" -gt "$WT" ]; then DETAILS="${DETAILS}${NODE}: ${P}% [WARN]; "; if [ "$STATUS" != "FAIL" ]; then STATUS="WARN"; fi
          else DETAILS="${DETAILS}${NODE}: ${P}% [OK]; "; fi
        done <<< "$NODES"
        echo "${STATUS}:::CPU Requests - ${DETAILS}"
      args:
        executable: /bin/bash
      register: check8_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 8"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'Node CPU Overcommit (Requests)', 'status': (check8_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check8_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 9: Memory Overcommit (Requests)
    - name: "{{ cluster.name }} | Check 9 - Node Memory Overcommit (Requests)"
      shell: |
        WT={{ warn_threshold }}; FT={{ fail_threshold }}
        NODES=$(timeout 30s oc get nodes --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null)
        if [ $? -ne 0 ] || [ -z "$NODES" ]; then echo "FAIL:::Unable to retrieve nodes"; exit 0; fi
        STATUS="PASS"; DETAILS=""
        while IFS= read -r NODE; do
          D=$(timeout 30s oc describe node "$NODE" 2>/dev/null)
          P=$(echo "$D" | awk '/Allocated resources/,/Events/' | grep -i "memory" | head -1 | grep -oP '\(\K[0-9]+(?=%\))' | tail -1)
          if [ -z "$P" ]; then P=$(echo "$D" | awk '/Allocated resources/,/Events/' | grep -i "memory" | head -1 | sed -n 's/.*(\([0-9]*\)%).*/\1/p'); fi
          if [ -z "$P" ]; then DETAILS="${DETAILS}${NODE}: N/A; "; continue; fi
          if [ "$P" -gt "$FT" ]; then DETAILS="${DETAILS}${NODE}: ${P}% [FAIL]; "; STATUS="FAIL"
          elif [ "$P" -gt "$WT" ]; then DETAILS="${DETAILS}${NODE}: ${P}% [WARN]; "; if [ "$STATUS" != "FAIL" ]; then STATUS="WARN"; fi
          else DETAILS="${DETAILS}${NODE}: ${P}% [OK]; "; fi
        done <<< "$NODES"
        echo "${STATUS}:::Memory Requests - ${DETAILS}"
      args:
        executable: /bin/bash
      register: check9_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 9"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'Node Memory Overcommit (Requests)', 'status': (check9_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check9_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 10: CPU Actual
    - name: "{{ cluster.name }} | Check 10 - Node CPU Actual Usage"
      shell: |
        WT={{ warn_threshold }}; FT={{ fail_threshold }}
        TOP=$(timeout 30s oc adm top node --no-headers 2>/dev/null)
        if [ $? -ne 0 ] || [ -z "$TOP" ]; then echo "FAIL:::Metrics unavailable"; exit 0; fi
        STATUS="PASS"; DETAILS=""
        while IFS= read -r LINE; do
          NN=$(echo "$LINE" | awk '{print $1}'); P=$(echo "$LINE" | awk '{print $3}' | tr -d '%')
          if [ -z "$P" ]; then DETAILS="${DETAILS}${NN}: N/A; "; continue; fi
          if [ "$P" -gt "$FT" ]; then DETAILS="${DETAILS}${NN}: ${P}% [FAIL]; "; STATUS="FAIL"
          elif [ "$P" -gt "$WT" ]; then DETAILS="${DETAILS}${NN}: ${P}% [WARN]; "; if [ "$STATUS" != "FAIL" ]; then STATUS="WARN"; fi
          else DETAILS="${DETAILS}${NN}: ${P}% [OK]; "; fi
        done <<< "$TOP"
        echo "${STATUS}:::CPU Actual - ${DETAILS}"
      args:
        executable: /bin/bash
      register: check10_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 10"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'Node CPU Actual Usage', 'status': (check10_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check10_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 11: Memory Actual
    - name: "{{ cluster.name }} | Check 11 - Node Memory Actual Usage"
      shell: |
        WT={{ warn_threshold }}; FT={{ fail_threshold }}
        TOP=$(timeout 30s oc adm top node --no-headers 2>/dev/null)
        if [ $? -ne 0 ] || [ -z "$TOP" ]; then echo "FAIL:::Metrics unavailable"; exit 0; fi
        STATUS="PASS"; DETAILS=""
        while IFS= read -r LINE; do
          NN=$(echo "$LINE" | awk '{print $1}'); P=$(echo "$LINE" | awk '{print $5}' | tr -d '%')
          if [ -z "$P" ]; then DETAILS="${DETAILS}${NN}: N/A; "; continue; fi
          if [ "$P" -gt "$FT" ]; then DETAILS="${DETAILS}${NN}: ${P}% [FAIL]; "; STATUS="FAIL"
          elif [ "$P" -gt "$WT" ]; then DETAILS="${DETAILS}${NN}: ${P}% [WARN]; "; if [ "$STATUS" != "FAIL" ]; then STATUS="WARN"; fi
          else DETAILS="${DETAILS}${NN}: ${P}% [OK]; "; fi
        done <<< "$TOP"
        echo "${STATUS}:::Memory Actual - ${DETAILS}"
      args:
        executable: /bin/bash
      register: check11_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 11"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'Node Memory Actual Usage', 'status': (check11_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check11_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 12: Pod Health
    - name: "{{ cluster.name }} | Check 12 - Pod Health"
      shell: |
        EXCL="{{ exclude_namespaces | join('|') }}"
        BAD=$(timeout 30s oc get pods --all-namespaces --no-headers 2>/dev/null | awk -v excl="$EXCL" 'BEGIN{split(excl,a,"|");for(k in a)m[a[k]]=1}{if($1 in m)next;s=$4;if(s!="Running"&&s!="Completed"&&s!="Succeeded")print $1"/"$2" ("s")"}')
        if [ -z "$BAD" ]; then echo "PASS:::0 problematic pods (excluded: {{ exclude_namespaces | join(', ') }})"; else
          C=$(echo "$BAD" | wc -l); T=$(echo "$BAD" | head -10 | tr '\n' '; '); SFX=""
          if [ "$C" -gt 10 ]; then SFX=" ... +$((C-10)) more"; fi
          echo "FAIL:::${C} problematic pods | ${T}${SFX}"; fi
      args:
        executable: /bin/bash
      register: check12_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 12"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'Pod Health', 'status': (check12_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check12_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 13: MCP Status
    - name: "{{ cluster.name }} | Check 13 - MCP Status"
      shell: |
        MCP_JSON=$(timeout 30s oc get mcp -o json 2>/dev/null)
        if [ $? -ne 0 ] || [ -z "$MCP_JSON" ]; then echo "FAIL:::Unable to retrieve MCPs"; exit 0; fi
        TOTAL=$(echo "$MCP_JSON" | jq -r '.items | length' 2>/dev/null || echo "0"); OK=0; ISSUES=""
        for i in $(seq 0 $((TOTAL-1))); do
          NM=$(echo "$MCP_JSON" | jq -r ".items[$i].metadata.name" 2>/dev/null)
          DEG=$(echo "$MCP_JSON" | jq -r "[.items[$i].status.conditions[] | select(.type==\"Degraded\")][0].status // \"False\"" 2>/dev/null || echo "False")
          UPD=$(echo "$MCP_JSON" | jq -r "[.items[$i].status.conditions[] | select(.type==\"Updated\")][0].status // \"Unknown\"" 2>/dev/null || echo "Unknown")
          if [ "$DEG" != "True" ] && [ "$UPD" = "True" ]; then OK=$((OK+1)); else ISSUES="${ISSUES}${NM}: Degraded=${DEG} Updated=${UPD}; "; fi
        done
        if [ "$OK" -eq "$TOTAL" ]; then echo "PASS:::${OK}/${TOTAL} MCPs up to date"; else echo "FAIL:::${OK}/${TOTAL} OK | Issues: ${ISSUES}"; fi
      args:
        executable: /bin/bash
      register: check13_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 13"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'MCP Status', 'status': (check13_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check13_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 14: StorageClasses
    - name: "{{ cluster.name }} | Check 14 - StorageClasses"
      shell: |
        SC_JSON=$(timeout 30s oc get sc -o json 2>/dev/null)
        if [ $? -ne 0 ] || [ -z "$SC_JSON" ]; then echo "FAIL:::Unable to retrieve StorageClasses"; exit 0; fi
        C=$(echo "$SC_JSON" | jq -r '.items | length' 2>/dev/null || echo "0")
        N=$(echo "$SC_JSON" | jq -r '[.items[].metadata.name] | join(", ")' 2>/dev/null || echo "")
        if [ "$C" -gt 0 ]; then echo "PASS:::${C} StorageClasses: ${N}"; else echo "FAIL:::No StorageClasses found"; fi
      args:
        executable: /bin/bash
      register: check14_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 14"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'StorageClasses', 'status': (check14_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check14_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # CHECK 15: PVC Status
    - name: "{{ cluster.name }} | Check 15 - PVC Status"
      shell: |
        PVC_JSON=$(timeout 30s oc get pvc --all-namespaces -o json 2>/dev/null)
        if [ $? -ne 0 ] || [ -z "$PVC_JSON" ]; then echo "FAIL:::Unable to retrieve PVCs"; exit 0; fi
        T=$(echo "$PVC_JSON" | jq -r '.items | length' 2>/dev/null || echo "0")
        if [ "$T" -eq 0 ]; then echo "PASS:::No PVCs found"; exit 0; fi
        B=$(echo "$PVC_JSON" | jq -r '[.items[] | select(.status.phase=="Bound")] | length' 2>/dev/null || echo "0")
        PE=$(echo "$PVC_JSON" | jq -r '[.items[] | select(.status.phase=="Pending")] | length' 2>/dev/null || echo "0")
        LO=$(echo "$PVC_JSON" | jq -r '[.items[] | select(.status.phase=="Lost")] | length' 2>/dev/null || echo "0")
        ISSUES=""
        if [ "$PE" -gt 0 ]; then PN=$(echo "$PVC_JSON" | jq -r '[.items[] | select(.status.phase=="Pending") | .metadata.namespace+"/"+.metadata.name] | join(", ")' 2>/dev/null); ISSUES="${ISSUES}Pending(${PE}): ${PN}; "; fi
        if [ "$LO" -gt 0 ]; then LN=$(echo "$PVC_JSON" | jq -r '[.items[] | select(.status.phase=="Lost") | .metadata.namespace+"/"+.metadata.name] | join(", ")' 2>/dev/null); ISSUES="${ISSUES}Lost(${LO}): ${LN}; "; fi
        if [ -z "$ISSUES" ]; then echo "PASS:::${B}/${T} PVCs Bound"; else echo "FAIL:::${B}/${T} Bound | ${ISSUES}"; fi
      args:
        executable: /bin/bash
      register: check15_result
      ignore_errors: yes

    - name: "{{ cluster.name }} | Store Check 15"
      set_fact:
        cluster_checks: >-
          {{ cluster_checks + [{'check_name': 'PVC Status', 'status': (check15_result.stdout | default('FAIL:::Error')).split(':::')[0], 'details': (check15_result.stdout | default('FAIL:::Error')).split(':::')[1] | default('No details')}] }}

    # Overall Status
    - name: "{{ cluster.name }} | Determine overall status"
      set_fact:
        overall_status: >-
          {%- set statuses = cluster_checks | map(attribute='status') | list -%}
          {%- if 'FAIL' in statuses -%}FAIL{%- elif 'WARN' in statuses -%}WARN{%- else -%}PASS{%- endif -%}

    # Append to master
    - name: "{{ cluster.name }} | Append results"
      set_fact:
        master_results: >-
          {{ master_results + [{'cluster_name': cluster.name, 'api_url': cluster.api_url, 'ocp_version': cluster_version, 'overall_status': overall_status | trim, 'alerts': cluster_alerts | default([]), 'checks': cluster_checks}] }}

    # Logout
    - name: "{{ cluster.name }} | Logout"
      shell: timeout 10s oc logout 2>/dev/null || true
      args:
        executable: /bin/bash
      ignore_errors: yes

  when: login_result.rc is defined and login_result.rc == 0
