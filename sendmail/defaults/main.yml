---
# ============================================================================
# Role Defaults: sendmail
# ============================================================================
# Targets: Ansible 2.7.17 (test) / 2.14.18 (prod)
# MIGRATION 2.14: No syntax changes needed. Standard variable declarations.
#
# Purpose: Default configuration parameters for the sendmail role, which executes
#          native direct SMTP email delivery on localhost with attachment support
#          and post-dispatch fact cleanup to prevent cross-hop body pollution.
# Role / Playbook Dependencies: vars/smtp.yml
# Gate Type: N/A (Role Defaults)
# Outputs: Default variables consumed by sendmail tasks
# ============================================================================

# SMTP server hostname or IP reachable from jump server (string, default: "smtp.example.com")
# Sourced from vars/smtp.yml
smtp_host: "smtp.example.com"

# SMTP service port: 25 for internal unauthenticated relay, 587 for STARTTLS (integer, default: 25)
# Sourced from vars/smtp.yml
smtp_port: 25

# Sender email address appearing in 'From' header (string, default: "aro-upgrades@example.com")
# Sourced from vars/smtp.yml
mail_from: "aro-upgrades@example.com"

# Recipient list for email notification dispatch (list of strings, default: [])
# Sourced from vars/smtp.yml or overridden via CLI --mail-to
mail_to: []

# Email subject line string (string, default: "[ARO Upgrade] Notification")
# Sourced from calling role or vars/smtp.yml
mail_subject: "[ARO Upgrade] Notification"

# Template file path to render (string, default: "")
# Sourced from calling role (relative to playbooks/templates/ or absolute path)
mail_template: ""

# Pre-rendered HTML email body string (string, default: "")
# Sourced from calling role or rendered dynamically by sendmail
mail_html_body: ""

# List of file attachment paths to include with email dispatch (list of strings, default: [])
# Sourced from calling role (e.g. HTML reports, run logs)
mail_attachments: []

# Character encoding for MIME email payload (string, default: "utf-8")
# Sourced from role defaults
mail_charset: "utf-8"

# Optional SMTP authentication username for authenticated relays (string, default: "")
# Sourced from vars/smtp.yml or vault credentials
smtp_username: ""

# Optional SMTP authentication password for authenticated relays (string, default: "")
# Sourced from vars/smtp.yml or vault credentials
smtp_password: ""

# SMTP transport security mode: 'never', 'starttls', or 'ssl' (string, default: "never")
# Sourced from vars/smtp.yml
smtp_secure: "never"
