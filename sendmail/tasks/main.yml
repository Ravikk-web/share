    - name: Verify log file exists
      stat:
        path: "{{ report_dir }}/"
      register: logfile

    - name: find all report files
      find:
        paths: "{{ report_dir }}/"
        patterns:
          - "*.csv"
          - "*.html"
          - "*.txt"
      register: all_log_files

    - name: Show found files
      debug:
        msg: "{{ all_log_files.files | map(attribute='path') | list }}"

    - name: Build email summary body
      set_fact:
        email_body: |
          <!DOCTYPE html>
          <html>
          <body style="margin:0;padding:0;background:#f4f6f8;font-family:'Segoe UI',Arial,Helvetica,sans-serif;">
          <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:24px 0;">
          <tr><td align="center">
          <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">

            <!-- Header -->
            <tr>
              <td style="background:#0f172a;padding:22px 28px;">
                <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <h1 style="margin:0;font-size:20px;color:#ffffff;font-weight:700;">ARO Cluster Capacity Report</h1>
                    <p style="margin:4px 0 0;font-size:12px;color:#94a3b8;">Infrastructure Health &amp; Capacity Assessment</p>
                  </td>
                  <td align="right" style="vertical-align:top;">
                    <span style="font-size:12px;color:#94a3b8;">{{ report_date }} {{ report_time }}</span><br>
                    <span style="font-size:11px;color:#94a3b8;">Prepared by: <strong style="color:#e2e8f0;">MSP_Openshift</strong></span>
                  </td>
                </tr>
                </table>
              </td>
            </tr>

            <!-- Greeting -->
            <tr>
              <td style="padding:24px 28px 8px;">
                <p style="margin:0;font-size:14px;color:#1e293b;">Hi Team,</p>
                <p style="margin:8px 0 0;font-size:13px;color:#475569;line-height:1.6;">
                  The scheduled ARO cluster health check has completed. Below is a quick summary of the results.
                  Please find the detailed report attached.
                </p>
              </td>
            </tr>

            {% set total_cl = master_results | length %}
            {% set pass_cl = master_results | selectattr('overall_status','equalto','PASS') | list | length %}
            {% set warn_cl = master_results | selectattr('overall_status','equalto','WARN') | list | length %}
            {% set fail_cl = master_results | selectattr('overall_status','equalto','FAIL') | list | length %}

            <!-- Summary Cards -->
            <tr>
              <td style="padding:16px 28px;">
                <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="25%" align="center" style="padding:4px;">
                    <table cellpadding="0" cellspacing="0" style="background:#f8fafc;border-radius:8px;border-top:3px solid #0f172a;width:100%;">
                    <tr><td style="padding:14px 8px;text-align:center;">
                      <div style="font-size:28px;font-weight:700;color:#0f172a;">{{ total_cl }}</div>
                      <div style="font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-top:2px;">Total Clusters</div>
                    </td></tr>
                    </table>
                  </td>
                  <td width="25%" align="center" style="padding:4px;">
                    <table cellpadding="0" cellspacing="0" style="background:#ecfdf5;border-radius:8px;border-top:3px solid #10b981;width:100%;">
                    <tr><td style="padding:14px 8px;text-align:center;">
                      <div style="font-size:28px;font-weight:700;color:#10b981;">{{ pass_cl }}</div>
                      <div style="font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-top:2px;">Passed</div>
                    </td></tr>
                    </table>
                  </td>
                  <td width="25%" align="center" style="padding:4px;">
                    <table cellpadding="0" cellspacing="0" style="background:#fffbeb;border-radius:8px;border-top:3px solid #f59e0b;width:100%;">
                    <tr><td style="padding:14px 8px;text-align:center;">
                      <div style="font-size:28px;font-weight:700;color:#f59e0b;">{{ warn_cl }}</div>
                      <div style="font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-top:2px;">Warnings</div>
                    </td></tr>
                    </table>
                  </td>
                  <td width="25%" align="center" style="padding:4px;">
                    <table cellpadding="0" cellspacing="0" style="background:#fef2f2;border-radius:8px;border-top:3px solid #ef4444;width:100%;">
                    <tr><td style="padding:14px 8px;text-align:center;">
                      <div style="font-size:28px;font-weight:700;color:#ef4444;">{{ fail_cl }}</div>
                      <div style="font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-top:2px;">Failed</div>
                    </td></tr>
                    </table>
                  </td>
                </tr>
                </table>
              </td>
            </tr>

            <!-- Per-Cluster Status Table -->
            <tr>
              <td style="padding:8px 28px 16px;">
                <table width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;">
                <tr style="background:#0f172a;">
                  <th style="padding:10px 14px;text-align:left;font-size:11px;color:#ffffff;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Cluster</th>
                  <th style="padding:10px 14px;text-align:left;font-size:11px;color:#ffffff;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">OCP Version</th>
                  <th style="padding:10px 14px;text-align:center;font-size:11px;color:#ffffff;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Checks</th>
                  <th style="padding:10px 14px;text-align:center;font-size:11px;color:#ffffff;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Status</th>
                </tr>
                {% for cl in master_results %}
                {% set row_bg = '#ffffff' if loop.index is odd else '#f8fafc' %}
                {% set st_color = '#10b981' if cl.overall_status == 'PASS' else ('#f59e0b' if cl.overall_status == 'WARN' else '#ef4444') %}
                {% set st_bg = '#ecfdf5' if cl.overall_status == 'PASS' else ('#fffbeb' if cl.overall_status == 'WARN' else '#fef2f2') %}
                {% set checks_pass = cl.checks | selectattr('status','equalto','PASS') | list | length %}
                {% set checks_total = cl.checks | length %}
                <tr style="background:{{ row_bg }};">
                  <td style="padding:10px 14px;font-size:13px;font-weight:600;color:#1e293b;border-bottom:1px solid #f1f5f9;">{{ cl.cluster_name }}</td>
                  <td style="padding:10px 14px;font-size:12px;color:#64748b;border-bottom:1px solid #f1f5f9;">{{ cl.ocp_version }}</td>
                  <td style="padding:10px 14px;font-size:12px;color:#475569;border-bottom:1px solid #f1f5f9;text-align:center;">{{ checks_pass }}/{{ checks_total }} passed</td>
                  <td style="padding:10px 14px;text-align:center;border-bottom:1px solid #f1f5f9;">
                    <span style="display:inline-block;padding:3px 12px;border-radius:12px;font-size:11px;font-weight:700;background:{{ st_bg }};color:{{ st_color }};">{{ cl.overall_status }}</span>
                  </td>
                </tr>
                {% endfor %}
                </table>
              </td>
            </tr>

            <!-- Note -->
            <tr>
              <td style="padding:8px 28px 20px;">
                <table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f9ff;border-left:4px solid #0ea5e9;border-radius:4px;">
                <tr><td style="padding:12px 16px;">
                  <p style="margin:0;font-size:12px;color:#0c4a6e;">
                    <strong>&#128204; Note:</strong> Please do not <em>preview</em> the attachment. For best viewing experience, <strong>download and open the HTML report in your browser</strong>.
                  </p>
                </td></tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="background:#f1f5f9;padding:16px 28px;border-top:1px solid #e2e8f0;">
                <p style="margin:0;font-size:11px;color:#94a3b8;text-align:center;line-height:1.6;">
                  Generated by <strong style="color:#64748b;">ARO Capacity Check Automation</strong><br>
                  Thresholds: <strong style="color:#64748b;">WARN &gt; {{ warn_threshold }}%</strong> &#124; <strong style="color:#64748b;">FAIL &gt; {{ fail_threshold }}%</strong> &#124; Alert Window: <strong style="color:#64748b;">{{ alert_window }}</strong>
                </p>
              </td>
            </tr>

          </table>
          </td></tr>
          </table>
          </body>
          </html>

    - name: Send email with log attachment
      mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_port }}"
        from: "{{ sender }}"
        to: "{{ recipients }}"
        subject: "ARO Health Check Report - DEV | {{ report_date }}"
        subtype: html
        body: "{{ email_body }}"
        attach: "{{ all_log_files.files | map(attribute='path') | list }}"
      when: all_log_files.files | length > 0

